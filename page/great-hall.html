<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>The Great Hall, greybox</title>
<style>
  :root {
    --bg: #0b0a09;
    --hud-bg: rgba(24, 21, 18, 0.78);
    --hud-fg: #d9d2c6;
    --hud-dim: #8e877c;
    --hud-on: #e9b86a;
    --hud-line: rgba(255, 255, 255, 0.16);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0a09; }
  }
  :root[data-theme="dark"] { --bg: #0b0a09; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    color: var(--hud-fg);
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  #stats {
    font-size: 12px;
    line-height: 1.35;
    background: var(--hud-bg);
    padding: 6px 9px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
    color: var(--hud-dim);
    white-space: pre;
  }
  #btns { display: flex; flex-wrap: wrap; gap: 6px; max-width: 320px; pointer-events: auto; }
  button {
    font: 500 13px/1 -apple-system, system-ui, "Segoe UI", sans-serif;
    color: var(--hud-fg);
    background: var(--hud-bg);
    border: 1px solid var(--hud-line);
    border-radius: 6px;
    min-height: 38px;
    min-width: 44px;
    padding: 0 12px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  button.on { color: var(--hud-on); border-color: var(--hud-on); }
  button:focus-visible { outline: 2px solid var(--hud-on); outline-offset: 2px; }
  #back {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    min-height: 46px;
    padding: 0 18px;
    font-size: 15px;
  }
  #help {
    position: fixed;
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    max-width: min(420px, calc(100vw - 20px));
    background: var(--hud-bg);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.45;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!--
The Great Hall in grey (the Great Hall lane's page, first session, 15 October 2026; docs/handoff/great-hall.md). The
room at real size to the plan assets/review/great-hall-plan-1015-1731.jpg, confirmed by Godric at 5.44 pm (greathall-grey-build-1015, 1).
Nothing here is a drawing: every piece is a grey placeholder at its real size, so the room can be walked and
shot before anything is spent.
- The building is the Architect's: page/castle-shell.js builds the walls, the fourteen windows, the doors' passage
  and the two stands (the doors' start and the staff table's, the model's look.stands, req 315) straight from
  page/castle-model.js, so a model change re-shapes this room. Nothing that changes the building is drawn here.
- What stands where is Interiors' schedule, docs/interiors/great-hall.md (The schedule, Occupancy, The occasions, The
  look up), its numbers in the block marked SCHEDULE below; a move past what it allows goes back to Interiors by row.
- The room shows what the clock says and nothing else decides (docs/room-states.md): the page reads the runtime's
  drivers (page/castle-events.js: time, meal, occasion, lessons, sun, weather, moon, year), each with its link
  (?time=, ?meal=, ?occasion=, ?lessons=, ?sun=, ?weather=, ?moon=, ?year=, ?date=), and draws only that. Which layer
  reads which driver is the lane file's table, The layers; each owner gives its part by row. Placeholders here:
  the candles' light (lookup-q1-lit-1013: pale by day, gold from dusk, out at night), the figures (Interiors'
  occupancy; People draws them), the places and goblet towers, the occasions (Godric's 1, interiors-hall-occasions-1015).
- He stands and looks, as in the shell: a drag turns his head within the stand's limits; the view never rises by
  itself (the charter, 15 October 2026). A tap on the platform or the staff table walks him up the middle aisle to the
  staff table's stand; a tap on nothing there, or Back, walks him back to the doors; the doors' mouth from its stand
  goes through to the Entrance Hall's shell. Every tap answers (castle.js's kit.tapped).
- Nothing announces itself: no glow or glint marks a thing to tap (docs/ministry/readers/GL.md); the only light drawn
  is the candles' own flames and the sky's.
-->
<canvas id="c" tabindex="0" aria-label="The Great Hall, greybox"></canvas>
<div id="hud">
  <div id="stats">starting</div>
  <div id="btns">
    <button type="button" data-act="layers">Layers</button>
    <button type="button" data-act="res">Res</button>
    <button type="button" data-act="exp">Exp</button>
    <button type="button" data-act="reset">Reset</button>
    <button type="button" data-act="help">?</button>
  </div>
</div>
<button id="back" type="button" hidden>Back</button>
<div id="help">Drag to look around.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="castle-model.js?v=392"></script>
<script src="castle-paint.js?v=4"></script>
<script src="design/tones.js?v=2"></script>
<script src="design/ceilings.js?v=2"></script>

<script>
(function () {
'use strict';

var Q = new URLSearchParams(location.search);
var PLACE = 'great-hall';
/* the model as it stands in the Stone's year unless ?book= names another (the shell's rule) */
var BOOKS = ['PS', 'CoS', 'PoA', 'GoF', 'OotP', 'HBP', 'DH'];
var BOOK = (function () {
  var q = Q.get('book') || 'PS', n = BOOKS.indexOf(q);
  return n >= 0 ? n : (+q >= 1 && +q <= 7 ? +q - 1 : 0);
})();
function stands(it) {
  var f = BOOKS.indexOf(it.first || 'PS'), l = it.last ? BOOKS.indexOf(it.last) : BOOKS.length - 1;
  return it.state !== 'set aside' && f <= BOOK && BOOK <= l;
}
var MODEL = window.CASTLE_MODEL ? (function (M) {
  var out = JSON.parse(JSON.stringify(M)), gone = {};
  ['grounds', 'rooms', 'features'].forEach(function (k) {
    out[k] = (out[k] || []).filter(function (it) { if (stands(it)) return true; gone[it.id] = true; return false; });
  });
  out.openings = (out.openings || []).filter(function (o) {
    return stands(o) && !gone[o.room] && !(o.between || []).some(function (r) { return gone[r]; });
  });
  return out;
})(window.CASTLE_MODEL) : null;

var kit = window.castleFrame ? castleFrame({
  background: 0x0b0a09, fog: 0.004,
  zoom: { max: 3 },
  onAct: function (act) { if (act === 'reset') goBack(); }
}) : null;
if (!kit) { if (!window.castleFrame) document.getElementById('help').textContent = 'castle.js did not load. Check the connection and reload.'; return; }
var canvas = kit.canvas, backBtn = kit.backBtn, clamp = kit.clamp, lerp = kit.lerp, easeInOut = kit.easeInOut, col = kit.col;
var renderer = kit.renderer, scene = kit.scene, camera = kit.camera;
camera.far = 220; camera.updateProjectionMatrix();

var shell = window.CastleShell && MODEL ? CastleShell.build(kit, MODEL, PLACE, { from: kit.from, paint: [PLACE] }) : null;
/* req 707: the hall painted as shell.html paints it, so the star vault (Design's 2c3ebaab, the Architect's bd81623e) and
   the materials schedule's tones come with the shell; the sky still shows through all that is not rib */
if (!shell) { kit.helpEl.textContent = 'The Great Hall is not in the castle model.'; return; }
scene.add(shell.group);
var P = function (x, y, z) { return shell.toLocal(x, y, (z || 0)); };

/* the clock (docs/room-states.md §1): one runtime, every chain, this room's place */
var READY = false;   /* the runtime may call drawRoom before the room below is built */
var CUES = {};       /* a record's cues, by its show string, filled once the room is built (the Howler, the whisper) */
var heardLast = '';  /* the last heard cue handed to the player, for the checks */
var events = window.CastleEvents ? CastleEvents.start({ chains: 'all', place: 'great hall', drawRoom: function () { if (READY) draw(); }, cues: CUES, showLines: function (list) { if (window.CastleSound) CastleSound.lines(list); } }) : null;
function drivers() {
  var e = events;
  var occ = e ? String(e.occasion()).replace(/-/g, ' ') : 'none';
  return {
    time: e ? e.time() : 'day', meal: e ? e.meal() : 'none', occasion: occ, lessons: e ? e.lessons() : 'off',
    sun: e ? e.sun() : { up: true, altitude: 30, bearing: 180, height: 0.4 }, weather: e ? e.weather() : { sky: 'clear' },
    moon: e ? e.moon() : { up: false, light: 0 }, year: e ? e.year() : 0, hour: new Date().getHours()
  };
}

/* ================= SCHEDULE: Interiors' numbers (docs/interiors/great-hall.md), cited, never settled here */
var S = {
  tables: [['gryffindor', 66.8], ['ravenclaw', 62.6], ['hufflepuff', 58.4], ['slytherin', 54.2]],
  tx0: 23.0, tx1: 61.0, top: 0.75, tw: 1.0,
  bench: { off: 0.05, deep: 0.35, seat: 0.45 },
  dais: { x0: 15.0, x1: 19.5, h: 0.45, steps: 3, rise: 0.15 },
  staff: { x0: 17.0, x1: 18.0, y0: 53.5, y1: 67.5, top: 1.20, chairs: 20, chairX: 16.6 },
  gold: [16.6, 60.5], stool: [21.6, 60.5],      /* the stool before the first years' line (Interiors, req 473, 5.46 pm) */
  firstYears: { x: 20.1, y0: 52.5, y1: 68.5, gap: 0.4, n: 40 },
  place: 0.6,
  candles: { lo: 5.0, hi: 6.0, dense: 0.9, edge: 0.3, rho: 6.0, x0: 22.5, x1: 61.5, staffX: 17.5,
             strays: [[63.8, 65.6], [55.4, 57.2], [68.0, 69.5], [51.5, 53.0]], strayLo: 6.2, strayHi: 7.0, bob: 0.06, sway: 0.03 },
  trees: { xs: [26, 32, 38, 44, 50, 56], ys: [69.0, 52.0], tub: 0.8, from: 1.6, spread: 2.4, h: 7.0 },
  lanterns: { x: 63.0, d: 2.0 },
  festoon: { hi: 4.4, lo: 3.6 },
  banner: { foot: 6.5, top: 14.5, w: 6.0 },
  /* the winner's hangings on the piers between the windows, six a side (Godric's 1 on greathall-hangings-1015, 6.08 pm;
     the piers the Architect's v27, between windows on a 6 m bay from x 23 to 59); Interiors writes them into item 5 */
  hangings: { xs: [26, 32, 38, 44, 50, 56], ys: [69.45, 51.55], w: 2.4, foot: 6.5, top: 13.0 },
  /* the Duelling Club's evening (Godric's 1 on interiors-duelling-1015, 6.10 pm; Interiors' *The Duelling Club's evening*):
     the tables gone, no stage, the teacher at the front, pairs in seven rows, the brothers' two dummies and their marks */
  club: { teacher: [21.0, 60.5], rows: [30, 34, 38, 42, 46, 50, 54], pairs: [[53.5, 57.5], [63.5, 67.5]],
          dummies: [[25.0, 62.5], [27.0, 62.5]], boys: [[25.0, 58.5], [27.0, 58.5]], dummyH: 1.4 }
};
var HOUSE = { gryffindor: 0x8a4a40, ravenclaw: 0x46566e, hufflepuff: 0x8a7a44, slytherin: 0x46684e };

function mat(hex, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: col(hex), roughness: 0.9, metalness: 0 }, o || {})); }
var M = { oak: mat(0x7a5c40), bench: mat(0x6a4e36), dais: mat(0x8a8276), gold: mat(0xb8932e, { roughness: 0.45, metalness: 0.6 }),
          wax: mat(0xe8dcc0), tub: mat(0x5a4632), tree: mat(0x3c5a40), holly: mat(0x3d5a3a), lantern: mat(0xc06a20, { roughness: 0.7 }),
          pumpkin: mat(0xc87428, { roughness: 0.7 }), banner: mat(0x8a2a26), stool: mat(0x6a5440) };
var room = new THREE.Group(); room.name = 'great-hall-grey'; scene.add(room);
function boxAt(w, h, d, x, y, z, m, name) {   /* w along x (east), d along y (north), z its foot; in the model's frame */
  var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.copy(P(x, y, z + h / 2)); b.name = name || ''; room.add(b); return b;
}

/* the platform, its steps, the staff table and its chairs, the gold chair */
var tapTop = [];
tapTop.push(boxAt(S.dais.x1 - S.dais.x0, S.dais.h, 18, (S.dais.x0 + S.dais.x1) / 2, 60.5, 0, M.dais, 'platform'));
for (var k = 0; k < S.dais.steps; k++) {
  var sx0 = S.dais.x1 + k * 0.3;
  tapTop.push(boxAt(0.3, S.dais.h - (k + 1) * S.dais.rise, 18, sx0 + 0.15, 60.5, 0, M.dais, 'platform-step'));
}
tapTop.push(boxAt(S.staff.x1 - S.staff.x0, 0.06, S.staff.y1 - S.staff.y0, (S.staff.x0 + S.staff.x1) / 2, (S.staff.y0 + S.staff.y1) / 2, S.staff.top - 0.06, M.oak, 'staff-table'));
tapTop.push(boxAt(S.staff.x1 - S.staff.x0 - 0.1, S.staff.top - 0.06 - S.dais.h, S.staff.y1 - S.staff.y0 - 0.1, (S.staff.x0 + S.staff.x1) / 2, (S.staff.y0 + S.staff.y1) / 2, S.dais.h, M.oak, 'staff-table'));
var chairYs = [];
for (var c = 0; c < S.staff.chairs; c++) chairYs.push(S.staff.y0 + 0.35 + c * 0.7);
chairYs.forEach(function (y) {
  if (Math.abs(y - S.gold[1]) < 0.4) return;
  boxAt(0.45, 1.0, 0.45, S.staff.chairX, y, S.dais.h, M.bench, 'staff-chair');
});
tapTop.push(boxAt(0.7, 1.7, 0.8, S.gold[0], S.gold[1], S.dais.h, M.gold, 'gold-chair'));
var stool = boxAt(0.35, 0.45, 0.35, S.stool[0], S.stool[1], 0, M.stool, 'stool');

/* the four long tables and their benches, the worn band in code later (Interiors' item 20) */
S.tables.forEach(function (t) {
  var yc = t[1], L = S.tx1 - S.tx0, xm = (S.tx0 + S.tx1) / 2;
  boxAt(L, 0.06, S.tw, xm, yc, S.top - 0.06, M.oak, 'table-' + t[0]);
  [-1, 1].forEach(function (s) {
    boxAt(0.12, S.top - 0.06, S.tw - 0.2, S.tx0 + 0.4, yc, 0, M.oak, 'table-leg');
    boxAt(0.12, S.top - 0.06, S.tw - 0.2, S.tx1 - 0.4, yc, 0, M.oak, 'table-leg');
    var by = yc + s * (S.tw / 2 + S.bench.off + S.bench.deep / 2);
    boxAt(L, 0.05, S.bench.deep, xm, by, S.bench.seat - 0.05, M.bench, 'bench-' + t[0]);
    boxAt(0.08, S.bench.seat - 0.05, S.bench.deep - 0.05, S.tx0 + 0.3, by, 0, M.bench, 'bench-leg');
    boxAt(0.08, S.bench.seat - 0.05, S.bench.deep - 0.05, S.tx1 - 0.3, by, 0, M.bench, 'bench-leg');
  });
});

/* the tables and benches, gone on a Duelling Club evening (CoS 11 L10298: "The long dining tables had vanished") */
var furniture = room.children.filter(function (m) { return /^(table|bench)/.test(m.name); });

/* ================= the candles (Interiors' field, The look up; what they do is Magic's: req 311) */
var rnd = (function (seed) { return function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; })(1013);
function U(a, b) { return a + (b - a) * rnd(); }
var C = [], G = [];   /* each candle's home point, and its own draw, so one that breaks a rule is drawn again in its own part */
function band(x0, x1, yc, along) {
  var L = x1 - x0, cs = S.candles, n = Math.round(L * 2 * cs.dense * cs.rho), ne = Math.round(L * cs.edge * (cs.rho + 0.5) / 2);
  function put(f) { function g() { var p = f(); return along ? p : [p[1], p[0], p[2]]; } C.push(g()); G.push(g); }
  for (var i = 0; i < n; i++) put(function () { return [U(x0, x1), yc + U(-cs.dense, cs.dense), U(cs.lo, cs.hi)]; });
  [-1, 1].forEach(function (s) {
    for (var j = 0; j < ne; j++) put(function () { var t = 1 - Math.sqrt(rnd()); return [U(x0, x1), yc + s * (cs.dense + t * cs.edge), U(cs.lo, cs.hi + 0.2 * t)]; });
  });
}
/* a scatter over a rectangle of the model's frame, rho a square metre, its flames between z0 and z1 */
function scatter(x0, x1, y0, y1, rho, z0, z1) {
  var n = Math.round((x1 - x0) * (y1 - y0) * rho);
  function g() { return [U(x0, x1), U(y0, y1), U(z0, z1)]; }
  for (var i = 0; i < n; i++) { C.push(g()); G.push(g); }
}
/* Interiors' three rules for field b (req 482, *The field*, Godric's b), each candle that breaks one drawn again in its own
   part, so the count and the spread stand: (1) no two home points nearer than 0.25 m, and none within 0.06 m in plan of
   another nearer than 0.40 m in height (no candle in another's flame at the ends of their bob); (2) every home point 0.3
   m off the long walls' faces (the model's 51.5 and 69.5); (3) clear of each Christmas tree's cone at the taper's foot by
   the candle's own bob and sway */
var FIELD_CHECK = null;
function keepRules() {
  var cell = 0.4, grid = {}, cs = S.candles, tr = S.trees, move = Math.sqrt(cs.bob * cs.bob + cs.sway * cs.sway);
  var w0 = 51.5 + 0.3, w1 = 69.5 - 0.3, redrawn = 0, givenUp = 0, nearest = [];
  function k(a, b, c) { return Math.floor(a / cell) + ',' + Math.floor(b / cell) + ',' + Math.floor(c / cell); }
  function coneR(z) { return Math.max(0, tr.spread / 2 * (tr.h - z) / (tr.h - tr.from)); }
  function gap(p) {   /* the nearest home point already kept, or -1 if a rule is broken */
    if (p[1] < w0 || p[1] > w1) return -1;
    for (var a = 0; a < tr.xs.length; a++) for (var b = 0; b < tr.ys.length; b++)
      if (Math.hypot(p[0] - tr.xs[a], p[1] - tr.ys[b]) < coneR(p[2] - 0.265) + move) return -1;
    var best = 9, fx = Math.floor(p[0] / cell), fy = Math.floor(p[1] / cell), fz = Math.floor(p[2] / cell);
    for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) for (var dz = -1; dz <= 1; dz++) {
      var list = grid[(fx + dx) + ',' + (fy + dy) + ',' + (fz + dz)]; if (!list) continue;
      for (var j = 0; j < list.length; j++) {
        var q = list[j], pl = Math.hypot(p[0] - q[0], p[1] - q[1]), v = Math.abs(p[2] - q[2]), d = Math.hypot(pl, v);
        if (d < 0.25 || (pl < 0.06 && v < 0.40)) return -1;
        if (d < best) best = d;
      }
    }
    return best;
  }
  for (var i = 0; i < C.length; i++) {
    var p = C[i], n = 0, g;
    while ((g = gap(p)) < 0) { if (++n > 300) { givenUp++; break; } p = G[i](); redrawn++; }
    C[i] = p; (grid[k(p[0], p[1], p[2])] = grid[k(p[0], p[1], p[2])] || []).push(p);
  }
  /* each kept point's nearest neighbour, for the checks */
  var all = C.map(function (p) { return p; }); grid = {};
  all.forEach(function (p) { (grid[k(p[0], p[1], p[2])] = grid[k(p[0], p[1], p[2])] || []).push(p); });
  var minGap = 9, broken = 0;
  all.forEach(function (p) {
    var best = 9, fx = Math.floor(p[0] / cell), fy = Math.floor(p[1] / cell), fz = Math.floor(p[2] / cell);
    for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) for (var dz = -1; dz <= 1; dz++) {
      var list = grid[(fx + dx) + ',' + (fy + dy) + ',' + (fz + dz)]; if (!list) continue;
      for (var j = 0; j < list.length; j++) { var q = list[j]; if (q === p) continue;
        var pl = Math.hypot(p[0] - q[0], p[1] - q[1]), v = Math.abs(p[2] - q[2]), d = Math.hypot(pl, v);
        if (d < 0.25 || (pl < 0.06 && v < 0.40)) broken++; if (d < best) best = d; }
    }
    nearest.push(best); if (best < minGap) minGap = best;
  });
  nearest.sort(function (a, b) { return a - b; });
  var walls = all.filter(function (p) { return p[1] < w0 || p[1] > w1; }).length;
  var trees = all.filter(function (p) { for (var a = 0; a < tr.xs.length; a++) for (var b = 0; b < tr.ys.length; b++)
    if (Math.hypot(p[0] - tr.xs[a], p[1] - tr.ys[b]) < coneR(p[2] - 0.265) + move) return true; return false; }).length;
  FIELD_CHECK = { count: all.length, redrawn: redrawn, givenUp: givenUp, pairsBroken: broken / 2, nearWall: walls, inTree: trees,
                  nearestMin: +minGap.toFixed(3), nearestMedian: +nearest[nearest.length >> 1].toFixed(3) };
}
/* Which field: b is Godric's pick (greathall-candles-1015, 1, 6.07 pm, 15 October 2026: the bands three times as thick,
   the aisles scattered, a thinner lane of sky up the middle), the default; its count, 7,587, confirmed by Interiors with
   its three rules, drawn in here (req 482, 7.13 pm).
   ?field=a is Interiors' field as it stood (*The look up*), c the even span he passed over; both kept for comparison.
