<!doctype html><html><head><meta charset="utf-8"><title>The house glasses, live</title>
<style>body { margin: 0; background: #14100b; display: flex; justify-content: center; } #g { width: 100%; max-width: 1000px; margin-top: 20px; }</style>
</head><body><div id="g"></div>
<script src="drawn.js"></script>
<script src="lumos-icon.js"></script>
<script src="house-hourglass.js"></script>
<script>
// LumosHourglass.hallMount as the entrance hall would use it (Q25 answered 25.1; Rework 1 of Design's change list):
// the four glasses in their niches, each holding its house's own points (levels, the school's, Events' to set), the
// boys' gems landing in Gryffindor's. It plays: the morning's jump (seen 4 of the 6 slips, so last night's two land
// at once, his t1), then a spell's point and a brother taught (slower) in Gryffindor's glass, then Slytherin's own
// points dropping (the school's, never the boys'), its stones flying up with the clink, while Ravenclaw's rise.
// window.hallPlayed counts the steps done.
const HOUSES = ['lion'];
const slips = [10, 5, 20, 10, 25, 15].map((p, i) => ({ kind: 'spell', thing: 's' + i, points: p, house: 'lion', on: i < 4 ? '2026-10-12' : '2026-10-13' }));
const audio = window.AudioContext ? new AudioContext() : null;
const levels = { lion: 150, badger: 170, eagle: 190, snake: 230 };
const hall = LumosHourglass.hallMount(document.getElementById('g'), { slips, houses: HOUSES, levels, full: 400, audio });
window.hallPlayed = 0;
hall.jump(4).then(() => window.hallPlayed++);
setTimeout(() => hall.point({ kind: 'card', thing: 'dumbledore', points: 30, house: 'lion' }).then(() => window.hallPlayed++), 800);
setTimeout(() => hall.point({ kind: 'taught', thing: 'lumos', points: 20, house: 'lion' }).then(() => window.hallPlayed++), 900);
setTimeout(() => hall.levels({ snake: 200, eagle: 215 }).then(() => window.hallPlayed++), 1000);
</script>
</body></html>
