<!doctype html><html><head><meta charset="utf-8"><title>The plan, plain</title>
<link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Caveat:wght@400;600&family=Homemade+Apple&family=Covered+By+Your+Grace&family=Fondamento&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>body { margin: 0; background: #222; } svg { display: block; }</style></head><body><div id="m"></div>
<script src="../castle-model.js"></script>
<script src="marauders-map.js"></script>
<script>
// The map code as it stands after the Ministry's sweep (Design's change list, Rework 7): the plain parchment, one
// geometry from the castle model, the iron-gall ink, no Marauders' title, oath, hands, dots or spread (the Map stays a
// wink; those parts are kept in code, off) and no den (her plan is game, waiting). A still, at a phone's window.
// window.mapPlayed is 1 once it is drawn, for a shot.
window.mapPlayed = 0;
document.fonts.ready.then(() => {
  document.getElementById('m').innerHTML = LumosMap.svg(window.CASTLE_MODEL, { look: 'raised', view: LumosMap.phone(40, 4, 9, 390, 500), title: 0 });
  window.mapPlayed++;
});
</script></body></html>
