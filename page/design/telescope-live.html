<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telescope probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0c0b; color: #d8cfbf; font: 15px/1.4 Georgia, serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../castle-sky.js?v=1"></script>
<script src="telescope.js?v=1"></script>
<script>
/* telescope-live.html: Design's probe for telescope.js (req 623). The sky is CastleSky.at (Events', req 622) for ?at=
   (an ISO time, default 10 pm Eastern on 20 October 2026) at ?lat= and ?lon= (default 42 north, 75 west, the runtime's
   fallback home for that clock zone). ?aim=moon|saturn|<a named star> or ?alt=&az=; ?field=5 (pushed in) or 1.2
   (drawn out); drag to move the glass. ?sheet=1 draws four views side by side for the sheet. */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search), cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.scale(dpr, dpr);
  var when = new Date(q.get('at') || '2026-10-21T02:00:00Z'), home = { lat: +(q.get('lat') || 42), lon: +(q.get('lon') || -75) };
  var sky = CastleSky.at(when, home);
  fetch('../sky/stars.json').then(function (r) { return r.json(); }).then(function (cat) {
    var label = function (s, x, y) { ctx.fillStyle = '#d8cfbf'; ctx.textAlign = 'center'; ctx.fillText(s, x, y); };
    if (q.get('sheet')) {
      var views = [['moon', 1.2, 'the Moon, drawn out full (1.2°)'], ['saturn', 1.2, 'Saturn and its rings, drawn out full'],
                   ['alcyone', 5, 'the Pleiades, pushed in (5°)'], ['vega', 5, 'Vega in the Lyre, pushed in']];
      var cw = W / 2, ch = H / 2, r = Math.min(cw, ch) * 0.36, out = [];
      ctx.font = '15px Georgia';
      views.forEach(function (v, i) {
        var x = (i % 2) * cw + cw / 2, y = Math.floor(i / 2) * ch + ch / 2 - 10, aim = LumosTelescope.aimAt(sky, v[0], cat);
        var seen = aim ? LumosTelescope.draw(ctx, { sky: sky, catalogue: cat, aim: aim, field: v[1], x: x, y: y, r: r }) : [];
        label((i + 1) + '  ' + v[2], x, y + r * 1.16 + 26);
        out.push({ view: v[0], aim: aim && { alt: +aim.alt.toFixed(1), az: +aim.az.toFixed(1) }, seen: seen.length, first: seen.slice(0, 3).map(function (s) { return s.name; }) });
      });
      label('Through a pupil’s brass telescope, 10 pm on 20 October 2026, 42° north (CastleSky, req 622)', W / 2, 26);
      window.telescopeReady = { sheet: out, moon: sky.moon.phase, lit: sky.moon.lit };
      return;
    }
    var aim = q.get('alt') ? { alt: +q.get('alt'), az: +q.get('az') } : LumosTelescope.aimAt(sky, q.get('aim') || 'moon', cat) || { alt: 45, az: 180 };
    var field = +(q.get('field') || 5), r = Math.min(W, H) * 0.42, drag = null, seen = [];
    function paint() {
      ctx.fillStyle = '#0d0c0b'; ctx.fillRect(0, 0, W, H);
      seen = LumosTelescope.draw(ctx, { sky: sky, catalogue: cat, aim: aim, field: field, x: W / 2, y: H / 2, r: r });
      window.telescopeReady = { aim: aim, field: field, seen: seen.length, first: seen.slice(0, 5).map(function (s) { return s.name; }) };
    }
    cv.addEventListener('pointerdown', function (e) { drag = [e.clientX, e.clientY, aim.alt, aim.az]; });
    addEventListener('pointerup', function () { drag = null; });
    addEventListener('pointermove', function (e) {
      if (!drag) return;
      var k = field / (2 * r);
      aim = { alt: Math.max(-5, Math.min(89, drag[2] + (e.clientY - drag[1]) * k)), az: drag[3] - (e.clientX - drag[0]) * k / Math.max(0.2, Math.cos(drag[2] * Math.PI / 180)) };
      paint();
    });
    paint();
  });
})();
</script>
</body>
</html>
