<!doctype html><html><head><meta charset="utf-8"><title>The house hourglass, live</title>
<style>body { margin: 0; background: #14100b; display: flex; justify-content: center; } #g { width: 320px; margin-top: 20px; }</style>
</head><body><div id="g"></div>
<script src="drawn.js"></script>
<script src="lumos-icon.js"></script>
<script src="house-hourglass.js"></script>
<script>
// LumosHourglass.mount as a room would use it (req 222; Rework 1 of Design's change list): Gryffindor's glass, the
// house's own points heaped first (level), the boys' gems on them; ?niche for his t1. It plays, a second apart: a
// spell's point falling, a brother taught falling slower, then the house's own points dropping a little (the school's,
// never the boys'), flying up with the clink. window.hourglassPlayed counts the steps done, for a shot.
const q = new URLSearchParams(location.search), HOUSES = ['lion'];
const slips = [10, 5, 20, 10].map((p, i) => ({ kind: 'spell', thing: 's' + i, points: p, house: 'lion' }));
const audio = window.AudioContext ? new AudioContext() : null;
const glass = LumosHourglass.mount(document.getElementById('g'), { slips, houses: HOUSES, level: 180, full: 400, niche: q.has('niche'), audio });
window.hourglassPlayed = 0;
setTimeout(() => glass.point({ kind: 'card', thing: 'dumbledore', points: 30, house: 'lion' }).then(() => window.hourglassPlayed++), 800);
setTimeout(() => glass.point({ kind: 'taught', thing: 'lumos', points: 20, house: 'lion' }).then(() => window.hourglassPlayed++), 900);
setTimeout(() => glass.level(150).then(() => window.hourglassPlayed++), 1000);
</script>
</body></html>
