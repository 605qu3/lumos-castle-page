<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spells in the Entrance Hall, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b10; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #room { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; }
  #ink { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; touch-action: none; }
  body.look #ink { pointer-events: none; }
  #say { position: fixed; left: 0; right: 0; top: max(10px, env(safe-area-inset-top)); text-align: center; z-index: 3;
    font: 600 21px/1.25 Georgia, serif; color: #f3e6c4; pointer-events: none; text-shadow: 0 1px 6px #000, 0 0 3px #000; padding: 0 14px; }
  #hint { position: fixed; left: 12px; right: 12px; top: calc(max(10px, env(safe-area-inset-top)) + 34px); text-align: center; z-index: 3;
    font: 17px/1.3 Georgia, serif; color: #fff4d6; pointer-events: none; padding: 7px 10px; background: rgba(20,14,10,.55); border-radius: 10px; text-shadow: 0 1px 3px #000; }
  #ring { position: fixed; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    border: 2px solid rgba(255,244,214,.75); z-index: 3; pointer-events: none; transition: all .15s; box-shadow: 0 0 4px #000; }
  #ring.on { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-color: #ffd36a; box-shadow: 0 0 14px 3px rgba(255,200,90,.8); }
  #mode { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 4;
    font: 600 18px Georgia, serif; color: #f3e6c4; background: rgba(40,28,22,.88); border: 1px solid #8a6a40; border-radius: 26px; padding: 11px 20px; white-space: nowrap; touch-action: manipulation; }
</style>
</head>
<body class="wand">
<iframe id="room" title="the Entrance Hall" src="shell.html?place=entrance-hall&clean"></iframe>
<canvas id="ink"></canvas>
<div id="ring"></div>
<div id="say">The Entrance Hall</div>
<div id="hint">Loading the hall...</div>
<button id="mode">Wand out. Tap to look around.</button>
<script src="charms/spells.js?v=1"></script>
<script src="charms/aim.js?v=2"></script>
<script>
/* Spells in the Entrance Hall, a test page for the Charms lane (req 5154, rebuilt for req 5295, 11 November 2026;
   the owner is Godric). The room is the walking page itself (shell.html, its shell, light and palette, the walker's
   eye and his drag to look), shown in a frame; this page lays the wand over it. A thing that answers a spell is
   added to the hall: a candle on a stand, a quill on a stand, and the hall's own great doors. The aim is the screen's
   centre ray from the walker's eye; every spell lands through CharmsAim.resolve, so a spell cannot land on what did not
   ask for it. The stroke judges are spells.js's, unchanged. The door's spell is a test only: Alohomora's gate is not
   decided. */
var S = LumosSpells, A = CharmsAim, REACH = 24;
var fr = document.getElementById('room'), ink = document.getElementById('ink'), ictx = ink.getContext('2d');
var sayEl = document.getElementById('say'), hintEl = document.getElementById('hint'), ringEl = document.getElementById('ring'), modeBtn = document.getElementById('mode');
var W = innerWidth, H = innerHeight, G = null, T = null, RC = null, THINGS = [], aimed = null, log = [];
var st = { lit: false, float: 0, door: false, doorAng: 0, bump: {} };

function boot() {
  var w = fr.contentWindow, g = w && w.lumosGreybox;
  if (!g || !g.camera || !g.scene || !w.THREE) { setTimeout(boot, 200); return; }
  G = g; T = w.THREE; RC = new T.Raycaster(); build(); requestAnimationFrame(frame);
}
fr.addEventListener('load', function () { setTimeout(boot, 300); });
setTimeout(boot, 1500);

var candle, flame, lamp, quill, doorMesh, doorPivot, halo = {};
function mk(geo, col, x, y, z, basic) { var m = new T.Mesh(geo, basic ? new T.MeshBasicMaterial({ color: col }) : new T.MeshLambertMaterial({ color: col })); m.position.set(x, y, z); G.scene.add(m); return m; }
var glowTex = null;
function glowSprite(w, h, x, y, z) {   /* a soft warm glow, not a ball: a radial gradient on an additive sprite */
  if (!glowTex) { var cv = document.createElement('canvas'); cv.width = cv.height = 128; var g = cv.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,214,120,1)'); gr.addColorStop(0.35, 'rgba(255,190,90,.45)'); gr.addColorStop(1, 'rgba(255,170,60,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); glowTex = new T.CanvasTexture(cv); }
  var m = new T.Sprite(new T.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false, depthTest: false }));
  m.scale.set(w, h, 1); m.position.set(x, y, z); m.raycast = function () {}; G.scene.add(m); return m;
}
function mkHalo(r, x, y, z) { return glowSprite(r * 3, r * 3, x, y, z); }
function pick(r, x, y, z) {   /* the generous aim for a small thing: an unseen sphere a boy's finger can find */
  var m = new T.Mesh(new T.SphereGeometry(r, 8, 6), new T.MeshBasicMaterial({ visible: false })); m.position.set(x, y, z); G.scene.add(m); return m;
}
function build() {
  /* in front of the walker, who stands at the hall's south end facing north (the walking page's own start) */
  var eye = G.eye(), ex = eye.x, ez = eye.z, cz = ez + 6;
  /* a candle on a carved stand, left of the way */
  mk(new T.CylinderGeometry(0.12, 0.2, 1.4, 14), 0x5a4030, ex - 0.9, 0.7, cz);
  mk(new T.CylinderGeometry(0.2, 0.2, 0.06, 14), 0x7a5a3a, ex - 0.9, 1.43, cz);
  candle = mk(new T.CylinderGeometry(0.05, 0.05, 0.3, 12), 0xf2e8cc, ex - 0.9, 1.61, cz);
  flame = mk(new T.SphereGeometry(0.055, 12, 8), 0xffc860, ex - 0.9, 1.82, cz, true); flame.visible = false; flame.scale.set(1, 1.5, 1);
  lamp = new T.PointLight(0xffc880, 0, 9, 1.6); lamp.position.set(ex - 0.9, 1.9, cz - 0.1); G.scene.add(lamp);
  /* a quill on a stand, right of the way */
  mk(new T.CylinderGeometry(0.1, 0.18, 1.3, 14), 0x5a4030, ex + 0.9, 0.65, cz);
  mk(new T.CylinderGeometry(0.17, 0.17, 0.05, 14), 0x7a5a3a, ex + 0.9, 1.33, cz);
  quill = mk(new T.BoxGeometry(0.1, 0.02, 0.85), 0xe9dcb8, ex + 0.9, 1.42, cz); quill.rotation.y = 0.5;
  quill.userData.y0 = 1.42;
  halo.candle = mkHalo(0.34, ex - 0.9, 1.7, cz); halo.quill = mkHalo(0.36, ex + 0.9, 1.55, cz);
  var pc = pick(0.4, ex - 0.9, 1.7, cz), pq = pick(0.42, ex + 0.9, 1.55, cz);
  /* the hall's own great doors; a wide soft glow in front of them when aimed */
  doorMesh = null; G.scene.traverse(function (k) { if (k.name === 'door-great-hall-doors') doorMesh = k; });
  var thing = function (id, kind, answers, obj, halo) { return { id: id, kind: kind, answers: answers, obj: obj, halo: halo }; };
  THINGS = [thing('candle', 'candle', ['lumos'], pc, halo.candle), thing('quill', 'quill', ['leviosa'], pq, halo.quill)];
  if (doorMesh) {
    var b = new T.Box3().setFromObject(doorMesh), c = b.getCenter(new T.Vector3()), s = b.getSize(new T.Vector3());
    var dh = glowSprite(s.x + 2, s.y + 1.5, c.x, c.y, c.z - 0.3);
    THINGS.push(thing('door', 'door', ['swish'], doorMesh, dh));
    doorPivot = { x: b.min.x, z: (b.min.z + b.max.z) / 2, p0: doorMesh.position.clone() };   /* swings on its left edge */
  }
  hintEl.textContent = 'Turn the hall with a finger-drag (tap "look around"), then aim the ring.';
  window.lumosCharms3d.ready = true;
}

var blk = { at: -1, v: false };
function blocked(dist) {   /* the room's own stone met before the thing: checked a few times a second, the room is heavy */
  var now = performance.now(); if (now - blk.at < 120) return blk.v; blk.at = now;
  var mine = {}; THINGS.forEach(function (t) { mine[t.obj.uuid] = 1; });
  var hs = RC.intersectObjects(G.scene.children, true), i, k, own;
  blk.v = false;
  for (i = 0; i < hs.length; i++) {
    k = hs[i].object; if (hs[i].distance >= dist - 0.6) break;
    if (k.isSprite || !k.isMesh || (k.material && k.material.visible === false)) continue;
    own = false; for (; k; k = k.parent) if (mine[k.uuid]) own = true;
    if (!own && hs[i].object.visible) { blk.v = true; break; }
  }
  return blk.v;
}
/* which thing the ring is on: the nearest thing met by the centre ray, if it is one of ours */
function aimRay() {
  G.camera.updateMatrixWorld(); var o = new T.Vector3().setFromMatrixPosition(G.camera.matrixWorld), d = new T.Vector3(); G.camera.getWorldDirection(d); RC.set(o, d);
  var objs = THINGS.map(function (t) { return t.obj; }), hits = RC.intersectObjects(objs, false), h = hits[0];
  if (!h) return { o: o, d: d, thing: null, dist: 0, pt: null };
  var th = THINGS.filter(function (t) { return t.obj === h.object; })[0];
  if (th && th.id === 'door' && blocked(h.distance)) return { o: o, d: d, thing: null, dist: 0, pt: null };   /* a pillar or wall in front hides the door */
  return { o: o, d: d, thing: th, dist: h.distance, pt: h.point.toArray() };
}
var HINTS = { candle: 'The candle. Flick up: Lumos.', quill: 'The quill. Swish and flick: Wingardium Leviosa.', door: 'The great doors. Swish down (a test of the door).' };
/* what a stroke is: the lane's judges */
function read(pts) {
  var all = [], f = S.judgeFlick(pts, W, H, 'kind'), s = S.judgeSwishFlick(pts, W, H, 'kind'), d = S.judgeSwishDown(pts, W, H, 'kind');
  if (f.verdict === 'lumos' || f.verdict === 'nox') all.push({ spell: f.verdict, as: 'lumos' });
  if (s.verdict === 'leviosa') all.push({ spell: 'leviosa', as: 'leviosa' });
  if (d.verdict === 'swish') all.push({ spell: 'swish', as: 'swish' });
  return all;
}
var NAMES = { lumos: 'Lumos!', nox: 'Nox!', leviosa: 'Wingardium Leviosa!', swish: 'Open!' };
function cast(pts) {
  if (!G) return null;
  var all = read(pts), out, a = aimRay(), c = null, pick = null, i, r;
  if (!all.length) { out = { spell: null, landed: false, why: 'fizzle' }; say('It fizzles', 'Try a flick up, a swish and flick, or a swish down.'); }
  else {
    for (i = 0; i < all.length; i++) { r = A.resolve(all[i].as, a.thing, a.dist, a.pt, REACH); if (!c || r.landed) { c = r; pick = all[i]; } if (r.landed) break; }
    out = { spell: pick.spell, landed: c.landed, why: c.why, target: c.target && c.target.id };
    if (c.landed) land(pick.spell, c.target);
    else if (c.why === 'ignores') say(NAMES[pick.spell].replace('!', '') + ' does nothing here', 'The ' + c.target.kind + ' does not answer that. Try another spell.');
    else say('Nothing there', 'Turn until the ring is on the candle, the quill or the great doors.');
  }
  log.push(out); return out;
}
function say(a, b) { sayEl.textContent = a; if (b) { hintEl.textContent = b; hintHold = performance.now() + 2800; } }
var hintHold = 0;
function land(spell, t) {
  say(NAMES[spell], t.id === 'candle' ? 'The flame lights.' : t.id === 'quill' ? 'The quill floats up.' : 'The great doors swing.');
  st.bump[t.id] = performance.now();
  if (t.id === 'candle') { st.lit = spell !== 'nox'; flame.visible = st.lit; lamp.intensity = st.lit ? 2.2 : 0; }
  if (t.id === 'quill') st.float = performance.now();
  if (t.id === 'door') st.door = !st.door;
}

/* the stroke on the screen, and the wand that draws it */
var stroke = null, trail = null, active = null;
function size() { W = innerWidth; H = innerHeight; ink.width = W; ink.height = H; }
addEventListener('resize', size); size();
ink.addEventListener('pointerdown', function (e) { if (active !== null) return; active = e.pointerId; stroke = [{ x: e.clientX, y: e.clientY, t: performance.now() }]; trail = null; try { ink.setPointerCapture(e.pointerId); } catch (x) {} });
ink.addEventListener('pointermove', function (e) { if (e.pointerId !== active) return; e.preventDefault(); stroke.push({ x: e.clientX, y: e.clientY, t: performance.now() }); });
function end(e) { if (e.pointerId !== active) return; active = null; stroke.push({ x: e.clientX, y: e.clientY, t: performance.now() }); var p = stroke; stroke = null; trail = { pts: p, at: performance.now() }; cast(p); }
ink.addEventListener('pointerup', end); ink.addEventListener('pointercancel', function (e) { if (e.pointerId === active) { active = null; stroke = null; } });
modeBtn.addEventListener('click', function () {
  var look = !document.body.classList.contains('look'); document.body.classList.toggle('look', look);
  modeBtn.textContent = look ? 'Looking: drag to turn. Tap for wand.' : 'Wand out. Tap to look around.';
});
/* the wand, always in the walker's hand (Godric's "I don't see a wand", 11 November 2026, 2.15 pm): held from the lower
   right of the screen, pointing at the ring when resting, its tip on the finger while a spell is drawn. */
function drawWand(tx, ty, lit, rest) {
  var hx = W * 0.9, hy = H - 70;   /* the hand, low on the right, above the bottom button */
  var dx = tx - hx, dy = ty - hy, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, nx = -uy, ny = ux;
  var L = rest ? d * 0.6 : Math.max(d, 120);   /* resting: short of the ring, so the ring stays clear; drawing: tip on the finger */
  var ex = hx + ux * L, ey = hy + uy * L, gl = Math.min(110, L * 0.32), gx = hx + ux * gl, gy = hy + uy * gl;
  function taper(x0, y0, w0, x1, y1, w1, col) {
    ictx.fillStyle = col; ictx.beginPath(); ictx.moveTo(x0 + nx * w0, y0 + ny * w0); ictx.lineTo(x1 + nx * w1, y1 + ny * w1);
    ictx.lineTo(x1 - nx * w1, y1 - ny * w1); ictx.lineTo(x0 - nx * w0, y0 - ny * w0); ictx.closePath(); ictx.fill();
  }
  ictx.save(); ictx.shadowColor = 'rgba(0,0,0,.8)'; ictx.shadowBlur = 10;
  taper(gx, gy, 6.5, ex, ey, 3, '#3a2414');   /* the shaft, tapering to the tip */
  taper(hx - ux * 14, hy - uy * 14, 11, gx, gy, 9, '#20140c');   /* the grip */
  ictx.shadowBlur = 0;
  taper(gx, gy, 3, ex, ey, 1.2, '#b07c46');   /* light along the shaft */
  [0.25, 0.55, 0.85].forEach(function (f) { var x = hx + ux * gl * f, y = hy + uy * gl * f; ictx.strokeStyle = '#6e4626'; ictx.lineWidth = 3;
    ictx.beginPath(); ictx.moveTo(x + nx * 10, y + ny * 10); ictx.lineTo(x - nx * 10, y - ny * 10); ictx.stroke(); });   /* carved rings on the grip */
  ictx.restore();
  var r = lit ? 26 : 16, g = ictx.createRadialGradient(ex, ey, 0, ex, ey, r);
  g.addColorStop(0, lit ? 'rgba(255,250,220,.95)' : 'rgba(255,240,200,.6)'); g.addColorStop(1, 'rgba(255,220,140,0)');
  ictx.fillStyle = g; ictx.beginPath(); ictx.arc(ex, ey, r, 0, 7); ictx.fill();
  return { x: ex, y: ey };
}
var last = performance.now(), swing = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  var a = aimRay(), th = a.thing && a.dist <= REACH ? a.thing : null; aimed = th;
  ringEl.className = th ? 'on' : '';
  if (now > hintHold) hintEl.textContent = th ? HINTS[th.id] : 'Turn until the ring is on the candle, the quill or the great doors.';
  /* the aimed thing glows; a cast pulses it */
  THINGS.forEach(function (t) {
    var m = t.halo.material, want = (t === th ? 0.28 : 0) + Math.max(0, 1 - (now - (st.bump[t.id] || -9e9)) / 700) * 0.5;
    m.opacity += (want - m.opacity) * Math.min(1, dt * 12);
  });
  flame.scale.set(1 + 0.12 * Math.sin(now / 80), 1.5 + 0.2 * Math.sin(now / 63), 1);
  if (st.lit) lamp.intensity = 2.2 + 0.25 * Math.sin(now / 90);
  /* the quill floats up and turns, then settles back */
  var k = st.float ? (now - st.float) / 3200 : 2, h = k < 1 ? Math.sin(Math.min(1, k) * Math.PI) : 0;
  quill.position.y = quill.userData.y0 + 0.55 * h; quill.rotation.z = 0.5 * h * Math.sin(now / 300);
  halo.quill.position.y = 1.55 + 0.55 * h;
  THINGS[1].obj.position.y = 1.55 + 0.55 * h;
  /* the door swings on its left edge */
  if (doorMesh) {
    st.doorAng += ((st.door ? -1.5 : 0) - st.doorAng) * Math.min(1, dt * 3.5);
    var ang = st.doorAng, p = doorPivot, c = Math.cos(ang), s = Math.sin(ang), px = p.x, pz = p.z;
    doorMesh.rotation.y = ang;
    doorMesh.position.set(p.p0.x + px - (px * c + pz * s), p.p0.y, p.p0.z + pz - (-px * s + pz * c));
  }
  ictx.clearRect(0, 0, W, H);
  var pts = stroke || (trail && trail.pts), al = stroke ? 1 : (trail ? Math.max(0, 1 - (now - trail.at) / 500) : 0);
  if (pts && pts.length > 1 && al > 0) {
    ictx.lineCap = 'round'; ictx.lineJoin = 'round'; ictx.strokeStyle = 'rgba(255,236,170,' + 0.9 * al + ')'; ictx.lineWidth = 6; ictx.shadowColor = 'rgba(255,200,90,' + al + ')'; ictx.shadowBlur = 12;
    ictx.beginPath(); pts.forEach(function (q, i) { i ? ictx.lineTo(q.x, q.y) : ictx.moveTo(q.x, q.y); }); ictx.stroke(); ictx.shadowBlur = 0;
  }
  if (stroke && stroke.length) drawWand(stroke[stroke.length - 1].x, stroke[stroke.length - 1].y, true);
  else drawWand(W / 2, H / 2, !!th, true);
  requestAnimationFrame(frame);
}
/* a hook for a script: cast a drawn stroke given as points, read what the ring is on */
window.lumosCharms3d = { ready: false, cast: cast, aimed: function () { var a = aimRay(); return a.thing && a.thing.id; }, things: function () { return THINGS.map(function (t) { return t.id; }); }, log: log, door: function () { return { name: doorMesh && doorMesh.name, found: !!doorMesh }; } };
</script>
</body>
</html>
