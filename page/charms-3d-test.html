<!DOCTYPE html>
<html lang="en-GB">
<head>

<title>Spells in the Entrance Hall, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b10; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #room { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; }
</style>

<body class="wand">
<iframe id="room" title="the Entrance Hall" src="shell.html?place=entrance-hall&clean"></iframe>
<script src="charms/spells.js?v=1"></script>
<script src="charms/aim.js?v=2"></script>
<script src="charms/walk.js?v=1"></script>
<script>
/* Spells in the Entrance Hall, a test page for the Charms lane (req 5154; the owner is Godric). The room is the walking
   page itself (shell.html) shown in a frame; the wand, ring and spells are page/charms/walk.js, the same module the
   shell loads for itself. */
var fr = document.getElementById('room');
function go() { window.lumosCharms3d = CharmsWalk.start({ win: fr.contentWindow }); }
if (fr.contentDocument && fr.contentDocument.readyState === 'complete') go(); else fr.addEventListener('load', go);
</script>
