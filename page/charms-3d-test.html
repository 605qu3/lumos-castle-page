<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spells in 3D, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b10; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  #ink { z-index: 2; pointer-events: none; }
  #say { position: fixed; left: 0; right: 0; top: max(14px, env(safe-area-inset-top)); text-align: center; z-index: 3;
    font: 600 22px/1.3 Georgia, serif; color: #e9dcc0; pointer-events: none; text-shadow: 0 1px 6px #000; padding: 0 16px; }
  #why { position: fixed; left: 0; right: 0; top: calc(max(14px, env(safe-area-inset-top)) + 34px); text-align: center; z-index: 3;
    font: 16px/1.35 Georgia, serif; color: #b7a98d; pointer-events: none; padding: 0 16px; text-shadow: 0 1px 4px #000; }
  #dot { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    border: 2px solid rgba(233,220,192,.8); z-index: 3; pointer-events: none; }
  .turn { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 4; font: 26px Georgia, serif; width: 64px; height: 56px;
    color: #cdbf9f; background: rgba(34,28,38,.85); border: 1px solid #4a3f50; border-radius: 10px; touch-action: none; }
  #tl { left: 12px; } #tr { right: 12px; } #tu { left: 84px; } #td { right: 84px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ink"></canvas>
<div id="dot"></div>
<div id="say">Aim the dot, then draw a spell</div>
<div id="why">Flick up: Lumos. Swish and flick: Wingardium Leviosa. Swish down: the door (a test only).</div>
<button class="turn" id="tl" aria-label="turn left">&#9664;</button>
<button class="turn" id="tu" aria-label="look up">&#9650;</button>
<button class="turn" id="td" aria-label="look down">&#9660;</button>
<button class="turn" id="tr" aria-label="turn right">&#9654;</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="charms/spells.js?v=1"></script>
<script src="charms/aim.js?v=1"></script>
<script>
/* Spells in a 3D room, a test page for the Charms lane (req 5154, 11 November 2026; the owner is Godric).
   Drawn in code, nothing painted. The aim is the screen's centre ray from the eye; every spell lands through one
   function, CharmsAim.castAt, so a spell cannot land on what did not ask for it. The stroke judges are spells.js's, unchanged.
   Turn with the arrows (hold); draw anywhere on the screen. The door's spell is a test only: Alohomora's gate is not decided. */
var S = LumosSpells, A = CharmsAim, REACH = 7, EYE = [0, 1.6, 0];
var cv = document.getElementById('c'), ink = document.getElementById('ink'), ictx = ink.getContext('2d');
var sayEl = document.getElementById('say'), whyEl = document.getElementById('why');
var W = innerWidth, H = innerHeight;
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
var scene = new THREE.Scene(); scene.background = new THREE.Color(0x14111a); scene.fog = new THREE.Fog(0x14111a, 6, 14);
var cam = new THREE.PerspectiveCamera(70, W / H, 0.05, 30); cam.position.set(EYE[0], EYE[1], EYE[2]); cam.rotation.order = 'YXZ';
var amb = new THREE.AmbientLight(0x5a5270, 0.6); scene.add(amb);
var lamp = new THREE.PointLight(0xffd9a0, 0, 7, 2); lamp.position.set(0, 1.3, -3.8); scene.add(lamp);
function box(w, h, d, x, y, z, col) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col })); m.position.set(x, y, z); scene.add(m); return m; }
box(16, 0.1, 16, 0, -0.05, -3, 0x3a3040);
box(16, 3, 0.1, 0, 1.5, -6.05, 0x5a4e62);   /* the far wall */
box(0.1, 3, 12, -8, 1.5, -3, 0x4e4458); box(0.1, 3, 12, 8, 1.5, -3, 0x4e4458); box(16, 3, 0.1, 0, 1.5, 6, 0x4e4458);
/* the three things that answer, and three that do not (a book, the far wall, a stool) */
var shelf = box(1.4, 0.06, 0.4, 0, 0.95, -4, 0x6a4a30);
var candle = box(0.08, 0.36, 0.08, 0, 1.18, -4, 0xe8dcc0);
var flame = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffc860 })); flame.position.set(0, 1.42, -4); flame.visible = false; scene.add(flame);
var feather = box(0.06, 0.02, 0.5, 3, 1.1, -2, 0xf2efe6);
var door = box(0.1, 2.2, 1.0, -3, 1.1, -4.5, 0x7a4a2a);
var book = box(0.4, 0.3, 0.2, -0.8, 1.45, -5.9, 0x2a4a6a);
var stool = box(0.5, 0.5, 0.5, 2, 0.25, -4, 0x6a6a3a);
function thing(id, kind, answers, m, pad) {
  var b = new THREE.Box3().setFromObject(m); pad = pad || 0;
  return { id: id, kind: kind, answers: answers, mesh: m, min: [b.min.x - pad, b.min.y - pad, b.min.z - pad], max: [b.max.x + pad, b.max.y + pad, b.max.z + pad] };
}
/* a generous box round the small ones, so a boy's aim on a phone is kind; the shelf and walls are plain */
var THINGS = [thing('candle', 'candle', ['lumos'], candle, 0.08), thing('feather', 'feather', ['leviosa'], feather, 0.08), thing('door', 'door', ['swish'], door, 0.02),
  thing('shelf', 'shelf', [], shelf), thing('book', 'book', [], book, 0.04), thing('stool', 'stool', [], stool),
  { id: 'farwall', kind: 'wall', answers: [], min: [-8, 0, -6.1], max: [8, 3, -6] }];
var yaw = 0, pitch = 0, held = null, st = { lit: false, up: 0, doorOpen: false };
function look() { cam.rotation.set(pitch, yaw, 0); }
function aimRay() { return A.rayFrom(yaw, pitch); }
[['tl', function (d) { yaw += d; }, 1], ['tr', function (d) { yaw -= d; }, 1], ['tu', function (d) { pitch = Math.min(0.9, pitch + d); }, 1], ['td', function (d) { pitch = Math.max(-0.9, pitch - d); }, 1]].forEach(function (b) {
  var el = document.getElementById(b[0]);
  el.addEventListener('pointerdown', function (e) { e.preventDefault(); held = b[1]; try { el.setPointerCapture(e.pointerId); } catch (x) {} });
  ['pointerup', 'pointercancel'].forEach(function (n) { el.addEventListener(n, function () { held = null; }); });
});
/* the stroke on the screen */
var stroke = null, trail = null, active = null;
function size() { W = innerWidth; H = innerHeight; renderer.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); ink.width = W; ink.height = H; ink.style.width = W + 'px'; ink.style.height = H + 'px'; }
addEventListener('resize', size); size();
function say(a, b) { sayEl.textContent = a; whyEl.textContent = b || ''; }
/* what a stroke is: the lane's judges, the first that reads it */
function read(pts) {   /* every reading of the stroke the judges allow: a straight stroke down is Nox and a swish down both */
  var all = [], f = S.judgeFlick(pts, W, H, 'kind'), s = S.judgeSwishFlick(pts, W, H, 'kind'), d = S.judgeSwishDown(pts, W, H, 'kind');
  if (f.verdict === 'lumos' || f.verdict === 'nox') all.push({ spell: f.verdict, as: 'lumos', j: f });
  if (s.verdict === 'leviosa') all.push({ spell: 'leviosa', as: 'leviosa', j: s });
  if (d.verdict === 'swish') all.push({ spell: 'swish', as: 'swish', j: d });
  return all;
}
var NAMES = { lumos: 'Lumos!', nox: 'Nox!', leviosa: 'Wingardium Leviosa!', swish: 'The door swings' };
var log = [];
function cast(pts) {
  var all = read(pts), out, pick = null, c = null, i, t;
  if (!all.length) { out = { spell: null, landed: false, why: 'fizzle' }; say('It fizzles', 'Try a flick up, a swish and flick, or a swish down.'); }
  else {
    for (i = 0; i < all.length && !(c && c.landed); i++) { t = A.castAt(all[i].as, EYE, aimRay(), THINGS, REACH); if (!c || t.landed) { c = t; pick = all[i]; } }
    out = { spell: pick.spell, landed: c.landed, why: c.why, target: c.target && c.target.id };
    if (c.landed) land(pick.spell, c.target);
    else if (c.why === 'ignores') say(NAMES[pick.spell].replace('!', '') + ' finds nothing to do', 'The ' + c.target.kind + ' does not answer that spell. Aim at something that does.');
    else say('Nothing there', 'Turn until the dot is on something, then draw the spell.');
  }
  log.push(out); return out;
}
function land(spell, t) {
  say(NAMES[spell], 'Landed on the ' + t.kind + '.');
  if (t.id === 'candle') { st.lit = spell !== 'nox'; flame.visible = st.lit; lamp.intensity = st.lit ? 1.4 : 0; }
  if (t.id === 'feather') st.up = 1;
  if (t.id === 'door') st.doorOpen = !st.doorOpen;
}
cv.addEventListener('pointerdown', function (e) { if (active !== null) return; active = e.pointerId; stroke = [{ x: e.clientX, y: e.clientY, t: performance.now() }]; trail = null; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
cv.addEventListener('pointermove', function (e) { if (e.pointerId !== active) return; e.preventDefault(); stroke.push({ x: e.clientX, y: e.clientY, t: performance.now() }); });
function end(e) { if (e.pointerId !== active) return; active = null; stroke.push({ x: e.clientX, y: e.clientY, t: performance.now() }); var p = stroke; stroke = null; trail = { pts: p, at: performance.now() }; cast(p); }
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', function (e) { if (e.pointerId === active) { active = null; stroke = null; } });
var last = performance.now(), frames = 0, fpsAt = last, fps = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (held) held(dt * 1.4);
  look();
  /* the feather floats up while it is lifted, then settles; the door swings on its hinge edge */
  var ty = st.up ? 1.9 : 1.1; feather.position.y += (ty - feather.position.y) * Math.min(1, dt * 3);
  if (st.up && feather.position.y > 1.85) st.up = 0;
  var ta = st.doorOpen ? -1.4 : 0; door.rotation.y += (ta - door.rotation.y) * Math.min(1, dt * 4);
  flame.scale.setScalar(1 + 0.15 * Math.sin(now / 90));
  renderer.render(scene, cam);
  ictx.clearRect(0, 0, W, H);
  var pts = stroke || (trail && trail.pts), a = stroke ? 1 : (trail ? Math.max(0, 1 - (now - trail.at) / 400) : 0);
  if (pts && pts.length > 1 && a > 0) { ictx.lineCap = 'round'; ictx.lineJoin = 'round'; ictx.strokeStyle = 'rgba(220,225,255,' + 0.6 * a + ')'; ictx.lineWidth = 5; ictx.beginPath(); pts.forEach(function (p, i) { i ? ictx.lineTo(p.x, p.y) : ictx.moveTo(p.x, p.y); }); ictx.stroke(); }
  frames++; if (now - fpsAt > 1000) { fps = Math.round(frames * 1000 / (now - fpsAt)); frames = 0; fpsAt = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* a hook for a script: aim by yaw and pitch, cast a drawn stroke given as points */
window.lumosCharms3d = { aim: function (y, p) { yaw = y; pitch = p; look(); }, cast: cast, ray: aimRay, things: THINGS, state: function () { return { st: st, fps: fps, yaw: yaw, pitch: pitch }; }, log: log };
</script>
</body>
</html>
