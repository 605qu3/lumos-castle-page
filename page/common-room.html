<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gryffindor common room, greybox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cinzel&family=EB+Garamond:ital@0;1&family=Fondamento&family=Nothing+You+Could+Do&family=Short+Stack&family=Quintessential&family=Almendra+SC&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070605;
    --hud-bg: rgba(24, 21, 18, 0.78);
    --hud-fg: #d9d2c6;
    --hud-dim: #8e877c;
    --hud-on: #e9b86a;
    --hud-line: rgba(255, 255, 255, 0.16);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #070605; }
  }
  :root[data-theme="dark"] { --bg: #070605; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    color: var(--hud-fg);
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  #stats {
    font-size: 12px;
    line-height: 1.35;
    background: var(--hud-bg);
    padding: 6px 9px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
    color: var(--hud-dim);
    white-space: pre;
  }
  #btns { display: flex; flex-wrap: wrap; gap: 6px; max-width: 320px; pointer-events: auto; }
  button {
    font: 500 13px/1 -apple-system, system-ui, "Segoe UI", sans-serif;
    color: var(--hud-fg);
    background: var(--hud-bg);
    border: 1px solid var(--hud-line);
    border-radius: 6px;
    min-height: 38px;
    min-width: 44px;
    padding: 0 12px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  button.on { color: var(--hud-on); border-color: var(--hud-on); }
  button:focus-visible { outline: 2px solid var(--hud-on); outline-offset: 2px; }
  #back {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    min-height: 46px;
    padding: 0 18px;
    font-size: 15px;
  }
  #help {
    position: fixed;
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    max-width: min(420px, calc(100vw - 20px));
    background: var(--hud-bg);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.45;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
  /* the events' lines (board req 65): said on a slip by the speaker, heard in faint italic toward where it comes from,
     written on a scrap in its hand; one at a time, a tap on the words puts it away */
  #lines { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .line { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; opacity: 0;
    transition: opacity 0.35s ease; -webkit-tap-highlight-color: transparent; }
  .line.on { opacity: 1; }
  .line.said { max-width: min(330px, 70vw); padding: 9px 13px 10px; background: #efe5cc; color: #2a2016;
    border-radius: 7px; box-shadow: 0 3px 14px rgba(0,0,0,0.45); font: 400 20px/1.3 "EB Garamond", Georgia, serif; }
  .line.said::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -9px; margin-left: -9px;
    border: 9px solid transparent; border-bottom: 0; border-top-color: #efe5cc; }
  .line.said.below::after { bottom: auto; top: -9px; border-top: 0; border-bottom: 9px solid #efe5cc; }
  .line.heard { max-width: min(420px, 80vw); color: #e9dfc6; text-align: center;
    font: italic 400 21px/1.3 "IM Fell English", Georgia, serif; text-shadow: 0 0 6px #000, 0 0 14px rgba(0,0,0,0.9); }
  .line.heard.sound { color: #cfc4aa; font-size: 19px; }
  .line.written { max-width: min(300px, 66vw); padding: 12px 15px; background: #f1e8d2; color: #2b2a4a;
    box-shadow: 0 3px 14px rgba(0,0,0,0.5); transform-origin: 50% 0; font: 400 21px/1.35 "Short Stack", cursive;
    white-space: pre-line; }
  @media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>
</head>
<body>
<!--
SOURCES for the notice board (the one object in this greybox that is not a placeholder)

Governing rules cited: FDP-33 (made by someone in the world, in that maker's style), FDP-22 and LDP-42 (legibility, clear
round hand), LDP-20 (hand and print only), LDP-22 (style and wear are separate: only the month-old notice is worn),
LDP-97 (printed form lines in the ceremonial print voice, entries written in by hand), LDP-98 (ordinary school paperwork
may be invented; no canon character gains a history), LDP-100 (met in the room at room scale, read in the hand),
LDP-91 (evidence beats animation: the torn corner left under its pin), LDP-5 (Book 1 only; nothing from Book 2 is drawn).

Notices, all Book 1:
 1. Flying lessons. A printed school form filled in by hand. Content: PS9 (a notice in the Gryffindor common room; flying
    lessons start Thursday; Gryffindor learns with Slytherin; half past three, in the grounds) and PS5 (first-years may not
    bring their own broomsticks). Invented as ordinary paperwork (LDP-98): the form itself, the wording, Madam Hooch's
    signature as the flying teacher (PS9 names her as the teacher of that lesson).
 2. Library. Madam Pince's hand (PS12 names her as the librarian). Content: PS11 (library books are not to be taken outside
    the school). Invented as ordinary paperwork: the Friday return day.
 3. Quidditch practice. Oliver Wood's hand. Content: PS10 (practice three evenings a week), PS11 (the first match is
    against Slytherin). Invented as ordinary paperwork: the day, the hour, the wording.
 4. Lost toad. Neville Longbottom's hand. Content: PS6 and PS7 (Trevor, who keeps getting lost). Invented: the wording and
    his drawing.
 5. A torn corner of a notice someone pulled down, still under its pin. Invented, LDP-91.
 Dates are given as weekdays only, so the board never contradicts the real calendar (LDP-23).

Hands, as settled in the hand bake-off and written into the design system's tokens/fonts.css. Print: IM Fell English,
EB Garamond, Cinzel. Ceremonial: IM Fell English SC, print only, so it sets the printed matter of notice 1 and never an
entry (LDP-97). Librarian's round hand: Fondamento, writing the entries of notice 1 and all of notice 2. Casual adult hand:
Nothing You Could Do, for Wood. Child hand: Short Stack, used for Neville provisionally. Open point: Short Stack is the
boys' shared hand, and LDP-41 gives every character a hand of their own, so a child character writing in it will read as
one of the boys; a fifth token for child characters is needed before any character's note sits next to a boy's.
Weight is 400 throughout; nothing is synthesised.

Precedents consulted from Godric's folders, never reproduced: parchment-scrap-04 and -05 (printed billheads with entries
written in, the model for notice 1), journal-05 (18th c. round hand), owl-letter-01 (1830s quick hand, the model for
Wood's note), parchment-scrap-01 (torn edge), postcard-01 (printed small capitals), owl-letter-04 (pinned, folded paper).

Paper tiles, held in the page's asset store: paper-tiles-01 (laid, buff), paper-tiles-03 (cream), paper-tiles-04 (buff), from the paper-tiles folder,
which is public domain, CC0 or Godric's own photographs by the folder's rule; the folder's record file carries the exact
licence line for each. Each is a centre crop downscaled to 640 px and mirror-tiled at draw time.

Nothing on the board is generated. The HUD remains the test harness, not the app.

DECISIONS LOG (FDP-45), one line per round, newest last
armchair-left, round 1: first drawn layer. A generated image (Gemini, prompted in chat to the layer spec), recorded as
generated under LDP-99, which admits generation for the look of a room and never for a record. Keyed from chroma
green, edge unmixed and despilled, resized premultiplied to 420 px wide (1.05 m at tier B, 400 px/m); height follows
the image, 1.23 m. Placed at 1.05 m wide instead of the greybox's 1.5 m, because the placeholder was oversized against
the 2.2 m hearth opening and the 1.6 m board; the chair is now a real chair's size.
room, colour management: the page now renders sRGB in and out (textures tagged sRGB, flat colours and lights converted
from their design values) so a drawing appears as drawn under neutral light; default exposure lowered from 1.1 to 0.8
to compensate. Done after the first drawn layer showed darker than its file. Tapestry placeholder moved 2 degrees
toward the hearth, off the left window.
cat, round 1: a nine-cell sheet generated to the plate (Gemini, anchors chair and boar), recorded as generated under
LDP-99. Cells cut by their own component so a neighbour's whiskers never bleed in, aligned bottom-centre in uniform
cells, kept at the sheet's native size, 600 px per metre so the sitting cat stands about 0.53 m: real size wins over the
tier B minimum. Six stride frames advance by distance walked (one stride 0.55 m), so the feet never skate; sitting
shows the wrapped tail, a flick every few seconds, and the look back over the shoulder when a boy tapped it. The old
placeholder bob is gone. Drift noted in the plate log: nine stripe bands where six were asked.
sofa, round 1: generated to the plate (Gemini, anchors chair and boar), recorded as generated under LDP-99. A white
border with a black rule arrived despite the output paragraph and was trimmed before keying; keyed, unmixed and
despilled as the chair was, kept at native size, 873 px wide (364 px per metre, under tier B, accepted on the far
plane: real size wins). Placed at 1.6 m wide instead of the greybox's 2.4 m, because the drawing is a two-seater and
at 2.4 m it stood 1.9 m tall; the width matches its arm height to the chair's (0.72 m), averaged between the near and
far ends because the drawing carries strong perspective. Height follows the image, 1.28 m. Drifts for the plate log:
cross-hatching over the lit faces reading as weave, a viewpoint about 25 degrees above the seat, a two-seater where
2.4 m was asked (the two-cushion count in the prompt pulled the length down), cloth lighter and pinker than the
chair's, and the border.
page, tiles moved out: the three notice-board paper tiles (laid, cream, buff; 640 px JPEGs) left the page source, where
they sat as base64 data URIs, 86 KB of a 159 KB file. They were held in the artifact's asset store until 6 October 2026,
and now sit beside the page as assets/tiles/paper-laid.jpg, paper-cream.jpg and paper-buff.jpg, loaded by the
same promise-based loader as before. Nothing drawn changes; the page source is now code only, so it can be read by search.
sofa, round 2: a fresh generation from the revised prompt (three cushions, camera stated as distance and angle, hatching
direction per face, base colour in words, green to all four edges). It came back geometrically identical to round 1:
silhouette 874 x 701 against 873 x 700, far-leg offset 241 px in both, the same border. Three cushions arrived and the
cloth darkened a step; the camera, border and hatching instructions did not move it. Not placed, because its viewpoint
is round 1's, already judged on the iPad as floating. Round 3 is an edit of this image rather than a fresh generation.
sofa, round 3: an edit of the round-2 drawing (Gemini, the round-2 image and the armchair attached), asked to lower the
viewpoint to the arm tops and to run the hatching one way. The camera moved: eye level at the arms, cushions as thin
wedges, the four feet within 60 px of one line, no border. The view went square-on rather than thirty degrees, which
suits a flat cutout. New drift: a row of seven buttons along the back, because the edit prompt did not restate the
exclusions; the cross-hatched grid on the arms persists. Keyed from the corners (the green now runs to the edges),
926 x 502 px native, 545 px per metre. Placed at 1.7 m wide by the arm-height datum (0.72 m), height 0.92 m; at the
greybox's 2.4 m it would stand 1.3 m tall. Replaces round 1 in the room; round 4 is an edit for the buttons and the grid.
plan, right armchair moved: on the iPad the sofa stood on the floor but was hidden behind the armchair-right placeholder.
From the camera at (0, 1.9, 7) the chair at x 2.0, z -2.1 spans 7.7 to 17.1 degrees and the 1.7 m sofa at x 2.3, z -3.7
spans 7.6 to 16.6, so the chair covered it entirely; the 2.4 m placeholder was also covered but for two degrees a side,
which the greybox never showed because both were grey. The sofa stays, since it is placed for the far plane in firelight;
the right armchair moves to x 3.1, z -0.6, still flanking the hearth, clear of the sofa and in front of the stair foot.
The layer spec's table is changed to match; its plan drawing is not yet redrawn.
sofa, round 3 verdict: on the iPad it stands on the floor and reads as the chair's workshop in the firelight on the far
plane; 1.7 m reads right against the chair and the hearth. Round 4 is an edit for the buttons and the grid only.
wall, notice board moved: the board at 44.7 degrees right of the hearth overlapped the right window (31.5 degrees) by
0.13 m of wall and 0.6 m of height, a greybox collision that had been there all along: 13.2 degrees of arc at 5.5 m is
1.27 m, and half a window plus half a board is 1.4 m. The board moves to 50.4 degrees (Math.PI - 0.88): 1.8 m from the
window centre, clear by 0.4 m, and still clear of the stair foot from the camera. The windows stay a matched pair.
sofa, round 4: an edit of round 3 for the two named faults. Buttons gone, and nothing else moved: silhouette 926 x 503
against 926 x 502, the four legs within one pixel of round 3's, no border, the cloth a step deeper (139, 82, 73 against
142, 84, 75). The one-way hatching did not take: the arms still carry a cross-hatched grid, held through three edits.
Placed as the sofa, since the grid is the only fault left and it reads as cloth at room scale; the anchor-set question
goes to the iPad. If the sofa joins the anchors the grid propagates, so the alternative is to leave the set at two.
sofa, round 4 verdict: on the iPad it reads as cloth and as the chair's workshop; the grid is invisible at room scale,
so it is a studio fault only. The anchor set stays at the armchair and the boar, and the sofa ships as a layer. Done at
four rounds.
cat, path moved: walking in front of the hearth, the cat's dark silhouette against the fire read as standing in it. Its
second point sat at -3.1 degrees from the camera, inside the fire's +/- 3.1 degree span, and 11.1 m away. A point is
added at x 1.1, z -3.4 and the old one moved to x -0.6, z -2.9, so the walk crosses the hearth a metre and a half nearer
the viewer and the silhouette passes over hearthstone and floor instead of flame. The loop is otherwise unchanged.
cat, path rebuilt: moving the walk forward put it level with the sofa's plane at z -3.7 inside the sofa's x span, and
two parallel cutouts at the same depth poke through each other, which is the cat walking through the settee. The same
fault was already there against the left armchair at z -1.9 and went unnoticed. A cat behind a piece or in front of it
is fine, because the cutouts depth-test; level with one is not. The loop is now x 2.7 z -2.7, x 1.0 z -3.0, x -1.4
z -3.1, x -2.8 z -2.8, x 1.6 z -2.6: it runs between z -2.5 and -3.13, so it clears every piece's plane by at least
0.35 m, passes in front of the sofa and behind the left armchair, and never crosses the fire deep. Rule for any mover:
a path keeps 0.35 m of depth from the plane of any cutout whose width it passes through, the cat's own half-width
included.
cat, stops randomised: the loop runs about nineteen seconds, the stop was pinned to one point on it and lasted six, so
the cat halted behind the left armchair every lap and two laps in forty seconds read as a glitch. The stop point is now
drawn fresh each lap, at least 0.3 of the loop from the last one; four laps in ten have no stop at all; the stop lasts
four to nine seconds. A tap still sits the cat on demand and now counts as that lap's stop, so it cannot sit twice in
a row. Nothing about the path or the sheet changes.
wingback, round 1: the first layer through the API pipeline (Nano Banana Pro at 2K, one candidate, about thirteen
cents) and the first piece drawn by the API's hand rather than the Gemini app's. It passed all seven checks: one
island, 1414 px per metre, outer feet 15 px apart, cloth 20 from the anchor against a tolerance of 45, crisp edge,
density, no border. Placed at 1.1 m wide, height 1.28 m from the image: a wing chair is the armchair's twin at about
1.05 m, and the greybox's 2.6 m was a placeholder's guess that would have made it three metres tall. The drawing shows
the near arm and a corner of seat, which the prompt asked it not to; kept, because a foreground frame that shows a
corner of its own seat reads as a chair rather than a wall, and the seat corner takes the firelight.
camera, lowered to a boy's eye line: with the wingback drawn at its real 1.1 m its top stands at 1.28 m, below the
camera's 1.9 m, so it fell to a sliver in the corner and moving it nearer would have dropped it out of frame entirely.
The greybox framed only because it was wrong: at 2.6 by 2.4 m its top stood above the camera and it behaved like a
wall. A real chair cannot frame a shot taken from a standing adult's eye, and the room is a boys' common room, so
CAM_BASE goes from 1.9 to 1.35 m and FOCUS from 1.6 to 1.25 m. Everything already placed is judged again from here.
tapestry, round 3: the first wall-hung piece. Round 1 (a lion walking on a pale ground) read as a printed tea towel and
the stone boar from the anchors was drawn into the picture; round 2 edited it and the boar stayed in two of three. Round
3 was a fresh prompt: a griffin standing upright filling the cloth, a dark faded blue-green ground, and a sentence telling
the model to draw neither reference object. The dark ground made it read as cloth. The griffin is invented past the
books under LDP-98 (canon's only griffin is Dumbledore's knocker, Book 2) and adds no lore. Placed at 1.44 m wide with
the pole, height 1.67 m from the image; the greybox's 1.2 by 2.6 was a guess and the drawing came out squarer. It hangs
at its centre, 3.9 m up, so the loader now leaves a wall piece's height alone (pivot 'centre'), and the placeholder's
material gained the alpha cutoff the cutouts already had. Not a third anchor: the chair's red and ochre in a new shape.
tapestry, flutter: a hanging above a fire moves in the warm air, so the cloth is now a 12 by 24 mesh displaced a
centimetre or two off the wall each frame, pinned at the pole and freest at the hem, uneven over time. It stirs harder
for a few seconds when the fire is stoked and when the portrait hole lets the draught in. Behaviour, not ornament.
tapestry, flutter retuned: at a centimetre straight toward the viewer it was invisible, so the depth went to 3 cm
(TAPESTRY_STIR) and the hem now sways sideways by about 2 cm. That pushed the cloth into the curved wall, whose 5.6 m
radius stands only 5 cm behind the flat cloth's edges, so the wave now only lifts away from the wall and the hanging
moved 5 cm further into the room.
portrait-mantel, round 2: candidate 2 of this round's set. Keyed at 1279 x 1714 px, 1279 px per metre. Placed at 1.0 m
wide, height 1.34 m from the image, hung at its centre 4.05 m up. A framed oil painting of an empty room: a tall window
upper left, one plain wooden high-backed chair in its light, open floor running out at the right edge, which is the
exit the sitter will use in 0.4 and faces portrait-right. Round 1, a fresh prompt, settled the subject: a dark warm
field inside a gilt rim read as an old painting rather than a page, and closing the painted room by count (a window
and one chair, nothing else) kept the stone boar out. Its chair stood at about seven-tenths of the painting's height,
right of centre, so round 2 edited it, sized against the window sill: it came down to about 54 percent and moved left,
though it kept a three-quarter view and turned to face the window, accepted because a chair by a window faces it. The
word portrait stays out of the prompt, since it pulls a face. The material gained the alpha cutoff, and the two
portrait meshes now carry their layer ids as names, which the loader needs.
tapestry, moved back to 15 degrees: its placeholder had been moved 2 degrees toward the hearth, off the left window
(13.2 degrees, Math.PI + 0.23), a move the spec and handoff never recorded. With the tapestry drawn at 1.44 m and the
mantel portrait at its real width, that left 5 cm between the gilt and the cloth. At 15 degrees it stands about 22 cm
from the portrait and 27 cm from the left window, the two gaps balanced.
room, exposure: the default goes from 0.8 to 1.0, judged with the mantel portrait placed. 0.8 had been set to
compensate when the page moved to sRGB colour management; 1.0 now reads best.
page, off the asset store: the nine images the page loads were held in the claude.ai artifact's asset store as
/_blob/ ids. They are now files beside the page, assets/layers/*.png and assets/tiles/*.jpg, reached by relative
path, so the room serves from GitHub Pages at 605qu3.github.io/lumos-castle-page/page/common-room.html. Nothing
drawn changed. The claude.ai room is retired.
portrait-right, round 1: candidate 1, taken on its first fresh prompt with all eight checks passing. Keyed at
1747 x 1907 px, 1747 px per metre. Placed at 1.0 m wide, height 1.09 m from the image, hung at its centre 3.9 m up,
16 degrees right of the hearth. An empty study by the mantel's painter: an open doorway at the left edge, which is
the exit its sitter will use and faces the mantel's right-edge exit, with pale light falling from it across the
floor in a wedge; a writing desk against the back wall right of centre; and one chair in the light, turned out from
the desk as if just vacated. The chair's back came in at half the doorway's height, as asked, so a standing sitter
has its scale. Two misses accepted: the painting is 1.09 times as tall as it is wide where 1.3 was asked and the
mantel is 1.34, so the pair are different shapes; and the chair is a swivel chair on a pedestal rather than the
plain wooden one asked for. Its material gained the alpha cutoff, which only the mantel's mesh had.
sitter-mantel, round 2: the mantel's sitter, a witch in umber-green robes and a soft pointed hat, by the mantel's
painter, drawn with the painting attached for its light. Recorded as generated under LDP-99. Eight cells at
465 x 925 px where ten were asked: four frames of
one stride, standing, settling her hat, rising, and a seated cell with a second stick in her raised hand, which is
never drawn. Round 1 had six cells and only one walking pose, so she slid. Drawn into the painting's canvas at 0.66
of the picture's height and clipped to it, so she is cut by the painted edge on her way out at the right.
sitter-mantel-seated, round 1: four seated cells at 548 x 913 px, drawn with her main sheet attached, so she is the
same woman: at the window, at her hands, out of the painting, settling her hat. One body in all four, differing only
above the waist, so a swap is a glance. Drawn at 0.55 / 0.66 of the main sheet's scale and placed by her hips, not her
feet, low enough that her boot meets the painted floor; her skirt covers the seat. She sits only in her own chair.
sitter-right, round 1: portrait-right's sitter, a man of about fifty with short grey hair and a trimmed beard in
slate robes, by the same painter, drawn with her sheet attached for scale and told to draw a different person.
Recorded as generated under LDP-99; looked at for likeness and judged none. Eight cells at 508 x 898 px, of which
standing, rising and seated at ease are used. Its stride shuffled and lost the wand in three frames, and the writing
cell is dropped because the painted desk has no chair at it. Every cell faces right where left was asked; the page
flips him. Seated in the swivel chair by his hips; visiting the mantel he stands at 0.75, clear of her chair.
sitter-right-walk, round 2: his stride on its own sheet, four cells at 526 x 1276 px, contact and lifted twice, the
wand in the same hand throughout. Round 1 was given his whole sheet and copied it, half its cells kept and half
redrawn; round 2 was given one cut-out figure of him and worked. His arms barely swing. The walk frame comes from
distance walked, 0.24 of a picture's width per four frames, so his feet cannot skate. The two sitters now visit each
other through exits that face across the wall, home more often than not and away for minutes at a time.
window-left, round 2: the first transparent glass. A glazier's leaded window in the mason's stone reveal: a
round-headed arch, a stone transom where it begins, one mullion and two tall lights of diamond quarries with iron
saddle bars, an opening casement in the left-hand light on black iron hinges with a brass latch and stay, and in the
head a painted roundel of an owl in flight, wingtips on its lead ring (owls of PS 1; invented past the books under
LDP-98, adding no lore). The glass is not drawn: it keys out and the sky shows through. Recorded as generated
under LDP-99. Round 1, on the square canvas every piece had used, came back 1.47 times as tall as wide where about
2.25 was asked; round 2, asked for a 9:16 canvas, came back 2.01. Keyed at 1225 x 2466 px, 1021 px per metre,
placed at 1.2 m wide, 2.42 m tall from the image, centred 3.3 m up where the placeholder was. Lit like the paintings;
its sky is a separate unlit plane 3 cm behind, shrunk to four-fifths by seven-eighths so it sits inside the reveal,
since at full size it showed round the window as a halo. The right window is still the placeholder.
window-right, round 4: window-left's pair by the same glazier, drawn with window-left's round 2 attached first, and
the same size to the pixel. It differs in three things: in the roundel a five-pointed shooting star rising to the
upper right, its tail trailing down to the ring at the lower left (the shooting stars of PS 1, adding no lore); no
casement, both lights fixed; one quarry low in the right-hand light cracked and mended with lead. Round 1, fresh,

/* Per painting: where its painted room is, how big a person is in it, and the
   places that matter. picture is the painted area inside the gilt, measured off
   each drawing as a fraction of the whole image. figureH is a standing figure's
   height as a fraction of the picture's height, derived from what each painting
   already contains: in the mantel the chair's back spans about 18 percent of the
   picture and a chair back is about 0.95 m, so a metre is 19 percent and a
   1.7 m woman is 32; in portrait-right the doorway is three-quarters of the
   picture and a doorway is about 2 m, so a metre is 37 percent and a man is 64.
   Both are meant to be tuned by eye, and the mantel's was: by 0.62 to 0.66,
   where her boot meets the painted floor seated. The study's stands as derived. chairSeat is where the resident's hips go
   in the painted chair, and seatFacing the way they face sitting in it. seatX
   is where the resident walks to and from the chair, risingX where they get up,
   visitX where a visitor stands, clear of the chair. facesOut is the way out:
   right in the mantel, left in the study, so the two exits face each other and
   a visitor crosses between them. */
var SCENES = {
  'portrait-mantel': {
    picture: [0.156, 0.117, 0.844, 0.883],
    figureH: 0.66, footY: 0.88,
    /* Not the painted seat itself: she is drawn with her legs out in front, so
       her feet sit only a little below her hips, while on this chair with her
       feet under her the drop is larger. No one size satisfies both, and the
       floor is the stronger cue, so she is set low enough for her boot to land
       on it and her skirt covers the seat. */
    chairSeat: [0.45, 0.745], seatFacing: -1,
    risingX: 0.34, seatX: 0.52, visitX: 0.75, exitX: 1.06, facesOut: 1

  'portrait-right': {
    picture: [0.126, 0.115, 0.874, 0.885],
    figureH: 0.64, footY: 0.90,
    /* the swivel chair, turned out from the desk toward the doorway */
    chairSeat: [0.70, 0.69], seatFacing: -1,
    risingX: 0.62, seatX: 0.62, visitX: 0.27, exitX: -0.06, facesOut: -1
  }
};

var portraits = {};        /* id -> its canvas, its clean copy and its texture */
var sheetImages = {};      /* sitter -> sheet name -> its loaded image */

function applyPortrait(id, entry) {
  var mesh = scene.getObjectByName(id);
  if (!mesh || !entry.url) return;
  var im = new Image();
  im.onload = function () {
    var w = im.width, h = im.height;
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.drawImage(im, 0, 0);
    var clean = document.createElement('canvas'); clean.width = w; clean.height = h;
    clean.getContext('2d').drawImage(im, 0, 0);

    var t = tex(cv);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    var hm = entry.w * h / w;
    mesh.geometry.dispose();

    mesh.material.map = t; mesh.material.needsUpdate = true;
    mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: t, alphaTest: 0.5 });
    mesh.customDistanceMaterial = new THREE.MeshDistanceMaterial({ map: t, alphaTest: 0.5 });

    var p = SCENES[id].picture;

      ctx: ctx, clean: clean, tex: t, w: w, h: h,
      rect: { x: p[0] * w, y: p[1] * h, w: (p[2] - p[0]) * w, h: (p[3] - p[1]) * h },
      drawn: false

    /* the painting can arrive after the sheets and after the first frame,
       which has already cleared the flags; without this its sitter stays
       unpainted until their next change of pose */
    sittersDirty();
  };
  im.src = entry.url;
}

function loadSitterSheets() {
  for (var name in SITTERS) {
    sheetImages[name] = {};
    for (var sh in SITTERS[name].sheets) (function (name, sh) {
      var im = new Image();
      im.onload = function () { sheetImages[name][sh] = im; sittersDirty(); };
      im.src = SITTERS[name].sheets[sh].url;
    })(name, sh);
  }
}

/* Wipe the painted room back to how the painter left it. */
function clearPortrait(p) {
  p.ctx.drawImage(p.clean, p.rect.x, p.rect.y, p.rect.w, p.rect.h,
                           p.rect.x, p.rect.y, p.rect.w, p.rect.h);
}

/* One sitter's current pose, drawn into a painted room and clipped to it. x
   runs across the picture, 0 at its left edge and 1 at its right, and is
   allowed to run outside that, so a figure is cut by the painted edge on the
   way through it. A pose whose sheet has not loaded is not drawn at all, which
   reads as the sitter being away. */

  var p = portraits[id], s = SCENES[id], def = SITTERS[st.name];

  if (!p || !img) return;

  if (st.phase === 'seated') {
    /* seated: line the hips up with the painted seat, not the feet with the floor */
    var ax = flip ? (1 - sh.seatCell[0]) : sh.seatCell[0];
    left = r.x + s.chairSeat[0] * r.w - ax * dw;
    top = r.y + s.chairSeat[1] * r.h - sh.seatCell[1] * dh;
  } else {
    left = r.x + st.x * r.w - dw / 2;
    top = r.y + s.footY * r.h - dh;

  var ctx = p.ctx;
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);

    ctx.translate(mid, 0); ctx.scale(-1, 1); ctx.translate(-mid, 0);
  }
  ctx.drawImage(img, cell * sh.cellW, 0, sh.cellW, sh.cellH, left, top, dw, dh);
  ctx.restore();

/* ---------- what they do ----------

   only in their own painting, where their chair is; in the other one they
   stand, as a visitor does, at a spot clear of that painting's chair. */
var sitters = {
  her: { name: 'her', where: 'portrait-mantel', phase: 'seated', t: dwell(90, 180),
         x: SCENES['portrait-mantel'].seatX, pose: SITTERS.her.seats[0], facing: SCENES['portrait-mantel'].seatFacing,
         dirty: true, lastX: null, dist: 0, idle: dwell(12, 40) },
  /* he starts the page home as often as not, so the two are not always both there */
  him: Math.random() < 0.5
    ? { name: 'him', where: 'portrait-right', phase: 'seated', t: dwell(40, 150),
        x: SCENES['portrait-right'].seatX, pose: SITTERS.him.seats[0], facing: SCENES['portrait-right'].seatFacing,
        dirty: true, lastX: null, dist: 0, idle: dwell(20, 60) }

function sittersDirty() { for (var n in sitters) sitters[n].dirty = true; }

var MOVING = { entering: 1, rising: 1, walking: 1, leaving: 1 };

/* One figure on the move in a painting at a time: two strides crossing in a
   room 130 pixels tall on the wall would read as a muddle. */
function frameBusy(id, except) {
  for (var n in sitters) {

  return false;
}

  return st.where === SITTERS[st.name].home ? SCENES[id].seatX : SCENES[id].visitX;
}

  st.goHome = false;
  st.phase = 'entering';
  st.x = s.exitX;
  st.dist = 0;
  st.facing = -s.facesOut;
  st.speed = Math.abs(standX(st, id) - s.exitX) / cross(4.5, 7);
  st.pose = walkPose(st);
  st.dirty = true;
}

/* Home more often than not, but away often enough that the visit is something
   that happens rather than a trick that repeats. */
function sitterNextFrame(st) {
  var home = SITTERS[st.name].home;
  if (st.goHome || Math.random() < 0.65) return home;   /* goHome: the visitors chain has brought her home */
  for (var id in SCENES) if (id !== home) return id;
  return home;
}

/* Which frame of the stride a sitter is on, from how far they have walked, so
   the feet cannot skate. */
function walkPose(st) {
  var w = SITTERS[st.name].walk, n = w.cells.length;
  var k = ((Math.floor(st.dist / SITTERS[st.name].strideX * n) % n) + n) % n;
  return { sheet: w.sheet, cell: w.cells[k] };
}

function pickSeat(def) {
  var roll = Math.random(), acc = 0;

}

function reached(from, to, x) {
  return to > from ? x >= to : x <= to;
}

function updateSitter(st, dt) {
  if (st.night) return;                       /* asleep in their own chair until morning */
  var def = SITTERS[st.name], sc = st.where ? SCENES[st.where] : null;

    if (st.t <= 0) {
      var next = sitterNextFrame(st);
      if (frameBusy(next, st)) st.t = dwell(2, 5);
      else sitterEnter(st, next);
    }

    var target = standX(st, st.where);
    st.x += (target > sc.exitX ? 1 : -1) * st.speed * dt;
    st.dist += st.speed * dt;
    st.pose = walkPose(st);
    if (reached(sc.exitX, target, st.x)) {
      st.x = target;
      st.facing = sc.facesOut;
      if (home && sc.chairSeat) {
        st.phase = 'seated'; st.t = dwell(60, 200); st.facing = sc.seatFacing;
        st.pose = def.seats[0];
        st.idle = dwell(def.seats[0].hold[0], def.seats[0].hold[1]);
      } else {
        st.phase = 'standing'; st.pose = def.standing; st.t = dwell(25, 90); st.idle = dwell(6, 15);
      }
    }
    st.dirty = true;

  } else if (st.phase === 'seated' || st.phase === 'standing') {
    st.idle -= dt;
    if (st.idle <= 0) {
      if (st.phase === 'seated') {
        var seat = pickSeat(def);

        st.idle = dwell(seat.hold[0], seat.hold[1]);
      } else if (def.fidget) {
        var wasFidget = (st.pose === def.fidget);
        st.pose = wasFidget ? def.standing : def.fidget;
        st.idle = wasFidget ? dwell(6, 15) : dwell(1.2, 2.2);
        st.dirty = true;
      } else {
        st.idle = dwell(6, 15);
      }
    }
    if (st.t <= 0) {
      if (frameBusy(st.where, st)) st.t = dwell(2, 5);
      else if (st.phase === 'seated') {
        st.phase = 'rising'; st.pose = def.rising; st.t = dwell(0.7, 1.3);

        st.speed = Math.abs(sc.exitX - st.x) / cross(4, 7);

        st.dirty = true;

      st.speed = Math.abs(sc.exitX - st.x) / cross(4, 7);

/* Seated first, then standing, then anyone on the move, so a figure crossing
   the room passes in front of one who is still. */
var DRAW_ORDER = { seated: 0, standing: 1, rising: 1 };

function updateSitters(dt) {
  var changed = false, n, st;

       the texture uploads down on the iPad without making the walk stepped */
    if (st.dirty || st.lastX === null || Math.abs(st.x - st.lastX) > 0.004) changed = true;
  }

  /* Repaint each painting once, with everyone in it: clearing it per sitter
     would wipe whoever was drawn first. */
  for (var id in portraits) {
    var p = portraits[id], here = [];
    for (n in sitters) {
      st = sitters[n];
      if (st.where === id && st.phase !== 'away') here.push(st);
    }
    if (!here.length && !p.drawn) continue;
    here.sort(function (a, b) {
      var oa = a.phase in DRAW_ORDER ? DRAW_ORDER[a.phase] : 2;
      var ob = b.phase in DRAW_ORDER ? DRAW_ORDER[b.phase] : 2;
      return oa - ob;
    });
    clearPortrait(p);
    for (var i = 0; i < here.length; i++) drawSitter(id, here[i]);
    p.drawn = here.length > 0;

/* For checking placements by screenshot: put a sitter in a state and hold it
   there. spec is { her: { where, phase, x }, him: ... }, phase one of seated,
   standing, walking or away; seated only in their own painting. */
function placeSitters(spec) {
  var out = {};
  for (var n in spec) {
    var st = sitters[n], def = SITTERS[n], o = spec[n], sc = o.where ? SCENES[o.where] : null;
    st.where = o.phase === 'away' ? null : o.where;
    st.phase = o.phase;
    st.t = 1e9; st.idle = 1e9; st.dist = 0;
    if (o.phase === 'seated') {
      st.pose = def.seats[o.seat || 0]; st.x = sc.seatX; st.facing = sc.seatFacing;
    } else if (o.phase === 'standing') {
      st.pose = def.standing; st.x = o.x !== undefined ? o.x : standX(st, o.where); st.facing = sc.facesOut;
    } else if (o.phase === 'walking') {
      st.x = o.x; st.facing = o.facing || sc.facesOut; st.dist = o.dist || 0; st.pose = walkPose(st);
      st.speed = 0;
    }
    st.dirty = true;
    out[n] = st.phase + (st.where ? ' in ' + st.where : '');

}

/* ---------- the sitters and the visitors chain (board req 57, the room's half of req 34; 9 October 2026) ----------
   page/events/visitors.json keeps where each sitter is across the pages: out beside the Fat Lady, in the painting
   opposite the hole, or home. While it has one out, the room holds her away (the loop neither brings her back nor
   sends her visiting) until her record's cue brings her home through her painting's exit. The runtime asks where each
   sitter is as `mantel sitter` and `right sitter`: seated, standing, walking or away. */
var VISITING = {
  her: { empty: "the mantel painting's sitter's chair empty, the sitter out visiting; the sitters' loop holds her away until her record brings her home",
         there: "the mantel painting's sitter in the painting opposite the hole, seen through the hole whenever it opens" },
  him: { empty: "the right painting's sitter's chair empty, the sitter out visiting; the sitters' loop holds him away until his record brings him home",
         there: "the right painting's sitter in the painting opposite the hole, seen through the hole whenever it opens" }

  if (st.phase === 'away' || st.phase === 'seated' || st.phase === 'standing') return st.phase;
  return 'walking';
}

  st.held = true; st.t = 1e9;

}

  var st = sitters[n];

  if (st.phase === 'away') { st.goHome = true; st.t = 0; }
}

/* The painting opposite the hole, a grey stand-in until the Corridor hangs the drawn one (req 33). Traced from the eye
   through both circles of the tunnel and past her open back, the open hole shows 1.15 to 1.75 m along the corridor's
   far wall at rest and -0.4 to 0.95 on the full drag left; no strip is seen from both. It hangs where the torch was,
   centred 1.5 m along and 1.25 m up, so his first look through the hole finds her, and the torch moved to 0.9 m, whole on
   the drag left; the Corridor hangs the pair at 0.9 and 2.1 either side of it (Godric, 9 October 2026, 2.43 pm; the
   Corridor's req 33; lost, the painting seen only on the drag left). A sitter out visiting
   stands in it, drawn from her own standing cell; looking in, she faces the room's side, paying him no mind she is
   turned away, and caught she walks off through the painted door at its right edge. One sitter at a time. */
/* The drawing is the Corridor's (req 33, round 1 candidate 3, Godric's pick at 5.11 pm, assets/layers/painting-opposite.png,
   400 x 433 for 0.5 by 0.54 m): an empty panelled room in a beaded gilt frame, its door ajar on the right, so a sitter
   stands on its floor and walks off through that doorway. It is the canvas's ground; until it loads, the grey stand-in.

var opposite = new THREE.Mesh(new THREE.PlaneGeometry(OPP_W, OPP_H),
  new THREE.MeshStandardMaterial({ map: oppTex, color: 0xffffff, roughness: 0.95, metalness: 0, alphaTest: 0.5 }));

function drawOpposite() {

function flicker(t) {
  return 0.86 + 0.08 * Math.sin(t * 7.1) + 0.04 * Math.sin(t * 13.7 + 1.3) + 0.02 * Math.sin(t * 23.3 + 0.7);

function updateCamera(dt) {
  if (tween) {
    tween.t += dt;
    var k = easeInOut(clamp(tween.t / tween.dur, 0, 1));
    camera.position.lerpVectors(tween.fromPos, tween.toPos, k);
    lookTmp.lerpVectors(tween.fromLook, tween.toLook, k);
    camera.lookAt(lookTmp);
    if (tween.toFov != null) { camera.fov = lerp(tween.fromFov, tween.toFov, k); camera.updateProjectionMatrix(); }
    if (tween.t >= tween.dur) { var d = tween.done; tween = null; if (d) d(); }
    return;
  }
  if (mode === 'fireside' && Math.abs(camera.fov - firesideFov()) > 0.01) { camera.fov = firesideFov(); camera.updateProjectionMatrix(); }
  if (mode === 'room') {
    var s = Math.min(1, dt * 7);
    yaw = lerp(yaw, yawT, s);
    pitch = lerp(pitch, pitchT, s);

  }
}

  fireLevel += (fireLevelT - fireLevel) * Math.min(1, dt * (fireLevelT > fireLevel ? 1.6 : 4));

  var near = hits.length ? hits[0].distance : Infinity;
  for (var i = 0; i < lineCast.length; i++) {
    var f = lineCast[i], m = poolCards[f.cell];
    if (!f.as || !m || !m.visible) continue;
    var h = raycaster.intersectObject(m, false)[0];
    if (!h || h.distance > near) continue;
    if (FIGURE_SPOTS[f.cell].still && h.point.y > FIGURE_SPOTS[f.cell].y + 0.75) continue;
    return f.as;
  }
  return null;
}

/* the events runtime (castle-events.js): this room's cues and the built-ins only it can answer */
var castle = window.CastleEvents ? CastleEvents.start({
  chains: 'all',
  place: 'common room',
  cues: Object.assign({
    'fire green for 2 s': fireGreen,
    'smoke puffs back out of the grate': smokePuff,
    'the embers brighten a step': embersStep,
    "the fire catches with a whoosh and the room's light comes up": fireCatches,
    'the bellows lift off their hook and pump once; the fire flares up happily': stokeFire
  }, VISITOR_CUES, NICK_CUES),
  drawRoom: function (shows) { fireDrawRoom(shows); visitorsDrawRoom(shows); setNight(shows.indexOf(NIGHT_SITTERS) >= 0); trevorDrawRoom(shows); notesDrawRoom(shows); },
  figures: FIGURES,
  drawFigures: drawFiguresInOrder,
  showLines: showLines,
  neighbours: TREVOR_NEIGHBOURS,
  builtins: {
    portrait: function () { return portrait.open ? 'open' : 'shut'; },
    'mantel sitter': function () { return sitterPhase(sitters.her); },
    'right sitter': function () { return sitterPhase(sitters.him); }
  }
}) : null;

/* arriving through the hole from the corridor (?from=corridor): the room comes up from black at its default view with
   her swinging shut behind him */
/* coming down the stair from the dormitory (?from=dormitory; board req 20) */
if (kit.from === 'dormitory') arriveFromStair();
/* the morning after lights out (board req 38): opened with no ?from and the place saved at lights out still the
   waking, he goes straight up to wake in his bed, ?from=sleep; the place is set to the dormitory as he goes, so the
   next opening is an ordinary one. Read here, not in the shared frame, since the common room is the page the castle is
   opened on. */
if (!kit.from) {
  var saved = kit.readPlace();
  if (saved && saved.room === 'dormitory' && saved.stop === 'waking') kit.travel('dormitory.html?from=sleep', { place: { room: 'dormitory' } });
}
if (kit.from === 'corridor') {
  portrait.open = true; portrait.ang = DOOR_OPEN; portrait.target = DOOR_OPEN; portrait.closeT = 1.0;
  kit.savePlace({ room: 'common-room' });
  kit.reveal();
}

var clock = new THREE.Clock();
var t = 0;
function frame() {
  var dt = Math.min(0.05, clock.getDelta());
  t += dt;
  if (castle) castle.tick(dt);
  updateCamera(dt);
  faceEye();
  updateTwins();
  updateFire(dt, t);
  updateBellows(dt);
  updateSmoke(dt);
  updateCat(dt, t);
  updatePortrait(dt);
  updateSitters(dt);
  updateOpposite(dt);
  updateTrevor(dt);
  updateNick(dt);
  updateLines(dt);
  updateNotes();
  updatePapers(dt, t);
  updateTapestry(dt, t);
  updateScarf(dt, t);
  updateSatchel(dt, t);
  renderer.render(scene, camera);
  kit.stats(dt);
}
renderer.setAnimationLoop(frame);

/* hooks for automated checks; harmless in normal use */
window.lumosGreybox = { frame: frame, tap: tap, satchelTap: satchelTap, satchel: function () { return satchelState; }, stokeFire: stokeFire, enterBoard: enterBoard, leaveBoard: leaveBoard, togglePortrait: togglePortrait, climbOut: climbOut, catSitDown: catSitDown, setTint: setTint, setShadows: setShadows, scene: scene, camera: camera, papers: papers, liftPaper: liftPaper, returnPaper: returnPaper, boardReady: boardReady, boardGroup: boardGroup, mode: function () { return mode; }, placeSitters: placeSitters, goFireside: goFireside, leaveFireside: leaveFireside, sitters: sitters, portrait: portrait, events: castle, fireGreen: fireGreen, bellows: bel, bellowsTap: bellowsTap, fire: function () { return { level: fireLevel, target: fireLevelT, damp: fireDamp }; }, opposite: opp, trevorMarks: TREVOR_MARKS, trevor: trevor, nick: nick, redrawNotes: function () { notesShows = (castle && castle.cues && castle.cues()) || []; }, climbStair: climbStair, lines: { show: showLines, cast: drawFiguresInOrder, now: function () { return lineCur && { text: lineCur.line.text, t: lineCur.t }; }, queued: function () { return lineQ.length; } } };
})();
</script>
