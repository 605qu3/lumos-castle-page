<!DOCTYPE html>

<head>

<title>The common room, as staged views</title>
<style>
/* A test of the point-and-click idea for Godric: the common room as three staged views of one room (the 2.5D room's
   own render from three looks), with tap targets that bring the view toward a thing. Nothing here is the game; the
   stills are shots of page/common-room.html, and the lines are stand-ins. The stills are 2560 wide so the close views hold
   to 4x. There is no tilt drift here: a tilt of the iPad turns the hourglass (world-rules.md), so the stills only drift on
   their own. The little door goes through to the den, a one-look still of the unbuilt den (a plain stand-in, not its
   final look), and out again; the round hole leaves for the walked corridor. */
html, body { margin: 0; height: 100%; background: #0b0807; color: #e7d9bd; font: 15px/1.4 Georgia, serif;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#view { flex: 1 1 auto; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
#frame { position: relative; aspect-ratio: 16 / 9; width: min(100vw, calc((100vh - 64px) * 16 / 9)); max-height: 100%;
  overflow: hidden; background: #000; touch-action: none; }
#stage { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform .8s cubic-bezier(.45,.05,.25,1); will-change: transform; }
.plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease, transform .5s ease; pointer-events: none; }
.plate.on { opacity: 1; transform: none; }
.spot { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; }
body.show .spot { outline: 2px dashed rgba(255, 220, 140, .85); background: rgba(255, 220, 140, .12); }
body.show .spot::after { content: attr(data-n); position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
  font: 11px/1.2 sans-serif; color: #ffe2a0; white-space: nowrap; text-shadow: 0 1px 2px #000; }
#iris { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s ease;
  background: radial-gradient(circle at var(--ix, 50%) var(--iy, 50%), transparent 0, transparent 6%, #000 38%); }
#iris.on { opacity: 1; }
#veil { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
#veil.on { opacity: 1; }
#card { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(8px); max-width: 82%; padding: 8px 14px;
  background: rgba(14, 10, 8, .86); border: 1px solid #6a5636; border-radius: 6px; opacity: 0; transition: opacity .35s, transform .35s;
  pointer-events: none; text-align: center; }
#card.on { opacity: 1; transform: translateX(-50%); }
#stub { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 12%; background: #000; }
#stub.on { display: flex; }
.arrow { position: absolute; top: 50%; width: 44px; height: 64px; margin-top: -32px; border: 0; background: rgba(14, 10, 8, .45); color: #e7d9bd;
  font-size: 26px; cursor: pointer; border-radius: 6px; }
.arrow:disabled { opacity: .12; }
#al { left: 8px; } #ar { right: 8px; }
#bar { flex: 0 0 auto; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px calc(env(safe-area-inset-bottom) + 0px);
  background: #120d0a; border-top: 1px solid #3a2c1e; font: 13px/1.3 sans-serif; flex-wrap: wrap; align-content: center; }
button.t { font: 13px sans-serif; color: #e7d9bd; background: #26190f; border: 1px solid #6a5636; border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button.t.on { background: #5b4021; }
#bar a { color: #e7d9bd; font: 13px sans-serif; margin-left: auto; }
#pos { opacity: .7; }
#turn { display: none; color: #ffe2a0; }
@media (orientation: portrait) { #turn { display: inline; } }
.fx { position: absolute; inset: 0; pointer-events: none; }
.fx > * { position: absolute; pointer-events: none; }
.fx .wash { inset: 0; mix-blend-mode: screen; }
.fx .glow { transform: translate(-50%, -50%); mix-blend-mode: screen; }
.fx .fl { transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(1.5px); }
.fx canvas { inset: 0; width: 100%; height: 100%; }
.fx .breath { transform-origin: 50% 100%; -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 45%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 55%, #000 45%, transparent 75%); animation: breathe 4.2s ease-in-out infinite; }
.fx .breath.soft { animation-name: breathe2; }
.fx .bed { transform: translate(-50%, -50%); mix-blend-mode: screen; }
@keyframes breathe2 { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.014); } }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03) translateY(-.3%); } }
.plate.on { animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.012) translate(-.25%, -.15%); } }
.fx .nod { transform-origin: 50% 90%; animation: none; }
.fx .cat { background: url(../assets/layers/cat-sheet.png) 0 0 / 900% 100% no-repeat; filter: brightness(.64) sepia(.55) saturate(1.35); display: none; }
.fx .catsh { transform: translate(-50%, -50%); aspect-ratio: 4; background: radial-gradient(ellipse, rgba(8, 3, 0, .55) 0, rgba(8, 3, 0, .25) 45%, transparent 70%); display: none; }
.fx .occ { -webkit-mask-image: radial-gradient(ellipse closest-side, #000 92%, transparent 100%); mask-image: radial-gradient(ellipse closest-side, #000 92%, transparent 100%); }
#snd, #tod, #wxb { min-width: 74px; }
#hint { opacity: .7; }
</style>

var LOOKN = 3;   /* the looks round the room; the den is reached through the little door and left through it */

var cur = 1, zoomed = false, busy = false;
var stage = document.getElementById('stage'), frame = document.getElementById('frame'), card = document.getElementById('card');
var iris = document.getElementById('iris'), veil = document.getElementById('veil'), stub = document.getElementById('stub');
var backBtn = document.getElementById('back'), cardTimer = 0;

VIEWS.forEach(function (v, i) {
  var im = new Image(); im.src = v.img; im.className = 'plate'; im.draggable = false; im.id = 'p' + i; stage.appendChild(im);
  v.el = im; v.layer = document.createElement('div'); v.layer.style.cssText = 'position:absolute;inset:0;display:none';
  v.spots.forEach(function (s) {
    var d = document.createElement('div'); d.className = 'spot'; d.setAttribute('data-n', s.n); s.el = d;
    d.style.cssText = 'left:' + s.x + '%;top:' + s.y + '%;width:' + Math.max(s.w, 9) + '%;aspect-ratio:1';   /* never under 9% of the view, a child's finger on a phone held sideways */
    d.addEventListener('click', function (e) { e.stopPropagation(); tapSpot(s); });
    v.layer.appendChild(d);
  });
  stage.appendChild(v.layer);
});

function show(i, dir) {
  VIEWS.forEach(function (v, k) {
    v.el.classList.toggle('on', k === i); v.layer.style.display = k === i ? 'block' : 'none';
    v.el.style.transform = k === i ? 'none' : 'translateX(' + (k < i ? -3 : 3) + '%)';
  });
  cur = i; document.getElementById('al').disabled = i === 0 || i >= LOOKN; document.getElementById('ar').disabled = i >= LOOKN - 1;
  document.getElementById('pos').textContent = VIEWS[i].name + (i < LOOKN ? ' (' + (i + 1) + ' of ' + LOOKN + ')' : '');

function look(d) { if (zoomed || busy) return; var n = cur + d; if (cur >= LOOKN || n < 0 || n >= LOOKN) return; card.classList.remove('on'); show(n, d); }

  var z = s.z || 2.4;

  var dx = 50 - s.x, dy = 46 - s.y;
  /* keep the scaled still covering the frame: its left edge sits at s.x(1-z)+dx and must not pass 0, its right at s.x(1-z)+100z+dx and must not fall short of 100 */
  dx = Math.min(-s.x * (1 - z), Math.max(100 - s.x * (1 - z) - 100 * z, dx));
  dy = Math.min(-s.y * (1 - z), Math.max(100 - s.y * (1 - z) - 100 * z, dy));

function stepBack() {

}
function tapSpot(s) {
  if (busy) return;
  if (zoomed) { stepBack(); return; }
  if (s.n === 'cat') catTap();

  if (s.kind === 'in' || s.kind === 'out') {
    /* a move to another view of this test: the iris closes, the veil falls, the far view opens, the veil lifts */
    busy = true;
    iris.style.setProperty('--ix', '50%'); iris.style.setProperty('--iy', '46%');
    setTimeout(function () { iris.classList.add('on'); }, 450);

    }, 1750);

    busy = true;
    iris.style.setProperty('--ix', '50%'); iris.style.setProperty('--iy', '46%');
    setTimeout(function () { iris.classList.add('on'); }, 450);
