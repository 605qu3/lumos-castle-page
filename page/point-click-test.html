<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The common room, as staged views</title>
<style>
/* A test of the point-and-click idea for Godric: the common room as three staged views of one room (the 2.5D room's
   own render from three looks), with tap targets that bring the view toward a thing. Nothing here is the game; the
   stills are shots of page/common-room.html, and the lines are stand-ins. */
html, body { margin: 0; height: 100%; background: #0b0807; color: #e7d9bd; font: 15px/1.4 Georgia, serif;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#view { flex: 1 1 auto; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
#frame { position: relative; aspect-ratio: 16 / 9; width: min(100vw, calc((100vh - 64px) * 16 / 9)); max-height: 100%;
  overflow: hidden; background: #000; touch-action: none; }
#stage { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform .8s cubic-bezier(.45,.05,.25,1); will-change: transform; }
.plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease, transform .5s ease; pointer-events: none; }
.plate.on { opacity: 1; transform: none; }
.spot { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; }
body.show .spot { outline: 2px dashed rgba(255, 220, 140, .85); background: rgba(255, 220, 140, .12); }
body.show .spot::after { content: attr(data-n); position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
  font: 11px/1.2 sans-serif; color: #ffe2a0; white-space: nowrap; text-shadow: 0 1px 2px #000; }
#iris { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s ease;
  background: radial-gradient(circle at var(--ix, 50%) var(--iy, 50%), transparent 0, transparent 6%, #000 38%); }
#iris.on { opacity: 1; }
#veil { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
#veil.on { opacity: 1; }
#card { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(8px); max-width: 82%; padding: 8px 14px;
  background: rgba(14, 10, 8, .86); border: 1px solid #6a5636; border-radius: 6px; opacity: 0; transition: opacity .35s, transform .35s;
  pointer-events: none; text-align: center; }
#card.on { opacity: 1; transform: translateX(-50%); }
#stub { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 12%; background: #000; }
#stub.on { display: flex; }
.arrow { position: absolute; top: 50%; width: 44px; height: 64px; margin-top: -32px; border: 0; background: rgba(14, 10, 8, .45); color: #e7d9bd;
  font-size: 26px; cursor: pointer; border-radius: 6px; }
.arrow:disabled { opacity: .12; }
#al { left: 8px; } #ar { right: 8px; }
#bar { flex: 0 0 auto; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px calc(env(safe-area-inset-bottom) + 0px);
  background: #120d0a; border-top: 1px solid #3a2c1e; font: 13px/1.3 sans-serif; flex-wrap: wrap; align-content: center; }
button.t { font: 13px sans-serif; color: #e7d9bd; background: #26190f; border: 1px solid #6a5636; border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button.t.on { background: #5b4021; }
#bar a { color: #e7d9bd; font: 13px sans-serif; margin-left: auto; }
#pos { opacity: .7; }
#turn { display: none; color: #ffe2a0; }
@media (orientation: portrait) { #turn { display: inline; } }
.fx { position: absolute; inset: 0; pointer-events: none; }
.fx > * { position: absolute; pointer-events: none; }
.fx .wash { inset: 0; mix-blend-mode: screen; }
.fx .glow { transform: translate(-50%, -50%); mix-blend-mode: screen; }
.fx .fl { transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(1.5px); }
.fx canvas { inset: 0; width: 100%; height: 100%; }
.fx .breath { transform-origin: 50% 100%; -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 45%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 55%, #000 45%, transparent 75%); animation: breathe 4.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03) translateY(-.3%); } }
.plate.on { animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.012) translate(-.25%, -.15%); } }
#snd { min-width: 74px; }
#hint { opacity: .7; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="frame">
      <div id="stage"></div>
      <div id="iris"></div>
      <div id="veil"></div>
      <button class="arrow" id="al" aria-label="Look left">&#8249;</button>
      <button class="arrow" id="ar" aria-label="Look right">&#8250;</button>
      <div id="card"></div>
      <div id="stub"><p id="stubtext"></p><button class="t" id="stubback">Back to the room</button></div>
    </div>
  </div>
  <div id="bar">
    <button class="t" id="back" disabled>Step back</button>
    <button class="t" id="showtaps">Show taps</button>
    <button class="t" id="snd">Sound on</button><span id="hint">Tap the room once to wake the sound.</span><span id="pos"></span><span id="turn">Turn the screen sideways.</span>
    <a href="common-room.html">the 2.5D room</a>
  </div>
</div>
<script>
/* The views run left to right as the room's own drag does. Spots are in plate percent (x, y, width). kind:
   look (the view moves toward it, a line), through (the view moves in, the iris closes, a stub for the next room's view),
   up (the view climbs). Every line here is a stand-in for the test. */
var VIEWS = [
  { id: 'a', img: '../assets/review/pc-room-left.jpg?v=1', name: 'the bookcase side', spots: [
    { n: 'bookcase', x: 16, y: 50, w: 14, kind: 'look', z: 2.2, say: 'The bookcase stand-in, a grey slab for now.' },
    { n: 'portrait hole', x: 34.5, y: 50, w: 12, kind: 'through', z: 3.2, say: 'The round hole in the wall, out to the corridor.', to: 'the corridor, a view of its own' },
    { n: 'cloak', x: 27, y: 52, w: 6, kind: 'look', z: 2.8, say: 'A hand-me-down cloak on its hook, a moth hole in the hem.' },
    { n: 'fire', x: 57, y: 55, w: 14, kind: 'look', z: 2.4, say: 'The fire, low and orange.' },
    { n: 'sleeper', x: 74, y: 57, w: 13, kind: 'look', z: 2.6, say: 'Someone asleep on the sofa, boots up.' },
    { n: 'stairs', x: 91, y: 40, w: 12, kind: 'up', z: 2.4, say: 'The stair winds up into the dark.', to: 'the dormitory stair' } ] },
  { id: 'b', img: '../assets/review/pc-room-centre.jpg?v=1', name: 'the fireside', spots: [
    { n: 'fire', x: 48, y: 52, w: 14, kind: 'look', z: 2.4, say: 'The fire pops and settles.' },
    { n: 'portrait hole', x: 21, y: 50, w: 12, kind: 'through', z: 3.2, say: 'The round hole in the wall, out to the corridor.', to: 'the corridor, a view of its own' },
    { n: 'cloak', x: 12.5, y: 54, w: 5, kind: 'look', z: 3, say: 'A hand-me-down cloak on its hook, a moth hole in the hem.' },
    { n: 'letter', x: 27, y: 66, w: 10, kind: 'look', z: 3, say: 'A letter, an inkwell and a long feather on the round table.' },
    { n: 'portrait', x: 49.5, y: 22, w: 7, kind: 'look', z: 3.4, say: 'A portrait. She is reading.' },
    { n: 'portrait', x: 59, y: 24, w: 7, kind: 'look', z: 3.4, say: 'A portrait. He has not moved all evening.' },
    { n: 'notice board', x: 80, y: 41, w: 11, kind: 'look', z: 3, say: 'The notice board, thick with notes.' },
    { n: 'sofa', x: 67, y: 58, w: 11, kind: 'look', z: 2.8, say: 'A boy asleep on the sofa. His boots are up.' },
    { n: 'cat', x: 54, y: 64, w: 6, kind: 'look', z: 4, say: 'The cat, going about her business.' },
    { n: 'stairs', x: 95, y: 40, w: 10, kind: 'up', z: 2.4, say: 'The stair winds up into the dark.', to: 'the dormitory stair' } ] },
  { id: 'c', img: '../assets/review/pc-room-right.jpg?v=1', name: 'the stair side', spots: [
    { n: 'chess', x: 37, y: 66, w: 14, kind: 'look', z: 3, say: 'Two first years bent over a game, quiet as stones.' },
    { n: 'notice board', x: 61, y: 42, w: 9, kind: 'look', z: 3.4, say: 'The notice board, thick with notes.' },
    { n: 'little door', x: 82, y: 56, w: 7, kind: 'through', z: 4, say: 'A small old door, low in the wall under the stair.', to: 'Clementine’s den, a view of its own' },
    { n: 'stairs', x: 78, y: 28, w: 14, kind: 'up', z: 2.2, say: 'The stair winds up into the dark.', to: 'the dormitory stair' },
    { n: 'letter', x: 70, y: 66, w: 11, kind: 'look', z: 3, say: 'A letter, an inkwell and a long feather on the round table.' },
    { n: 'window', x: 15, y: 48, w: 13, kind: 'look', z: 2.4, say: 'A window on the dark grounds.' },
    { n: 'portrait hole', x: 3.5, y: 50, w: 8, kind: 'through', z: 3.2, say: 'The round hole in the wall, out to the corridor.', to: 'the corridor, a view of its own' } ] }
];

var cur = 1, zoomed = false, busy = false;
var stage = document.getElementById('stage'), frame = document.getElementById('frame'), card = document.getElementById('card');
var iris = document.getElementById('iris'), veil = document.getElementById('veil'), stub = document.getElementById('stub');
var backBtn = document.getElementById('back'), cardTimer = 0;

VIEWS.forEach(function (v, i) {
  var im = new Image(); im.src = v.img; im.className = 'plate'; im.draggable = false; im.id = 'p' + i; stage.appendChild(im);
  v.el = im; v.layer = document.createElement('div'); v.layer.style.cssText = 'position:absolute;inset:0;display:none';
  v.spots.forEach(function (s) {
    var d = document.createElement('div'); d.className = 'spot'; d.setAttribute('data-n', s.n);
    d.style.cssText = 'left:' + s.x + '%;top:' + s.y + '%;width:' + s.w + '%;aspect-ratio:1';
    d.addEventListener('click', function (e) { e.stopPropagation(); tapSpot(s); });
    v.layer.appendChild(d);
  });
  stage.appendChild(v.layer);
});

function say(t) { card.textContent = t; card.classList.add('on'); clearTimeout(cardTimer); cardTimer = setTimeout(function () { card.classList.remove('on'); }, 3800); }
function show(i, dir) {
  VIEWS.forEach(function (v, k) {
    v.el.classList.toggle('on', k === i); v.layer.style.display = k === i ? 'block' : 'none';
    v.el.style.transform = k === i ? 'none' : 'translateX(' + (k < i ? -3 : 3) + '%)';
  });
  cur = i; document.getElementById('al').disabled = i === 0; document.getElementById('ar').disabled = i === VIEWS.length - 1;
  document.getElementById('pos').textContent = VIEWS[i].name + ' (' + (i + 1) + ' of ' + VIEWS.length + ')';
}
function look(d) { if (zoomed || busy) return; var n = cur + d; if (n < 0 || n >= VIEWS.length) return; card.classList.remove('on'); show(n, d); }
function zoomTo(s) {
  var z = s.z || 2.4;
  /* move the view so the spot sits near the middle at scale z: translate by the offset of the spot from the centre */
  var dx = 50 - s.x, dy = 46 - s.y;
  /* keep the scaled still covering the frame: its left edge sits at s.x(1-z)+dx and must not pass 0, its right at s.x(1-z)+100z+dx and must not fall short of 100 */
  dx = Math.min(-s.x * (1 - z), Math.max(100 - s.x * (1 - z) - 100 * z, dx));
  dy = Math.min(-s.y * (1 - z), Math.max(100 - s.y * (1 - z) - 100 * z, dy));
  stage.style.transformOrigin = s.x + '% ' + s.y + '%';
  stage.style.transform = 'translate(' + dx + '%,' + dy + '%) scale(' + z + ')';
  zoomed = true; backBtn.disabled = false;
}
function stepBack() {
  if (busy) return;
  if (stub.classList.contains('on')) { leaveStub(); return; }
  stage.style.transformOrigin = '50% 50%'; stage.style.transform = 'none'; zoomed = false; backBtn.disabled = true; iris.classList.remove('on'); card.classList.remove('on');
}
function tapSpot(s) {
  if (busy) return;
  if (zoomed) { stepBack(); return; }
  zoomTo(s); say(s.say);
  if (s.kind === 'through' || s.kind === 'up') {
    busy = true;
    iris.style.setProperty('--ix', '50%'); iris.style.setProperty('--iy', '46%');
    setTimeout(function () { iris.classList.add('on'); }, 450);
    setTimeout(function () { veil.classList.add('on'); }, 1100);
    setTimeout(function () {
      document.getElementById('stubtext').innerHTML = (s.kind === 'up' ? 'Up the stair: ' : 'Through: ') + s.to + '.<br><small>This is where the next staged view would open.</small>';
      stub.classList.add('on'); veil.classList.remove('on'); busy = false;
    }, 1750);
  }
}
function leaveStub() {
  busy = true; veil.classList.add('on');
  setTimeout(function () {
    stub.classList.remove('on'); iris.classList.remove('on'); stage.style.transition = 'none';
    stage.style.transformOrigin = '50% 50%'; stage.style.transform = 'none'; zoomed = false; backBtn.disabled = true; void stage.offsetWidth; stage.style.transition = '';
    veil.classList.remove('on'); busy = false;
  }, 650);
}
document.getElementById('al').onclick = function () { look(-1); };
document.getElementById('ar').onclick = function () { look(1); };
document.getElementById('stubback').onclick = leaveStub;
backBtn.onclick = stepBack;
document.getElementById('showtaps').onclick = function () { document.body.classList.toggle('show'); this.classList.toggle('on'); };
frame.addEventListener('click', function () { if (zoomed && !busy) stepBack(); });
/* a swipe looks round; a tap on bare room does nothing */
var sx = null;
frame.addEventListener('pointerdown', function (e) { sx = e.clientX; });
frame.addEventListener('pointerup', function (e) { if (sx === null) return; var dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) look(dx < 0 ? 1 : -1); });
document.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') look(-1); else if (e.key === 'ArrowRight') look(1); else if (e.key === 'Escape') stepBack(); });
/* Movement and sound (req 1867). Everything is made in the page: the fire's light and flames are layers over each still,
   the embers and dust are a small canvas, and every sound is Web Audio noise shaped in code, so nothing is fetched and
   nothing costs. Sound wakes on the first tap (Safari), has a mute kept on this device, and sits low. */
var FXV = {
  a: { fire: { x: 58.5, y: 51, w: 8, str: .55 }, sleeper: { L: 72, T: 51, W: 9, H: 10 } },
  b: { fire: { x: 50, y: 54, w: 9, str: 1 }, sleeper: { L: 61, T: 49, W: 11, H: 10 } },
  c: { fire: { x: 34.5, y: 56, w: 7, str: .4 } }
};
var fxState = { flare: 0, t: 0 };
function noiseAt(t) { return .5 + .26 * Math.sin(t * 7.3) + .14 * Math.sin(t * 13.9 + 1.7) + .1 * Math.sin(t * 3.1 + .4); }
VIEWS.forEach(function (v) {
  var cfg = FXV[v.id], fx = document.createElement('div'); fx.className = 'fx'; v.fx = { root: fx, cfg: cfg };
  var wash = document.createElement('div'); wash.className = 'wash';
  wash.style.background = 'radial-gradient(circle at ' + cfg.fire.x + '% ' + cfg.fire.y + '%, rgba(255,128,40,.95) 0, rgba(255,110,30,.35) 28%, transparent 62%)';
  var glow = document.createElement('div'); glow.className = 'glow';
  glow.style.cssText = 'left:' + cfg.fire.x + '%;top:' + cfg.fire.y + '%;width:' + (cfg.fire.w * 3.2) + '%;aspect-ratio:1;background:radial-gradient(circle, rgba(255,170,70,.9) 0, rgba(255,120,30,.4) 38%, transparent 68%)';
  fx.appendChild(wash); fx.appendChild(glow); v.fx.wash = wash; v.fx.glow = glow; v.fx.fl = [];
  for (var k = 0; k < 4; k++) {
    var f = document.createElement('div'); f.className = 'fl';
    var fw = cfg.fire.w * (.34 + .1 * (k % 2)), fh = fw * 1.9, fxp = cfg.fire.x + (k - 1.5) * cfg.fire.w * .2;
    f.style.cssText = 'left:' + (fxp - fw / 2) + '%;top:' + (cfg.fire.y + cfg.fire.w * .14 - fh * .56) + '%;width:' + fw + '%;height:' + fh * (16 / 9) + '%;background:radial-gradient(ellipse at 50% 70%, rgba(255,226,140,.95) 0, rgba(255,150,40,.7) 38%, transparent 70%)';
    fx.appendChild(f); v.fx.fl.push(f);
  }
  if (cfg.sleeper) {
    var sl = cfg.sleeper, b = document.createElement('div'); b.className = 'breath';
    b.style.cssText = 'left:' + sl.L + '%;top:' + sl.T + '%;width:' + sl.W + '%;height:' + sl.H + '%;background-image:url(' + v.img + ');background-size:' + (10000 / sl.W) + '% ' + (10000 / sl.H) + '%;background-position:' + (sl.L / (100 - sl.W) * 100) + '% ' + (sl.T / (100 - sl.H) * 100) + '%';
    fx.appendChild(b);
  }
  var cv = document.createElement('canvas'); cv.width = 640; cv.height = 360; fx.appendChild(cv); v.fx.cv = cv; v.fx.ctx = cv.getContext('2d'); v.fx.parts = [];
  for (var m = 0; m < 16; m++) v.fx.parts.push({ dust: true, x: Math.random() * 640, y: Math.random() * 360, vx: (Math.random() - .5) * 3, vy: -1 - Math.random() * 2, a: .05 + Math.random() * .1, r: 1 });
  v.layer.insertBefore(fx, v.layer.firstChild);
});
var last = 0;
function frameFx(ms) {
  var t = ms / 1000, dt = Math.min(.1, t - last); last = t;
  var v = VIEWS[cur], fx = v.fx, c = fx.cfg.fire;
  fxState.flare *= Math.pow(.02, dt);
  var f = noiseAt(t) + fxState.flare * .5, str = c.str;
  fx.wash.style.opacity = (.05 + .09 * f) * str;
  fx.glow.style.opacity = Math.min(1, (.18 + .34 * f) * str);
  fx.glow.style.transform = 'translate(-50%,-50%) scale(' + (.92 + .16 * f) + ')';
  fx.fl.forEach(function (el, k) {
    var g = noiseAt(t * (1.1 + k * .23) + k * 2.1) + fxState.flare * .4;
    el.style.opacity = Math.min(1, (.25 + .55 * g) * (.5 + .5 * str));
    el.style.transform = 'scaleY(' + (.8 + .55 * g) + ') translateX(' + (Math.sin(t * (4 + k) + k) * 6) + '%) skewX(' + (Math.sin(t * (3 + k * .7) + k * 1.3) * 7) + 'deg)';
  });
  var cx = fx.ctx, ps = fx.parts; cx.clearRect(0, 0, 640, 360);
  if (Math.random() < dt * 3.5 * str) ps.push({ x: c.x * 6.4 + (Math.random() - .5) * c.w * 3, y: c.y * 3.6 - c.w * .6, vx: (Math.random() - .5) * 10, vy: -(14 + Math.random() * 18), a: 1, r: 1.1 + Math.random(), life: 1.4 + Math.random() * 1.2, age: 0 });
  for (var i = ps.length - 1; i >= 0; i--) {
    var p = ps[i];
    if (p.dust) {
      p.x += (p.vx + Math.sin(t * .6 + i) * 2) * dt; p.y += p.vy * dt * .4;
      if (p.y < -4) { p.y = 364; p.x = Math.random() * 640; } if (p.x < -4) p.x = 644; if (p.x > 644) p.x = -4;
      cx.fillStyle = 'rgba(255,225,170,' + p.a + ')'; cx.fillRect(p.x, p.y, 1.2, 1.2); continue;
    }
    p.age += dt; if (p.age > p.life) { ps.splice(i, 1); continue; }
    p.x += (p.vx + Math.sin(t * 3 + i) * 8) * dt; p.y += p.vy * dt;
    var al = (1 - p.age / p.life) * .9; cx.fillStyle = 'rgba(255,' + Math.round(150 + 60 * al) + ',60,' + al + ')'; cx.beginPath(); cx.arc(p.x, p.y, p.r * (1 - p.age / p.life * .5), 0, 6.3); cx.fill();
  }
  requestAnimationFrame(frameFx);
}
requestAnimationFrame(frameFx);

/* Sound */
var Snd = (function () {
  var ctx = null, master = null, awake = false, muted = false, amb = {}, noiseBuf = null, brown = null, timers = [];
  try { muted = localStorage.getItem('pc-test-muted') === 'yes'; } catch (e) {}
  var btn = document.getElementById('snd'), hint = document.getElementById('hint');
  function paint() { btn.textContent = muted ? 'Sound off' : 'Sound on'; btn.classList.toggle('on', !muted); }
  paint();
  function mkBuffers() {
    var n = ctx.sampleRate * 2, i, a, b, last = 0;
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate); a = noiseBuf.getChannelData(0);
    brown = ctx.createBuffer(1, n, ctx.sampleRate); b = brown.getChannelData(0);
    for (i = 0; i < n; i++) { a[i] = Math.random() * 2 - 1; last = (last + .02 * a[i]) / 1.02; b[i] = last * 3.5; }
  }
  function loop(buf, ftype, freq, q, gain, dest) {
    var s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
    var f = ctx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q || .7;
    var g = ctx.createGain(); g.gain.value = gain; s.connect(f); f.connect(g); g.connect(dest || master); s.start();
    return { g: g, f: f, s: s };
  }
  function burst(kind, level) {
    if (!awake || muted) return;
    var t = ctx.currentTime, s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var f = ctx.createBiquadFilter(), g = ctx.createGain();
    if (kind === 'pop') { f.type = 'bandpass'; f.frequency.value = 500 + Math.random() * 500; f.Q.value = 1.2; var d = .05 + Math.random() * .06; g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(.0008, t + d); s.connect(f); f.connect(g); g.connect(amb.fireBus); s.start(t, Math.random(), d + .02); }
    else { f.type = 'highpass'; f.frequency.value = 1800 + Math.random() * 2500; g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(.0008, t + .012 + Math.random() * .03); s.connect(f); f.connect(g); g.connect(amb.fireBus); s.start(t, Math.random(), .06); }
  }
  function crackle() {
    var r = Math.random();
    if (r < .12) { burst('pop', .55 + Math.random() * .4); fxState.flare = Math.min(1, fxState.flare + .6); }
    else { var k = 1 + (Math.random() * 3 | 0); for (var i = 0; i < k; i++) setTimeout(function () { burst('tick', .15 + Math.random() * .35); }, i * (8 + Math.random() * 30)); if (Math.random() < .3) fxState.flare = Math.min(1, fxState.flare + .25); }
    timers[0] = setTimeout(crackle, 50 + Math.random() * Math.random() * 700);
  }
