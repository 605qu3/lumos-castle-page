<!--
A castle shell (the Architect's page; docs/handoff/architect.md, "The shells plan, Q10"). Godric's Q10, answered 10.1
(13 October 2026, 12.22 pm): the ways walk as grey shells straight from the model, every room off them a shut door that
answers a tap; a room opens when it is built. His touch t1 (PS 8: doors that open only if asked politely, or are solid
walls pretending) is the events' and magic's to wire, by the hooks at the foot of this file. One page for every way:
shell.html?place=<id>, a room's id or a mass's made a slug (entrance-hall, stair-hall); page/castle-shell.js builds it
from page/castle-model.js, so a model change re-shapes the shell. The frame (renderer, camera, HUD, zoom, the help
line, the mote, travel and reveal) is castle.js's, unedited.
- He stands, as in the corridor: the start is inside the way he came in by (?from=<place>), or on a plain load inside
  the place's own start (the Entrance Hall's front doors, facing the marble staircase); a drag turns his head up to
  60 degrees each way (docs/interaction-vocabulary.md §1, §2). A tap on a door or a mouth walks him square to it
  (§11); a second tap there answers: a shut door shakes on its latch and tells the hooks (§6), an open mouth to a way
  takes him through under the frame's fade (§8), a way not yet built answers as a shut door. A tap on nothing at a
  stand goes back to the start; Back does the same (§3, §5). The stands are defaults; Interaction sets them (req 208).
- The stair hall's well (Godric's 12.1, 13 October 2026, 4.57 pm): ?place=stair-hall&from=entrance-hall arrives at the
  marble staircase's foot. A tap on a flight at one of its ends walks him up or down it to the other; on the floor of
  an end, to that end first. He walks a floor by its landings, never across the well's air; a thing on another floor
  waits until he climbs to it. Back walks him the same way down. The sixth moving flight's head, the landing bay at
  +34.42, opens west into corridor.html (?from=stair-hall); from it he arrives on the bay.
- Grey light only: a cool sky light from above and a warm one from the floor, no torches drawn yet.
-->

    sink: !!TRICK.sink, found: trickFound() }; },
  /* B21: the cupboard's state, and a tap on its grains as from its stand (true if they run) */
  cupboard: function () { return CUP ? { open: CUP.open, target: CUP.target, run: CUP.run } : null; },
  /* req 633: the hall's glasses (their levels and whether one is moving) and the ball; shown strings passed in are
     drawn as the records would show them */
  glass: function (shown) { var d = shown ? glassShown(shown) : [];
    return { ready: GLASS.ready, levels: GLASS.list.map(function (g) { return g.name + ' ' + g.level + (g.busy ? ' moving' : ''); }),
      ball: !!(GLASS.ball && GLASS.ball.visible), drawn: d.length }; },
  /* req 635: the stair hall's things as they stand (the armour, the tapestry's scene, Christmas, the rods); shown
     strings passed in are drawn as the room rules would show them */
  stair: function (shown) { var d = shown ? stairShown(shown) : [];
    return STAIR.on ? { suits: STAIR.suits.length, armour: STAIR.armour, scene: STAIR.scene, xmas: STAIR.xmas, loose: STAIR.loose,
      rods: STAIR.rods ? STAIR.rods.length : 0, drawn: d.length } : null; },
  /* req 658: the library's lamps as they stand (lit or not); shown strings passed in are drawn as the room rules would show them */
  lib: function (shown) { var d = shown ? libShown(shown) : [];
    return LIB.on ? { lamps: LIB.lamps.length, lit: LIB.lit, drawn: d.length } : null; },
  /* reqs 667 and 665: the Charms candles and the Potions fires as they stand; sway() knocks the chandelier */
  charms: function (shown) { var d = shown ? charmsShown(shown) : [];
    return CHARMS.on ? { candles: CHARMS.flames.length, lit: CHARMS.lit, swaying: !!CHARMS.sway, drawn: d.length } : null; },
  sway: function () { charmsSway(); return CHARMS.on; },
  potions: function (shown) { if (shown) potShown(shown);
    return POT.on ? { stands: POT.places.length, lit: POT.places.filter(function (q) { return q.fire.visible; }).length, all: POT.all } : null; },
  /* reqs 672, 675 and 677: the Transfiguration lamps, the Defence plates and the ward's lamps as they stand */
  trans: function (shown) { var d = shown ? transShown(shown) : [];
    return TRANS.on ? { lamps: TRANS.flames.length, lit: TRANS.lit, drawn: d.length } : null; },
  plates: function () { return DEF.on ? { plates: DEF.plates.length } : null; },
  wing: function (shown) { var d = shown ? wingShown(shown) : [];
    return WING.on ? { lamps: WING.flames.length, state: WING.state, drawn: d.length } : null; },
  grains: function () { if (!CUP) return null; lineDoor = CUP.d; if (events) events.tap('hall-cupboard-grains'); else cupRun(); return CUP.run >= 0; },
  knots: function (id) { var d = shell.doors.filter(function (x) { return x.id === id; })[0]; return d && d.knots ? knotSpots(d) : null; } };
