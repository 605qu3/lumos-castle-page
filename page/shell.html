<style>
  :root {

  }

  html, body {

<body>
<!--
A castle shell (the Architect's page; docs/handoff/architect.md, "The shells plan, Q10"). Godric's Q10, answered 10.1
(13 October 2026, 12.22 pm): the ways walk as grey shells straight from the model, every room off them a shut door that
answers a tap; a room opens when it is built. His touch t1 (PS 8: doors that open only if asked politely, or are solid
walls pretending) is the events' and magic's to wire, by the hooks at the foot of this file. One page for every way:
shell.html?place=<id>, a room's id or a mass's made a slug (entrance-hall, stair-hall); page/castle-shell.js builds it
from page/castle-model.js, so a model change re-shapes the shell. The frame (renderer, camera, HUD, zoom, the help
line, the mote, travel and reveal) is castle.js's, unedited.
- He stands, as in the corridor: the start is inside the way he came in by (?from=<place>), or on a plain load inside
  the place's own start (the Entrance Hall's front doors, facing the marble staircase); a drag turns his head up to
  60 degrees each way (docs/interaction-vocabulary.md §1, §2). A tap on a door or a mouth walks him square to it
  (§11); a second tap there answers: a shut door shakes on its latch and tells the hooks (§6), an open mouth to a way
  takes him through under the frame's fade (§8), a way not yet built answers as a shut door. A tap on nothing at a
  stand goes back to the start; Back does the same (§3, §5). The stands are defaults; Interaction sets them (req 208).
- The stair hall's well (Godric's 12.1, 13 October 2026, 4.57 pm): ?place=stair-hall&from=entrance-hall arrives at the
  marble staircase's foot. A tap on a flight at one of its ends walks him up or down it to the other; on the floor of
  an end, to that end first. He walks a floor by its landings, never across the well's air; a thing on another floor
  waits until he climbs to it. Back walks him the same way down. The sixth moving flight's head, the landing bay at
  +34.42, opens west into corridor.html (?from=stair-hall); from it he arrives on the bay.
- Grey light only: a cool sky light from above and a warm one from the floor, no torches drawn yet.
-->

<div id="hud">

<script src="castle-events.js?v=36"></script>
<script>
(function () {
'use strict';

var Q = new URLSearchParams(location.search);
var PLACE = Q.get('place') || 'entrance-hall';
/* a room's old id (its "alias" in the model) opens it under its own; a room the model marks "shell": "never" is
   model data only and is never built (the forbidden corridor behind its locked door: the Ministry's list, Rework 1) */
/* the boy's castle year by its book: each ground, room, opening and feature stands from its "first" book (to its
   "last", where given), so a place past his year is not built and a door into it is plain wall (the Ministry's list,
   Rework 4; the world rules, Spoilers). ?book=PS (CoS, PoA, GoF, OotP, HBP, DH, or 1 to 7) sets it for a check; else
   window.lumosCastleBook when the room states' castle-year driver gives it (req 414, Events'); else the Stone's year,
   so nothing later shows. A place set aside stands in no year. */
var BOOKS = ['PS', 'CoS', 'PoA', 'GoF', 'OotP', 'HBP', 'DH'];
var BOOK = (function () {
  var q = Q.get('book') || window.lumosCastleBook || 'PS', n = BOOKS.indexOf(q);
  return n >= 0 ? n : (+q >= 1 && +q <= 7 ? +q - 1 : 0);
})();
function stands(it) {
  var f = BOOKS.indexOf(it.first || 'PS'), l = it.last ? BOOKS.indexOf(it.last) : BOOKS.length - 1;
  return it.state !== 'set aside' && f <= BOOK && BOOK <= l;
}
var MODEL = window.CASTLE_MODEL ? (function (M) {
  var out = JSON.parse(JSON.stringify(M)), gone = {};
  ['grounds', 'rooms', 'features'].forEach(function (k) {
    out[k] = (out[k] || []).filter(function (it) { if (stands(it)) return true; gone[it.id] = true; return false; });
  });
  out.openings = (out.openings || []).filter(function (o) {
    return stands(o) && !gone[o.room] && !(o.between || []).some(function (r) { return gone[r]; });
  });
  return out;
})(window.CASTLE_MODEL) : null;
var MROOMS = (MODEL && MODEL.rooms) || [];
MROOMS.forEach(function (r) { if ((r.alias || []).indexOf(PLACE) >= 0) PLACE = r.id; });
var NEVER = MROOMS.some(function (r) { return r.id === PLACE && r.shell === 'never'; });
/* each place's start on a plain load: the way he first comes in by */
var STARTS = { 'entrance-hall': 'front-doors', 'stair-hall': 'well-mouth', 'tapestry-stairwell': 'tapestry-stair-1' };

var kit = window.castleFrame ? castleFrame({
  background: 0x0b0a09, fog: 0.012,
  zoom: { max: 3 },
  onAct: function (act) { if (act === 'reset') goBack(); }
}) : null;
if (!kit) { if (!window.castleFrame) document.getElementById('help').textContent = 'castle.js did not load. Check the connection and reload.'; return; }
var canvas = kit.canvas, backBtn = kit.backBtn, clamp = kit.clamp, lerp = kit.lerp, easeInOut = kit.easeInOut;
var renderer = kit.renderer, scene = kit.scene, camera = kit.camera;
camera.far = 220; camera.updateProjectionMatrix();

if (NEVER) { kit.helpEl.hidden = false; kit.helpEl.textContent = 'This door stays shut.'; return; }
var shell = window.CastleShell && MODEL ? CastleShell.build(kit, MODEL, PLACE, { from: kit.from, start: STARTS[PLACE] }) : null;
if (!shell) { kit.helpEl.hidden = false; kit.helpEl.textContent = 'No such place in the castle model: ' + PLACE; return; }
scene.add(shell.group);
document.title = shell.place.name + ', a shell';

/* grey light */
scene.add(new THREE.HemisphereLight(0xcfd4dc, 0x3a332c, 0.85));
var sun = new THREE.DirectionalLight(0xfff1dc, 0.45); sun.position.set(-6, 14, 9); scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));
/* the torches' light without the torches (PS 7: "stone walls lit with flaming torches"): four warm lights a place at
   3.2 m, a quarter of the way in from each corner, so the walls take light and fall off */
shell.places.forEach(function (p, pi) {
  var xs = p.poly.map(function (q) { return q[0]; }), ys = p.poly.map(function (q) { return q[1]; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  [[0.25, 0.25], [0.75, 0.25], [0.75, 0.75], [0.25, 0.75]].forEach(function (f) {
    var l = new THREE.PointLight(0xffc98a, pi ? 0.7 : 1.0, 26, 1.6);
    l.position.copy(shell.toLocal(x0 + (x1 - x0) * f[0], y0 + (y1 - y0) * f[1], p.floor + 3.2));
    scene.add(l);
  });
});
/* a well's floors above the ground: one more at the middle of each, 3.2 m over it, or the upper galleries go dark */
var lit = {};
shell.flights.forEach(function (f) {
  /* v17: a turret's landing, a lamp over it */
  if (f.lamp) { var lp = new THREE.PointLight(0xffc98a, 0.8, 10, 1.6); lp.position.copy(shell.toLocal(f.lamp[0], f.lamp[1], f.lamp[2])); scene.add(lp); return; }
  var st = shell.stairs.filter(function (s) { return s.id === f.id; })[0], p = st && shell.places.filter(function (q) { return q.id === st.place; })[0];
  if (!p || f.head.level - p.floor < 4 || lit[p.id + f.head.level]) return;
  lit[p.id + f.head.level] = true;
  var xs = p.poly.map(function (q) { return q[0]; }), ys = p.poly.map(function (q) { return q[1]; });
  var l = new THREE.PointLight(0xffc98a, 0.8, 30, 1.6);
  l.position.copy(shell.toLocal((Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2, f.head.level + 3.2));
  scene.add(l);
});

/* standing and looking round (the dormitory's way, req 210's: a drag turns his head from where he stands). He walks
   between stands on one floor by its landings, and up or down a flight from one end to the other (Godric's 12.1, the
   stair hall's well); a thing on another floor waits until he has climbed to it. Back walks the same way down. */
var D2R = Math.PI / 180;
/* how far his head goes at a stand (the model's look, version 19): the turn each way (all round at 180), the pitch
   between the stand's down and up, measured about the level, whatever the stand looks at */
function limits(s) {
  var L = s.lim || { down: -14, up: 14, turn: 60 }, d = s.look.clone().sub(s.pos), el0 = Math.atan2(d.y, Math.hypot(d.x, d.z));
  return { yaw: L.turn >= 180 ? null : L.turn * D2R, lo: Math.min(0, L.down * D2R - el0), hi: Math.max(0, Math.min(88 * D2R, L.up * D2R) - el0) };
}
var START = shell.stands[0], here = START, hy = 0, hp = 0, hyT = 0, hpT = 0, tween = null, legs = [], lookTmp = new THREE.Vector3();
/* v10 of the shells: a hidden opening seen from its outer side is wall with an unseen tap over it (Events' req 534:
   `tap keep-east-stair-panel-3` from the stair hall); a tap there walks him to it, a second is its id to the events */
var things = shell.doors.concat(shell.ways, shell.hidden || []), tappables = things.map(function (d) { return d.mesh; });
var trail = [START.pos.clone()];
function thingOf(mesh) { return things.filter(function (d) { return d.mesh === mesh; })[0]; }
function flightOf(mesh) { var id = mesh.userData.stair; return id ? shell.flights.filter(function (f) { return f.id === id; })[0] : null; }
function headPose(pos, look) {
  pos.copy(here.pos);
  var d = here.look.clone().sub(here.pos), a = Math.atan2(d.x, d.z) + hy, el = Math.atan2(d.y, Math.hypot(d.x, d.z)) + hp;
  look.set(pos.x + Math.sin(a) * Math.cos(el) * 10, pos.y + Math.sin(el) * 10, pos.z + Math.cos(a) * Math.cos(el) * 10);
}
function sameLevel(a, b) { return Math.abs(a - b) < 0.02; }
function near(s) { return sameLevel(here.level, s.level) && Math.hypot(here.pos.x - s.pos.x, here.pos.z - s.pos.z) < 1.6; }
function startLeg() {
  var to = legs.shift(), from = { pos: camera.position.clone(), look: lookTmp.clone() }, dist = from.pos.distanceTo(to.pos);
  tween = { t: 0, dur: to.fast ? clamp(0.3 + dist * 0.04, 0.3, 1.2) : clamp(0.8 + dist * 0.08, 0.8, 2.6), from: from, to: to };
}
/* through eye points to a stand, each leg looking on along itself, the last as the stand looks */
function walkTo(points, s, fast) {
  legs = [];
  var prev = camera.position.clone();
  points.forEach(function (p, i) {
    var dir = (i + 1 < points.length ? points[i + 1] : s.pos).clone().sub(p);
    if (dir.lengthSq() < 1e-4) dir = p.clone().sub(prev);
    legs.push({ pos: p.clone(), look: p.clone().add(dir.setLength(10)), fast: fast }); prev = p;
  });
  here = s; hy = hyT = hp = hpT = 0;
  var fp = new THREE.Vector3(), fl = new THREE.Vector3(); headPose(fp, fl);
  legs.push({ pos: fp, look: fl, fast: fast });
  trail = trail.concat(points.map(function (p) { return p.clone(); }), [s.pos.clone()]);
  for (var j = 0; j < trail.length - 1; j++) if (trail[j].distanceTo(s.pos) < 0.05) { trail = trail.slice(0, j + 1); break; }
  backBtn.hidden = s === START;
  startLeg();
}
/* to a stand on his own floor, by its landings; false if it is on another floor */
function goStand(s) {
  if (here === s) return true;
  if (!sameLevel(here.level, s.level)) return false;
  walkTo(shell.route(here.pos, s.pos, s.level) || [], s);
  return true;
}
/* a flight: at one end, a tap takes him to the other; on the floor of an end, to that end first (two taps, §6) */
function useFlight(f) {
  /* v17: a turret's flight is walked along its own treads, round the newel */
  if (near(f.foot)) { if (f.path) walkTo(f.path, f.head, true); else walkTo([f.footPt, f.headPt], f.head); return true; }
  if (near(f.head)) { if (f.path) walkTo(f.path.slice().reverse().concat([f.footPt]), f.foot, true); else walkTo([f.headPt, f.footPt], f.foot); return true; }
  return goStand(f.foot) || goStand(f.head);
}
function goTo(d) { return goStand(d.stand); }
function goBack() { if (here === START) { hyT = hpT = 0; return; } walkTo(trail.slice(1, -1).reverse(), START, true); }

/* a shut door answers: it shakes on its latch, and the hooks hear of it (the events' lines, t1's polite doors) */
var shakes = [];
function answer(d, point) {
  lineDoor = d;
  lastTickle = point ? tickleAt(d, point) : null;
  turnDone = null;
  if (events) events.tap(d.id);   /* a turn's cue fires inside the tap (Events, 6.17 pm), so the shake is decided after */
  else if (CUP && d === CUP.d) { turnDone = 'cupboard'; cupSet(CUP.target < 1); }   /* B21 with the events absent */
  if (turnDone === 'giggle') shake(d, 0.85, 45, 0.012 + 0.03 * (lastTickle ? lastTickle.near : 0.5));
  else if (!turnDone && d.rest) shake(d, 0.45, 70, 0.025);   /* a wall or a way out stays still (v10) */
  if (hooks.onDoorTap) hooks.onDoorTap({ id: d.id, to: d.to, place: d.place });
}
function shake(d, s, f, a) {
  shakes = shakes.filter(function (x) { return x.m !== d.mesh; });
  shakes.push({ m: d.mesh, t: 0, s: s, f: f, a: a, base: d.rest.pos, dir: d.inward.clone() });
}
function updateShakes(dt) {
  shakes = shakes.filter(function (s) {
    s.t += dt;
    var k = s.t < s.s ? Math.sin(s.t * s.f) * s.a * (1 - s.t / s.s) : 0;
    s.m.position.copy(s.base).addScaledVector(s.dir, k);
    return s.t < s.s;
  });
}

/* the doors' turns by the week (Magic's B19, Godric's 1 with t1, 5.21 pm; board req 284, the page half of Events'
   req 283). From password Monday one shut door some weeks is the polite one, the ticklish one or a wall pretending
   (Events' word `doors` and its records in events/doors.json, which say which door and when); the page draws what
   each record shows. Polite: please, or a second knock with speech off, swings the leaf open a hand's width on its
   hinge, warm light spilling through the gap across the grey floor, then it shuts. Ticklish: a few knots in its wood,
   one of them the right one this week (from the week alone, so both boys' doors agree); a tap on it laughs the door
   open a hand's width, off it the wood shivers and giggles, harder the nearer. A wall: the tap thuds with no shake, and
   for a breath the planks fade to the grey stone they really are. ?doors=polite (ticklish, wall, none) sets the week
   for checks. */
var HAND = 0.11, KNOT_R = 0.07, TICKLE_R = 0.13, KNOTS = 4, WALL_GREY = kit.col(0x75726e), Y_AXIS = new THREE.Vector3(0, 1, 0);
var TURN = /^(polite|ticklish|wall|none)$/.test(Q.get('doors') || '') ? Q.get('doors') : null;
var lastTickle = null, turnDone = null, swings = [], fades = [], turnDoors = { ticklish: [] }, knotsDrawn = false;
function turnNow() { if (TURN) return TURN; var w = events && events.words('doors'); return w ? w.now : 'none'; }
shell.doors.forEach(function (d) {
  var m = d.mesh, along = new THREE.Vector3(1, 0, 0).applyAxisAngle(Y_AXIS, m.rotation.y), W = d.w - 0.08;
  var th = Math.asin(Math.min(0.5, HAND / W)), s = along.clone().applyAxisAngle(Y_AXIS, th).dot(d.inward) < 0 ? 1 : -1;
  d.rest = { pos: m.position.clone(), rot: m.rotation.y };
  d.hinge = { at: m.position.clone().addScaledVector(along, -W / 2), along: along, half: W / 2, th: th * s };
  d.face = new THREE.Vector3().copy(d.inward).applyAxisAngle(Y_AXIS, -m.rotation.y).z > 0 ? 1 : -1;   /* the leaf's side toward him */
});
/* the wear (Godric's note on architect-knots-284-1013, 6.51 to 6.56 pm: "slightly worn from use by students over the
   decades"; the Architect's ledger, line 4): on every shut leaf, both faces, the wood rubbed paler and smoother where
   hands push it, by the free edge at the corridor door's lock height (about 1.0 m up), a scuffed foot paler toward
   that edge, and the threshold dished paler down its middle. Low contrast, a grey shell's; they swing with the leaf */
var wearTex = (function () {
  var c = document.createElement('canvas'); c.width = c.height = 64;
  var g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 2, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.55, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
var WEAR = { hand: { up: 1.0, in: 0.17, w: 0.3, h: 0.42 }, foot: { h: 0.32 }, sill: { frac: 0.6 } };
function wearPatch(w, h, color, opacity) {
  var mat = kit.solid(color, { map: wearTex, transparent: true, opacity: opacity, depthWrite: false, roughness: 0.62 });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
}
shell.doors.forEach(function (d) {
  var half = d.hinge.half, H = d.h - 0.02;
  d.wear = [];
  [1, -1].forEach(function (f) {
    var hand = wearPatch(WEAR.hand.w, WEAR.hand.h, 0x7a7168, 0.5);
    hand.position.set(half - WEAR.hand.in, -H / 2 + WEAR.hand.up, f * 0.0605);

  var m = ft.tread.material.clone(); m.color.offsetHSL(0, 0, 0.14); ft.tread.material = m;
}
function trickSink() { TRICK.sink = { t: 0 }; TRICK.list.forEach(trickPale); }
var TRICK_SINK = { down: 0.2, hold: 1.1, up: 1.5, depth: 0.35 };
function trickHold() { return !!TRICK.sink; }

  var s = TRICK.sink; if (!s) return 0;
  var t = s.t, k = t < TRICK_SINK.down ? t / TRICK_SINK.down : t < TRICK_SINK.hold ? 1 : Math.max(0, 1 - (t - TRICK_SINK.hold) / (TRICK_SINK.up - TRICK_SINK.hold));

}

  if (!TRICK.list.length) return;
  var sx = camera.position.x - TRICK.o.x, sy = TRICK.o.z - camera.position.z, feet = camera.position.y + TRICK.z0 - 1.35;
  TRICK.list.forEach(function (ft) {
    var r = ft.rect, on = sx >= r[0] - 0.02 && sx <= r[2] + 0.02 && sy >= r[1] - 0.02 && sy <= r[3] + 0.02 && Math.abs(feet - ft.z) < 0.45;
    if (on && !TRICK.inside[ft.id] && tween && !trickFound() && events && events.moment) events.moment('stepped on ' + ft.id.replace(/-/g, ' '));

if (events && events.ready) events.ready.then(function () { if (trickFound()) TRICK.list.forEach(trickPale); });

/* Filch's near misses (Events' req 498, the shells' half of Interiors' req 471; page/events/filch.json's
   `filch.miss-<room>`): on about one day in two, by day or evening, the first time in a visit he stands still a few
   seconds in one of the rooms the records name, the runtime hears `filch passes`, as page/corridor.html's FILCH has it,
   and the room's record answers with Filch's grumble, heard, and its one cue, word for word from the file: his lamp's
   warm light comes in at the room's way in farthest from him, swings a few metres in, holds and goes back out, never
   within FILCH.gap of him. Never a figure, never finding him; the way out stays open and Back works throughout. Every
   stand counts as a hiding place until Interiors' spots (each schedule's *Filch's near miss*) are stands of their own.
   The lamp's light stays in the scene at 0, so a pass never recompiles a material. ?filch makes him pass whatever the day */
var FILCH = { chance: 0.5, linger: 4, inTo: 4.0, gap: 2.5, speed: 0.8, hold: 1.4, y: 1.0, peak: 1.3,
  places: ['history-of-magic-classroom', 'charms-classroom', 'transfiguration-classroom', 'defence-classroom', 'potions-dungeon',
           'trophy-room', 'library', 'stair-hall', 'entrance-hall', 'myrtles-bathroom'] };
var filch = { on: FILCH.places.indexOf(PLACE) >= 0, q: Q.has('filch'), done: false, wait: 0, t: -1, door: null, reach: 0, T: 0,
  light: new THREE.PointLight(0xf2a860, 0, 6, 1.6) };
filch.light.name = 'filch-lamp'; filch.light.position.set(0, -50, 0); scene.add(filch.light);
if (filch.on) fetch('events/filch.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (j) {
  (j.records || []).forEach(function (rec) {
    if (/^filch\.miss-/.test(rec.id)) (rec.show || []).forEach(function (s) { allCues[s] = filchLamp; });

}).catch(function () {});
function filchDay() {
  if (filch.q) return true;

  var day = events.date ? events.date() : '', h = 23;
  for (var i = 0; i < day.length; i++) h = (h * 31 + day.charCodeAt(i)) % 9973;

}
function filchLamp() {
  var ds = shell.doors.concat(shell.ways).filter(function (d) { return d.place === shell.place.id; });
  if (!ds.length) return;
  var eye = camera.position, far = -1;
  ds.forEach(function (d) { var k = d.mid.distanceTo(eye); if (k > far) { far = k; filch.door = d; } });
  filch.reach = Math.max(0, Math.min(FILCH.inTo, far - FILCH.gap));
  filch.T = 0.6 + 2 * filch.reach / FILCH.speed + FILCH.hold + 0.6; filch.t = 0;   /* his steps and grumble are the record's, heard */
}
function updateFilch(dt) {
  if (filch.t >= 0) {
    var u = (filch.t += dt) - 0.6, go = filch.reach / FILCH.speed, d = filch.door;
    var s = u < 0 ? 0 : u < go ? u * FILCH.speed : u < go + FILCH.hold ? filch.reach : Math.max(0, filch.reach - (u - go - FILCH.hold) * FILCH.speed);
    var side = new THREE.Vector3(d.inward.z, 0, -d.inward.x).multiplyScalar(0.35 * Math.sin(filch.t * 1.7));   /* the lamp swung to look */
    filch.light.position.copy(d.mid).addScaledVector(d.inward, s + 0.3).add(side);
    filch.light.position.y = d.mid.y + d.sill + FILCH.y + 0.03 * Math.sin(filch.t * 11);
    filch.light.intensity = FILCH.peak * Math.min(1, filch.t / 0.8, Math.max(0, (filch.T - filch.t) / 0.8));
    if (filch.t >= filch.T) { filch.t = -1; filch.light.intensity = 0; filch.light.position.y = -50; }
    return;
  }

}

/* the hooks: the events and magic set these (a shut door's tap, a way taken); harmless when unset */
var hooks = window.lumosShell = { onDoorTap: null, onWay: null,
  place: shell.place.id, places: shell.places.map(function (p) { return p.id; }),
  doors: shell.doors.map(function (d) { return { id: d.id, to: d.to }; }),
  ways: shell.ways.map(function (d) { return { id: d.id, to: d.to, built: !!d.built }; }),
  stands: shell.stands.map(function (s) { return s.name; }) };
/* hooks for automated checks; harmless in normal use */
window.lumosGreybox = { scene: scene, camera: camera, zoom: kit.zoom, tap: tap, goBack: goBack, busy: function () { return !!tween; },
  goTo: function (id) { var d = things.filter(function (x) { return x.id === id; })[0]; return d ? goTo(d) : false; },
  flight: function (id) { var f = shell.flights.filter(function (x) { return x.id === id; })[0]; return f ? useFlight(f) : false; },
  flights: function () { return shell.flights.map(function (f) { return f.id; }); },
  stand: function () { return here.name; }, level: function () { return here.level; }, eye: function () { return camera.position.clone(); },
  head: function () { var lm = limits(here); return { yaw: hy, pitch: hp, limit: lm.yaw, lo: lm.lo, hi: lm.hi, lim: here.lim }; },
  /* a stand by name at once, and the head set and held within its limits (the shots at both limits) */
  standNamed: function (n) {
    var s = shell.stands.filter(function (x) { return x.name === n; })[0]; if (!s) return false;
    tween = null; legs = []; here = s; hy = hyT = hp = hpT = 0; headPose(camera.position, lookTmp); camera.lookAt(lookTmp); return true;
  },
  look: function (y, p) { var lm = limits(here); hy = hyT = lm.yaw == null ? y : clamp(y, -lm.yaw, lm.yaw); hp = hpT = clamp(p, lm.lo, lm.hi); return { yaw: hy, pitch: hp }; },
  /* a shut door's tap; x and y (metres across and up from the leaf's middle) put it on a spot, as on a knot */
  answer: function (id, x, y) {

  trick: function () { return { steps: TRICK.list.map(function (f) { return f.id; }), treads: TRICK.list.map(function (f) { return !!f.tread; }),
