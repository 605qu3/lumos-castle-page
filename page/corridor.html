<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Seventh-floor corridor, greybox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital@0;1&family=Short+Stack&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a09;
    --hud-bg: rgba(24, 21, 18, 0.78);
    --hud-fg: #d9d2c6;
    --hud-dim: #8e877c;
    --hud-on: #e9b86a;
    --hud-line: rgba(255, 255, 255, 0.16);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0a09; }
  }
  :root[data-theme="dark"] { --bg: #0b0a09; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    color: var(--hud-fg);
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  #stats {
    font-size: 12px;
    line-height: 1.35;
    background: var(--hud-bg);
    padding: 6px 9px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
    color: var(--hud-dim);
    white-space: pre;
  }
  #btns { display: flex; flex-wrap: wrap; gap: 6px; max-width: 320px; pointer-events: auto; }
  button {
    font: 500 13px/1 -apple-system, system-ui, "Segoe UI", sans-serif;
    color: var(--hud-fg);
    background: var(--hud-bg);
    border: 1px solid var(--hud-line);
    border-radius: 6px;
    min-height: 38px;
    min-width: 44px;
    padding: 0 12px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  button.on { color: var(--hud-on); border-color: var(--hud-on); }
  button:focus-visible { outline: 2px solid var(--hud-on); outline-offset: 2px; }
  #back {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    min-height: 46px;
    padding: 0 18px;
    font-size: 15px;
  }
  #help {
    position: fixed;
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    max-width: min(420px, calc(100vw - 20px));
    background: var(--hud-bg);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.45;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
  /* the events' lines (board req 66), the common room's slips as they stand (req 65, their look provisional with
     Godric there): said on a slip by the speaker, heard in faint italic toward where it comes from, written on a scrap;
     one at a time, a tap on the words puts it away */
  #lines { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .line { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; opacity: 0;
    transition: opacity 0.35s ease; -webkit-tap-highlight-color: transparent; }
  .line.on { opacity: 1; }
  .line.said { max-width: min(330px, 70vw); padding: 9px 13px 10px; background: #efe5cc; color: #2a2016;
    border-radius: 7px; box-shadow: 0 3px 14px rgba(0,0,0,0.45); font: 400 20px/1.3 "EB Garamond", Georgia, serif; }
  .line.said::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -9px; margin-left: -9px;
    border: 9px solid transparent; border-bottom: 0; border-top-color: #efe5cc; }
  .line.said.below::after { bottom: auto; top: -9px; border-top: 0; border-bottom: 9px solid #efe5cc; }
  .line.heard { max-width: min(420px, 80vw); color: #e9dfc6; text-align: center;
    font: italic 400 21px/1.3 "IM Fell English", Georgia, serif; text-shadow: 0 0 6px #000, 0 0 14px rgba(0,0,0,0.9); }
  .line.heard.sound { color: #cfc4aa; font-size: 19px; }
  .line.written { max-width: min(300px, 66vw); padding: 12px 15px; background: #f1e8d2; color: #2b2a4a;
    box-shadow: 0 3px 14px rgba(0,0,0,0.5); transform-origin: 50% 0; font: 400 21px/1.35 "Short Stack", cursive;
    white-space: pre-line; }
  @media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>
</head>
<body>
<!--
The seventh-floor corridor outside the portrait hole (PS 9), its own page with its own GPU budget, so moving between
rooms is a page load under a fade. Its frame (renderer, camera, the texture and mesh helpers, the apply functions, the
HUD) is castle.js, shared with the common room since 8 October 2026; this page keeps its own scene, stops and loop.

Decisions, 7 and 8 October 2026, each Godric's; the handoff's The corridor is the full record:
- It agrees with what the hole shows from inside. Everything is in the hole's own frame, copied from common-room.html:
  x along the wall, toward the hearth side; y up; z into the room. Her painted face is at z -0.81. As built in the
  room, the far wall is 2.0 m beyond her and the torch's head at x 0.95, 1.3 m up; from inside a boy sees only a patch
  of the far wall from x 0.15 to 1.25, 0.5 to 1.85 m up, and never the floor.
- Width and height: 3 m wide and 4.5 m tall, so the far wall is at z -3.81 and the torch's head at x 1.3, where the
  default view (x 1.15 to 1.75) and a drag left (0.4 to 1.45) agree, projected through the hole. Canon gives no
  numbers; PA 8 has the whole house crowding it (from memory). Chosen over 2 m (the room as built, but cramped, the
  door and armour stops at 70 degrees) and 4 m. The room's far wall and torch move to match; that is the password
  session's code, asked for in the handoff. The closed end is at x 2.3, past anything the hole shows (x 2.05 at most).
- Shape: a dead end. She hangs on the long side near the closed end, the torch faces her, and the corridor runs off
  to the right as you face her (toward -x). Chosen over running past her (loses PS 7's "at the very end of the
  corridor", quoted from memory), curving with the tower, and pointing at her (the room's far wall would change).
- Length and the far end: x 2.3 to a stair head at x -11.4 (from -11.0, for the inglenook's width), where a flight goes down toward -x between the same
  walls (PS 7 brings the first-years up staircases; PS 8's moving stairs), behind the camera at rest. It replaced a
  90 degree turn at -10.5, which was invented, not canon. Lost: the turn; running on into the dark.
- By day, the gallery (8 October), on three axes: hers (x 0), the study stretch's bay (-3.55) and the hearth's
  (-8.6). Her wall: her, portrait-a (-2.5, nearest her) and portrait-b (-4.6). The far wall, the castle's outer wall:
  a torch either side of her axis, exactly mirrored (+1.5, the one the room shows whole, and -1.5), a tall window with a deep sill opposite
  each portrait (the sill at -4.6 is the Remembrall's, later), the armour in the pier between them, the tapestry on
  the hearth axis facing the fire. The polite door on the end wall, on the centre line, closes the view. Chosen over a single
  window on the bay axis with an armour opposite each portrait. The empty classroom and its door are gone: a
  classroom beside the dormitory makes no sense.
- Her study (the common room's to build) is pulled out to a wall square to the corridor at x -6.4, tangent to the
  tower. Past it the inglenook, where visitors wait to be fetched: 4.4 by 2.2 m clear, a low ceiling and lintel at
  2.4 m, a chimney breast 3.0 m wide with the room's fireplace drawing at 2.6 m, and a settle 2.0 m long each side, three seats a side. Chosen
  over 2.6 m deep with four a side (more than asked, and half the study behind her window).
- Camera: down the length from the stair head at a boy's eye, chosen from greybox shots of both views over a stage view
  with the far wall cut away (her wall square on, but a gallery rather than a corridor, and the far wall's four things
  lost). Everything on the walls is foreshortened from here, her most, so the view turns square at each stop. A
  standing piece (the armour) is a card turned to the eye, as the stairs are. The stage view stays behind View.
- The stops: each stands a hand short of the facing wall and opens its field of view until the thing fits with an
  eighth to spare, between 42 and 70 degrees: her, the windows and the portraits at 42, the tapestry 43, the armour 52.
  The inglenook's stop stands a hand off the far wall, square to the hearth.
- The glimpse behind the polite door (8 October, evening): the leaf swings in on a hinge at the outer-wall jamb and lies
  open along the shelves on that side; one flat drawing, door-glimpse, 1.8 by 3.2 m, stands 1.05 m behind the door's plane,
  running 0.6 m below the floor, painted for the eye at the door's stop, the only place the door is ever open. Round 1,
  candidate 2 of 3 (the narrowest aisle, the longest run, two empty shelves on the right at chest height for the find),
  keyed at 720 x 1280, 400 px per metre, about 4.9 MB on the iPad. Lost: a door swinging out into the corridor; the
  drawing 1.5 m in with bare floor first.
- Moving: tap a thing to go to it, her, a window, the armour, a portrait, the tapestry or the inglenook; the view glides there and turns
  square; tap off it or Back to glide back to the corner. The notice board's walk-up again. Lost: stepping along by
  tapping the floor (stops with nothing at them).
- Hand-over: through the hole under a fade. Going in, the view glides into the tunnel, fades to black where it is
  darkest, and the common room loads and fades in at its default view with her swinging shut; coming out, the reverse,
  arriving at her stop as she closes. The address carries where he came from; the place is saved on the device. The
  room's half is the password session's code, agreed through the handoff. Lost: a plain cut (no passing through), one
  page for both rooms (the budgets add). The room is always night, so day here meets night there until it has a day.
Every grey shape is at its real size. Nothing is drawn yet but the torch, which the room already has.
-->
<canvas id="c" tabindex="0" aria-label="Seventh-floor corridor greybox"></canvas>
<div id="hud">
  <div id="stats">starting</div>
  <div id="btns">
    <button type="button" data-act="view">View</button>
    <button type="button" data-act="layers">Layers</button>
    <button type="button" data-act="res">Res</button>
    <button type="button" data-act="exp">Exp</button>
    <button type="button" data-act="reset">Reset</button>
    <button type="button" data-act="help">?</button>
  </div>
</div>
<button id="back" type="button" hidden>Back</button>
<div id="help">Drag to look along the corridor. Tap her, a portrait, the armour, a window, the tapestry, the inglenook or the door at the end to go to it; tap off it or Back to return. View switches to the stage view. The grey shapes are placeholders.</div>

<div id="lines" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="castle.js?v=3"></script>
<script src="castle-ear.js?v=1"></script>
<script src="castle-events.js?v=11"></script>
<script>
(function () {
'use strict';

/* ---------- the shared frame (castle.js): renderer, scene, camera, helpers, HUD ---------- */

var kit = window.castleFrame ? castleFrame({
  background: 0x0b0a09, fog: 0.03,
  onAct: function (act) {
    if (act === 'view') setView(view === 'length' ? 'stage' : 'length');
    else if (act === 'reset') { yawT = pitchT = 0; slideT = VIEWS.stage.x0; goBack(); }
  }
}) : null;
if (!kit) { if (!window.castleFrame) document.getElementById('help').textContent = 'castle.js did not load. Check the connection and reload.'; return; }
var helpEl = kit.helpEl, canvas = kit.canvas, btns = kit.btns;
var clamp = kit.clamp, lerp = kit.lerp, easeInOut = kit.easeInOut, col = kit.col;
var renderer = kit.renderer, scene = kit.scene, camera = kit.camera;
var makeCanvas = kit.makeCanvas, tex = kit.tex, rr = kit.rr, arch = kit.arch, cutoutTexture = kit.cutoutTexture, flameTexture = kit.flameTexture;
var layered = kit.layered, register = kit.register, solid = kit.solid, box = kit.box, cutoutMesh = kit.cutoutMesh;
var setTint = kit.setTint;

var lookTmp = new THREE.Vector3();

var flameTex = flameTexture();

/* silhouettes for the placeholders */
function drawRect(g, w, h) { g.fillRect(0, 0, w, h); }
function drawFrame(g, w, h) { g.fillRect(0, 0, w, h); g.fillStyle = '#8f8b84'; g.fillRect(w * 0.09, h * 0.08, w * 0.82, h * 0.84); }
function drawArch(g, w, h) { arch(g, 0, 0, w, h); }
function drawArmour(g, w, h) {
  /* a standing suit on a plinth: helm, shoulders, body, legs */
  g.fillRect(w * 0.12, h * 0.86, w * 0.76, h * 0.14);
  rr(g, w * 0.36, h * 0.02, w * 0.28, h * 0.13, w * 0.1);
  rr(g, w * 0.14, h * 0.14, w * 0.72, h * 0.12, w * 0.08);
  g.fillRect(w * 0.27, h * 0.24, w * 0.46, h * 0.28);
  g.fillRect(w * 0.06, h * 0.22, w * 0.14, h * 0.32);
  g.fillRect(w * 0.80, h * 0.22, w * 0.14, h * 0.32);
  g.fillRect(w * 0.29, h * 0.5, w * 0.18, h * 0.37);
  g.fillRect(w * 0.53, h * 0.5, w * 0.18, h * 0.37);
}
function drawTorch(g, w, h) {
  g.fillRect(w * 0.05, h * 0.3, w * 0.22, h * 0.5);
  g.fillRect(w * 0.2, h * 0.5, w * 0.6, h * 0.06);
  g.fillRect(w * 0.72, h * 0.08, w * 0.16, h * 0.5);
}

/* a flat piece on a wall: facing +1 looks toward +z (her wall, into the corridor), -1 toward -z (the far wall) */
function onWallZ(t, w, h, x, y, z, facing, layer, name) {
  var m = cutoutMesh(t, w, h);
  m.position.set(x, y, z);
  if (facing < 0) m.rotation.y = Math.PI;
  m.name = name;
  scene.add(m);
  return register(m, layer);
}

/* ---------- the corridor ---------- */
/* The hole's own frame from common-room.html: x along the wall toward the hearth side, y up, z into the room.
   The closed end is at +x, the stair head at -x. Facing her, +x is on your left. The corridor's floor runs to the
   stair head at STAIR_X, where a flight goes down toward -x between the same two walls, the way PS 7 brings the
   first-years up; it is behind the camera at rest. At its foot a landing 2.4 m deep (Godric, 9 October
   2026, from the window's plan, req 29) ends at the end wall, so the side walls and ceiling run on to it. */
var HER_Z = -0.81, FAR_Z = -3.81, END_X = 2.3, STAIR_X = -11.4, CEIL = 4.5, BELOW = 2.5;
var STEP_RISE = 0.18, STEP_RUN = 0.3, STEPS = 11, LANDING_D = 2.4;
var FOOT_X = STAIR_X - STEPS * STEP_RUN, FOOT_Y = -STEPS * STEP_RISE, FAR_END_X = FOOT_X - LANDING_D;
var MID_Z = (HER_Z + FAR_Z) / 2, LEN = END_X - FAR_END_X, WIDTH = HER_Z - FAR_Z;

var stoneMat = solid(0x75726e);
var floorMat = solid(0x6a6764);
var ceilMat = solid(0x3d3b38);
var T = 0.3, WALL_H = CEIL + BELOW, WALL_Y = (CEIL - BELOW) / 2;
var walls = new THREE.Group(); scene.add(walls);
/* the far wall, the castle's outer wall, full length and down the stairwell; cut away in the stage view */
var farWall = box(walls, LEN, WALL_H, T, (END_X + FAR_END_X) / 2, WALL_Y, FAR_Z - T / 2, stoneMat, 0);
farWall.name = 'far-wall';
/* her wall; her study lies behind it from x -2.6 to its end wall at -6.4, and past that the inglenook opens off it,
   x -6.4 to -10.8 clear, under a lintel at NOOK_H (8 October 2026: 4.4 by 2.2 m, six seats, a low ceiling
   at 2.4 m for the nook's feel) */
var NOOK_X0 = -6.4, NOOK_X1 = -10.8, NOOK_D = 2.2, NOOK_H = 2.4;
var NOOK_BACK = HER_Z + NOOK_D, NOOK_MID = (NOOK_X0 + NOOK_X1) / 2, NOOK_W = NOOK_X0 - NOOK_X1;
var herWall = box(walls, END_X - NOOK_X0, WALL_H, T, (END_X + NOOK_X0) / 2, WALL_Y, HER_Z + T / 2, stoneMat, 0);
herWall.name = 'her-wall';
box(walls, NOOK_X1 - FAR_END_X, WALL_H, T, (NOOK_X1 + FAR_END_X) / 2, WALL_Y, HER_Z + T / 2, stoneMat, 0).name = 'her-wall-stair';
box(walls, NOOK_W, CEIL - NOOK_H, T, NOOK_MID, (CEIL + NOOK_H) / 2, HER_Z + T / 2, stoneMat, 0).name = 'nook-lintel';
/* the closed end, with the polite door's opening cut out of it on the centre line (two sides, a lintel and a stone
   threshold the wall's thickness deep), and the wall the flight runs down toward */
var DOOR = { w: 1.0, h: 2.2 };
box(walls, T, WALL_H, (WIDTH - DOOR.w) / 2, END_X + T / 2, WALL_Y, MID_Z + (WIDTH + DOOR.w) / 4, stoneMat, 0).name = 'end-wall-her-side';
box(walls, T, WALL_H, (WIDTH - DOOR.w) / 2, END_X + T / 2, WALL_Y, MID_Z - (WIDTH + DOOR.w) / 4, stoneMat, 0).name = 'end-wall-outer-side';
box(walls, T, CEIL - DOOR.h, DOOR.w, END_X + T / 2, (CEIL + DOOR.h) / 2, MID_Z, stoneMat, 0).name = 'end-wall-lintel';
box(walls, T, BELOW, DOOR.w, END_X + T / 2, -BELOW / 2, MID_Z, stoneMat, 0).name = 'end-wall-threshold';
box(walls, T, WALL_H, WIDTH, FAR_END_X - T / 2, WALL_Y, MID_Z, stoneMat, 0).name = 'stair-end-wall';
var floor = new THREE.Mesh(new THREE.PlaneGeometry(END_X - STAIR_X, WIDTH), floorMat);
floor.rotation.x = -Math.PI / 2; floor.position.set((END_X + STAIR_X) / 2, 0, MID_Z);
floor.name = 'floor'; scene.add(floor); register(floor, 0);
/* the flight down from the stair head, full width */
var stairMat = solid(0x6f6b66), treads = [];
for (var si = 1; si <= STEPS; si++) {
  var top = -si * STEP_RISE;
  var tread = box(scene, STEP_RUN, 0.4, WIDTH, STAIR_X - (si - 0.5) * STEP_RUN, top - 0.2, MID_Z, stairMat, 0);
  tread.name = 'stair-' + si; treads.push(tread);
}
/* the landing at the flight's foot, and a grey stand-in for its tall window in the end wall (req 29 settles the window
   and what it looks onto; a pale sky shape for now so the foot of the stair is never dark) */
var landing = new THREE.Mesh(new THREE.PlaneGeometry(LANDING_D, WIDTH), floorMat);
landing.rotation.x = -Math.PI / 2; landing.position.set((FOOT_X + FAR_END_X) / 2, FOOT_Y, MID_Z);
landing.name = 'landing'; scene.add(landing); register(landing, 0);
var LANDING_WINDOW = { w: 2.33, h: 4.8, sill: 0.9 };   /* grand and tall, stained glass; 2.33 by 4.8 m, the drawing's own shape at the height Godric chose (9 October 2026, 2.41 pm, req 29) */
var landingWindow = cutoutMesh(cutoutTexture(120, 288, "#c9d6e2", drawArch, "window"), LANDING_WINDOW.w, LANDING_WINDOW.h);
landingWindow.material = new THREE.MeshBasicMaterial({ map: landingWindow.material.map, alphaTest: 0.5, color: col(0xdfe8f0) });
landingWindow.position.set(FAR_END_X + 0.01, FOOT_Y + LANDING_WINDOW.sill + LANDING_WINDOW.h / 2, MID_Z);
landingWindow.rotation.y = Math.PI / 2;
landingWindow.name = 'landing-window'; scene.add(landingWindow); register(landingWindow, 1);
/* the drawing (round 1, candidate 3, Godric, 9 October 2026, 2.20 pm): Gryffindor's lion in scarlet and gold glass in its
   stone reveal, unlit so the glass glows with the day behind it. Drawn about 1 to 2.06, so its height follows its width;
   sizeLandingWindow(w) restands it, its foot staying on the sill line. */
var landingWindowAspect = LANDING_WINDOW.h / LANDING_WINDOW.w;
function sizeLandingWindow(w) {
  LANDING_WINDOW.w = w; LANDING_WINDOW.h = w * landingWindowAspect;
  landingWindow.geometry.dispose();
  landingWindow.geometry = new THREE.PlaneGeometry(LANDING_WINDOW.w, LANDING_WINDOW.h);
  landingWindow.position.y = FOOT_Y + LANDING_WINDOW.sill + LANDING_WINDOW.h / 2;
  return LANDING_WINDOW.w.toFixed(2) + ' x ' + LANDING_WINDOW.h.toFixed(2);
}
(function () {
  var im = new Image();
  im.onload = function () {
    landingWindow.material.map = tex(im); landingWindow.material.color.set(0xffffff);
    landingWindow.material.needsUpdate = true;
    landingWindowAspect = im.height / im.width;
    sizeLandingWindow(LANDING_WINDOW.w);
  };
  im.src = '../assets/layers/landing-window.png';
})();
/* the front doors (req 63; round 1, candidate 2, Godric, 10 October 2026, 3.34 pm): the entrance hall's great oak doors,
   shut, a thin line of daylight under them, standing on the landing in the end wall in the window's place on the days
   the stair leads to them (showFoot). The window's width, 2.33 m; their height follows the drawing, about 4.2 m. Lit,
   not glowing: the torch either side of them (below) lights them */
var FRONT_DOORS = { w: 2.33, h: 4.22 };
var frontDoors = cutoutMesh(cutoutTexture(120, 216, '#5a3e26', function (g, w, h) { g.fillRect(0, 0, w, h); }, 'doors'), FRONT_DOORS.w, FRONT_DOORS.h);
frontDoors.position.set(FAR_END_X + 0.01, FOOT_Y + FRONT_DOORS.h / 2, MID_Z);
frontDoors.rotation.y = Math.PI / 2;
frontDoors.visible = false;
frontDoors.name = 'front-doors'; scene.add(frontDoors); register(frontDoors, 1);
(function () {
  var im = new Image();
  im.onload = function () {
    var t = tex(im);
    frontDoors.material.map = t; frontDoors.material.color.set(0xffffff); frontDoors.userData.base = frontDoors.material.color.clone();
    frontDoors.material.needsUpdate = true;
    if (frontDoors.customDepthMaterial) { frontDoors.customDepthMaterial.map = t; frontDoors.customDistanceMaterial.map = t; }
    FRONT_DOORS.h = FRONT_DOORS.w * im.height / im.width;
    frontDoors.geometry.dispose(); frontDoors.geometry = new THREE.PlaneGeometry(FRONT_DOORS.w, FRONT_DOORS.h);
    frontDoors.position.y = FOOT_Y + FRONT_DOORS.h / 2;
    sizeDoorsGap();
  };
  im.src = '../assets/layers/front-doors.png';
})();
/* after dusk the line of daylight under them goes dark (Events' night cue, req 82): a dark strip over the drawn gap,

  var dt = Math.min(0.05, clock.getDelta());
  t += dt;
  if (castle) castle.tick(dt);
  updateCamera(dt);
  updateSticks(dt);
  updateTrevor(dt);
  updateLines(dt);
  updateDraught(dt);
  updateScarf(dt);
  updateSteam();
  updateDoorsKnock(dt);
  herDoor.ang = lerp(herDoor.ang, herDoor.target, Math.min(1, dt * 4));
  hinge.rotation.y = -herDoor.ang;
  doorLeaf.ang = lerp(doorLeaf.ang, doorLeaf.target, Math.min(1, dt * 4));
  doorHinge.rotation.y = doorLeaf.ang;
  glimpseLight.intensity = 1.4 * Math.sin(doorLeaf.ang);
  torches.forEach(function (tc, i) {
    var k = 0.85 + 0.15 * Math.sin(t * 11 + i) * Math.sin(t * 4.3 + i * 2);
    tc.light.intensity = 1.6 * k;
    tc.flame.scale.set(0.12 * (0.92 + 0.08 * Math.sin(t * 7.3 + i)), 0.2 * (0.85 + 0.2 * Math.abs(Math.sin(t * 9.1 + i))), 1);
    if (tc.lean) tc.flame.material.rotation = -0.4 + 0.08 * Math.sin(t * 5.1);   /* leaning toward the arch */
    if (doorTorches.indexOf(tc) >= 0) {       /* the draught: fluttering and guttering */
      var g = draught.g * (0.7 + 0.3 * Math.sin(t * 23 + i));
      tc.flame.material.rotation = 0.6 * g * Math.sin(t * 12 + i * 1.7);   /* the lean is toward him, so it flutters side to side as well */
      tc.flame.scale.x *= 1 + 0.5 * g; tc.flame.scale.y *= 1 - 0.3 * g;
      tc.light.intensity *= 1 - 0.3 * g * Math.abs(Math.sin(t * 31 + i));
    }
  });
  renderer.render(scene, camera);
  kit.stats(dt);
}
renderer.setAnimationLoop(frame);

/* hooks for automated checks; harmless in normal use */
window.lumosGreybox = { frame: frame, setView: setView, view: function () { return view; }, setTint: setTint, scene: scene, camera: camera, hinge: hinge,
  tap: tap, goBack: goBack, steam: function (lean, out) { steamLeanT = lean; steamOut = !!out; }, gust: function (leaf) { draught.next = 0; if (leaf) addLeaf(); return draught.leaves.length; }, goTo: function (name) { var s = STOPS.filter(function (x) { return x.name === name; })[0]; if (s) goTo(s); return !!s; },
  mode: function () { return mode; }, stop: function () { return atStop && atStop.name; }, busy: function () { return !!tween; },
  yaw: function () { return yaw; }, yawTarget: function () { return yawT; },
  enter: enter, herDoor: herDoor, events: castle, armour: armour, sticks: sticks, openDoor: openDoor, setGlimpse: setGlimpse, doorLeaf: doorLeaf,
  sizeLandingWindow: sizeLandingWindow, trevor: trevorHit, trevorMarks: TREVOR_MARKS, paintingSitter: setPaintingSitter, stair: { step: vanishingStep, down: goDownStair, foot: function () { return footNamed; } },
  lines: { show: showLines, now: function () { return lineCur && { text: lineCur.line.text, t: lineCur.t }; }, queued: function () { return lineQ.length; } } };
})();
