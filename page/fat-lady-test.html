<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fat Lady test</title>
<style>
  :root { --barh: 64px; --bg: #15120f; --fg: #f1e8da; --dim: #a89c8a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 17px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 var(--barh) 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #lady { position: relative; width: min(96vw, calc((100vh - var(--barh)) * 0.96 * 1120 / 1360)); aspect-ratio: 1120 / 1360; transition: transform 0.6s ease; transform-origin: 54% 27%; }
  #lady.close { transform: scale(3.2); }
  /* While she listens the view eases a few centimetres closer, standing in for a lean the fade cannot show. */
  #lady.lean { transform: scale(1.05); transition: transform 0.9s ease-out; }
  #lady.close.lean { transform: scale(3.36); }
  #lady img { position: absolute; display: block; }
  #front { inset: 0; width: 100%; height: 100%; }
  /* Every image carries ?v=N, raised whenever a patch is recut: GitHub Pages lets Safari keep an image for ten
     minutes, and David judged an old cut on 7 October because of it. */
  /* A patch sits at its box in the layer's 1120 x 1360 pixels, given in percent so it scales with her. */
  .patch { opacity: 0; transition: opacity 0.2s linear; }
  .patch.on { opacity: 1; }
  /* An arm patch fades a little slower, and through a halfway pose, so the hand reads as moving. */
  .patch.arm { transition-duration: 0.25s; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; min-height: 64px; box-sizing: border-box; flex-wrap: wrap; padding: 8px 12px; display: flex; gap: 8px; align-items: center; justify-content: center; padding: 0 12px; }
  button { font: inherit; color: var(--fg); background: #2a241e; border: 1px solid #4a4036; border-radius: 10px; padding: 9px 14px; }
  button.sel { background: #6b3a24; }
  @media (max-width: 640px) { :root { --barh: 120px; } button { padding: 8px 10px; } }
  #state { color: var(--dim); min-width: 5em; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="lady">
    <img id="front" src="../assets/layers/portrait-hole-front.png?v=3" alt="">
    <img class="patch arm" id="reach" src="../assets/layers/portrait-hole-front-reach.png?v=3" alt="">
    <img class="patch arm" id="ear" src="../assets/layers/portrait-hole-front-ear.png?v=3" alt="">
    <img class="patch" id="doze" src="../assets/layers/portrait-hole-front-doze.png?v=3" alt="">
    <img class="patch" id="listen" src="../assets/layers/portrait-hole-front-listen.png?v=3" alt="">
    <img class="patch" id="pleased" src="../assets/layers/portrait-hole-front-pleased.png?v=3" alt="">
    <img class="patch" id="brow" src="../assets/layers/portrait-hole-front-brow.png?v=3" alt="">
    <img class="patch" id="sigh" src="../assets/layers/portrait-hole-front-sigh.png?v=3" alt="">
  </div>
</div>
<div id="bar">
  <button id="auto" class="sel">Auto</button>
  <button id="toggle">Doze / wake</button>
  <button id="listenBtn">Listen</button>
  <button id="rightBtn">Right password</button>
  <button id="lastBtn">Last week's</button>
  <button id="earBtn">Can't hear</button>
  <button id="giveBtn">Giving in</button>
  <button id="zoom">Close</button>
  <span id="state">awake</span>
</div>
<script>
/* A test of the Fat Lady's face patches over her staged front, for judging them moving before the corridor page
   takes them. Each patch is a feathered cut from an edit of her front, laid at its box and cross-faded in a fifth
   of a second. Auto dozes and wakes her at durations drawn fresh each time, never on a clock. */
(function () {
  var W = 1120, H = 1360;
  var PATCHES = { doze: [543, 396, 664, 526], listen: [540, 384, 666, 526], pleased: [540, 384, 666, 529],
    brow: [540, 384, 666, 529], sigh: [540, 384, 666, 529],
    reach: [549, 415, 907, 918], ear: [549, 415, 907, 918] };
  for (var id in PATCHES) {
    var b = PATCHES[id], el = document.getElementById(id);
    el.style.left = (100 * b[0] / W) + '%'; el.style.top = (100 * b[1] / H) + '%';
    el.style.width = (100 * (b[2] - b[0]) / W) + '%'; el.style.height = (100 * (b[3] - b[1]) / H) + '%';
  }
  var doze = document.getElementById('doze'), stateEl = document.getElementById('state');
  var autoBtn = document.getElementById('auto'), auto = true, timer = null;
  function set(asleep) { doze.classList.toggle('on', asleep); stateEl.textContent = asleep ? 'dozing' : 'awake'; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function step() {
    var asleep = !doze.classList.contains('on');
    set(asleep);
    timer = setTimeout(step, 1000 * (asleep ? rand(3, 8) : rand(2, 5)));
  }
  function setAuto(on) {
    auto = on; autoBtn.classList.toggle('sel', on); clearTimeout(timer);
    if (on) timer = setTimeout(step, 1500);
  }
  autoBtn.addEventListener('click', function () { setAuto(!auto); });
  document.getElementById('toggle').addEventListener('click', function () { setAuto(false); set(!doze.classList.contains('on')); });
  document.getElementById('zoom').addEventListener('click', function (e) {
    var lady = document.getElementById('lady'); lady.classList.toggle('close');
    e.target.textContent = lady.classList.contains('close') ? 'Whole' : 'Close';
  });
  // Listen: wake into the listening face and hold it three seconds, the view easing in, then back to awake.
  var listen = document.getElementById('listen'), lady = document.getElementById('lady'), listenTimer = null;
  function setListen(on) {
    listen.classList.toggle('on', on); lady.classList.toggle('lean', on);
    if (on) { doze.classList.remove('on'); stateEl.textContent = 'listening'; } else stateEl.textContent = 'awake';
  }
  document.getElementById('listenBtn').addEventListener('click', function () {
    setAuto(false); setListen(true); clearTimeout(listenTimer);
    listenTimer = setTimeout(function () { setListen(false); }, 3000);
  });
  // Right password: she listens two seconds, the view easing in, then is pleased for three, then awake.
  var pleased = document.getElementById('pleased');
  function setPleased(on) {
    pleased.classList.toggle('on', on);
    if (on) { setListen(false); doze.classList.remove('on'); stateEl.textContent = 'pleased'; } else stateEl.textContent = 'awake';
  }
  document.getElementById('rightBtn').addEventListener('click', function () {
    setAuto(false); clearTimeout(listenTimer); setBrow(false); setPleased(false); setListen(true);
    listenTimer = setTimeout(function () {
      setPleased(true);
      listenTimer = setTimeout(function () { setPleased(false); }, 3000);
    }, 2000);
  });
  // Last week's: she listens two seconds, then one brow goes up, fondly amused, for three, then awake.
  var brow = document.getElementById('brow');
  function setBrow(on) {
    brow.classList.toggle('on', on);
    if (on) { setListen(false); doze.classList.remove('on'); stateEl.textContent = "last week's"; } else stateEl.textContent = 'awake';
  }
  document.getElementById('lastBtn').addEventListener('click', function () {
    setAuto(false); clearTimeout(listenTimer); setPleased(false); setBrow(false); setListen(true);
    listenTimer = setTimeout(function () {
      setBrow(true);
      listenTimer = setTimeout(function () { setBrow(false); }, 3000);
    }, 2000);
  });
  // Can't hear: the hand rises from her lap through the halfway pose to her ear, the listening face with it,
  // holds three seconds, and comes back down the same way.
  var reach = document.getElementById('reach'), ear = document.getElementById('ear'), armTimers = [];
  function at(ms, f) { armTimers.push(setTimeout(f, ms)); }
  function setArm(state) {   // 'lap', 'reach' or 'ear'
    reach.classList.toggle('on', state === 'reach'); ear.classList.toggle('on', state === 'ear');
  }
  function askAgain(t) {   // one ask, starting t ms from now, 3.8 s long
    at(t, function () { setArm('reach'); setListen(true); stateEl.textContent = 'asking again'; });
    at(t + 400, function () { setArm('ear'); });
    at(t + 3400, function () { setArm('reach'); });
    at(t + 3800, function () { setArm('lap'); setListen(false); });
  }
  var sigh = document.getElementById('sigh');
  function reset() {
    setAuto(false); clearTimeout(listenTimer); armTimers.forEach(clearTimeout); armTimers = [];
    setPleased(false); setBrow(false); sigh.classList.remove('on'); doze.classList.remove('on');
  }
  document.getElementById('earBtn').addEventListener('click', function () { reset(); askAgain(0); });
  // Giving in: she asks twice with her hand to her ear, then sighs fondly for three seconds and lets him in.
  document.getElementById('giveBtn').addEventListener('click', function () {
    reset(); askAgain(0); askAgain(4400);
    at(8600, function () { sigh.classList.add('on'); stateEl.textContent = 'giving in'; });
    at(11600, function () { sigh.classList.remove('on'); stateEl.textContent = 'awake'; });
  });
  window.ladyTest = { setArm: setArm, setListen: setListen, setPleased: setPleased, setBrow: setBrow, set: set, setAuto: setAuto, zoom: function (on) { document.getElementById('lady').classList.toggle('close', on); } };
  setAuto(true);
})();
</script>
</body>
</html>
