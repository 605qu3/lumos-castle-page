<!DOCTYPE html>

<title>Mobiliarbus, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #110d0b; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  #line { position: fixed; left: 50%; transform: translateX(-50%); top: max(12px, env(safe-area-inset-top));
    width: min(92vw, 600px); box-sizing: border-box; text-align: center; padding: 10px 14px;
    font: 17px/1.35 Georgia, 'Times New Roman', serif; color: #eadcbf; background: #1e1611;
    border: 1px solid #4a3a2c; border-radius: 6px; pointer-events: none; }
  #line b { color: #f3d27a; }
  #panel { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex;
    flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 8px; }

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line"></div>
<div id="panel"></div>
<script src="spells.js?v=34"></script>
<script>
/* Mobiliarbus, a test page for the Charms lane (12 October 2026, ninth session; the owner is Godric). Drawn in code.
   The book (PoA 10, checked in the text): in the Three Broomsticks, with the teachers and the Minister coming in out of
   the snow, Hermione whispers "Mobiliarbus!" and the Christmas tree beside their table "rose a few inches off the
   ground, drifted sideways and landed with a soft thump right in front of their table, hiding them from view". The
   book gives no motion, so the stroke is ours, for the geometry (way 1, a translation): the floor seen from above as a
   grid of flagstones, the things standing on their squares like pieces on a board; he touches the tree and draws one
   straight line to where it should go; it rises a few inches, drifts along the line and lands on the nearest square
   with a soft thump; then the move is drawn as an arrow with its two legs counted, "3 right", "1 down". Three rounds:
   a move told in words along one line, a move told in words on a slant (two legs), and the book's own, hiding the
   table from the door, where he finds the move himself; a wrong move still moves the tree, and the line says what is
   left, so the moves add up; at the end all three are summed, start to finish. Judged by LumosSpells.judgeSlide.
   Both ways (Q6, 6.3, Godric, 13 October 2026, 7.11 am): one slanted line, or an L along the squares, across then
   up or down, whose two legs join into one arrow; his legs are drawn in his order. The lift and the thump frame the
   arrow (his t1): it grows from the tree as it rises a few inches and is whole at the soft thump. Hermione whispered
   it (his t2), so the hiding round asks for a whisper and praises one: "Quietly done. Fudge never noticed."
   Two moves add up (8.1, thirty-first session, 13 October 2026): a round before the hiding tells two moves, each its
   own slide; landed, his arrows stay end to end, numbered, and the one arrow from where the round began is their sum
   (LumosSpells.addMoves: the rights and lefts added with their signs, the ups and downs the same); the other order,
   dashed through its own middle square, lands on the same square. A wrong slide is never wasted: from there, what is
   left adds up to the move he wanted. In any round, a wrong slide's arrow stays and the round ends on the sum.
   ?ease= for trying; window.lumosMobiliarbus for checks. */
(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), lineEl = document.getElementById('line'), panel = document.getElementById('panel');
  var W = 0, H = 0, DPR = 1, audio = null, qs = new URLSearchParams(location.search);
  var EASES = ['kind', 'fair', 'strict'], ease = EASES.indexOf(qs.get('ease')) >= 0 ? qs.get('ease') : 'kind';
  /* the room, in squares: portrait and landscape keep the same story on a board that fits */
  var LAYOUTS = {
    tall: { cols: 6, rows: 8, door: 4, table: [4, 6], stools: [[3, 6], [5, 6], [4, 7]], tree: [1, 3],
      rounds: [{ move: [3, 0] }, { move: [-1, -3] }, { two: [[2, 1], [-3, 1]] }, { hide: true }] },
    wide: { cols: 9, rows: 6, door: 6, table: [6, 4], stools: [[5, 4], [7, 4], [6, 5]], tree: [1, 2],
      rounds: [{ move: [3, 0] }, { move: [-1, -2] }, { two: [[2, 1], [-3, 1]] }, { hide: true }] } };
  var Lo = null, cell = 40, gx = 0, gy = 0, round = 0, pos = null, startPos = null, target = null, moves = [], roundMoves = [];
  var stroke = null, active = null, trail = null, anim = null, arrow = null, bump = null, dust = null, doorOpen = 0, done = false, last = null, wait = null;
  var kept = [], ghost = null, roundStart = null;   /* this round's moves end to end, the other order, where the round began */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var lo = W > H ? LAYOUTS.wide : LAYOUTS.tall;
    if (lo !== Lo) { Lo = lo; if (pos) start(); }
    var top = Math.max(110, H * 0.17), bottom = Math.max(70, H * 0.1);
    cell = Math.floor(Math.min((W - 24) / Lo.cols, (H - top - bottom - 30) / (Lo.rows + 0.6)));
    gx = Math.round((W - cell * Lo.cols) / 2); gy = Math.round(H - bottom - cell * Lo.rows);   /* down by the buttons, the line box free above */
  }
  function centre(sq) { return { x: gx + (sq[0] + 0.5) * cell, y: gy + (sq[1] + 0.5) * cell }; }
  function say(html) { lineEl.innerHTML = html; }
  function ensureAudio() { if (audio) { if (audio.state === 'suspended') audio.resume(); return; } var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
  function noise(dur, freq, gain) {
    if (!audio) return;
    var n = Math.floor(audio.sampleRate * dur), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    var src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(audio.destination); src.start();

  /* "3 right and 1 down", "2 left", "no squares" */
  function words(dx, dy) {
    var a = [];
    if (dx) a.push(Math.abs(dx) + ' ' + (dx > 0 ? 'right' : 'left'));
    if (dy) a.push(Math.abs(dy) + ' ' + (dy > 0 ? 'down' : 'up'));
    return a.length ? a.join(' and ') : 'no squares';
  }
  function sq(n) { return n === 1 ? 'square' : 'squares'; }
  function told(m) {
    var x = m[0], y = m[1], a = [];
    if (x) a.push('<b>' + Math.abs(x) + ' ' + sq(Math.abs(x)) + ' ' + (x > 0 ? 'right' : 'left') + '</b>');
    if (y) a.push('<b>' + Math.abs(y) + ' ' + sq(Math.abs(y)) + ' ' + (y > 0 ? 'down' : 'up') + '</b>');
    return a.join(' and ');
  }
  function menu() {
    panel.innerHTML = '';
    var a = document.createElement('button'); a.textContent = 'Again'; a.onclick = function () { ensureAudio(); start(); }; panel.appendChild(a);
    var e = document.createElement('button'); e.textContent = 'Ease: ' + ease;
    e.onclick = function () { ease = EASES[(EASES.indexOf(ease) + 1) % 3]; menu(); }; panel.appendChild(e);
  }
  function start() {
    clearTimeout(wait); wait = null; pos = Lo.tree.slice(); startPos = pos.slice(); round = 0; moves = []; stroke = null; trail = null; anim = null; arrow = null; bump = null; dust = null;
    doorOpen = 0; done = false; last = null; menu(); begin();
  }
  function begin() {
    var R = Lo.rounds[round]; roundMoves = []; kept = []; ghost = null; roundStart = pos.slice();
    if (R.two) {   /* two moves add up: told as two, each its own slide */
      target = [pos[0] + R.two[0][0] + R.two[1][0], pos[1] + R.two[0][1] + R.two[1][1]];
      say('Two moves this time: first ' + told(R.two[0]) + ', then ' + told(R.two[1]) + '. Each its own slide. Watch what they add up to. <i>Mobiliarbus!</i>');
    } else if (R.hide) {
      target = [Lo.table[0], Lo.table[1] - 1]; doorOpen = performance.now();
      say('The door swings open: in come Professor McGonagall, Professor Flitwick, Hagrid and the Minister for Magic! Quick, and quietly: <b>slide the tree right in front of your table</b>, between it and the door. Whisper it: <i>Mobiliarbus!</i>');
    } else {
      target = [pos[0] + R.move[0], pos[1] + R.move[1]];
      say((round ? 'Now slide it ' : 'The Christmas tree in the Three Broomsticks. Touch it and draw one straight line to where it should go. Slide it ') + told(R.move) + '.' +
        (R.move[0] && R.move[1] ? ' One slanted line, or two legs along the squares: across, then up or down.' : '') + ' <i>Mobiliarbus!</i>');
    }
  }
  function blockedAt(s) {
    if (s[0] < 0 || s[1] < 0 || s[0] >= Lo.cols || s[1] >= Lo.rows) return 'the wall';
    if (s[0] === Lo.table[0] && s[1] === Lo.table[1]) return 'the table';
    for (var i = 0; i < Lo.stools.length; i++) if (s[0] === Lo.stools[i][0] && s[1] === Lo.stools[i][1]) return 'a stool';
    return null;
  }
  var WHY = {
    off: 'Start on the tree: touch it, then draw straight to where it should go.',
    wiggly: 'It lifts, wobbles and settles back. One straight line from the tree to its new square, or two straight legs along the squares.',
    short: 'It lifts a few inches and lands where it was. Draw all the way to the new square.',
    between: 'It hovers between two squares and settles back. End your line in the middle of a square.' };
  function cast(pts) {
    var j = LumosSpells.judgeSlide(pts, centre(pos), cell, ease);
    last = j;
    if (j.reason === 'tap') return j;
    if (j.verdict !== 'slide') { bump = { at: performance.now(), dir: [0, 0] }; noise(0.08, 300, 0.3); say(WHY[j.reason]); return j; }
    var to = [pos[0] + j.dx, pos[1] + j.dy], b = blockedAt(to);
    if (b) {
      bump = { at: performance.now(), dir: [Math.sign(j.dx) * 0.25, Math.sign(j.dy) * 0.25] }; noise(0.15, 180, 0.5);
      say('It drifts toward ' + b + ', bumps it, and lands back where it was. (' + words(j.dx, j.dy) + ' would put it on ' + b + '.)');
      return j;
    }
    LumosSpells.learn('mobiliarbus');
    if (arrow && roundMoves.length && !arrow.sum) kept.push({ from: arrow.from, to: arrow.to });   /* his last move stays, end to end */
    anim = { at: performance.now(), from: pos.slice(), to: to, dx: j.dx, dy: j.dy, ell: j.shape === 'L', acrossFirst: j.shape !== 'L' || j.legs[0][0] !== 0 };
    arrow = { from: pos.slice(), to: to, at: performance.now(), ell: anim.ell, acrossFirst: anim.acrossFirst, grow: true };   /* framed by the lift and the thump */
    noise(0.25, 700, 0.12);
    return j;
  }
  function landed(a) {
    pos = a.to; noise(0.18, 110, 0.7); dust = { at: performance.now(), sq: pos.slice() };
    moves.push([a.dx, a.dy]); roundMoves.push([a.dx, a.dy]);
    arrow = { from: a.from, to: a.to, at: arrow && arrow.grow ? arrow.at : performance.now(), ell: a.ell, acrossFirst: a.acrossFirst };
    var left = [target[0] - pos[0], target[1] - pos[1]], R = Lo.rounds[round];
    if (!left[0] && !left[1]) {
      var line = 'A soft thump. ' + (a.ell ? 'Your two legs, <b>' + words(a.acrossFirst ? a.dx : 0, a.acrossFirst ? 0 : a.dy) + '</b> then <b>' +
        words(a.acrossFirst ? 0 : a.dx, a.acrossFirst ? a.dy : 0) + '</b>, join into one slide, ' : '') + '<b>' + words(a.dx, a.dy) + '</b>' + (roundMoves.length > 1 ? ', and altogether this round <b>' + words(sum(roundMoves)[0], sum(roundMoves)[1]) + '</b>' : '') + ': just as it should.';
      if (R.hide) {
        done = true; kept = []; ghost = null; var tot = [pos[0] - startPos[0], pos[1] - startPos[1]];
        arrow = { from: startPos, to: pos.slice(), at: performance.now(), total: true };
        say('Hidden! Quietly done. Fudge never noticed. The tree landed with a soft thump right in front of your table; through its branches, four pairs of feet go by. ' +
          'All its moves together: from where it began, <b>' + words(tot[0], tot[1]) + '</b>.');
        return;
      }
      var many = R.two || roundMoves.length > 1;
      if (many) { var added = addedUp(R); if (R.two) line = added; }
      say(line); round++; wait = setTimeout(function () { wait = null; if (!done && round < Lo.rounds.length && !anim) begin(); }, many ? 6500 : 2600);
      return;
    }
    if (R.two && roundMoves.length === 1 && same(roundMoves[0], R.two[0])) { say('A soft thump: <b>' + words(a.dx, a.dy) + '</b>, the first move. Now the second: ' + told(R.two[1]) + '.'); return; }
    say('A soft thump: that was <b>' + words(a.dx, a.dy) + '</b>. ' + (R.hide ? 'Not hidden yet: the door can still see your table. ' : R.two ? 'Not the move the words said, but never wasted. ' : 'The words said ' + words(R.move[0], R.move[1]) + '. ') +
      'From here, <b>' + words(left[0], left[1]) + '</b> to go.');
  }
  function same(p, q) { return p[0] === q[0] && p[1] === q[1]; }
  /* "2 right and 3 left make 1 left": one axis of the moves added with their signs */
  function addUp(list, key) {
    var parts = list.map(function (m) { return m[key]; }).filter(function (v) { return v; }), tot = parts.reduce(function (p, v) { return p + v; }, 0);
    function nm(v) { return Math.abs(v) + ' ' + (key ? (v > 0 ? 'down' : 'up') : (v > 0 ? 'right' : 'left')); }
    if (!parts.length) return '';
    if (parts.length === 1) return '<b>' + nm(tot) + '</b>';
    return parts.map(nm).join(' and ') + ' make <b>' + (tot ? nm(tot) : 'none') + '</b>';
  }
  /* the round landed after more than one move, or the two-move round: his arrows kept end to end, the sum arrow from
     where the round began, the other order dashed through its middle square when that square is free */
  function addedUp(R) {
    var A = LumosSpells.addMoves(roundMoves), n = roundMoves.length, mid = null, now = performance.now();
    if (arrow && n > 1) kept.push({ from: arrow.from, to: arrow.to });
    arrow = { from: roundStart.slice(), to: pos.slice(), at: now, sum: true };
    if (n === 2) mid = [roundStart[0] + A.swapped[0], roundStart[1] + A.swapped[1]];
    else if (n === 1 && R.two) mid = [roundStart[0] + R.two[0][0], roundStart[1] + R.two[0][1]];
    ghost = mid && !blockedAt(mid) ? { from: roundStart.slice(), mid: mid, to: pos.slice(), at: now } : null;
    var list = n === 1 && R.two ? R.two : roundMoves, ax = addUp(list, 0), dn = addUp(list, 1), add = 'Added up: ' + ax + (ax && dn ? '; ' : '') + dn;
    if (n === 1) return 'A soft thump: one slide does both moves at once. ' + add + '.' + (ghost ? ' Dashed, the two moves the words told: the same square.' : '');
    return 'A soft thump. ' + (n === 2 ? 'Two moves' : 'All ' + n + ' moves') + ' end to end. ' + add + ': one slide from where it began.' +
      (ghost ? ' Dashed, the other way round: the same square.' : '') + (R.two && !same(roundMoves[0], R.two[0]) ? ' A wrong slide is never wasted.' : '');
  }
  function sum(list) { return list.reduce(function (s, m) { return [s[0] + m[0], s[1] + m[1]]; }, [0, 0]); }

  /* ---- drawing ---- */
  function drawRoom(now) {
    cx.fillStyle = '#1a1411'; cx.fillRect(0, 0, W, H);
    var top = gy - cell * 0.6;
    cx.fillStyle = '#3a2c22'; cx.fillRect(gx - 8, top, cell * Lo.cols + 16, cell * 0.6);   /* the far wall, seen from above */
    cx.fillStyle = '#2a1f18'; cx.fillRect(gx - 8, top, 8, cell * (Lo.rows + 0.6)); cx.fillRect(gx + cell * Lo.cols, top, 8, cell * (Lo.rows + 0.6));
    var r, c;
    for (r = 0; r < Lo.rows; r++) for (c = 0; c < Lo.cols; c++) {   /* the flagstones, one a square */
      var x = gx + c * cell, y = gy + r * cell, k = ((r * 7 + c * 13) % 5) / 5;
      cx.fillStyle = 'rgb(' + Math.round(88 + k * 14) + ',' + Math.round(76 + k * 12) + ',' + Math.round(64 + k * 10) + ')';
      cx.fillRect(x + 1.5, y + 1.5, cell - 3, cell - 3);
    }
    /* the door, in the far wall: it swings open for the teachers, the snow behind */
    var d = gx + Lo.door * cell, open = doorOpen ? Math.min(1, (now - doorOpen) / 600) : 0;
    cx.fillStyle = open ? '#dfe6ee' : '#1a120c'; cx.fillRect(d + cell * 0.12, top + 2, cell * 0.76, cell * 0.56);
    if (open) { cx.fillStyle = '#fff'; for (var i = 0; i < 6; i++) { cx.beginPath(); cx.arc(d + cell * (0.2 + ((i * 37 + now / 20) % 60) / 100), top + cell * (0.1 + ((i * 23 + now / 30) % 45) / 100), 1.5, 0, 7); cx.fill(); } }
    cx.save(); cx.translate(d + cell * 0.12, top + cell * 0.58); cx.rotate(-open * 1.3);
    cx.fillStyle = '#5a3a22'; cx.fillRect(0, -cell * 0.06, cell * 0.76, cell * 0.12); cx.restore();
    cx.fillStyle = '#c9b48a'; cx.font = 'italic ' + Math.round(cell * 0.2) + 'px Georgia, serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.textAlign = 'right'; cx.fillText('door', d + cell * 0.04, top + cell * 0.3); cx.textAlign = 'center';   /* in the wall beside it */
    /* their table, three tankards of Butterbeer, and the stools */
    Lo.stools.forEach(function (s) { var p = centre(s); cx.fillStyle = 'rgba(0,0,0,0.3)'; cx.beginPath(); cx.ellipse(p.x + 3, p.y + 4, cell * 0.28, cell * 0.24, 0, 0, 7); cx.fill();
      cx.fillStyle = '#6a4a2c'; cx.beginPath(); cx.arc(p.x, p.y, cell * 0.26, 0, 7); cx.fill(); cx.strokeStyle = '#3a2616'; cx.lineWidth = 2; cx.stroke(); });
    var t = centre(Lo.table);
    cx.fillStyle = 'rgba(0,0,0,0.35)'; cx.beginPath(); cx.arc(t.x + 4, t.y + 5, cell * 0.44, 0, 7); cx.fill();
    cx.fillStyle = '#7a5530'; cx.beginPath(); cx.arc(t.x, t.y, cell * 0.44, 0, 7); cx.fill(); cx.strokeStyle = '#3a2616'; cx.lineWidth = 2.5; cx.stroke();
    [[-0.16, -0.12], [0.16, -0.1], [0, 0.16]].forEach(function (o) { var x = t.x + o[0] * cell, y = t.y + o[1] * cell;
      cx.fillStyle = '#c99a4a'; cx.beginPath(); cx.arc(x, y, cell * 0.09, 0, 7); cx.fill(); cx.fillStyle = '#f2e6c8'; cx.beginPath(); cx.arc(x, y, cell * 0.055, 0, 7); cx.fill(); });
    cx.fillStyle = '#eadcbf'; cx.font = 'italic ' + Math.round(cell * 0.19) + 'px Georgia, serif'; cx.fillText('your table', t.x, t.y + cell * 0.62);
  }
  function drawTree(p, lift, now) {
    var s = cell * 1.25, base = p.y + cell * 0.36 - lift * cell * 0.22;   /* standing tall in its square */
    cx.fillStyle = 'rgba(0,0,0,' + (0.38 - lift * 0.18) + ')';   /* its shadow stays on the floor as it rises */
    cx.beginPath(); cx.ellipse(p.x + 3, p.y + cell * 0.38, s * (0.34 - lift * 0.06), s * (0.12 - lift * 0.02), 0, 0, 7); cx.fill();
    cx.fillStyle = '#7a4a2a'; cx.fillRect(p.x - s * 0.13, base - s * 0.04, s * 0.26, s * 0.12);   /* its pot */
    var tiers = [[0.38, 0.0], [0.3, -0.24], [0.21, -0.45]];
    tiers.forEach(function (q, i) {
      cx.fillStyle = i % 2 ? '#2f6a3c' : '#28583a';
      cx.beginPath(); cx.moveTo(p.x - s * q[0], base + q[1] * s - s * 0.02); cx.lineTo(p.x + s * q[0], base + q[1] * s - s * 0.02); cx.lineTo(p.x, base + q[1] * s - s * 0.36); cx.closePath(); cx.fill();
    });
    [[-0.18, -0.1, '#d9634a'], [0.16, -0.14, '#e8be5a'], [-0.06, -0.33, '#9fb6c9'], [0.1, -0.4, '#d9634a'], [-0.12, -0.5, '#e8be5a']].forEach(function (b) {
      cx.fillStyle = b[2]; cx.beginPath(); cx.arc(p.x + b[0] * s, base + b[1] * s, s * 0.045, 0, 7); cx.fill(); });
    cx.fillStyle = '#f3d27a'; cx.beginPath(); cx.arc(p.x, base - s * 0.8, s * 0.06 + Math.sin(now / 300) * s * 0.008, 0, 7); cx.fill();   /* the star */
  }
  /* his moves this round kept end to end, numbered, and the other order dashed: moves add up */
  function drawKept(now, numbers) {   /* the arrows under the sum, their numbers over it */
    if (!kept.length && !ghost) return;
    var fs = Math.round(Math.max(12, cell * 0.22));
    if (numbers) {
      var S = roundStart ? centre(roundStart) : null, P = centre(pos), mid = S ? { x: (S.x + P.x) / 2, y: (S.y + P.y) / 2 } : P;
      cx.save(); cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.globalAlpha = 0.95;
      kept.forEach(function (m, i) {
        var a = centre(m.from), b = centre(m.to), L = Math.hypot(b.x - a.x, b.y - a.y); if (L < 1) return;
        var nx = -(b.y - a.y) / L * fs * 0.95, ny = (b.x - a.x) / L * fs * 0.95, cxm = (a.x + b.x) / 2, cym = (a.y + b.y) / 2;
        var p1 = { x: cxm + nx, y: cym + ny }, p2 = { x: cxm - nx, y: cym - ny }, q = Math.hypot(p1.x - mid.x, p1.y - mid.y) >= Math.hypot(p2.x - mid.x, p2.y - mid.y) ? p1 : p2;   /* the side away from the sum */
        cx.fillStyle = '#1a1411'; cx.beginPath(); cx.arc(q.x, q.y, fs * 0.62, 0, 7); cx.fill(); cx.strokeStyle = '#c9a24e'; cx.lineWidth = 1.5; cx.stroke();
        cx.fillStyle = '#f3d27a'; cx.font = '600 ' + fs + 'px Georgia, serif'; cx.fillText(String(i + 1), q.x, q.y + 1);
      });

    }
    cx.save(); cx.lineCap = 'round'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
