<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spells in a room, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d0a; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #line { position: fixed; left: 50%; transform: translateX(-50%); top: max(12px, env(safe-area-inset-top));
    width: min(92vw, 560px); box-sizing: border-box; text-align: center; padding: 10px 14px;
    font: 17px/1.35 Georgia, 'Times New Roman', serif; color: #eadcbf; background: #1e1611;
    border: 1px solid #4a3a2c; border-radius: 6px; pointer-events: none; }
  #panel { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); display: flex;
    flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 10px; }
  button { font: 15px Georgia, serif; color: #eadcbf; background: #2a2019; border: 1px solid #5a4636; border-radius: 8px;
    padding: 9px 13px; touch-action: manipulation; }
  button.on { background: #e8be5a; color: #1a1411; border-color: #e8be5a; }
  button.go { background: #6b2a1a; border-color: #a0503a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line"></div>
<div id="panel"></div>
<script src="spells.js?v=40"></script>
<script src="guide.js?v=6"></script>
<script src="../castle-ear.js"></script>
<script>
/* A lock and a page of ink in a room, a test page for the Charms lane (12 October 2026, fifth session; the owner is
   Godric). It tries the two calls a room makes for req 146 (Magic for the boys, *Alohomora in the castle* and
   *Aparecium in the castle*): LumosSpells.openLock on Percy's drawer (req 143) and on the brass key's door, which
   answers "nothing" whatever the turn, and LumosSpells.revealInk on Wood's blank notice (req 144). Each waits for a
   boy who has learned the spell (LumosSpells.learned, set on alohomora-test.html and aparecium-test.html; the
   buttons here set it for trying). Drawn in code: the drawer, door and notice are stand-ins for the room's own, and
   what is inside the drawer and on the notice is the room's and Events' (req 145), only marked here.
   Since 12 October 2026 (sixth session, req 153, the Interaction lane's §9): LumosSpells.levitate on a feather on a
   table (the swish and flick, then his steer while it floats, then it settles; each miss moves it by its cause), and
   LumosSpells.measureSpan, Ollivander's tape, on a wand in its box (the painted wand is eleven inches; the tape says
   right, short or long) and on his own hand on the glass (real inches). The Cast button stands for his tap on the
   thing, and Step back for leaving the stop: the room calls cancel().
   Since 12 October 2026 (ninth session, req 163): LumosSpells.openHump on the one-eyed witch's hump, the call her
   landing makes (req 178, the Corridor's): offered only while he holds the twins' note (req 179; the button sets it
   for trying), a first tap does nothing, the word's card comes up, a tap on it says the word, and the next tap on the
   hump swings it open by itself, the protractor and the chord stopping it where the gap equals his width. The witch
   is a stand-in side on; the corridor draws its own and calls witchHump() on 'opened'.
   Since 13 October 2026 (twenty-sixth session, Q6's room callable): LumosSpells.moveThing on an armchair in a room seen
   from above, its floor in squares: a tap on the chair, the word's card (Mo-bi-li-ar-bus), then one stroke to its new
   square, a line or an L along the squares; the wall and the fireplace are in the way (it bumps and lands back), and
   once it has moved a silver Sickle glints where it stood (the spellbook's idea: slide the armchair and find what fell
   behind it). The room asks for 3 squares right; the traced guide draws that while he is new to it.
   Since 13 October 2026 (forty-first session, req 282, Magic for the boys' B18 to B20, Godric's picks of 5.20 pm):
   the broom cupboard, LumosSpells.openLock as Percy's drawer has it, swinging the door open on buckets, a mop and an
   old school broom leaning hard to the left with a luggage tag on its handle (the tag's words are Magic's, drawn
   later); a tap on the broom stands it up straight and it slowly leans left again (the corridor calls cupboardSwing()
   on 'opened'). A polite door, as in the shells in its polite week: Alohomora is openLock with stuck, so it never
   opens, and the door huffs, as the corridor's ("Well! Not so much as a please."); Say please listens once through
   the castle's ear (page/castle-ear.js, the Events lane's, its match() at its LOOSE), and with no ear in the browser
   (or ?ear=off) the tap stands for the word; please swings it a hand's width and warm light spills out. Percy's
   parchment, the swap in his drawer: LumosSpells.revealInk as Wood's notice, bringing up the twins' line; a tap on the
   sheet adds Mr George's (Godric's t1); Look away blanks it, and each Aparecium brings it back.
   window.lumosRoomSpells for checks. */
(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), lineEl = document.getElementById('line'), panel = document.getElementById('panel');
  var W = 0, H = 0, S = 1, DPR = 1;
  var THINGS = [
    { id: 'drawer', name: "Percy's drawer", spell: 'alohomora' },
    { id: 'door', name: "The brass key's door", spell: 'alohomora' },
    { id: 'notice', name: "Wood's notice", spell: 'aparecium' },
    { id: 'feather', name: 'A feather', spell: 'leviosa' },
    { id: 'wand', name: 'A wand in its box', spell: null },
    { id: 'hand', name: 'Your hand', spell: null },
    { id: 'hump', name: "The witch's hump", spell: null },
    { id: 'chair', name: 'The armchair', spell: 'mobiliarbus' },
    { id: 'cupboard', name: 'The broom cupboard', spell: 'alohomora' },
    { id: 'polite', name: 'A polite door', spell: 'alohomora' },
    { id: 'parchment', name: "Percy's parchment", spell: 'aparecium' } ];
  /* req 282: the cupboard's leaf (0 shut to 1 open) and its broom's lean (1 hard left, 0 upright); the polite door's
     hand's width; the parchment's ink and how many of the twins' lines are showing */
  var cup = { open: 0, target: 0, lean: 1, upAt: 0 }, polite = { open: 0, target: 0, ear: null }, parch = { ink: 0, lines: 0, at: 0 };
  var EAR = window.CastleEar && new URLSearchParams(location.search).get('ear') !== 'off' ? window.CastleEar : null;
  var FRED = 'Messrs Fred and George present their compliments to Percy, and beg him to keep his very important nose out of other people\u2019s parchment.';
  var GEORGE = 'Mr George agrees with Mr Fred, and would like to add that Percy\u2019s badge is on upside down.';
  /* the armchair's room, seen from above: whole squares of floor, the wall along the top with the fireplace in it */
  var chair = null, drift = null;
  function room() {
    var c = Math.round(S * 0.1), i0 = 1, i1 = Math.floor(W / c) - 1, j0 = Math.ceil(H * 0.2 / c), j1 = Math.floor(H * 0.64 / c);
    return { c: c, i0: i0, i1: i1, j0: j0, j1: j1, fire: [i1 - 3, i1 - 2], start: { i: i0 + 1, j: j0 + 1 } };
  }
  function sqMid(i, j) { var c = room().c; return { x: (i + 0.5) * c, y: (j + 0.5) * c }; }
  function inTheWay(dx, dy) {
    var R = room(), i = chair.i + dx, j = chair.j + dy;
    if (i < R.i0 || i >= R.i1 || j < R.j0 || j >= R.j1) return 'the wall';
    if (j === R.j0 && i >= R.fire[0] && i <= R.fire[1]) return 'the fireplace';
    return null;
  }
  var hump = { deg: 0 }, note = false;   /* the lid's angle, and whether he holds the twins' note (req 179) */
  function humpGeo() {
    var x = W / 2, y = H * 0.52, hinge = { x: x + S * 0.2, y: y }, edge = { x: x - S * 0.12, y: y - S * 0.12 };
    return { x: x, y: y, hinge: hinge, edge: edge, bulge: { x: x + S * 0.06, y: y - S * 0.4 }, floor: H * 0.78,
      spot: { x: x + S * 0.04, y: y - S * 0.12 }, r: Math.hypot(edge.x - hinge.x, edge.y - hinge.y) * 0.7 };
  }
  var feather = { x: 0, y: 0, phase: 'rest', mode: null, t0: 0, rot: 0 }, tape = null;
  function featherRest() { return { x: W * 0.5, y: H * 0.6 }; }
  function wandBox() { var w = Math.min(W * 0.82, S * 1.1), h = w * 0.16; return { x: W / 2 - w / 2, y: H * 0.45 - h / 2, w: w, h: h }; }
  function wandEnds() { var B = wandBox(); return [{ x: B.x + B.w * 0.08, y: B.y + B.h / 2 }, { x: B.x + B.w * 0.92, y: B.y + B.h / 2 }]; }
  function wandScale() { var e = wandEnds(); return 11 / (e[1].x - e[0].x); }   /* the painted wand is eleven inches */
  var cur = null, thing = 0, T = THINGS[0], asking = null, last = null, opened = { drawer: 0, notice: 0 }, rattle = null, shake = null;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight; S = Math.min(W, H);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  /* the spots a room would project */
  function drawerRect() { var w = Math.min(W * 0.8, S * 0.95), h = w * 0.28; return { x: W / 2 - w / 2, y: H * 0.5 - h / 2, w: w, h: h }; }
  function doorRect() { var h = H * 0.62, w = Math.min(W * 0.7, h * 0.55); return { x: W / 2 - w / 2, y: H * 0.17, w: w, h: h }; }
  function cupRect() {   /* kept above the buttons, which take half a phone's height, so the broom's foot and the buckets show */
    var y = Math.max(108, H * 0.15), h = Math.min(H * 0.6, (panel.getBoundingClientRect().top || H) - 14 - y), w = Math.min(W * 0.5, h * 0.4);
    return { x: W / 2 - w / 2, y: y, w: w, h: h }; }
  function broomAt() { var C = cupRect(), f = { x: C.x + C.w * 0.62, y: C.y + C.h * 0.98 }, a = -0.32 * cup.lean, L = C.h * 0.82;
    return { foot: f, top: { x: f.x + Math.sin(a) * L, y: f.y - Math.cos(a) * L } }; }
  function keyhole() {
    if (T.id === 'cupboard') { var C = cupRect(); return { x: C.x + C.w * 0.18, y: C.y + C.h * 0.52 }; }
    if (T.id === 'drawer') { var R = drawerRect(); return { x: R.x + R.w * 0.3, y: R.y + R.h * 0.55 }; }
    var D = doorRect(); return { x: D.x + D.w * 0.78, y: D.y + D.h * 0.55 };
  }
  function sheetRect() { var h = Math.min(H * 0.56, W * 1.1), w = h * 0.75; w = Math.min(w, W * 0.86); return { x: W / 2 - w / 2, y: H * 0.18, w: w, h: h }; }

  function say(t) { lineEl.innerHTML = t; }
  function btn(label, fn, cls) { var b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn;
    if (label === 'Step back') b.setAttribute('data-spell-exit', '');   /* leaving the stop: the spell's layer never covers it */
    return b; }
  function menu() {
    panel.innerHTML = '';
    THINGS.forEach(function (t, i) { panel.appendChild(btn(t.name, function () { choose(i); }, i === thing ? 'on' : '')); });
    var knows = !T.spell || LumosSpells.learned(T.spell), word = { alohomora: 'Alohomora', aparecium: 'Aparecium', leviosa: 'Leviosa', mobiliarbus: 'Mobiliarbus' }[T.spell];
    if (T.spell) panel.appendChild(btn('Knows ' + word + ': ' + (knows ? 'yes' : 'no'), function () {
      try { if (knows) localStorage.removeItem('lumos.spells.learned.' + T.spell); else LumosSpells.learn(T.spell); } catch (e) {}
      menu();
    }));
    panel.appendChild(btn('Cast', cast, 'go'));
    if (T.id === 'hump') panel.appendChild(btn("Holds the twins' note: " + (note ? 'yes' : 'no'), function () { note = !note; menu(); }));
    if (opened.drawer || opened.notice || hump.deg || cup.target || polite.target) panel.appendChild(btn('Shut it again', function () { opened = { drawer: 0, notice: 0 }; hump.deg = 0; cup.target = 0; polite.target = 0; say('Shut, and blank again.'); menu(); }));
    if (T.id === 'polite') panel.appendChild(btn('Say please', sayPlease));
    if (T.id === 'parchment' && parch.lines) panel.appendChild(btn('Look away', function () { parch.ink = 0; parch.lines = 0; say('You look away. When you look back, the parchment is blank again.'); menu(); }));
    if (T.id === 'chair' && chair && (chair.i !== room().start.i || chair.j !== room().start.j)) panel.appendChild(btn('Put it back', function () { chair = room().start; say('The armchair is back by the wall.'); menu(); }));
  }
  function choose(i) {
    if (asking) { var old = asking; asking = null; old.cancel(); }   /* its answer is dropped: a new thing is chosen */
    thing = i; T = THINGS[i]; menu(); tape = null;
    var r = featherRest(); feather = { x: r.x, y: r.y, phase: 'rest', mode: null, t0: 0, rot: 0 };
    if (T.id === 'feather') { say('A tawny owl feather, lying on the table.'); return; }
    if (T.id === 'wand') { say('A wand in its box, on the counter. How long is it?'); return; }
    if (T.id === 'hand') { say("Ollivander's tape, on the counter. How wide is your hand?"); return; }
    if (T.id === 'hump') { say('A statue of a humpbacked, one-eyed witch, on her plinth.'); return; }
    if (T.id === 'chair') { chair = chair || room().start; drift = null; say('A squashy armchair by the fire. Something rolled under it once.'); return; }
    if (T.id === 'cupboard') { say('A plain narrow door in the corridor, with a ring handle and a keyhole.'); return; }
    if (T.id === 'polite') { say('A door in the stone, older than the wall round it. It has no handle.'); return; }
    if (T.id === 'parchment') { say('In Percy&rsquo;s drawer, a sheet labelled in his hand: <i>Confiscated: suspicious blank parchment</i>. It is blank.'); return; }
    say(T.id === 'drawer' ? 'A drawer in the books table, with a small brass keyhole and a label: <i>CONFISCATED. Prefects only. P. Weasley</i>.'
      : T.id === 'door' ? 'A heavy door with a brass keyhole.' : 'A notice pinned to the board. It is blank.');
  }
  function cast() {
    if (asking) return;
    if (T.spell && !LumosSpells.learned(T.spell)) {
      if (T.id === 'feather') { feather.mode = 'twitch'; feather.t0 = performance.now(); say('It lies there. (Learn Wingardium Leviosa in Charms.)'); }
      else if (T.id === 'notice' || T.id === 'parchment') say('Still blank. A wizard who knows Aparecium might read it. (Learn it in Charms.)');
      else if (T.id === 'chair') { shake = performance.now(); say('You push. It does not budge. (Learn Mobiliarbus in Charms.)'); }
      else { rattle = performance.now(); say('It rattles. Locked. (Learn Alohomora in Charms.)'); }
      return;
    }
    if (T.id === 'hump' && !note) { shake = performance.now(); say('Cold stone. Nothing happens. (Find the twins\' note first: it gives the word.)'); return; }
    panel.innerHTML = ''; panel.appendChild(btn('Step back', function () { if (asking) asking.cancel(); }));
    if (T.id === 'chair') {
      say('Tap the armchair with your wand.');
      asking = LumosSpells.moveThing({ at: function () { return sqMid(chair.i, chair.j); }, cell: function () { return room().c; },
        reach: function () { return room().c * 0.6; }, want: { dx: 3, dy: 0 }, blocked: inTheWay,
        onTap: function () { say('Tap the word as you say it: <i>Mo-bi-li-ar-bus</i>.'); },
        onWord: function () { say('<i>Mobiliarbus...</i> Now draw from the chair to its new square: <b>3 right</b>. A straight line, or two legs along the squares.'); },
        onDrift: function (p) { drift = p; },
        onThump: function (o) { chair = { i: chair.i + o.dx, j: chair.j + o.dy }; drift = null; } });
    } else if (T.id === 'hump') {
      say('Tap her hump with your wand.');
      asking = LumosSpells.openHump({ hump: function () { return humpGeo().spot; }, r: function () { return humpGeo().r; },
        hinge: function () { return humpGeo().hinge; }, edge: function () { return humpGeo().edge; },
        onTap: function (n) { shake = performance.now();
          say(n === 1 ? 'Nothing happened. The twins\' note says: <i>tap it and say Dissendium</i>. Tap the word to whisper it.' : 'Nothing again. Tap the word first, then her hump.'); },
        onWord: function () { say('<i>Dissendium...</i> you whisper. Now tap her hump again.'); },
        onSwing: function (d) { hump.deg = d; },
        onStop: function (o) { say('It stops at <b>' + o.degrees + '\u00b0</b>: a gap of <b>' + o.gap + ' cm</b>, and you are <b>' + o.width + ' cm</b> across the shoulders. Just wide enough.'); } });
    } else if (T.id === 'feather') {
      say('Swish and flick. <i>Wing-gar-dium Levi-o-sa!</i>');
      asking = LumosSpells.levitate({ at: featherRest, size: S * 0.08,
        onSteer: function (p) { feather.x = p.x; feather.y = p.y; feather.phase = p.phase; },
        onSettle: function (p) { feather.x = p.x; feather.y = p.y; feather.phase = 'rest'; } });
      asking.settled.then(function (r) { if (r.at) say(r.cancelled ? 'You step back, and it drifts down where it was.' : 'It floats down and settles.'); });
    } else if (T.id === 'wand' || T.id === 'hand') {
      say(T.id === 'wand' ? 'Two fingers on the wand, one at each end; or tap one end, then the other.'
        : 'Spread your hand on the glass: thumb on one ring, little finger on the other.');
      asking = T.id === 'wand' ? LumosSpells.measureSpan({ ends: wandEnds, scale: wandScale(), want: 11 })
        : LumosSpells.measureSpan({ at: function () { return { x: W / 2, y: H * 0.5 }; } });
    } else if (T.id === 'notice' || T.id === 'parchment') {
      say('Three taps on the ' + (T.id === 'notice' ? 'notice' : 'parchment') + ': in a line, the middle one halfway, at an even beat. <i>Aparecium!</i>');
      asking = LumosSpells.revealInk({ sheet: sheetRect });
    } else {
      say('Tap the lock with your wand.');
      asking = LumosSpells.openLock({ at: keyhole, r: S * 0.11, turn: 0.25, dir: 1, stuck: T.id === 'door' || T.id === 'polite',
        onTap: function () { say('Now turn it, as a key turns: <b>a quarter turn, clockwise</b>, twelve to three. Whisper it: <i>Alohomora</i>.'); } });
    }
    var mine = asking; cur = mine;
    if (mine.settled) mine.settled.then(function () { if (cur === mine) cur = null; menu(); });
    mine.done.then(function (r) {
      if (asking !== mine) return;
      asking = null; last = r;
      if (r.pts && r.pts.length === 2) tape = { a: r.pts[0], b: r.pts[1] };
      if (T.id === 'feather') {
        if (r.verdict === 'lifted') { say('<b>Wingardium Leviosa!</b> It rises. Drag a finger anywhere to steer it.'); panel.innerHTML = ''; panel.appendChild(btn('Step back', function () { if (cur) cur.cancel(); })); return; }
        if (r.verdict === 'missed') { var c = r.cause; feather.mode = c === 'windmill' ? 'spin' : c === 'flickaside' ? 'scoot' : (c === 'slow' || c === 'flicklong') ? 'hop' : (c === 'wave' || c === 'line') ? 'flop' : c === 'prod' ? 'smoke' : 'twitch';
          feather.dir = r.judge && r.judge.flickAngle < 0 ? -1 : 1; feather.t0 = performance.now(); say('<b>' + r.why[0] + '.</b> ' + r.why[1]); }
        else say('You step back; it stays where it lies.');
        menu(); return;
      }
      if (T.id === 'wand' || T.id === 'hand') {
        var inch = r.inches == null ? '' : String(r.inches).replace('.25', '¼').replace('.5', '½').replace('.75', '¾');
        if (r.verdict === 'right') say('<b>About ' + inch + ' inches.</b> Eleven inches, just as Ollivander wrote on the box.');
        else if (r.verdict === 'short' || r.verdict === 'long') say('About ' + inch + ' inches: a little ' + r.verdict + '. The gold mark is eleven inches. One finger at each very end.');
        else if (r.verdict === 'measured') say('<b>About ' + inch + ' inches</b> from thumb to little finger.');
        else if (r.verdict === 'missed') say('<b>' + r.why[0] + '.</b> ' + r.why[1]);
        else say('You step back; the tape rolls itself up.');
        menu(); return;
      }
      if (T.id === 'chair') {
        drift = null;
        var R0 = room().start, gone = chair.i !== R0.i || chair.j !== R0.j;
        if (r.verdict === 'moved') say('<b>Mobiliarbus!</b> It rises a few inches, drifts ' + LumosSpells.slideWords(r.dx, r.dy) + (r.shape === 'L' ? ' (an L)' : '') + ' and lands with a soft thump.'
          + (r.right === false ? ' Not quite the 3 right the room wanted.' : '') + (gone ? ' Something glints where it stood: a silver Sickle.' : ''));
        else if (r.verdict === 'blocked' || r.verdict === 'missed') { shake = performance.now(); say('<b>' + r.why[0] + '.</b> ' + r.why[1]); }
        else say('You step back; it stays where it is.');
        menu(); return;
      }
      if (T.id === 'hump') {
        if (r.verdict === 'opened') say('<b>Dissendium!</b> Open at ' + r.degrees + '\u00b0, a gap of ' + r.gap + ' cm: wide enough for you.' + (r.first ? ' (Her first time open: the corridor tells the castle, witchHump().)' : ''));
        else { hump.deg = 0; say('You step back; she stays shut.'); }
        menu(); return;
      }
      if (r.verdict === 'opened' && T.id === 'cupboard') { cup.target = 1; say('<b>Alohomora!</b> The door swings open on buckets, a mop and an old school broom, leaning hard to the left, a luggage tag on its handle. Tap the broom.'); }
      else if (r.verdict === 'opened') { opened.drawer = 0.01; say('<b>Alohomora!</b> The drawer slides open.'); }
      else if (r.verdict === 'nothing' && T.id === 'polite') { shake = performance.now(); say('<i>A sniff, and a creak of offended wood.</i> &ldquo;Well! Not so much as a <b>please</b>.&rdquo;'); }
      else if (r.verdict === 'revealed' && T.id === 'parchment') { parch.ink = 0.01; parch.lines = 1; parch.at = performance.now(); say('<b>Aparecium!</b> Ink rises out of the blank sheet, in a hand you know. Tap the parchment.'); }
      else if (r.verdict === 'nothing') { shake = performance.now(); say('You tapped it, you whispered <i>Alohomora</i>... but nothing happened. This one wants its own key.'); }
      else if (r.verdict === 'tight') { shake = performance.now(); say('Click: the lock tightened. That way locks it. Clockwise, twelve to three.'); }
      else if (r.verdict === 'revealed') { opened.notice = 0.01; say('<b>Aparecium!</b> The ink comes back.'); }
      else if (r.verdict === 'missed') say(T.id === 'notice' ? 'The ink stays hidden. Three taps in a line, the middle one halfway, tap ... tap ... tap.' : 'Not quite. Round the keyhole, a quarter turn, twelve to three.');
      else say('You step back; it stays as it was.');
      menu();
    });
  }

  /* the polite door's please: one listen through the castle's ear, or the tap standing for the word */
  function heard(text) { var E = window.CastleEar; return !!E && E.match(text, 'please') >= E.LOOSE; }

    judge: function (pts) { return asking && asking.judge ? asking.judge(pts) : null; },
    taps: function (list) { return asking && asking.taps ? asking.taps(list) : null; },
    word: function () { return asking && asking.say ? asking.say() : null; },
    note: function (v) { note = !!v; menu(); },
    chair: function () { var R = room(); return { at: chair, start: R.start, c: R.c, i0: R.i0, i1: R.i1, j0: R.j0, j1: R.j1, fire: R.fire, drift: drift, offer: asking && asking.state ? asking.state() : null }; }, hump: function () { return { deg: Math.round(hump.deg * 10) / 10, note: note, offer: asking && asking.state ? asking.state() : null }; },
    steer: function (dx, dy) { return cur && cur.steer ? cur.steer(dx, dy) : null; },
    measure: function (a, b) { return asking && asking.measure ? asking.measure(a, b) : null; },
    stepBack: function () { if (cur) cur.cancel(); else if (asking) asking.cancel(); },

    wandEnds: wandEnds, rest: featherRest,

    polite: function () { return { open: Math.round(polite.open * 100) / 100, target: polite.target, ear: !!EAR }; },
    parchment: function () { return { ink: Math.round(parch.ink * 100) / 100, lines: parch.lines }; },
    heard: heard, line: function () { return lineEl.textContent; } };
})();
