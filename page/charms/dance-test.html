<title>The pineapple's tap dance, a test</title>
<style>

<body>
<canvas id="c"></canvas>
<div id="line"></div>
<div id="panel"></div>
<script src="spells.js?v=38"></script>
<script src="guide.js?v=6"></script>
<script>
/* The pineapple's tap dance, a test page for the Charms lane (13 October 2026, nineteenth session; the owner is Godric).
   Drawn in code (Rework 16, 16 October 2026: no exam sat; the third round is a practice before a chalked "Practical,
   Thursday", Flitwick on his pile of books, PS 8; the book below is the source only). The book (PS 16, checked in the text): in the practical exams "Professor Flitwick called them one by
   one into his class to see if they could make a pineapple tapdance across a desk." No word and no motion in the book;
   the taps are ours, for the geometry: equal steps across a length, the desk split into equal parts. The pineapple
   stands at one end of a long Charms desk; he taps where it lands, step by step, to the far end, judged after every
   tap by LumosSpells.judgePineapple on the tally's own layout (checks/dance-tally.js: the desktop at 0.62 of the
   height, from 0.14 to 0.86 of the width, the exam's longer desk 0.08 to 0.92, the band a twentieth of the short side,
   16 px at least). It hops to each tap at once. When the steps are equal it dances the whole way again at his own
   timing (an uneven beat shows as a stumble, never a miss), and the geometry is drawn: each step bracketed under the
   desk with its share, 1/4 for a quarter. Uneven, and the equal landings show dashed above his, the odd step named.
   Three rounds: Flitwick's lesson (four steps, the guide's four rings), Your own count (no guide, three to eight) and
   The exam (Flitwick calls the number). ?round=1..4, ?want= (the exam's number), ?ease= for trying; window.lumosDance
   for checks.
   A fourth round after the exam's full marks (twenty-second session), Flitwick's beat: speed as distance over time.
   A metronome counts three, then he taps a step on every tick (judged against the tick, the clock starting at the
   count): three steps at a tick a second, six at two a second (half the step, half the time: across in the same three
   seconds, the same speed), three at two a second (across in half the time, twice as fast). After each, a chart of
   how far against how long, one line a part: the first two lie together, the third twice as steep.
   Q9's fix 6 (thirty-ninth session, 13 October 2026; equal steps judged by eye were too hard; Q11, option 2, Godric,
   7.40 pm): every step, judged more kindly. LumosSpells.judgeSteps reads his taps as judgePineapple does, each step
   allowed to stray from their mean by 0.45, 0.35, 0.25 of it; after the dance the exactly equal steps are drawn, dashed,
   under his, and his step furthest out is ringed. His t1, woven: when his steps carry it too far the pineapple
   tap-dances off the end of the desk with a soft thump, and Flitwick, who stands on a pile of books to see over his desk
   (PS 8), peers over the edge at it. Flitwick's numbers are ours, not the book's, so no line quotes him with one. */
(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), lineEl = document.getElementById('line'), panel = document.getElementById('panel');
  var W = 0, H = 0, S = 1, DPR = 1, audio = null, qs = new URLSearchParams(location.search);
  var EASES = ['kind', 'fair', 'strict'], ease = EASES.indexOf(qs.get('ease')) >= 0 ? qs.get('ease') : 'kind';
  var SHARE = { 2: 'a half', 3: 'a third', 4: 'a quarter', 5: 'a fifth', 6: 'a sixth', 7: 'a seventh', 8: 'an eighth' };
  var WORD = { 2: 'two', 3: 'three', 4: 'four', 5: 'five', 6: 'six', 7: 'seven', 8: 'eight' };
  var ROUNDS = [
    { name: "Flitwick's lesson", want: 4,
      start: 'Flitwick: "A pineapple, a desk, and a little rhythm!" <b>Tap where it lands</b>, step by step, across to the far end: <b>four equal steps</b>.' },
    { name: 'Your own count', want: 0,
      start: '<b>No guide.</b> Any number of steps from three to eight, but every step the same length, all the way to the far end.' },
    { name: 'Practical, Thursday', want: 0,
      start: '' },
    { name: "Flitwick's beat", want: 0,
      start: '' } ];
  /* Flitwick's beat: three parts, n steps on a tick every ms */
  var PARTS = [
    { n: 3, ms: 1000, color: '#f3d27a', key: '3 steps, 1 tick a second',
      start: "Flitwick's beat. His metronome ticks slowly, <b>one tick a second</b>. He counts three; then <b>a step on every tick</b>, three equal steps across.",
      end: function (s) { return 'Three steps on three slow ticks: across in <b>' + s + ' seconds</b>. A third of the desk every second: that is its <b>speed</b>.'; } },
    { n: 6, ms: 500, color: '#9fc4ff', key: '6 steps, 2 ticks a second',
      start: 'Now the beat goes <b>twice as quick</b>, two ticks a second. Six equal steps, half as long, <b>one on every tick</b>.',
      end: function (s) { return 'Six short steps on the quick beat: across in <b>' + s + ' seconds</b> again. Half the step in half the time is <b>the same speed</b>: its line lies on the first.'; } },
    { n: 3, ms: 500, color: '#f0968c', key: '3 steps, 2 ticks a second',
      start: 'The quick beat again, but <b>big steps</b>: three equal steps, one on every tick.',
      end: function (s) { return 'Big steps on the quick beat: across in <b>' + s + ' seconds</b>, <b>twice as fast</b>. Its line is twice as steep: speed is how far, over how long.'; } } ];
  var round = Math.max(0, Math.min(3, (Number(qs.get('round')) || 1) - 1));
  var wantQ = Number(qs.get('want')) || 0, examWant = 5;
  var desk = null, P = 0, taps = [], wait = null, done = false, last = null, misses = 0;
  var pos = 0, hop = null, show = null, dance = null, fall = null, guides = [];
  var part = 0, clock = null, runs = [];   /* the beat round: its part, the metronome, the parts danced */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight; S = Math.min(W, H);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    place(); makeGuide();

  function place() {
    var m = round === 2 ? 0.08 : 0.14;
    desk = { a: W * m, b: W * (1 - m), y: H * 0.62, band: Math.max(16, S * 0.05) };

  }
  function want() { return round === 0 ? 4 : round === 2 ? examWant : round === 3 ? PARTS[part].n : 0; }
  function say(html) { lineEl.innerHTML = html; }
  function ensureAudio() { if (audio) { if (audio.state === 'suspended') audio.resume(); return; } var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
  function noise(dur, freq, gain) {
    if (!audio) return;
    var n = Math.floor(audio.sampleRate * dur), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    var src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();

    src.connect(f); f.connect(g); g.connect(audio.destination); src.start();

  function tapSound() { noise(0.05, 3200, 0.45); }   /* a tap shoe on wood */
  function tick(count) { noise(0.03, count ? 1500 : 2300, count ? 0.6 : 0.4); }   /* the metronome; his count deeper */

      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.12;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.55);
    });
  }

  /* the guide, in the first round only: four rings on the desktop, a quarter of it apart */
  function makeGuide() {
    guides = [];
    if (round !== 0) return;
    var gd = LumosGuide.create({ key: 'lumos.charms.danceGuidedHits', rest: 1.0, mirror: false, beatSecs: 0.5,
      box: function () { return { G: desk.b - desk.a, ox: desk.a, oy: desk.y }; },
      beats: [[0.25, 0], [0.5, 0], [0.75, 0], [1, 0]], beatLabels: ['1', '2', '3', '4'] });
    gd.build(W, H); guides = [gd];
  }

  function menu() {
    panel.innerHTML = '';
    ROUNDS.forEach(function (r, i) {
      var b = document.createElement('button'); b.textContent = r.name; if (i === round) b.className = 'on';
      b.onclick = function () { ensureAudio(); choose(i); }; panel.appendChild(b);
    });
    var e = document.createElement('button'); e.textContent = 'Ease: ' + ease;
    e.onclick = function () { ease = EASES[(EASES.indexOf(ease) + 1) % 3]; menu(); }; panel.appendChild(e);
    var g = document.createElement('button'); g.textContent = 'Guide';
    g.onclick = function () { guides.forEach(function (gd) { gd.reset(); }); }; panel.appendChild(g);
  }
  function choose(i) {
    if (wait) { clearTimeout(wait); wait = null; }
    round = i; last = null; taps = []; done = false; misses = 0; pos = 0; hop = null; show = null; dance = null; fall = null; clock = null;
    if (i === 2) { var pick = [3, 5, 6]; examWant = wantQ >= 3 && wantQ <= 8 ? wantQ : pick[Math.floor(Math.random() * pick.length)]; }
    place(); makeGuide(); menu();
    if (i === 3) { runs = []; startPart(0); return; }
    say(i === 2 ? 'A pineapple left on a Charms desk, and a chalked note: <i>Practical, Thursday</i>. Flitwick, on his pile of books, calls a number: <b>' + WORD[examWant] + ' equal steps</b> across the desk.' : ROUNDS[i].start);
  }
  function again(after) {   /* the pineapple trots back to its end and the taps clear */
    wait = setTimeout(function () { var now = performance.now(); wait = null; taps = []; show = null; fall = null; hopTo(0, now, 420);
      if (round === 3) startCount(now + 900); }, after);
  }
  /* the beat round: a part begins, then the metronome counts three and ticks on; t0 is his third count, so the first
     step belongs on the tick after it */
  function startPart(k) {
    var now = performance.now();
    part = k; taps = []; last = null; show = null; dance = null; fall = null; hopTo(0, now, 420);
    say(PARTS[k].start); startCount(now + 1800);
  }
  function startCount(at) { var ms = PARTS[part].ms; clock = { ms: ms, c0: at, t0: at + 2 * ms, tick: -1 }; }

  /* ---- the cast: taps, judged after each ---- */
  function hopTo(x, now, ms) { hop = { from: pos, to: x, at: now, ms: ms || 240 }; pos = x; }
  function tap(p) {
    if (wait || done || dance) return null;
    taps.push(p); guides.forEach(function (g) { g.cover(p); });
    return judge(performance.now(), true);
  }
  /* after every tap (fresh) and every frame while it waits, so a long pause ends the try short; the pineapple hops
     only on a fresh tap that lands it somewhere on the desk */
  function judge(now, fresh) {
    if (!taps.length && !clock) return null;
    var j = LumosSpells.judgeSteps(taps, desk, ease, want(), fresh ? undefined : now, clock ? { ms: clock.ms, t0: clock.t0 } : undefined);
    var p = taps[taps.length - 1] || { x: desk.a }, along = p.x - desk.a;
    if (j.reason === 'waiting') { if (fresh) { hopTo(along, now); tapSound(); } last = j; return j; }
    last = j;
    var ck = clock; clock = null;   /* the try is over: the metronome stops */
    var lv = guides.length ? guides[0].level() : 0;
    if (j.verdict !== 'danced') {
      guides.forEach(function (g) { g.miss(); }); misses++;
      var n = j.n, w = want();
      if (j.reason === 'past') {   /* too far: off the end, a soft thump, Flitwick peering over the edge */
        var edge = Math.min(along, desk.b - desk.a + S * 0.03 + P * 0.1);
        hopTo(edge, now); tapSound(); fall = { at: now + 240, x: edge }; setTimeout(function () { noise(0.3, 160, 0.35); }, 760); }
      else if (fresh && j.reason !== 'off' && j.reason !== 'back') { hopTo(along, now); tapSound(); }
      if (j.reason === 'uneven' || j.reason === 'count' || j.reason === 'leap') show = { j: j, at: now + 260, taps: taps.slice() };
      var words = {
        off: 'That one missed the desk! <b>Tap on the desktop</b>, where the pineapple can land.',
        back: 'Forwards each time, a real step: a pineapple cannot tap-dance backwards, or on the spot.',
        past: 'Too far: off the end of the desk, with a soft thump! Flitwick, on his pile of books, peers over the edge at it. <b>Land the last step on the far end</b>, not past it.',
        leap: 'That was a leap, not a dance. <b>At least three steps</b>, all the same length.',
        shuffle: 'Tiny shuffles! <b>Eight steps at most</b>: make each one longer.',
        short: 'It stopped part way, waiting for the next tap. <b>Keep tapping</b> all the way to the far end.',
        count: 'Flitwick asked for <b>' + (w ? WORD[w] : '') + '</b> steps; that was ' + (WORD[n] || n) + '. The dashed marks are where ' + (w ? WORD[w] : '') + ' equal steps land.',
        uneven: 'Step ' + (j.worst + 1) + ' was ' + (j.long ? 'too long' : 'too short') + '. <b>Every step the same length</b>: the dashed marks are where ' + (WORD[n] || n) + ' equal steps land.',
        beat: j.offbeat === 0 && !j.late ? 'Too soon! Let Flitwick count three, then <b>step on the next tick</b>.'
          : j.late && j.offbeat >= n ? 'A tick went by with no step. <b>Tap on every tick</b>, all the way across.'
          : 'Step ' + (j.offbeat + 1) + ' came <b>' + (j.late ? 'after' : 'before') + ' its tick</b>: tap just as the metronome ticks.'
      };
      say(words[j.reason] || 'Try again: equal steps, all the way across.');
      again(j.reason === 'past' ? 3400 : j.reason === 'uneven' || j.reason === 'count' ? 3600 : 1800);
      return j;
    }
    /* danced: the last hop, then the whole dance again at his own timing, then the geometry */
    hopTo(along, now); tapSound();
    guides.forEach(function (g) { g.hit(lv > 0); });
    LumosSpells.learn('pineapple'); chime();
    var gaps = [], k; for (k = 1; k < taps.length; k++) gaps.push(Math.max(260, Math.min(ck ? 1100 : 900, taps[k].t - taps[k - 1].t)));
    dance = { at: now + 900, gaps: gaps, lands: taps.map(function (q) { return q.x - desk.a; }), wobble: j.beat > 1.8, done: false, j: j };
    var n2 = j.n, wob = j.beat > 1.8 ? ' Your beat wobbled, so it stumbled a little, but the steps were what counted.' : '';
    say('<b>It dances!</b> ' + (WORD[n2] || n2) + ' equal steps across the desk' + (ck ? ', on the beat.' : '.'));
    if (ck) { var pk = part; runs[pk] = { time: j.time, pts: taps.map(function (q) { return [q.t - ck.t0, (q.x - desk.a) / (desk.b - desk.a)]; }) }; }
    var total = 900 + 300 + gaps.reduce(function (s, g) { return s + g; }, 0) + 500;
    wait = setTimeout(function () { wait = null; dance.done = true;
      if (round === 3) {   /* the beat round: the chart, then the next part or full marks */
        say(PARTS[part].end((j.time / 1000).toFixed(1)));
        if (part < PARTS.length - 1) wait = setTimeout(function () { wait = null; startPart(part + 1); }, 7000);
        else { done = true;
          wait = setTimeout(function () { wait = null; say('Speed is how far over how long. Slow ticks and big steps, or quick ticks and steps half as long: a third of the desk a second, the same. Big steps on the quick ticks: two thirds a second, twice as fast.'); }, 6000); }
        return;
      }
      say('The desk split into <b>' + (WORD[n2] || n2) + ' equal steps</b>: each one is <b>' + SHARE[n2] + '</b> of the desk, 1/' + n2 + '.' +
        (j.spread >= 0.05 ? ' Under yours, dashed, the exactly equal steps; your step furthest out is ringed.' : '') + wob);
      if (round === 2) { done = true;
        wait = setTimeout(function () { wait = null; say('Flitwick peers over the edge of his books and nods: ' + WORD[n2] + ' equal steps, all the way across.');
          wait = setTimeout(function () { wait = null; choose(3); }, 6000); }, 4200); }
      else wait = setTimeout(function () { wait = null; choose(round + 1); }, 6500);
    }, total);
    return j;
  }

  /* ---- the classroom, the desk, the pineapple ---- */
  function drawRoom() {
    var g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#221b15'); g.addColorStop(1, '#16110d');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.strokeStyle = 'rgba(255,255,255,0.035)'; cx.lineWidth = 1;
    for (var y = H * 0.09; y < desk.y; y += S * 0.09) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
    var top = S * 0.022, apron = S * 0.07, over = S * 0.03, x0 = desk.a - over, x1 = desk.b + over;
    cx.fillStyle = '#4a3220'; cx.fillRect(x0 + S * 0.02, desk.y + top, S * 0.035, H * 0.94 - desk.y - top);   /* legs */
    cx.fillRect(x1 - S * 0.055, desk.y + top, S * 0.035, H * 0.94 - desk.y - top);
    cx.fillStyle = '#5e4129'; cx.fillRect(x0, desk.y + top, x1 - x0, apron);   /* the apron, where the shares are drawn */
    cx.fillStyle = '#8a6038'; cx.fillRect(x0, desk.y - 1, x1 - x0, top);       /* the desktop */
    cx.fillStyle = 'rgba(255,230,190,0.12)'; cx.fillRect(x0, desk.y - 1, x1 - x0, 2);
  }
  function deskX(along) { return desk.a + along; }
  function drawPineapple(now) {
    var x = deskX(pos), lift = 0, tilt = 0;
    if (hop && now - hop.at < hop.ms) { var f = (now - hop.at) / hop.ms; x = deskX(hop.from + (hop.to - hop.from) * f); lift = Math.sin(Math.PI * f) * P * 0.55; tilt = Math.sin(Math.PI * f) * 0.15 * (hop.to >= hop.from ? 1 : -1); }
    if (dance && now >= dance.at) {   /* the dance again, at his own timing */
      var t = now - dance.at, k = 0, from = 0, at = 0, i;
      if (t < 300) { x = deskX(0); lift = 0; }
      else {
        t -= 300; at = 0; from = 0;
        for (i = 0; i < dance.lands.length; i++) {
          var g = i === 0 ? (dance.gaps[0] || 400) : dance.gaps[i - 1], ms = Math.min(240, g * 0.8);
          if (t < at + ms) { var f2 = (t - at) / ms; x = deskX(from + (dance.lands[i] - from) * f2); lift = Math.sin(Math.PI * f2) * P * 0.55;
            tilt = dance.wobble && i % 2 ? Math.sin(Math.PI * f2) * 0.4 : Math.sin(Math.PI * f2) * 0.15; k = -1; break; }
          if (t < at + g) { x = deskX(dance.lands[i]); if (!dance['t' + i]) { dance['t' + i] = 1; tapSound(); } k = -1; break; }
          from = dance.lands[i]; at += g;
        }
        if (k !== -1) x = deskX(dance.lands[dance.lands.length - 1]);
      }
    }
    var y = desk.y - lift, drop = 0;
    if (fall && now >= fall.at) { var ft = (now - fall.at) / 520; x = Math.min(deskX(fall.x) + Math.min(1, ft) * P * 0.6, W - P * 1.0);   /* on its side on the floor, still in sight */ drop = Math.min(1, ft) * Math.min(1, ft) * (Math.min(H * 0.94, panel.getBoundingClientRect().top - 4) - desk.y); tilt = Math.min(1, ft) * 1.6; }
    cx.save(); cx.translate(x, y + drop); cx.rotate(tilt);
    var rx = P * 0.3, ry = P * 0.38, cy = -P * 0.08 - ry;
    cx.fillStyle = '#16120e'; cx.beginPath(); cx.ellipse(-rx * 0.45, -P * 0.04, rx * 0.42, P * 0.06, 0, 0, 7); cx.ellipse(rx * 0.45, -P * 0.04, rx * 0.42, P * 0.06, 0, 0, 7); cx.fill();   /* tap shoes */
    cx.fillStyle = '#d9d2c2'; cx.fillRect(-rx * 0.5, -P * 0.1, P * 0.025, P * 0.02); cx.fillRect(rx * 0.4, -P * 0.1, P * 0.025, P * 0.02);
    cx.strokeStyle = '#7a5428'; cx.lineWidth = Math.max(1, P * 0.025);
    cx.beginPath(); cx.moveTo(-rx * 0.45, -P * 0.05); cx.lineTo(-rx * 0.3, cy + ry * 0.8); cx.moveTo(rx * 0.45, -P * 0.05); cx.lineTo(rx * 0.3, cy + ry * 0.8); cx.stroke();
    var grd = cx.createRadialGradient(-rx * 0.3, cy - ry * 0.3, rx * 0.2, 0, cy, ry * 1.1); grd.addColorStop(0, '#f0c25a'); grd.addColorStop(1, '#b07a22');
    cx.fillStyle = grd; cx.beginPath(); cx.ellipse(0, cy, rx, ry, 0, 0, 7); cx.fill();
    cx.save(); cx.clip(); cx.strokeStyle = 'rgba(110,70,20,0.55)'; cx.lineWidth = Math.max(1, P * 0.02);
    for (var d = -3; d <= 3; d++) { cx.beginPath(); cx.moveTo(-rx + d * rx * 0.5, cy - ry); cx.lineTo(rx + d * rx * 0.5, cy + ry); cx.stroke(); cx.beginPath(); cx.moveTo(rx - d * rx * 0.5, cy - ry); cx.lineTo(-rx - d * rx * 0.5, cy + ry); cx.stroke(); }
    cx.restore();
    cx.fillStyle = '#2f6b34';   /* the crown */
    [-0.9, -0.45, 0, 0.45, 0.9].forEach(function (a, i) {
      cx.save(); cx.translate(0, cy - ry * 0.9); cx.rotate(a * 0.55); cx.beginPath(); cx.moveTo(-P * 0.05, 0);
      cx.quadraticCurveTo(0, -P * (i === 2 ? 0.5 : 0.36), P * 0.05, 0); cx.closePath(); cx.fill(); cx.restore();
    });
    cx.fillStyle = '#2b1d10'; cx.beginPath(); cx.arc(-rx * 0.32, cy - ry * 0.12, P * 0.025, 0, 7); cx.arc(rx * 0.32, cy - ry * 0.12, P * 0.025, 0, 7); cx.fill();
    cx.strokeStyle = '#2b1d10'; cx.lineWidth = Math.max(1, P * 0.022); cx.beginPath(); cx.arc(0, cy + ry * 0.08, rx * 0.32, 0.2, Math.PI - 0.2); cx.stroke();
    cx.restore();
  }
  /* Flitwick behind the far end of the desk, head and shoulders over it (PS 8: "a tiny little wizard who had to stand on
     a pile of books to see over his desk"); when the pineapple goes off the end he leans over the edge and peers at it */
  function drawFlitwick(now) {
    var u = P, peer = fall && now >= fall.at + 520 ? Math.min(1, (now - fall.at - 520) / 450) : 0, hr = u * 0.14;
    cx.save(); cx.translate(desk.b + S * 0.015, desk.y - 1 - peer * u * 0.06); cx.rotate(0.55 * peer);
    cx.fillStyle = '#2a2440'; cx.beginPath(); cx.moveTo(-u * 0.16, 0); cx.lineTo(u * 0.16, 0); cx.lineTo(u * 0.11, -u * 0.23); cx.lineTo(-u * 0.11, -u * 0.23); cx.closePath(); cx.fill();
    cx.fillStyle = '#e2c4a0'; cx.beginPath(); cx.arc(0, -u * 0.36, hr, 0, 7); cx.fill();
    var lx = peer * hr * 0.25, ly = peer * hr * 0.3;
    cx.fillStyle = '#2b1d10'; cx.beginPath(); cx.arc(-hr * 0.35 + lx, -u * 0.37 + ly, hr * 0.13, 0, 7); cx.arc(hr * 0.35 + lx, -u * 0.37 + ly, hr * 0.13, 0, 7); cx.fill();
    cx.restore();
  }
  function label(x, y, text, color, size) {
    cx.save(); cx.font = 'italic ' + Math.round(size || Math.max(13, S * 0.034)) + 'px Georgia, serif'; cx.textAlign = 'center';
    cx.fillStyle = 'rgba(18,15,12,0.75)'; var w = cx.measureText(text).width;
    cx.fillRect(x - w / 2 - 4, y - (size || Math.max(13, S * 0.034)) * 0.85, w + 8, (size || Math.max(13, S * 0.034)) * 1.15);
    cx.fillStyle = color; cx.fillText(text, x, y); cx.restore();
  }
  function marks(now) {   /* where he tapped: a gold nick on the desktop for each landing */
    cx.save(); cx.strokeStyle = 'rgba(243,210,122,0.9)'; cx.lineWidth = 2;
    taps.forEach(function (q) { var x = Math.max(desk.a - S * 0.03, Math.min(desk.b + S * 0.03, q.x)); cx.beginPath(); cx.moveTo(x, desk.y - 4); cx.lineTo(x, desk.y + S * 0.03); cx.stroke(); });
    cx.restore();
  }
  function bracket(x0, x1, y, color, text) {
    var h = S * 0.014; cx.strokeStyle = color; cx.lineWidth = 2; cx.beginPath();
    cx.moveTo(x0 + 2, y - h); cx.lineTo(x0 + 2, y); cx.lineTo(x1 - 2, y); cx.lineTo(x1 - 2, y - h); cx.stroke();
    if (text) label((x0 + x1) / 2, y + Math.max(13, S * 0.034) * 1.15, text, color, Math.max(12, S * 0.03));
  }
  function drawGeometry(now) {
    var y = desk.y + S * 0.022 + S * 0.03;
    if (dance && dance.done) {   /* each step bracketed with its share */
      var n = dance.lands.length, from = 0;
      cx.save(); cx.globalAlpha = Math.min(1, (now - (dance.doneAt || (dance.doneAt = now))) / 400);
      dance.lands.forEach(function (l) { bracket(deskX(from), deskX(l), y, '#f3d27a', '1/' + n); from = l; });
      if (dance.j && dance.j.spread >= 0.05) {   /* the exactly equal steps under his, dashed, and his step furthest out ringed */
        var L = desk.b - desk.a, fs = Math.max(13, S * 0.034), y2 = y + fs * 2.2, k;
        cx.setLineDash([5, 4]); for (k = 0; k < n; k++) bracket(deskX(L * k / n), deskX(L * (k + 1) / n), y2, '#dce1ff', k === n - 1 ? 'equal' : ''); cx.setLineDash([]);
        var wk = dance.j.worst, w0 = wk > 0 ? dance.lands[wk - 1] : 0, w1 = dance.lands[wk];
        if (wk >= 0) { cx.strokeStyle = '#f0968c'; cx.lineWidth = 2.5; cx.beginPath(); cx.ellipse(deskX((w0 + w1) / 2), y + fs * 0.4, Math.abs(w1 - w0) / 2 + S * 0.02, fs * 1.15, 0, 0, 7); cx.stroke(); }
      }
      cx.restore();
    }
    if (show && now >= show.at) {   /* a miss worth showing: where equal steps land, dashed, and the odd step */
      var j = show.j, m = j.reason === 'count' ? want() : j.n, L = desk.b - desk.a, i;
      cx.save(); cx.globalAlpha = Math.min(1, (now - show.at) / 300);
      cx.setLineDash([5, 5]); cx.strokeStyle = 'rgba(220,225,255,0.85)'; cx.lineWidth = 2;
      for (i = 1; i <= m; i++) { var fx = desk.a + L * i / m; cx.beginPath(); cx.moveTo(fx, desk.y - S * 0.06); cx.lineTo(fx, desk.y - 4); cx.stroke(); }
      cx.setLineDash([]);
      label(desk.a + L / 2, desk.y - S * 0.09, m + ' equal steps land here', '#dce1ff', Math.max(12, S * 0.03));
      if (j.reason === 'uneven' && j.worst >= 0) {
        var a0 = j.worst ? show.taps[j.worst - 1].x : desk.a, a1 = show.taps[j.worst].x;
        bracket(a0, a1, y, '#f0968c', j.long ? 'too long' : 'too short');
      }
      cx.restore();
    }
  }
  /* the beat round: Flitwick's metronome, its arm at one end on every tick; his count of three, then the step due */
  function drawMetronome(now) {
    if (!clock) return;
    var mx = (desk.a + desk.b) / 2, my = desk.y - P * 1.6, h = S * 0.13, ph = (now - clock.c0) / clock.ms, k = Math.floor(ph);
    var a = now < clock.c0 ? 0 : 0.45 * Math.cos(Math.PI * ph);
    cx.save();
    cx.fillStyle = '#5e4129'; cx.strokeStyle = '#8a6038'; cx.lineWidth = 2; cx.beginPath();
    cx.moveTo(mx - h * 0.32, my); cx.lineTo(mx + h * 0.32, my); cx.lineTo(mx + h * 0.13, my - h); cx.lineTo(mx - h * 0.13, my - h); cx.closePath(); cx.fill(); cx.stroke();
    var px = mx, py = my - h * 0.12, len = h * 0.95, tx = px + Math.sin(a) * len, ty = py - Math.cos(a) * len;
    cx.strokeStyle = '#d9d2c2'; cx.lineWidth = Math.max(2, h * 0.03); cx.beginPath(); cx.moveTo(px, py); cx.lineTo(tx, ty); cx.stroke();
    cx.fillStyle = '#e8be5a'; cx.fillRect(px + Math.sin(a) * len * 0.62 - h * 0.06, py - Math.cos(a) * len * 0.62 - h * 0.04, h * 0.12, h * 0.08);
    if (now >= clock.c0 && (now - clock.c0) % clock.ms < 160) {   /* the tick: a flash at the arm's tip */
      cx.strokeStyle = 'rgba(243,210,122,' + (1 - ((now - clock.c0) % clock.ms) / 160) + ')'; cx.lineWidth = 3;
      cx.beginPath(); cx.arc(tx, ty, h * 0.12, 0, 7); cx.stroke();
    }
    cx.restore();
    var big = Math.max(18, S * 0.05);
    if (now < clock.c0) label(mx + h * 0.75, my - h * 0.45, 'ready', '#eadcbf', big * 0.7);
    else if (k < 3) label(mx + h * 0.75, my - h * 0.45, String(k + 1), '#f3d27a', big);
    else label(mx + h * 0.8, my - h * 0.45, 'step ' + (k - 2), '#f3d27a', big * 0.8);
  }
  /* after each part: how far against how long, one line a part, from the start of his count */
  function drawChart(now) {
    if (round !== 3 || clock || !(dance && dance.done) || !runs.length) return;
    var top = lineEl.getBoundingClientRect().bottom + S * 0.03, bot = desk.y - P * 1.45;
    var cw = Math.min(desk.b - desk.a, (bot - top) * 1.8), left = (desk.a + desk.b) / 2 - cw / 2;
    var gx0 = left + S * 0.02, gx1 = left + cw, gy0 = top + S * 0.05, fs = Math.max(12, Math.min(S * 0.028, (bot - top) * 0.075)), gy1 = bot - fs * 2.9, TMAX = 3500;   /* lettering to the chart's size */
    var X = function (t) { return gx0 + (gx1 - gx0) * Math.max(0, t) / TMAX; }, Y = function (f) { return gy1 - (gy1 - gy0) * f; };
    cx.save(); cx.globalAlpha = Math.min(1, (now - (dance.doneAt || now)) / 400);
    cx.fillStyle = 'rgba(18,15,12,0.82)'; cx.fillRect(left - S * 0.02, top, cw + S * 0.04, bot - top);
    cx.strokeStyle = 'rgba(234,220,191,0.7)'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(gx0, gy0 - S * 0.02); cx.lineTo(gx0, gy1); cx.lineTo(gx1, gy1); cx.stroke();
    cx.setLineDash([4, 4]); cx.beginPath(); cx.moveTo(gx0, Y(1)); cx.lineTo(gx1, Y(1)); cx.stroke(); cx.setLineDash([]);
    cx.font = 'italic ' + Math.round(fs) + 'px Georgia, serif'; cx.fillStyle = '#eadcbf'; cx.textAlign = 'left';
    cx.fillText('far end of the desk', gx0 + 6, Y(1) - 5);
    cx.textAlign = 'center';
    for (var s = 0; s <= 3; s++) { cx.beginPath(); cx.moveTo(X(s * 1000), gy1); cx.lineTo(X(s * 1000), gy1 + 5); cx.stroke(); cx.fillText(s + (s ? ' s' : ''), X(s * 1000), gy1 + fs * 1.2); }
    cx.fillText('seconds from the count', (gx0 + gx1) / 2, gy1 + fs * 2.4);   /* under the axis, centred as the tick labels are */
    runs.forEach(function (r, k) {
      if (!r) return;
      cx.strokeStyle = PARTS[k].color; cx.fillStyle = PARTS[k].color; cx.lineWidth = k === 1 ? 2 : 3; cx.setLineDash(k === 1 ? [7, 5] : []);
      cx.beginPath(); cx.moveTo(X(0), Y(0)); r.pts.forEach(function (p) { cx.lineTo(X(p[0]), Y(p[1])); }); cx.stroke(); cx.setLineDash([]);
      r.pts.forEach(function (p) { cx.beginPath(); cx.arc(X(p[0]), Y(p[1]), 3.5, 0, 7); cx.fill(); });
    });
    cx.textAlign = 'right'; var ly = gy1 - fs * 0.6;
    for (var k = runs.length - 1; k >= 0; k--) { if (!runs[k]) continue; cx.fillStyle = PARTS[k].color; cx.fillText(PARTS[k].key + ': ' + (runs[k].time / 1000).toFixed(1) + ' s', gx1, ly); ly -= fs * 1.3; }
    if (runs[2]) { cx.textAlign = 'right'; cx.fillStyle = '#f0968c'; cx.fillText('steeper: faster', X(runs[2].time * 0.85) - 10, Y(0.85)); }   /* above the steep line, where no line runs */
    cx.restore();
  }
  function frame(now) {
    drawRoom();
    marks(now);
    drawGeometry(now);
    if (!wait && !done && !dance && !show) guides.forEach(function (g) { g.draw(cx, now, taps.length > 0); });
    drawChart(now);
    drawMetronome(now);
    drawFlitwick(now);
    drawPineapple(now);
    if (clock && now >= clock.c0) { var tk = Math.floor((now - clock.c0) / clock.ms); if (tk > clock.tick) { clock.tick = tk; tick(tk < 3); } }
    if (!wait && !dance && !done && (taps.length && last && last.reason === 'waiting' || clock && !taps.length)) judge(now, false);   /* a long pause ends a try short; with a beat, a tick with no step */
    requestAnimationFrame(frame);
  }

  /* ---- touch: taps on the desk ---- */
  function pt(ev) { return { x: ev.clientX, y: ev.clientY, t: Math.round(performance.now()) }; }
  cv.addEventListener('pointerdown', function (ev) { ensureAudio(); ev.preventDefault(); tap(pt(ev)); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  addEventListener('resize', resize); resize(); choose(round); requestAnimationFrame(frame);
  window.lumosDance = { choose: function (i) { choose(i - 1); },
    clock: function () { return clock ? { c0: clock.c0, t0: clock.t0, ms: clock.ms, now: performance.now() } : null; },
    desk: function () { return { a: desk.a, b: desk.b, y: desk.y, band: desk.band }; },
    state: function () { return { round: round + 1, want: want(), waiting: !!wait, done: done, misses: misses, taps: taps.length,
      dancing: !!dance, danced: !!(dance && dance.done), fell: !!fall, peering: !!(fall && performance.now() >= fall.at + 520),
      ringed: !!(dance && dance.done && dance.j && dance.j.spread >= 0.05 && dance.j.worst >= 0),
      last: last ? { verdict: last.verdict, reason: last.reason, n: last.n, steps: last.steps, share: last.share, spread: last.spread, worst: last.worst, beat: last.beat, offbeat: last.offbeat, late: last.late, time: last.time, speed: last.speed } : null,
      part: round === 3 ? part + 1 : 0, counting: !!clock, runs: runs.filter(Boolean).length,
      line: lineEl.textContent, guide: guides.length ? guides[0].state().level : null, ease: ease, learned: LumosSpells.learned('pineapple') }; } };
})();
