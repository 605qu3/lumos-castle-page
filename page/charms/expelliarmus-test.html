<!DOCTYPE html>
<html lang="en-GB">
<head>

<title>Expelliarmus, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #120f0c; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  #line { position: fixed; left: 50%; transform: translateX(-50%); top: max(12px, env(safe-area-inset-top));
    width: min(92vw, 600px); box-sizing: border-box; text-align: center; padding: 10px 14px;
    font: 17px/1.35 Georgia, 'Times New Roman', serif; color: #eadcbf; background: #1a1714;
    border: 1px solid #4a3a2c; border-radius: 6px; pointer-events: none; }
  #line b { color: #f3d27a; }
  #panel { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex;
    flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 8px; }
  button { font: 15px Georgia, serif; color: #eadcbf; background: #2a2019; border: 1px solid #5a4636; border-radius: 8px;
    padding: 8px 12px; touch-action: manipulation; }
  button.on { background: #e8be5a; color: #2b1d10; border-color: #e8be5a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line"></div>
<div id="panel"></div>
<script src="spells.js?v=35"></script>
<script src="guide.js?v=5"></script>
<script>
/* Expelliarmus, a test page for the Charms lane (13 October 2026, fifteenth session; the owner is Godric). Drawn in code.
   The book (CoS 11, checked in the text): "The long dining tables had vanished and a golden stage had appeared along
   one wall, lit by thousands of candles floating overhead"; Lockhart and Snape "swung their wands above their heads and
   pointed them at their opponent; Snape cried: 'Expelliarmus!' There was a dazzling flash of scarlet light". And the
   catch (CoS 16): Harry bellowed "Expelliarmus!" at Lockhart, whose "wand flew high into the air; Ron caught it". The
   stroke is the book's: one stroke from the wand hand, swung up above it, then pointed at the straw dummy's wand hand,
   judged by LumosSpells.judgeDisarm on the tally's own sizes (checks/expelliarmus-tally.js: the hand at 0.3 of the
   short side left of the middle and 0.72 down, its reach 0.06; the dummy's hand 0.55 across, its size 0.05). The rest
   is ours, for the geometry: the dummy's wand flies up in an arc toward him and he catches it with one tap where it
   will come down, called while it is still high. A throw comes down as it went up, its top halfway along, so it lands
   as far past its top as it started before it (symmetry); after each throw the arc is drawn, its top marked, the line
   through the top dashed, and the two halves on the start's level ticked as equal. Three rounds: a short throw, a long
   one, and the dummy up on the stage, where the wand starts higher than his hand and so lands further on than the
   mirror of its start (the older boy's edge). Each throw varies a little, so the rise has to be read, not remembered.
   A fourth round, the top (8.1, thirty-second session): he calls the very top itself while the wand still rises,
   from the rise alone, judged by LumosSpells.judgeTop; the line down through his call is his mirror, the rise turned
   over in it is drawn as his fall, and a line a foot off lands that fall two feet off: a mirror doubles it.
   Q9's fix (Godric, 13 October 2026, 5.05 pm: awkward in the hand): the swing and the point may be two strokes, the
   finger lifted at the top and the point drawn from there (LumosSpells.joinStrokes), and in the three catch rounds the
   wand hangs a beat at its top, the flight's clock standing still, so the catch is a read, not a race.
   The traced guide, the swing and the point, shows in the first round only. ?round=1..4, ?ease=, ?guide= for trying;
   window.lumosExpelliarmus for checks. */
(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), lineEl = document.getElementById('line'), panel = document.getElementById('panel');
  var W = 0, H = 0, S = 1, DPR = 1, audio = null, qs = new URLSearchParams(location.search);
  var EASES = ['kind', 'fair', 'strict'], ease = EASES.indexOf(qs.get('ease')) >= 0 ? qs.get('ease') : 'kind';
  /* the catch: how near the landing his tap must be (a share of the short side), and how far back down the wand may
     have fallen when he calls it (a share of its rise; 0 is at its top), and how long it hangs at its top, s (Q9) */
  var CATCH = { kind: { tol: 0.075, late: 0.5, hang: 0.7 }, fair: { tol: 0.055, late: 0.25, hang: 0.5 }, strict: { tol: 0.04, late: 0.05, hang: 0.3 } };
  var ROUNDS = [
    { name: 'Short', up: 0, span: 0.28, rise: 0.30,
      start: 'The Duelling Club, in the Great Hall. A straw dummy holds up its wand. <b>Swing your wand up above your head, then point it at the dummy\'s wand hand</b>: one stroke, or lift at the top and point from there. <i>Expelliarmus!</i>' },
    { name: 'Long', up: 0, span: 0.48, rise: 0.42,
      start: 'A harder flash this time: its wand will fly higher and further. Disarm it, then <b>tap where it will come down</b> while it is still high.' },
    { name: 'Stage', up: 0.2, span: 0.36, rise: 0.22,
      start: 'Now the dummy is up on the golden stage, higher than your hand. Disarm it: <b>where will its wand come down to you?</b>' },
    { name: 'Top', up: 0, span: 0.42, rise: 0.36,
      start: 'For the older boy: <b>catch it at its very top</b>, the moment it stops rising. Disarm it, watch it rise, and <b>tap where the top will be</b> before it gets there.' } ];
  var round = Math.max(0, Math.min(3, (Number(qs.get('round')) || 1) - 1));
  var hand = { x: 0, y: 0, r: 10 }, dummy = { x: 0, y: 0, r: 8 }, FT = 1;   /* FT: pixels to the foot, from the dummy's height */
  var stage = 'cast', wait = null, done = false, last = null, bolt = null, flash = 0, rock = 0, fly = null, sum = null, sparks = [], t0 = performance.now();
  var stroke = null, active = null, trail = null, guide = null, candles = [], upHeld = null;   /* upHeld: a swing alone, waiting for its point (Q9) */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight; S = Math.min(W, H);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    hand = { x: W / 2 - S * 0.3, y: H * 0.72, r: S * 0.06 };
    FT = S * 0.42 / 5.5;   /* the dummy stands about five and a half feet */
    candles = []; for (var i = 0; i < 70; i++) { var u = Math.sin(i * 12.9898) * 43758.5453; u -= Math.floor(u); var v = Math.sin(i * 78.233) * 12543.123; v -= Math.floor(v);
      candles.push({ x: u * W, y: H * (0.04 + v * 0.36), k: 0.6 + ((i * 7) % 5) / 10, ph: i * 1.7 }); }
    place(); choose(round);
  }
  function place() { var r = ROUNDS[round]; dummy = { x: hand.x + S * 0.55, y: hand.y - r.up * S, r: S * 0.05 }; }
  function floorY() { return hand.y + S * 0.2; }
  function stageTop() { return floorY() - ROUNDS[round].up * S; }
  function say(html) { lineEl.innerHTML = html; }
  function ensureAudio() { if (audio) { if (audio.state === 'suspended') audio.resume(); return; } var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
  function noise(dur, freq, gain, q) {
    if (!audio) return;
    var n = Math.floor(audio.sampleRate * dur), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3) * (q ? 0.6 + 0.4 * Math.sin(i / audio.sampleRate * q * 6.283) : 1);
    var src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(audio.destination); src.start();
  }
  function ft(px) { var v = Math.round(px / FT * 2) / 2; return (v >= 1 ? String(Math.floor(v)) : '') + (v % 1 ? '½' : '') + ' ft'; }
  function ftq(px) { return Math.abs(px) < FT / 4 ? 'under ½ ft' : ft(Math.abs(px)); }

  /* the guide, in the first round only: the swing up from the hand, then the point at the dummy's wand hand */
  function makeGuide() {
    if (round !== 0) { guide = null; return; }
    var a = [hand.x / S, hand.y / S], top = [(hand.x - hand.r / 3) / S, (hand.y - hand.r * 2.5) / S];
    var c = [(a[0] + top[0]) / 2 - hand.r * 0.25 / S, (a[1] + top[1]) / 2], b = [top[0] + (dummy.x / S - top[0]) * 0.85, top[1] + (dummy.y / S - top[1]) * 0.85];
    guide = LumosGuide.create({ key: 'lumos.charms.expelliarmusGuidedHits', rest: 1.0, mirror: false,
      box: function () { return { G: S, ox: 0, oy: 0 }; },
      parts: [{ pts: LumosGuide.quad(a, c, top, 10), secs: 0.45, label: 'swing up', at: 0.5, dx: -2.6, dy: 0 },
              { pts: LumosGuide.line(top, b, 12), secs: 0.4, label: 'point', at: 0.5, dx: 0, dy: -1.4 }] });
    guide.build(W, H);
  }

  function menu() {
    panel.innerHTML = '';
    ROUNDS.forEach(function (r, i) {
      var b = document.createElement('button'); b.textContent = r.name; if (i === round) b.className = 'on';
      b.onclick = function () { ensureAudio(); choose(i); }; panel.appendChild(b);
    });
    var e = document.createElement('button'); e.textContent = 'Ease: ' + ease;
    e.onclick = function () { ease = EASES[(EASES.indexOf(ease) + 1) % 3]; menu(); }; panel.appendChild(e);
    var g = document.createElement('button'); g.textContent = 'Guide';
    g.onclick = function () { if (guide) guide.reset(); }; panel.appendChild(g);
  }
  function choose(i) {
    if (wait) { clearTimeout(wait); wait = null; }
    round = i; stage = 'cast'; last = null; upHeld = null; bolt = null; fly = null; sum = null; trail = null; done = false; sparks = []; rock = 0;
    place(); makeGuide(); menu(); say(ROUNDS[i].start);
  }
  function again(html) { stage = 'cast'; upHeld = null; bolt = null; fly = null; sum = null; sparks = []; say(html); }

  /* ---- the cast: the swing and the point ---- */
  var SIDE = { high: 'above', low: 'below', left: 'to the left of', right: 'to the right of' };
  function judge(pts) {
    if (stage !== 'cast' || wait) return null;
    var jn = upHeld ? LumosSpells.joinStrokes(upHeld, pts, hand, ease) : null; upHeld = null;   /* the point as a second stroke from the swing's top */
    if (jn) pts = jn;
    var j = LumosSpells.judgeDisarm(pts, hand, dummy, ease);
    if (j.reason === 'tap') { if (guide) guide.clear(); say('Swing your wand up above your head, then point it at the dummy\'s wand hand: one stroke, or lift at the top and point from there.'); last = j; return j; }
    var lv = guide ? guide.level() : 0, tr = guide ? guide.score(pts) : null;
    if (tr && tr.traced && j.verdict === 'miss' && j.reason !== 'off') {
      j.verdict = 'disarmed'; j.reason = 'traced'; if (!j.top) j.top = { x: hand.x - hand.r / 3, y: hand.y - hand.r * 2.5 }; }
    last = j;
    if (j.reason === 'up') {   /* a swing alone: held, drawn, for the point from its top */
      upHeld = pts; trail = { pts: pts, at: performance.now() };
      say('A good swing! Now <b>point</b> it at the dummy\'s wand hand from the top: keep your finger down, or lift it and point from there.');
      return j;
    }
    if (j.verdict !== 'disarmed' && j.reason !== 'wide') {
      if (guide) guide.miss();
      trail = { pts: pts, at: performance.now() };
      var peak = pts[0].y - Math.min.apply(null, pts.map(function (q) { return q.y; }));
      say({ off: 'Start at your wand hand, down by your side, where it glows.',
            flat: j.top && Math.abs(j.top.x - hand.x) > hand.r * 2 ? 'You pointed, then swung: <b>swing up first</b>, above your head, then point from the top.' :
                  j.top ? 'Higher! Swing it right up above your head first, then point.' :
                  peak >= hand.r ? 'A rainbow! Swing straight up, then turn sharply at the top and point straight from there: a corner, not a curve.' :
                  'Swing your wand up above your head first, then point: the book\'s duellists swing, then point.',
            wiggly: 'Point straight, like a finger at the dummy\'s hand: the flash flies straight.',
            short: 'A longer point, well out toward the dummy.',
            away: 'At the dummy, not away from it!' }[j.reason] || 'Swing up, then point.');
      return j;
    }
    /* a cast: the scarlet flash flies from the top of the swing along his point */
    var top = j.top, e = pts[pts.length - 1], len = Math.hypot(e.x - top.x, e.y - top.y) || 1, ux = (e.x - top.x) / len, uy = (e.y - top.y) / len;
    if (j.reason === 'traced') { var dl = Math.hypot(dummy.x - top.x, dummy.y - top.y); ux = (dummy.x - top.x) / dl; uy = (dummy.y - top.y) / dl; }
    var along = (dummy.x - top.x) * ux + (dummy.y - top.y) * uy, hit = j.verdict === 'disarmed';
    var end = hit ? { x: dummy.x, y: dummy.y } : { x: top.x + ux * (along + S * 0.35), y: top.y + uy * (along + S * 0.35) };
    stage = 'bolt'; trail = { pts: pts, at: performance.now() };
    bolt = { from: { x: top.x, y: top.y }, to: end, at: performance.now(), dur: 260, hit: hit, j: j };
    noise(0.3, 1800, 0.35); say('<b>Expelliarmus!</b>');
    if (hit) { if (guide) guide.hit(lv > 0); LumosSpells.learn('expelliarmus'); } else if (guide) guide.miss();
    return j;
  }
  function struck(now) {
    var j = bolt.j;
    if (!bolt.hit) {
      stage = 'missed'; sparks.push({ x: bolt.to.x, y: bolt.to.y, at: now }); noise(0.2, 600, 0.3);
      var inch = Math.max(1, Math.round(j.by / (FT / 12)));
      say('The flash went past its hand, about ' + inch + ' inch' + (inch === 1 ? '' : 'es') + ' ' + SIDE[j.side] + ' it. Your point was ' + deg(Math.abs(j.off)) + ' off; from up there it allows ' + deg(j.allow) + '.');
      wait = setTimeout(function () { wait = null; again('Again: <b>swing up above your head, then point</b> at its wand hand.'); }, 4000);
      return;
    }
    stage = 'catch'; flash = now; rock = now; noise(0.5, 300, 0.4, 6); throwWand(now);
    say(round === 3 ? '<b>A dazzling flash of scarlet light</b>, and its wand flies up! <b>Tap where its top will be</b>, before it gets there.' :
        '<b>A dazzling flash of scarlet light</b>, and its wand flies up and hangs a beat at its top! <b>Tap where it will come down</b>, while it is still high.');
  }
  function deg(v) { return (v < 1 ? v.toFixed(1) : String(Math.round(v * 10) / 10)) + '°'; }

  /* ---- the throw: a parabola toward him, its top halfway between the start and its mirror on the start's level ---- */
  function throwWand(now) {
    var r = ROUNDS[round], c = CATCH[ease], span = r.span * S * (0.88 + Math.random() * 0.24), lim = Math.max(110, H * 0.16);
    var rise = Math.min(r.rise * S * (0.88 + Math.random() * 0.24), dummy.y - lim), catchY = hand.y, xt, land, m;
    for (m = 0; m < 8; m++) {   /* keep the landing on the screen */
      xt = dummy.x - span / 2; land = xt - span / 2 * Math.sqrt((catchY - (dummy.y - rise)) / rise);
      if (land >= W * 0.06) break; span *= 0.88;
    }
    var yt = dummy.y - rise, tUp = 0.9 + 0.6 * rise / (0.4 * S), vx = span / 2 / tUp;
    var late = xt - span / 2 * Math.sqrt(round === 3 ? CATCH.strict.late : c.late);   /* the top's round: called on the rise, every ease */
    fly = { at: now, start: { x: dummy.x, y: dummy.y }, top: { x: xt, y: yt }, span: span, rise: rise, mirror: dummy.x - span,
            land: land, catchY: catchY, vx: vx, lateAt: (dummy.x - late) / vx, landAt: (dummy.x - land) / vx, topAt: tUp, judge: null, hang: round === 3 ? 0 : c.hang,
            floorAt: (dummy.x - (xt - span / 2 * Math.sqrt((floorY() - yt) / rise))) / vx, tap: null, told: false, caught: null };
  }
  function wandAt(t) {   /* t in seconds since the throw */
    var x = fly.start.x - fly.vx * t, k = (x - fly.top.x) / (fly.span / 2);
    return { x: x, y: fly.top.y + fly.rise * k * k };
  }
  function flightT(now) {   /* the flight's own clock, which stands still while the wand hangs at its top (Q9) */
    var t = (now - fly.at) / 1000; return t <= fly.topAt ? t : t <= fly.topAt + fly.hang ? fly.topAt : t - fly.hang;
  }
  function call(p) {   /* his tap: his catching hand goes to that place along his hand's level */
    var t = flightT(performance.now());
    if (fly.tap || fly.caught !== null) return;
    if (t > fly.lateAt) { if (!fly.told) { fly.told = true; say(round === 3 ? 'Too late: it has passed its top. Call the top while it is still rising.' : 'Too late to call it: next time, tap while it is still high.'); } return; }
    fly.tap = { x: p.x, y: round === 3 ? p.y : fly.catchY }; noise(0.08, 2600, 0.15);   /* the top's round: his hand goes up to the top he called */
  }
  function settle(now) {   /* at his hand's level: caught, or on down to the floor */
    if (round === 3) return settleTop(now);
    var tol = CATCH[ease].tol * S, gap = fly.tap ? fly.tap.x - fly.land : null;
    fly.caught = fly.tap && Math.abs(gap) <= tol;
    sum = { shown: now + 250, gap: gap };
    if (fly.caught) {
      stage = 'caught'; noise(0.12, 1200, 0.3);
      var tail = round === 2 ? ' Level with its start it was as far past its top as it began before it, then it fell on down to your hand.' : ' It came down as far past its top as it started before it.';
      say('<b>Caught it!</b> As Ron caught Lockhart\'s wand (Book 2).' + tail);
      wait = setTimeout(function () { wait = null; choose(round + 1); }, 7000);
    } else stage = 'falling';
  }
  function settleTop(now) {   /* the top's round: at its top, caught in his hand there, or on over and down */
    var jt = fly.tap ? LumosSpells.judgeTop(fly.tap, fly.start, fly.top, S, ease) : null;
    fly.judge = jt; fly.caught = !!jt && jt.verdict === 'caught'; sum = { shown: now + 250, gap: null };
    if (!fly.caught) { stage = 'falling'; return; }
    stage = 'caught'; noise(0.12, 1200, 0.3); done = true;
    say('<b>Caught at the very top</b>, where it stopped rising! Dashed through your hand: its fall, the rise turned over in your line.');
    setTimeout(function () { if (done) say('All four caught. <i>"That was a Disarming Charm, as you see, I\'ve lost my wand,"</i> as Lockhart said (Book 2).'); }, 5200);
  }
  function clatter(now) {
    stage = 'missed'; noise(0.25, 700, 0.35, 30);
    if (round === 3) {   /* the top's round: how far his hand was from the top, and what his line does to the fall */
      var jt = fly.judge, ow;
      if (!jt) ow = fly.told ? 'You called it after its top.' : 'You didn\'t call it.';
      else {
        ow = 'Your hand was ' + (jt.reason === 'before' || jt.reason === 'past' ? ftq(jt.along) + ' ' + jt.reason : ftq(jt.up) + (jt.reason === 'high' ? ' above' : ' below')) + ' its top. ';
        ow += Math.abs(jt.gap) >= FT / 4 ? 'Turned over in your line, the fall lands ' + ft(Math.abs(jt.gap)) + ' off: a mirror doubles it.' : 'Your line was true, so its fall turns over right: only the height was off.';
      }
      say('<b>Clatter!</b> ' + ow);
      wait = setTimeout(function () { wait = null; again('The dummy picks its wand back up. Again: <b>swing up, then point</b>, then call its top.'); }, 6200);
      return;
    }
    var where = sum.gap === null ? (fly.told ? 'You called it too late.' : 'You didn\'t call it.') :
      'Your hand was ' + ft(Math.abs(sum.gap)) + (sum.gap > 0 ? ' short of' : ' past') + ' where it came down.';
    say('<b>Clatter!</b> ' + where + ' See the two halves: it comes down as far past its top as it went up before it.');
    wait = setTimeout(function () { wait = null; again('The dummy picks its wand back up. Again: <b>swing up, then point</b>.'); }, 5200);
  }

  /* ---- drawing ---- */
  function drawHall(now) {
    var fy = floorY(), g = cx.createLinearGradient(0, 0, 0, fy);
    g.addColorStop(0, '#0d1020'); g.addColorStop(0.3, '#1b1a22'); g.addColorStop(1, '#3a3027'); cx.fillStyle = g; cx.fillRect(0, 0, W, fy);
    cx.fillStyle = 'rgba(230,225,255,0.55)';   /* the enchanted ceiling's stars */
    for (var i = 0; i < 40; i++) { var u = Math.sin(i * 91.7) * 9999; u -= Math.floor(u); var v = Math.sin(i * 17.3) * 9999; v -= Math.floor(v); cx.fillRect(u * W, v * H * 0.18, 1.2, 1.2); }
    var bw = Math.max(48, S * 0.16), bh = bw * 0.45, y0 = H * 0.3, r, c;   /* the wall's stones, below the ceiling */
    for (r = 0; y0 + r * bh < fy; r++) for (c = -1; c * bw < W; c++) {
      var x = c * bw + (r % 2 ? bw / 2 : 0), y = y0 + r * bh, t = ((r * 7 + c * 13) % 5) / 5;
      cx.fillStyle = 'rgba(' + Math.round(78 + t * 14) + ',' + Math.round(66 + t * 12) + ',' + Math.round(54 + t * 10) + ',' + Math.min(1, (y - y0) / (bh * 3)) + ')';
      cx.fillRect(x + 1.5, y + 1.5, bw - 3, bh - 3);
    }
    cx.fillStyle = '#2b231c'; cx.fillRect(0, fy, W, H - fy);
    for (c = 0; c * bw < W; c++) { cx.fillStyle = c % 2 ? '#30271f' : '#271f18'; cx.fillRect(c * bw, fy + 3, bw - 2, H - fy); }
    cx.fillStyle = 'rgba(0,0,0,0.35)'; cx.fillRect(0, fy, W, 4);
    candles.forEach(function (k) {   /* thousands of candles floating overhead (a few dozen of them) */
      var y = k.y + Math.sin(now / 1100 + k.ph) * S * 0.006, s = S * 0.012 * k.k, fl = 1 + Math.sin(now / 80 + k.ph) * 0.12;
      var gl = cx.createRadialGradient(k.x, y - s * 2, 0, k.x, y - s * 2, s * 6); gl.addColorStop(0, 'rgba(255,200,120,0.22)'); gl.addColorStop(1, 'rgba(255,180,100,0)');
      cx.fillStyle = gl; cx.fillRect(k.x - s * 6, y - s * 8, s * 12, s * 12);
      cx.fillStyle = '#efe4c8'; cx.fillRect(k.x - s * 0.35, y - s, s * 0.7, s * 2.6);
      cx.fillStyle = '#ffd27a'; cx.beginPath(); cx.ellipse(k.x, y - s * 1.6, s * 0.3 * fl, s * 0.7 * fl, 0, 0, 7); cx.fill();
