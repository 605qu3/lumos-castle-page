<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wingardium Leviosa, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #120e0c; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  #say { position: fixed; left: 0; right: 0; top: max(14px, env(safe-area-inset-top)); text-align: center;
    font: 600 22px/1.3 Georgia, 'Times New Roman', serif; color: #e9dcc0; pointer-events: none;
    text-shadow: 0 1px 6px #000; padding: 0 16px; }
  #why { position: fixed; left: 0; right: 0; top: calc(max(14px, env(safe-area-inset-top)) + 34px); text-align: center;
    font: 16px/1.35 Georgia, serif; color: #b7a98d; pointer-events: none; padding: 0 16px; }
  .btn { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); font: 14px Georgia, serif;
    color: #cdbf9f; background: #221c26; border: 1px solid #4a3f50; border-radius: 8px; padding: 8px 12px;
    touch-action: manipulation; }
  #ease { left: 12px; }
  #guideBtn { left: 12px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 48px); }
  @media (max-width: 640px) { #guideBtn { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 96px); } }
  #logBtn { right: 12px; }
  #word { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom));
    font: 600 17px Georgia, serif; color: #2b2013; background: #e6d6b0; border: 1px solid #8a7550;
    border-radius: 6px; padding: 7px 12px; white-space: nowrap; touch-action: manipulation;
    box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  #word b { letter-spacing: 0.12em; color: #7a1f12; }
  @media (max-width: 640px) { #word { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 48px); } }
  #log { position: fixed; left: 8px; right: 8px; bottom: 60px; max-height: 40vh; overflow: auto; display: none;
    background: rgba(20,16,24,.94); color: #cdbf9f; font: 12px/1.4 Menlo, Consolas, monospace; padding: 8px;
    border: 1px solid #4a3f50; border-radius: 8px; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  #log button { font: 13px Georgia, serif; margin: 0 6px 6px 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="say">Swish and flick</div>
<div id="why">Start at the glowing dot and follow the gold path, in one stroke.</div>
<button class="btn" id="ease">Ease: kind</button>
<button class="btn" id="guideBtn">Guide</button>
<button id="word">Wing-<b>gar</b>-dium Levi-o-sa</button>
<button class="btn" id="logBtn">Log</button>
<div id="log"><button id="copy">Copy log</button><button id="close">Close</button><div id="logText"></div></div>
<script src="guide.js?v=3"></script>
<script src="spells.js?v=5"></script>
<script>
/* Wingardium Leviosa, a test page for the Charms lane (11 October 2026; the owner is Godric). Drawn in code; the
   feather is the common room's tawny owl feather, reused, nothing painted.
   Swish and flick (Flitwick, PS 10): the books name it but never draw it, so its shape here is the lane's own, kept
   loose: any curve, a corner, then a short straight flick up, in one stroke.
   The geometry: a hit names the two parts, a curve and a line, and marks the corner with its angle. */

/* The judging lives in spells.js since 12 October 2026 (req 153: a room's Leviosa judges with it too), unchanged;
   tallied there by checks/leviosa-tally.js. */
var EASES = LumosSpells.SWISH_EASES, judgeSwishFlick = LumosSpells.judgeSwishFlick;

(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var sayEl = document.getElementById('say'), whyEl = document.getElementById('why');
  var W = 0, H = 0, DPR = 1, S = 1, ease = 'kind';
  var stroke = null, trails = [], parts = [], ghost = null, mark = null, logLines = [], audio = null;
  var img = new Image(); img.src = '../../assets/layers/feather-desk.png';

  /* The feather's state: where it is, its turn, and what it is doing. */
  var F = { x: 0, y: 0, rot: 0, flip: 1, mode: 'rest', t0: 0, hoverUntil: 0, smoke: 0, tx: 0, ty: 0, vx: 0 };
  function tableY() { return H * 0.72; }
  function restPos() { return { x: W * 0.42, y: tableY() - S * 0.012 }; }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (F.mode === 'rest') { var r = restPos(); F.x = r.x; F.y = r.y; F.rot = -Math.PI / 2 + 0.08; }
  }
  window.addEventListener('resize', resize);
  resize();

  function featherLen() { return S * 0.32; }
  function drawFeather() {
    var L = featherLen(), wd = L * 281 / 640;
    cx.save();
    /* its shadow on the table, smaller and fainter the higher it floats */
    var lift = Math.max(0, tableY() - F.y) / H;
    cx.fillStyle = 'rgba(0,0,0,' + (0.35 * Math.max(0, 1 - lift * 2.5)) + ')';
    cx.beginPath(); cx.ellipse(F.x, tableY() + S * 0.004, L * 0.45 * (1 - lift), S * 0.012 * (1 - lift), 0, 0, 7); cx.fill();
    cx.translate(F.x, F.y); cx.rotate(F.rot); cx.scale(F.flip, 1);
    if (img.complete && img.naturalWidth) cx.drawImage(img, -wd / 2, -L / 2, wd, L);
    else { cx.fillStyle = '#a57b4c'; cx.beginPath(); cx.ellipse(0, 0, wd * 0.3, L / 2, 0, 0, 7); cx.fill(); }
    cx.restore();
  }
  function tipOfFeather() {
    var L = featherLen();
    return { x: F.x + Math.sin(F.rot) * L * 0.48, y: F.y - Math.cos(F.rot) * L * 0.48 };
  }
  function inFeather(p) {
    var L = featherLen(), dx = p.x - F.x, dy = p.y - F.y, c = Math.cos(-F.rot), s = Math.sin(-F.rot);
    var lx = dx * c - dy * s, ly = dx * s + dy * c;
    return Math.abs(lx) < L * 0.25 && Math.abs(ly) < L * 0.55;
  }

  function drawRoom() {
    cx.fillStyle = '#120e0c'; cx.fillRect(0, 0, W, H);
    var g = cx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.35, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(120,70,40,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    /* the table top, its boards and its front edge */
    var ty = tableY();
    var tg = cx.createLinearGradient(0, ty - S * 0.06, 0, H);
    tg.addColorStop(0, '#5a3a22'); tg.addColorStop(1, '#2e1d11');
    cx.fillStyle = tg; cx.fillRect(0, ty - S * 0.06, W, H);
    cx.strokeStyle = 'rgba(0,0,0,0.25)'; cx.lineWidth = 1;
    for (var x = -W; x < W * 2; x += S * 0.22) { cx.beginPath(); cx.moveTo(x, ty - S * 0.06); cx.lineTo(x + (x - W / 2) * 0.4, H); cx.stroke(); }
    cx.fillStyle = 'rgba(255,220,170,0.08)'; cx.fillRect(0, ty - S * 0.06, W, 2);
  }
  function wandTip() { return { x: W * 0.82, y: H * 0.6 }; }
  function drawWand() {
    var b = { x: W * 0.95, y: H * 0.98 }, t = wandTip();
    cx.save(); cx.lineCap = 'round';
    cx.strokeStyle = '#3b2617'; cx.lineWidth = S * 0.03;
    cx.beginPath(); cx.moveTo(b.x, b.y); cx.lineTo(b.x + (t.x - b.x) * 0.3, b.y + (t.y - b.y) * 0.3); cx.stroke();
    cx.strokeStyle = '#6b4a2f'; cx.lineWidth = S * 0.014;
    cx.beginPath(); cx.moveTo(b.x + (t.x - b.x) * 0.3, b.y + (t.y - b.y) * 0.3); cx.lineTo(t.x, t.y); cx.stroke();
    cx.restore();
  }

  function ensureAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC();
  }
  function chime() {
    if (!audio) return; var now = audio.currentTime;
    [659, 880, 1319].forEach(function (f, i) {
      var o = audio.createOscillator(), gn = audio.createGain(); o.type = 'sine'; o.frequency.value = f;
      gn.gain.setValueAtTime(0, now + i * 0.1); gn.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.1 + 1.1);
      o.connect(gn); gn.connect(audio.destination); o.start(now + i * 0.1); o.stop(now + i * 0.1 + 1.2);
    });
  }
  function fizz() {
    if (!audio) return;
    var n = audio.sampleRate * 0.3, buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    var src = audio.createBufferSource(), f = audio.createBiquadFilter(), gn = audio.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1800; gn.gain.value = 0.16;
    src.connect(f); f.connect(gn); gn.connect(audio.destination); src.start();
  }
  function sparksAt(p, n) {
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, v = S * (0.003 + Math.random() * 0.008);
      parts.push({ k: 'spark', x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, dec: 0.02 + Math.random() * 0.02, c: Math.random() < 0.5 ? '#ffd27a' : '#ff8a4d' });
    }
  }
  function smokeAt(p) {
    parts.push({ k: 'smoke', x: p.x + (Math.random() - 0.5) * 4, y: p.y, vx: (Math.random() - 0.5) * 0.4, vy: -S * 0.002, life: 1, dec: 0.012, r: S * 0.015 });
  }
  function stepParts() {
    parts = parts.filter(function (p) {
      p.life -= p.dec;
      if (p.k === 'spark') { p.vy += 0.1; p.x += p.vx; p.y += p.vy; }
      if (p.k === 'smoke') { p.x += p.vx; p.y += p.vy; p.r *= 1.015; }
      return p.life > 0;
    });
  }
  function drawParts() {
    parts.forEach(function (p) {
      cx.save();
      if (p.k === 'spark') { cx.globalAlpha = p.life; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, 2, 0, 7); cx.fill(); }
      if (p.k === 'smoke') {
        var g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, 'rgba(160,155,150,' + 0.45 * p.life + ')'); g.addColorStop(1, 'rgba(160,155,150,0)');
        cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
      }
      cx.restore();
    });
  }

  /* After a hit: the curve, the corner with its angle, and the line, named on his own stroke. */
  function drawMark(now) {
    if (!mark) return;
    var age = (now - mark.at) / 3500; if (age > 1) { mark = null; return; }
    var a = age < 0.8 ? 1 : (1 - age) / 0.2, p = mark.pts, c = mark.corner;
    cx.save(); cx.globalAlpha = a; cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.strokeStyle = '#9fd0ff'; cx.lineWidth = 4;
    cx.beginPath(); p.slice(0, c + 1).forEach(function (q, i) { i ? cx.lineTo(q.x, q.y) : cx.moveTo(q.x, q.y); }); cx.stroke();
    cx.strokeStyle = '#ffe9a8';
    cx.beginPath(); p.slice(c).forEach(function (q, i) { i ? cx.lineTo(q.x, q.y) : cx.moveTo(q.x, q.y); }); cx.stroke();
    cx.strokeStyle = '#e8be5a'; cx.lineWidth = 2.5;
    cx.beginPath(); cx.arc(p[c].x, p[c].y, 9, 0, 7); cx.stroke();
    var fs = Math.round(Math.max(16, S * 0.038));
    cx.font = '600 ' + fs + 'px Georgia, serif'; cx.textAlign = 'center';
    cx.shadowColor = 'rgba(0,0,0,0.9)'; cx.shadowBlur = 6;
    var m = p[Math.floor(c / 2)], e = p[Math.min(p.length - 1, c + Math.floor((p.length - c) * 0.6))];
    cx.fillStyle = '#9fd0ff'; cx.fillText('a curve', m.x - fs * 2.4, m.y + fs * 0.4);
    cx.fillStyle = '#ffe9a8'; cx.fillText('a line', e.x + fs * 2.2, e.y);
    cx.fillStyle = '#e8be5a'; cx.fillText('corner ' + Math.round(mark.deg) + '°', p[c].x, p[c].y + fs * 1.5);
    cx.restore();
  }
  /* After a miss: his stroke faint, beside a gold dotted swish and flick from the same start. */
  function drawGhost(now) {
    if (!ghost) return;
    var age = (now - ghost.at) / 2000; if (age > 1) { ghost = null; return; }
    var a = 1 - age, p0 = ghost.pts[0];
    cx.save(); cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.strokeStyle = 'rgba(200,200,215,' + 0.5 * a + ')'; cx.lineWidth = 4;
    cx.beginPath(); ghost.pts.forEach(function (q, i) { i ? cx.lineTo(q.x, q.y) : cx.moveTo(q.x, q.y); }); cx.stroke();
    var c1 = { x: p0.x + S * 0.02, y: p0.y + S * 0.14 }, k = { x: p0.x + S * 0.16, y: p0.y + S * 0.1 };
    var e = { x: k.x + S * 0.03, y: k.y - S * 0.13 };
    cx.strokeStyle = 'rgba(232,190,90,' + 0.85 * a + ')'; cx.lineWidth = 5; cx.setLineDash([2, 9]);
    cx.beginPath(); cx.moveTo(p0.x, p0.y); cx.quadraticCurveTo(c1.x, c1.y, k.x, k.y); cx.lineTo(e.x, e.y); cx.stroke();
    cx.setLineDash([]); cx.fillStyle = 'rgba(232,190,90,' + 0.85 * a + ')';
    var ang = Math.atan2(e.y - k.y, e.x - k.x);
    cx.beginPath(); cx.moveTo(e.x + Math.cos(ang) * 10, e.y + Math.sin(ang) * 10);
    cx.lineTo(e.x + Math.cos(ang + 2.4) * 10, e.y + Math.sin(ang + 2.4) * 10);
    cx.lineTo(e.x + Math.cos(ang - 2.4) * 10, e.y + Math.sin(ang - 2.4) * 10); cx.closePath(); cx.fill();
    cx.restore();
  }
  function drawStroke() {
    trails = trails.filter(function (tr) { tr.life -= 0.04; return tr.life > 0; });
    cx.save(); cx.lineCap = 'round'; cx.lineJoin = 'round';
    trails.concat(stroke ? [{ pts: stroke, life: 1 }] : []).forEach(function (tr) {
      if (tr.pts.length < 2) return;
      cx.strokeStyle = 'rgba(220,225,255,' + 0.5 * tr.life + ')'; cx.lineWidth = 5;
      cx.beginPath(); tr.pts.forEach(function (q, i) { i ? cx.lineTo(q.x, q.y) : cx.moveTo(q.x, q.y); }); cx.stroke();
    });
    cx.restore();
  }

  var WHY = {
    tap: null,
    small: ['It twitches', 'A little bigger: a curve, then a flick up.'],
    slow: ['It lifts a finger, and drops', 'Quicker: swish and flick is one quick stroke.'],
    windmill: ['It spins round and round', 'Ron waved his arms like a windmill too. One curve, then one flick.'],
    wave: ['It flops over', 'A curve with no flick. Finish with a sharp flick up.'],
    line: ['It flops over', 'Only a line. Swish first: a curve, then the flick.'],
    noswish: ['It twitches', 'The swish should curve, like part of a circle.'],
    flickwiggly: ['It wobbles', 'Keep the flick straight, like a line.'],
    flickaside: ['It scoots along the table', 'The flick went sideways. Flick it up.'],
    flicklong: ['It drifts up, and sinks', 'The flick is short and sharp; the swish is the long part.']
  };

  function setMode(m, now) { F.mode = m; F.t0 = now; }
  /* The traced guide (Godric, 11 October 2026, 9.13 pm: traced at first, larger), now shared by every spell
     (9.30 pm) in guide.js; this page gives only its path: the swish, a curve slow through 0.9 s, and the flick, a
     short straight stroke up in 0.25 s. */
  var qs = new URLSearchParams(location.search);
  var guide = LumosGuide.create({ key: 'lumos.charms.leviosaGuidedHits', parts: [
    { pts: LumosGuide.quad([0, 0], [0.08, 0.75], [0.8, 0.55], 40), secs: 0.9, label: 'swish', at: 0.55, dy: -0.9 },
    { pts: LumosGuide.line([0.8, 0.55], [0.95, -0.15], 16), secs: 0.25, label: 'and flick', at: 0.5, dx: -2.9 }
  ] });
  window.addEventListener('resize', function () { guide.build(W, H); });
  guide.build(W, H);

  /* Baruffio's buffalo (Godric, 11 October 2026, 9.23 pm, on the desk: yes). Flitwick, PS 10: "never forget Wizard
     Baruffio, who said 's' instead of 'f' and found himself on the floor with a buffalo on his chest." A wildly wrong
     stroke (Ron's windmill), at most once a day, brings a cartoon buffalo down on the table beside the feather; it
     sits there looking puzzled, then gets up and wanders off. After it, a tap on the word card answers in Hermione's
     words (PS 10): "It's Wing-gar-dium Levi-o-sa, make the 'gar' nice and long." ?buffalo=always to try it on every
     windmill, ?buffalo=off never. */
  var BKEY = 'lumos.charms.buffaloDay', B = null, afterBuffalo = false;
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function buffaloDue() {
    if (qs.get('buffalo') === 'always') return true;
    if (qs.get('buffalo') === 'off') return false;
    try { return localStorage.getItem(BKEY) !== today(); } catch (e) { return false; }
  }
  function buffaloSize() { return S * 0.36; }
  function startBuffalo(now) {
    try { localStorage.setItem(BKEY, today()); } catch (e) {}
    var u = buffaloSize();
    var x = Math.min(W - u * 0.5, restPos().x + featherLen() * 0.5 + u * 0.62);
    B = { phase: 'fall', t0: now, x: x, y: -u, vy: 0, face: -1 };   /* facing the feather, puzzled by it */
    afterBuffalo = true;
  }
  function thump() {
    if (!audio) return; var now = audio.currentTime;
    var o = audio.createOscillator(), gn = audio.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(95, now); o.frequency.exponentialRampToValueAtTime(38, now + 0.3);
    gn.gain.setValueAtTime(0.45, now); gn.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
    o.connect(gn); gn.connect(audio.destination); o.start(now); o.stop(now + 0.45);
  }
  function grunt() {
    if (!audio) return; var now = audio.currentTime;
    var o = audio.createOscillator(), f = audio.createBiquadFilter(), gn = audio.createGain(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, now); o.frequency.exponentialRampToValueAtTime(92, now + 0.55);
    f.type = 'lowpass'; f.frequency.value = 520;
    gn.gain.setValueAtTime(0, now); gn.gain.linearRampToValueAtTime(0.16, now + 0.06); gn.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    o.connect(f); f.connect(gn); gn.connect(audio.destination); o.start(now); o.stop(now + 0.65);
  }
  function dustAt(x, y, n) {
    for (var i = 0; i < n; i++) parts.push({ k: 'smoke', x: x + (Math.random() - 0.5) * buffaloSize(), y: y, vx: (Math.random() - 0.5) * 2.2, vy: -Math.random() * 1.2, life: 1, dec: 0.02, r: S * 0.02 });
  }
  function stepBuffalo(now) {
    if (!B) return;
    var t = (now - B.t0) / 1000, ground = tableY() + S * 0.005;
    if (B.phase === 'fall') {
      B.y = -buffaloSize() + 0.5 * S * 7.8 * t * t;   /* by the clock, so a 120 Hz screen looks the same as a 60 */
      if (B.y >= ground) {
        B.y = ground; B.phase = 'sit'; B.t0 = now; thump(); dustAt(B.x, ground, 14);
        sayEl.textContent = 'A buffalo!';
        whyEl.textContent = 'Never forget Wizard Baruffio, who said ‘s’ instead of ‘f’ and found himself on the floor with a buffalo on his chest.';
      }
    } else if (B.phase === 'sit') {
      B.y = ground;
      if (t > 1.2 && !B.grunted) { B.grunted = true; grunt(); }
      if (t > 5.5) { B.phase = 'walk'; B.t0 = now; B.face = 1; B.x0 = B.x; }   /* it turns round and wanders off */
    } else if (B.phase === 'walk') {
      B.y = ground; B.x = B.x0 + S * 0.19 * t;
      if (B.x > W + buffaloSize()) B = null;
    }
  }
  function drawBuffalo(now) {
    if (!B) return;
    var u = buffaloSize(), t = (now - B.t0) / 1000, sit = B.phase !== 'walk', fall = B.phase === 'fall';
    var squash = (B.phase === 'sit' && t < 0.25) ? 1 - 0.18 * Math.sin(t / 0.25 * Math.PI) : 1;
    cx.save();
    /* its shadow on the table, smaller while it is still in the air */
    var air = Math.min(0.9, Math.max(0, (tableY() - B.y) / H));
    cx.fillStyle = 'rgba(0,0,0,' + (0.38 * Math.max(0, 1 - air * 2)) + ')';
    cx.beginPath(); cx.ellipse(B.x, tableY() + S * 0.008, u * 0.55 * (1 - air), u * 0.07 * (1 - air), 0, 0, 7); cx.fill();
    cx.translate(B.x, B.y); cx.scale(B.face, squash);
    var bob = sit ? 0 : Math.abs(Math.sin(t * 7)) * u * 0.03;
    cx.translate(0, -bob);
    /* legs: tucked under while it sits, walking when it goes */
    cx.fillStyle = '#2c1a0f';
    if (sit) {
      [[-0.32, -0.04], [0.22, -0.04]].forEach(function (l) { cx.beginPath(); cx.ellipse(l[0] * u, l[1] * u, u * 0.13, u * 0.06, 0, 0, 7); cx.fill(); });
    } else {
      [-0.32, -0.18, 0.16, 0.3].forEach(function (lx, i) {
        var sw = Math.sin(t * 7 + (i % 2) * Math.PI) * u * 0.05;
        cx.fillRect(lx * u + sw - u * 0.035, -u * 0.18, u * 0.07, u * 0.18);
        cx.fillStyle = '#1a0f08'; cx.fillRect(lx * u + sw - u * 0.04, -u * 0.03, u * 0.08, u * 0.03); cx.fillStyle = '#2c1a0f';
      });
    }
    var lift = sit ? u * 0.02 : u * 0.16;
    /* the tail, with its tuft */
    cx.strokeStyle = '#3a2414'; cx.lineWidth = u * 0.025; cx.lineCap = 'round';
    var tw = Math.sin(now / 260) * u * 0.05;
    cx.beginPath(); cx.moveTo(-u * 0.48, -lift - u * 0.22); cx.quadraticCurveTo(-u * 0.62, -lift - u * 0.12, -u * 0.6 + tw, -lift - u * 0.02); cx.stroke();
    cx.fillStyle = '#24150b'; cx.beginPath(); cx.ellipse(-u * 0.6 + tw, -lift, u * 0.03, u * 0.05, 0, 0, 7); cx.fill();
    /* the body, and the shaggy hump over the shoulders */
    cx.fillStyle = '#74492a'; cx.beginPath(); cx.ellipse(-u * 0.06, -lift - u * 0.2, u * 0.46, u * 0.22, 0, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(255,214,160,0.16)'; cx.beginPath(); cx.ellipse(-u * 0.12, -lift - u * 0.3, u * 0.3, u * 0.08, 0, 0, 7); cx.fill();
    cx.fillStyle = '#4e301b'; cx.beginPath(); cx.ellipse(u * 0.18, -lift - u * 0.3, u * 0.28, u * 0.26, -0.2, 0, 7); cx.fill();
    cx.fillStyle = '#3e2615';
    for (var k = 0; k < 7; k++) { cx.beginPath(); cx.arc(u * (0.02 + k * 0.055), -lift - u * (0.5 - Math.sin(k / 6 * Math.PI) * 0.06), u * 0.045, 0, 7); cx.fill(); }
    /* the head, tilted while it wonders where it is */
    var tilt = sit && !fall ? Math.sin(Math.min(1, t / 0.8) * Math.PI / 2) * 0.28 + Math.sin(now / 700) * 0.04 : 0;
    cx.save(); cx.translate(u * 0.42, -lift - u * 0.22); cx.rotate(tilt);
    cx.fillStyle = '#4e301b'; cx.beginPath(); cx.ellipse(0, 0, u * 0.16, u * 0.15, 0, 0, 7); cx.fill();
    cx.fillStyle = '#9a7250'; cx.beginPath(); cx.ellipse(u * 0.08, u * 0.08, u * 0.11, u * 0.08, 0, 0, 7); cx.fill();
    cx.fillStyle = '#2a1608'; cx.beginPath(); cx.arc(u * 0.05, u * 0.08, u * 0.016, 0, 7); cx.arc(u * 0.13, u * 0.08, u * 0.016, 0, 7); cx.fill();
    /* the horns, pale and curling up */
    cx.strokeStyle = '#e4d6b8'; cx.lineWidth = u * 0.04;
    cx.beginPath(); cx.moveTo(-u * 0.08, -u * 0.1); cx.quadraticCurveTo(-u * 0.22, -u * 0.12, -u * 0.18, -u * 0.26); cx.stroke();
    cx.beginPath(); cx.moveTo(u * 0.08, -u * 0.11); cx.quadraticCurveTo(u * 0.22, -u * 0.14, u * 0.2, -u * 0.28); cx.stroke();
    /* the eyes, looking up and about; one brow raised */
    var blink = (now % 2600) < 120 ? 0.15 : 1, look = Math.sin(now / 900) * u * 0.012;
    [-0.05, 0.07].forEach(function (ex, i) {
      cx.fillStyle = '#f6efe0'; cx.beginPath(); cx.ellipse(ex * u, -u * 0.04, u * 0.035, u * 0.04 * blink, 0, 0, 7); cx.fill();
      if (blink > 0.5) { cx.fillStyle = '#111'; cx.beginPath(); cx.arc(ex * u + look, -u * 0.055, u * 0.017, 0, 7); cx.fill(); }
      cx.strokeStyle = '#1a0f08'; cx.lineWidth = u * 0.014;
      cx.beginPath(); cx.moveTo(ex * u - u * 0.035, -u * (i ? 0.13 : 0.095)); cx.lineTo(ex * u + u * 0.035, -u * (i ? 0.11 : 0.095)); cx.stroke();
    });
    cx.restore();
    cx.restore();
    /* a question mark over its head while it sits */
    if (B.phase === 'sit' && t > 0.5) {
      var qa = Math.min(1, (t - 0.5) / 0.4) * (t > 5 ? Math.max(0, 1 - (t - 5) / 0.5) : 1);
      cx.save(); cx.globalAlpha = qa; cx.fillStyle = '#ffe9a8';
      cx.font = '700 ' + Math.round(u * 0.28) + 'px Georgia, serif'; cx.textAlign = 'center';
      cx.shadowColor = 'rgba(0,0,0,0.9)'; cx.shadowBlur = 6;
      cx.fillText('?', B.x + B.face * u * 0.5, B.y - u * 0.62 - Math.sin(now / 400) * u * 0.02);
      cx.restore();
    }
  }

  function cast(pts) {
    var now = performance.now(), j = judgeSwishFlick(pts, W, H, ease);
    var lv = guide.level(), tr = F.mode === 'rest' ? guide.score(pts) : null;
    var traced = !!tr && tr.traced;
    var hit = j.verdict === 'leviosa' || traced;
    var line = new Date().toTimeString().slice(0, 8) + ' ' + ease + ' ' + j.verdict + '/' + j.reason +
      ' corner ' + Math.round(j.cornerDeg) + ' swishTurn ' + Math.round(j.swishTurn) + ' flick ' + Math.round(j.flickAngle) +
      ' size ' + j.size.toFixed(2) + ' ' + j.ms + 'ms turns ' + j.turns.toFixed(1) + ' pts ' + pts.length + ' screen ' + W + 'x' + H +
      (tr ? ' guide ' + lv + ' cov ' + tr.cov.toFixed(2) + ' dist ' + tr.dist.toFixed(3) + (traced ? ' traced' : '') : '');
    if (j.reason !== 'tap') { logLines.unshift(line); if (logLines.length > 200) logLines.pop(); document.getElementById('logText').textContent = logLines.join('\n'); }
    if (j.reason === 'tap') {
      /* a tap on the feather prods it, as Seamus did: it smokes; a second tap pats it out */
      if (inFeather(pts[0]) && F.mode === 'rest') {
        if (F.smoke > 0) { F.smoke = 0; sayEl.textContent = 'Pat, pat'; whyEl.textContent = 'Out. Harry used his hat.'; }
        else { F.smoke = 1; sayEl.textContent = 'You prodded it!'; whyEl.textContent = 'Seamus prodded his feather and set fire to it. Tap again to pat it out.'; }
      }
      guide.clear();
      return j;
    }
    if (hit) {
      guide.hit(lv > 0);
      F.smoke = 0; chime(); setMode('rise', now); F.hoverUntil = now + 7000;
      F.tx = W * 0.5; F.ty = H * 0.3;
      mark = j.verdict === 'leviosa' ? { at: now, pts: j.pts, corner: j.corner, deg: j.cornerDeg } : null;
      sayEl.textContent = 'Wingardium Leviosa!';
      whyEl.textContent = 'It flies. Drag a finger to steer it.';
    } else {
      guide.miss();
      fizz(); sparksAt(wandTip(), 10);
      if (F.mode !== 'rest') { setMode('fall', now); }
      else if (j.reason === 'windmill') { setMode('spin', now); if (!B && buffaloDue()) startBuffalo(now); }
      else if (j.reason === 'flickaside') { setMode('scoot', now); F.vx = (j.flickAngle > 0 ? 1 : -1) * S * 0.006; }
      else if (j.reason === 'slow' || j.reason === 'flicklong') setMode('hop', now);
      else if (j.reason === 'wave' || j.reason === 'line') setMode('flop', now);
      else setMode('twitch', now);
      /* the small gold sketch beside his stroke only once the guide has gone, never two guides at once (Godric, 9.44 pm) */
      if (j.reason !== 'windmill' && !guide.level()) ghost = { at: now, pts: pts };
      sayEl.textContent = WHY[j.reason][0]; whyEl.textContent = WHY[j.reason][1];
    }
    return j;
  }

  /* The feather's moves, by mode. */
  function stepFeather(now) {
    var t = (now - F.t0) / 1000, r = restPos(), base = -Math.PI / 2 + 0.08;
    switch (F.mode) {
      case 'rest': F.y = r.y; F.rot += (base - F.rot) * 0.2; break;
      case 'rise':
        var k = Math.min(1, t / 1.6), ease2 = 1 - Math.pow(1 - k, 3);
        F.x = r.x + (F.tx - r.x) * ease2; F.y = r.y + (F.ty - r.y) * ease2;
        F.rot = base + (-0.35 - base) * ease2;
        if (k >= 1) setMode('hover', now);
        break;
      case 'hover':
        F.x += (F.tx - F.x) * 0.08 + Math.sin(now / 900) * 0.3;
        F.y += (F.ty + Math.sin(now / 650) * S * 0.015 - F.y) * 0.08;
        F.rot = -0.35 + Math.sin(now / 1100) * 0.18 + (F.tx - F.x) * 0.002;
        if (now > F.hoverUntil && !dragging) setMode('fall', now);
        break;
      case 'fall':
        F.y += S * 0.0035; F.x += Math.sin(now / 300) * 1.4; F.rot += (base - F.rot) * 0.03 + Math.sin(now / 300) * 0.01;
        if (F.y >= r.y) { F.y = r.y; setMode('settle', now); }
        break;
      case 'settle': F.x += (r.x - F.x) * 0.06; F.rot += (base - F.rot) * 0.1; if (t > 1.2) { F.x = r.x; setMode('rest', now); } break;
      case 'twitch': F.rot = base + Math.sin(t * 40) * 0.08 * Math.max(0, 1 - t / 0.6); if (t > 0.6) setMode('rest', now); break;
      case 'flop':
        F.rot = base + Math.sin(t * 30) * 0.1 * Math.max(0, 1 - t / 0.5);
        if (t > 0.5 && t < 0.9) { F.y = r.y - Math.sin((t - 0.5) / 0.4 * Math.PI) * S * 0.04; }
        if (t >= 0.7 && F.flipped !== F.t0) { F.flip = -F.flip; F.flipped = F.t0; }
        if (t > 1) setMode('rest', now);
        break;
      case 'hop': F.y = r.y - Math.max(0, Math.sin(Math.min(1, t / 0.7) * Math.PI)) * S * 0.035; if (t > 0.8) setMode('rest', now); break;
      case 'spin': F.rot = base + t * Math.PI * 4 * Math.max(0, 1 - t / 1.4); if (t > 1.4) setMode('rest', now); break;
      case 'scoot':
        F.x += F.vx; F.vx *= 0.94; F.rot = base + Math.sin(t * 25) * 0.05;
        if (t > 1) { setMode('settle', now); }
        break;
    }
    if (F.smoke > 0 && Math.random() < 0.35) smokeAt(tipOfFeather());
  }

  /* The stroke: the first finger only. While the feather flies, a finger steers it instead of casting. */
  var activeId = null, dragging = false;
  function pt(ev) { return { x: ev.clientX, y: ev.clientY, t: Math.round(performance.now()) }; }
  cv.addEventListener('pointerdown', function (ev) {
    if (activeId !== null) return;
    ensureAudio(); activeId = ev.pointerId;
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    if (F.mode === 'hover' || F.mode === 'rise') { dragging = true; F.tx = ev.clientX; F.ty = Math.min(ev.clientY, tableY() - S * 0.12); stroke = null; }
    else { stroke = [pt(ev)]; guide.cover(stroke[0]); }
    ev.preventDefault();
  });
  cv.addEventListener('pointermove', function (ev) {
    if (ev.pointerId !== activeId) return;
    if (dragging) { F.tx = ev.clientX; F.ty = Math.min(ev.clientY, tableY() - S * 0.12); F.hoverUntil = performance.now() + 4000; }
    else if (stroke) {
      var list = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev]; if (!list.length) list = [ev];
      list.forEach(function (e2) { var q = pt(e2); stroke.push(q); guide.cover(q); });
    }
    ev.preventDefault();
  });
  cv.addEventListener('pointerup', function (ev) {
    if (ev.pointerId !== activeId) return;
    activeId = null;
    if (dragging) { dragging = false; return; }
    stroke.push(pt(ev)); var pts = stroke; stroke = null;
    trails.push({ pts: pts, life: 1 }); cast(pts);
  });
  cv.addEventListener('pointercancel', function (ev) { if (ev.pointerId === activeId) { activeId = null; stroke = null; dragging = false; } });
  document.addEventListener('touchmove', function (e) { if (!e.target.closest || !e.target.closest('#log')) e.preventDefault(); }, { passive: false });

  /* The word, read aloud for him by the device's own voice, slowly, the "gar" nice and long (PS 10). */
  document.getElementById('word').addEventListener('click', function () {
    var hermione = afterBuffalo; afterBuffalo = false;
    if (hermione) { sayEl.textContent = 'It\u2019s Wing-gar-dium Levi-o-sa,'; whyEl.textContent = 'make the \u2018gar\u2019 nice and long. (Hermione)'; }
    if (!window.speechSynthesis) { if (!hermione) whyEl.textContent = 'This device cannot read it aloud.'; return; }
    var u = new SpeechSynthesisUtterance(hermione ? 'It\'s Wing-gaaar-dium Levi-oh-sa. Make the gaaar nice and long.' : 'Wing-gaaar-dium Levi-oh-sa');
    u.lang = 'en-GB'; u.rate = 0.75;
    var v = speechSynthesis.getVoices().filter(function (x) { return /en-GB/i.test(x.lang); })[0]; if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    if (hermione) return;
    sayEl.textContent = 'Wing-gar-dium Levi-o-sa'; whyEl.textContent = 'Make the "gar" nice and long.';
  });

  document.getElementById('guideBtn').addEventListener('click', function () {
    guide.reset();
    sayEl.textContent = 'Swish and flick'; whyEl.textContent = 'Start at the glowing dot and follow the gold path.';
  });
  var easeBtn = document.getElementById('ease'), order = ['kind', 'fair', 'strict'];
  easeBtn.addEventListener('click', function () { ease = order[(order.indexOf(ease) + 1) % 3]; easeBtn.textContent = 'Ease: ' + ease; });
  var logEl = document.getElementById('log');
  document.getElementById('logBtn').addEventListener('click', function () { logEl.style.display = logEl.style.display === 'block' ? 'none' : 'block'; });
  document.getElementById('close').addEventListener('click', function () { logEl.style.display = 'none'; });
  document.getElementById('copy').addEventListener('click', function () {
    var txt = navigator.userAgent + '\n' + logLines.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { document.getElementById('copy').textContent = 'Copied'; });
  });

  var frames = 0, t0 = performance.now();
  function frame(now) {
    stepFeather(now); stepBuffalo(now);
    drawRoom(); drawFeather(); drawBuffalo(now); drawWand();
    stepParts(); drawParts();
    if (F.mode !== 'rise' && F.mode !== 'hover' && F.mode !== 'fall') guide.draw(cx, now, !!stroke);   /* shown through a miss's twitch, hidden while it flies */
    drawStroke(); drawGhost(now); drawMark(now);
    frames++;
    if (now - t0 > 2000) { window.lumosStats = Math.round(frames * 1000 / (now - t0)) + ' fps'; frames = 0; t0 = now; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.lumosCharms = { cast: cast, judge: judgeSwishFlick, feather: function () { return { mode: F.mode, x: Math.round(F.x), y: Math.round(F.y) }; },
    guide: guide.state, buffalo: function () { return B ? { phase: B.phase, x: Math.round(B.x), y: Math.round(B.y) } : null; } };
})();
</script>
