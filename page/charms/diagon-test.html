<style>

<body>
<canvas id="c"></canvas>
<div id="line"></div>
<div id="panel"></div>
<script src="spells.js?v=39"></script>
<script>
/* The chalk wall, a test page for the Charms lane (13 October 2026, fortieth session; the owner is Godric).
   Rework 19 of the Ministry's list (16 October 2026): the lesson moves to a castle wall, the back wall of Flitwick's
   room, counted from the coal scuttle at its foot (the code keeps the name bin); the rounds are the wall's way and
   counting from the left, with no Hagrid and no Harry; Hagrid's "Three up... two across..." (PS 5) is only a wink,
   pencilled in a book's margin; the right brick slides back on a dusty cubbyhole, not an arch onto Diagon Alley;
   "across first, as maths books write it" is Flitwick's "Along the corridor first, then up the stairs" (Rework 4);
   no brick glows: the one to name is ringed in steady chalk (GL-14). The wall in the classroom itself is asked of
   its builder by row. What follows is the page as first built.
   Drawn in code. Q10, option 1: coordinates, geometry beyond angles. The books: in the little walled courtyard behind
   the Leaky Cauldron, "Three up... two across..." Hagrid muttered, and tapped the wall three times with the point of
   his umbrella; the brick quivered, it wriggled, a small hole appeared and grew wider and wider into an archway (PS 5);
   a summer later Harry's own way in, "tap the third brick from the left above the dustbin" (PoA 4). The geometry is
   the lane's: two numbers name one brick, counted from one corner, the bin; up and across the other way round is
   another brick; one number alone names a whole column. Hagrid counts steps from the bin's column (two across),
   Harry counts bricks from the left (the third): the same brick. Rounds: Hagrid's way; Harry's way (one number lights
   the column, then the height); the chalk grid (forty-first session: numbers chalked along the bottom from the bin's
   column, 0, and up it, 1, 2, 3...; the page names a pair across first, as maths books write it, and he finds the
   brick, the second pair Hagrid's own; then the other way, a brick glows and he names its pair from the chalk, the
   number along the bottom, then the one up the side). The cast is three taps on one brick at an even beat (judgeTaps,
   place: false); which brick by LumosSpells.judgeBrick (spells.js), tallied in checks/diagon-tally.js. A button lays the
   wall straight or real (the running bond, every other course shifted half a brick, the bat counted, as the judge counts
   it) on Hagrid's and Harry's ways; the chalk grid is always straight. ?round=1..3, ?wall=real, ?ease= for trying;
   window.lumosDiagon for checks. */
(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), lineEl = document.getElementById('line'), panel = document.getElementById('panel');
  var W = 0, H = 0, DPR = 1, audio = null, qs = new URLSearchParams(location.search);
  var EASES = ['kind', 'fair', 'strict'], ease = EASES.indexOf(qs.get('ease')) >= 0 ? qs.get('ease') : 'kind';
  var ROUNDS = [
    { name: 'The wall’s way', kind: 'hagrid', want: { a: 2, u: 3 } },
    { name: 'From the left', kind: 'harry', want: { a: 2, u: 3 } },
    { name: 'Chalk grid', kind: 'grid', want: { a: 4, u: 2 }, finds: [{ a: 4, u: 2 }, { a: 2, u: 3 }], names: [{ a: 3, u: 4 }, { a: 1, u: 5 }] } ];
  var round = Math.max(0, Math.min(ROUNDS.length - 1, (Number(qs.get('round')) || 1) - 1)), R = ROUNDS[round];
  var run = [], runKey = null, stage = 'cast', last = null, shown = null, open = null, lit = null, running = qs.get('wall') === 'real';
  var step = 0, pair = null, target = null, picks = null, timers = [];   /* the chalk grid: which pair, the pair drawn, the brick to name and what he has named */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  /* the wall, as checks/diagon-tally.js lays it out: six courses above the bin's lid and two beside it; five bricks
     across on a narrow screen, six on a wide one; a course at most 56 px, the brick 1.6 to 2.6 times as long; the
     ground kept clear of the buttons when they wrap to a second row on a phone */
  function wallOf() {
    var top = Math.max(110, H * 0.16), bot = Math.min(H - 70, (panel.getBoundingClientRect().top || H) - 8), cols = W >= 700 ? 6 : 5, rows = 6, below = 2;
    var bh = Math.min(56, (bot - top) / (rows + below + 0.6)), bw = Math.min(W * 0.92 / cols, bh * 2.6);
    if (bw < bh * 1.6) bh = bw / 1.6;
    var x = W / 2 - cols * bw / 2, y = bot - below * bh;
    return { x: x, y: y, bw: bw, bh: bh, cols: cols, rows: rows, below: below, running: running && R.kind !== 'grid',
      bin: { x: x + bw * 0.08, y: y + 2, w: bw * 0.84, h: below * bh - 2 } };
  }
  function course(w, u) {   /* the bricks of course u, left to right, each [a, x0, x1]; a shifted course starts with its bat */
    var out = [], x = w.x, end = w.x + w.cols * w.bw, a = 0;
    if (w.running && u % 2 === 0) { out.push([0, x, x + w.bw / 2]); x += w.bw / 2; a = 1; }
    for (; x < end - 1e-6; a++) { var x1 = Math.min(end, x + w.bw); out.push([a, x, x1]); x = x1; }
    return out;
  }
  function mid(w, a, u) { var b = course(w, u).filter(function (q) { return q[0] === a; })[0]; return b ? { x: (b[1] + b[2]) / 2, y: w.y - (u - 0.5) * w.bh } : null; }

  function say(html) { lineEl.innerHTML = html; }
  function ensureAudio() { if (audio) { if (audio.state === 'suspended') audio.resume(); return; } var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
  function tone(freq, dur, gain, type) {
    if (!audio) return;
    var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type || 'sine'; o.frequency.value = freq; g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
  }

  function menu() {
    panel.innerHTML = '';
    ROUNDS.forEach(function (r, i) {
      var b = document.createElement('button'); b.textContent = r.name; if (i === round) b.className = 'on';
      b.onclick = function () { ensureAudio(); choose(i); }; panel.appendChild(b);
    });
    var e = document.createElement('button'); e.textContent = 'Ease: ' + ease;
    e.onclick = function () { ease = EASES[(EASES.indexOf(ease) + 1) % 3]; menu(); }; panel.appendChild(e);
    if (R.kind === 'grid') return;   /* the chalk grid is always stacked straight: a grid is drawn square */
    var b = document.createElement('button'); b.textContent = 'Wall: ' + (running ? 'real' : 'straight'); b.id = 'wallKind';
    b.onclick = function () { ensureAudio(); running = !running; choose(round); }; panel.appendChild(b);
  }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function choose(i) {
    timers.forEach(clearTimeout); timers = [];
    round = i; R = ROUNDS[i]; run = []; runKey = null; last = null; shown = null; open = null; lit = null;
    step = 0; pair = null; target = null; picks = null;
    stage = R.kind === 'harry' ? 'column' : 'cast'; menu();
    if (R.kind === 'grid') { R.want = R.finds[0]; say('Chalk numbers from the scuttle: <b>across</b> the bottom, <b>up</b> its column. Flitwick&rsquo;s rule, chalked in the corner: <i>along the corridor first, then up the stairs</i>. <b>(4, 2)</b> is 4 along, 2 up. Tap that brick three times.'); }
    else if (R.kind === 'hagrid') say('Pencilled in the margin of an old book on the sill: <b>&ldquo;Three up&hellip; two across&hellip;&rdquo;</b> Count from the coal scuttle, then tap that brick <b>three times</b>.');
    else say('Another way to count: <b>the third brick from the left</b>, above the coal scuttle. Tap it.');
  }

  /* ---- the spell ---- */
  var ORD = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh'];
  function bricks(n) { return n + (n === 1 ? ' brick' : ' bricks'); }
  function missWords(j) {
    var want = R.want, d;
    switch (j.reason) {
      case 'swapped': return 'That brick wriggled and sneezed a puff of mortar dust. That was ' + j.brick.u + ' up, ' + j.brick.a + ' across: The margin counts <b>up first</b>, ' + want.u + ', <b>then across</b>, ' + want.a + '.';
      case 'column': d = j.du; return 'The right column, ' + want.a + ' across, but ' + bricks(Math.abs(d)) + ' too ' + (d > 0 ? 'high' : 'low') + ': count ' + want.u + ' up from the top of the scuttle.';
      case 'row': d = j.da; return 'The right height, ' + want.u + ' up, but ' + bricks(Math.abs(d)) + ' too far ' + (d > 0 ? 'right' : 'left') + ': ' + want.a + ' across from the scuttle&rsquo;s column.';
      case 'off': return 'That was ' + j.brick.u + ' up and ' + j.brick.a + ' across. Start at the scuttle: <b>' + want.u + ' up</b>, then <b>' + want.a + ' across</b>.';
      case 'below': return 'That one is level with the scuttle. Count up from the top of the scuttle: the first brick above its lid is <b>one up</b>.';
      case 'bin': return 'That&rsquo;s the coal scuttle itself. Start counting from it: the brick just above its lid is one up.';
      default: return 'Tap a brick in the wall.';
    }
  }
  function pairOf(b) { return '(' + b.a + ', ' + b.u + ')'; }
  function gridMiss(j) {   /* the chalk grid's words: across first */
    var want = R.want, d;
    switch (j.reason) {
      case 'swapped': return 'That brick wriggled and sneezed a puff of mortar dust. That was ' + pairOf(j.brick) + ': <b>across first, then up</b>. The margin says it the other way round.';
      case 'column': d = j.du; return 'The right column, ' + want.a + ' across, but ' + bricks(Math.abs(d)) + ' too ' + (d > 0 ? 'high' : 'low') + ': then ' + want.u + ' up, by the chalk on the scuttle&rsquo;s column.';
      case 'row': d = j.da; return 'The right height, ' + want.u + ' up, but ' + bricks(Math.abs(d)) + ' too far ' + (d > 0 ? 'right' : 'left') + ': find ' + want.a + ' along the bottom first.';
      case 'off': return 'That was ' + pairOf(j.brick) + '. Across first: <b>' + want.a + '</b> along the bottom, then <b>' + want.u + '</b> up.';
      case 'below': return 'That&rsquo;s the bottom course, where the across numbers are chalked. Find ' + want.a + ' there, then count <b>' + want.u + ' up</b>.';
      case 'bin': return 'That&rsquo;s the coal scuttle, the corner where both counts start: 0 across. Find ' + want.a + ' along the bottom.';
      default: return 'Tap a brick in the wall.';
    }
  }
  function found(j) {   /* the chalk grid's first pair: the brick quivers and the count is drawn, across first; then Hagrid's pair */
    stage = 'shown'; shown = { at: performance.now(), j: j }; pair = { a: R.want.a, u: R.want.u, at: performance.now() };
    [0, 1].forEach(function (k) { setTimeout(function () { tone(587 + k * 196, 0.4, 0.12); }, k * 140); });
    say('<b>' + pairOf(R.want) + '</b>: ' + R.want.a + ' along the bottom, then ' + R.want.u + ' up. Along the corridor first, then up the stairs.');
    later(function () {
      step = 1; R.want = R.finds[1]; pair = null; shown = null; stage = 'cast';
      say('Now <b>' + pairOf(R.want) + '</b>: ' + R.want.a + ' across, then ' + R.want.u + ' up. Tap it three times.');
    }, 3600);
  }
  function startName() {   /* the other way round: a brick glows and he names its pair from the chalk */
    open = null; pair = null; shown = null; stage = 'name'; target = R.names[step]; picks = { a: null, at: 0 };
    say(step === 0 ? 'Now the other way: name the brick ringed in chalk. Tap its number <b>along the bottom</b>, then its number <b>up the side</b>.'
      : 'And this one: its number along the bottom, then up the side.');
  }
  /* where the chalk is: the across numbers on the bottom course beside the bin and 0 on the bin, counted by the bin's
     columns; the up numbers on the bin's column. Anywhere else is the field */
  function labelAt(p, w) {
    var B = w.bin;
    if (p.x >= B.x && p.x <= B.x + B.w && p.y >= B.y && p.y <= B.y + B.h) return { axis: 'a', n: 0 };
    var b = LumosSpells.brickAt(p, w); if (!b) return null;
    if (b.u <= 0) return { axis: 'a', n: Math.floor((p.x - w.x) / w.bw) };
    if (p.x < w.x + w.bw) return { axis: 'u', n: b.u };
    return { axis: 'field', brick: b };
  }
  function nameTap(p, w) {
    var L = labelAt(p, w), T = target, j = { label: L, reason: 'away' };
    last = { j: j }; tone(L && L.axis !== 'field' ? 560 : 300, 0.07, 0.18, 'triangle');
    if (!L) { say('Name it from the chalk: its number along the bottom, then up the side.'); return j; }
    if (L.axis === 'field') { j.reason = 'field'; say('Not the brick itself: name it from the chalk. Its number <b>along the bottom</b> first.'); return j; }
    if (picks.a === null) {
      if (L.axis === 'u') { j.reason = 'up first'; say('Along the corridor first, then up the stairs: its number <b>along the bottom</b>, then up.'); return j; }
      if (L.n !== T.a) { j.reason = 'across'; say('That&rsquo;s ' + L.n + ' along the bottom. Follow the ringed brick&rsquo;s column straight down to its number.'); return j; }
      picks.a = L.n; j.reason = 'across right'; tone(660, 0.25, 0.1);
      say('<b>' + T.a + ' across.</b> Now its number <b>up the side</b>, on the scuttle&rsquo;s column.'); return j;
    }
    if (L.axis === 'a') { j.reason = 'across again'; say('You have its across, ' + picks.a + '. Now its number <b>up the side</b>, on the scuttle&rsquo;s column.'); return j; }
    if (L.n !== T.u) { j.reason = 'up'; say('That&rsquo;s ' + L.n + ' up. Follow the ringed brick&rsquo;s course across to the scuttle&rsquo;s column.'); return j; }
    j.reason = 'right'; stage = 'named'; picks.at = performance.now(); pair = { a: T.a, u: T.u, at: performance.now() };
    [0, 1, 2].forEach(function (k) { setTimeout(function () { tone(523 + k * 131, 0.45, 0.12); }, k * 140); });
    say('<b>' + pairOf(T) + '</b>: ' + T.a + ' across, ' + T.u + ' up.');
    later(function () {
      if (++step < R.names.length) return startName();
      stage = 'done'; target = null;
      say('Two numbers, <b>across first</b>, name one brick; swap them and it is another brick. The margin says them the other way round, so count carefully.');
    }, 3000);

  }
  function tapAt(p) {

    var w = wallOf();
    if (stage === 'column') return columnTap(p, w);
    if (stage === 'name') return nameTap(p, w);
    var j = LumosSpells.judgeBrick(p, w, R.want, ease), key = j.brick ? j.brick.a + ',' + j.brick.u : j.reason;
    if (key !== runKey || (run.length && p.t - run[run.length - 1].t > 1500)) { run = []; runKey = key; }
    run.push(p); tone(j.brick ? 520 : 300, 0.07, 0.18, 'triangle');
    if (run.length < 3) return j;
    var jt = LumosSpells.judgeTaps(run, W, H, { gap: 1500, beat: LumosSpells.TAP_EASES[ease].beat, place: false });
    last = { j: j, beat: jt }; run = []; runKey = null;
    if (jt.verdict !== 'open') { shown = { at: performance.now(), j: j, beat: true }; say('Keep an even beat, like a clock: tap &hellip; tap &hellip; tap.'); return j; }
    if (j.verdict === 'right' && R.kind === 'grid' && step === 0) { found(j); return j; }
    if (j.verdict === 'right') { stage = 'open'; open = { at: performance.now() }; shown = null; opening(); return j; }
    shown = { at: performance.now(), j: j }; tone(j.reason === 'swapped' ? 180 : 240, 0.3, 0.15);
    say(R.kind === 'grid' ? gridMiss(j) : missWords(j));
    return j;
  }
  function columnTap(p, w) {
    var b = LumosSpells.brickAt(p, w), B = w.bin, j = { brick: b, reason: b ? (b.u < 1 ? 'below' : 'column') : 'away' };
    if (p.x >= B.x && p.x <= B.x + B.w && p.y >= B.y && p.y <= B.y + B.h) j.reason = 'bin';
    tone(b ? 520 : 300, 0.07, 0.18, 'triangle'); last = { j: j };
    if (j.reason === 'column' && b.a === R.want.a) {
      stage = 'cast'; lit = { a: b.a, at: performance.now() }; tone(660, 0.4, 0.1);
      say('The third brick from the left: <b>one number</b>, and it lights a whole column. Above the coal scuttle, but how high? The margin&rsquo;s count gives the other number: <b>three up</b>. Tap that brick three times.' + (w.running ? ' On a real wall every other course is shifted half a brick, so the third brick zigzags: that is why maths draws its grids square.' : ''));
      return j;
    }
    shown = { at: performance.now(), j: j };
    if (j.reason === 'column') say('That&rsquo;s the ' + ORD[b.a] + ' brick from the left. Count from the left end, the scuttle&rsquo;s column first: first, second, <b>third</b>.');
    else say(missWords(j));
    return j;
  }
  function opening() {
    tone(90, 0.6, 0.25, 'sawtooth');
    say('<b>The brick quivers &hellip; and slides back</b> on a dusty cubbyhole, empty but for a stub of chalk.');
    later(function () { [0, 1, 2].forEach(function (k) { setTimeout(function () { tone(523 + k * 131, 0.5, 0.12); }, k * 150); }); }, 1700);
    later(function () {
      stage = 'done'; LumosSpells.learn('diagon');
      if (R.kind === 'grid') {   /* Hagrid's own brick: the wall comes back, the count is drawn across first, then the other way */
        pair = { a: R.want.a, u: R.want.u, at: performance.now() + 600 };
        say('<b>(2, 3)</b>: 2 across, 3 up. The margin&rsquo;s own brick: it says it the other way round, <b>&ldquo;three up&hellip; two across&rdquo;</b>.');
        later(function () { step = 0; startName(); }, 4200);
      }
      else if (R.kind === 'hagrid') say('From the scuttle: <b>' + R.want.u + ' up</b>, then <b>' + R.want.a + ' across</b>. Two numbers, counted from one corner, name one brick.');
      else say('The margin counts steps from the scuttle&rsquo;s column: <b>two across</b>. From the left, it is <b>the third</b> brick. Two ways to count, one brick; and one number alone names a whole column.');

  /* ---- drawing ---- */
  function shade(a, u) { var h = Math.sin(a * 12.9898 + u * 78.233) * 43758.5453; h -= Math.floor(h); return h; }

  function drawWall(w, now) {

      if (open && a === R.want.a && u === R.want.u) { var q = (now - open.at) / 1000; if (q < 0.9) { dx = Math.sin(q * 55) * 2.5; dy = Math.cos(q * 47) * 1.5; } }
      cx.save(); cx.translate((b[1] + b[2]) / 2 + dx, y0 + w.bh / 2 + dy); cx.rotate(rot);
      cx.fillStyle = 'rgb(' + Math.round(118 + 28 * s) + ',' + Math.round(54 + 16 * s) + ',' + Math.round(36 + 10 * s) + ')';
      cx.fillRect(-(b[2] - b[1]) / 2 + m / 2, -w.bh / 2 + m / 2, b[2] - b[1] - m, w.bh - m);
      cx.fillStyle = 'rgba(255,220,180,0.07)'; cx.fillRect(-(b[2] - b[1]) / 2 + m / 2, -w.bh / 2 + m / 2, b[2] - b[1] - m, w.bh * 0.22);
      cx.restore();
    });
  }
  function glowBrick(w, a, u, col, lw) {
    var b = course(w, u).filter(function (q) { return q[0] === a; })[0]; if (!b) return;
    cx.strokeStyle = col; cx.lineWidth = lw; cx.strokeRect(b[1] + 2, w.y - u * w.bh + 2, b[2] - b[1] - 4, w.bh - 4);
  }
  function drawBin(w) {   /* the coal scuttle at the wall's foot (Rework 19; it was the Leaky Cauldron's dustbin) */
    var B = w.bin;
    cx.fillStyle = '#2b2a2c'; cx.beginPath(); cx.moveTo(B.x + B.w * 0.06, B.y + B.h * 0.12); cx.lineTo(B.x + B.w * 0.94, B.y + B.h * 0.12);
    cx.lineTo(B.x + B.w * 0.84, B.y + B.h); cx.lineTo(B.x + B.w * 0.16, B.y + B.h); cx.closePath(); cx.fill();
    cx.fillStyle = '#141316'; cx.beginPath(); cx.ellipse(B.x + B.w / 2, B.y + B.h * 0.12, B.w * 0.44, B.h * 0.06, 0, 0, 7); cx.fill();
    cx.strokeStyle = '#4a4648'; cx.lineWidth = 2; cx.beginPath(); cx.arc(B.x + B.w / 2, B.y + B.h * 0.1, B.w * 0.3, Math.PI * 1.05, Math.PI * 1.95); cx.stroke();   /* its handle */
    cx.fillStyle = '#0d0c0e'; [[0.38, 0.06], [0.55, 0.04], [0.47, 0.0]].forEach(function (q) { cx.beginPath(); cx.arc(B.x + B.w * q[0], B.y + B.h * (0.08 + q[1]), B.w * 0.08, 0, 7); cx.fill(); });   /* coal */
  }
  function archPath(w, r, c) {   /* the arch three bricks wide over the wanted one, from the ground to the fifth course, cut by a circle of radius r about c */
    var x0 = w.x + (R.want.a - 1) * w.bw + w.bw * 0.1, x1 = w.x + (R.want.a + 2) * w.bw - w.bw * 0.1, rr = (x1 - x0) / 2, g = w.y + w.below * w.bh, top = w.y - 5 * w.bh + rr;
    cx.beginPath(); cx.arc(c.x, c.y, r, 0, 7); cx.clip();
    cx.beginPath(); cx.moveTo(x0, g); cx.lineTo(x0, top); cx.arc((x0 + x1) / 2, top, rr, Math.PI, 0); cx.lineTo(x1, g); cx.closePath();
  }
  function drawOpen(w, now) {   /* the right brick slides back on a dusty cubbyhole (Rework 19), then slides home */
    var t = (now - open.at) / 1000; if (t < 0.9) return;
    var back = stage === 'done' ? Math.min(1, (t - 5.2) / 0.6) : 0; if (back >= 1) return;
    var b = course(w, R.want.u).filter(function (q) { return q[0] === R.want.a; })[0]; if (!b) return;
    var k = Math.min(1, (t - 0.9) / 0.8) * (1 - back), y0 = w.y - R.want.u * w.bh, m = Math.max(2, w.bh * 0.07);
    cx.save(); cx.globalAlpha = k;
    cx.fillStyle = '#0c0907'; cx.fillRect(b[1] + m / 2, y0 + m / 2, b[2] - b[1] - m, w.bh - m);
    cx.fillStyle = 'rgba(230,222,200,0.8)'; cx.fillRect((b[1] + b[2]) / 2 - w.bw * 0.12, y0 + w.bh * 0.62, w.bw * 0.24, w.bh * 0.1);   /* a stub of chalk */
    cx.restore();
  }
  function chalk(text, x, y, size) {
    cx.font = 'italic ' + size + 'px Georgia, serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.lineWidth = 4; cx.strokeStyle = 'rgba(20,14,10,0.85)'; cx.strokeText(text, x, y); cx.fillStyle = '#f1ead8'; cx.fillText(text, x, y);
  }
  function drawSum(w, now) {   /* after the arch: from the bin, the count up its column and along the course, the brick ringed */
    var t = (now - open.at) / 1000 - 5.8; if (t < 0) return;
    var a = R.want.a, u = R.want.u, base = mid(w, 0, 1), up = mid(w, 0, u), to = mid(w, a, u), f = Math.min(1, t / 1.2);
    base = { x: base.x, y: w.y };
    cx.save(); cx.setLineDash([7, 6]); cx.strokeStyle = '#f1ead8'; cx.lineWidth = 2.5;
    cx.beginPath(); cx.moveTo(base.x, base.y); cx.lineTo(base.x, base.y + (up.y - base.y) * Math.min(1, f * 2));
    if (f > 0.5) cx.lineTo(up.x + (to.x - up.x) * (f - 0.5) * 2, up.y);
    cx.stroke(); cx.restore();
    var s = Math.max(14, w.bh * 0.42);
    for (var k = 1; k <= u && f * 2 >= k / u; k++) chalk(String(k), base.x - w.bw * 0.32, w.y - (k - 0.5) * w.bh, s * 0.8);
    if (f >= 0.5) chalk(u + ' up', base.x, w.y - (u + 0.6) * w.bh, s);
    if (f >= 1) {
      chalk(a + ' across', (up.x + to.x) / 2, up.y - w.bh * 0.62, s);
      cx.strokeStyle = '#f3d27a'; cx.lineWidth = 3; cx.beginPath(); cx.ellipse(to.x, to.y, w.bw * 0.58, w.bh * 0.72, 0, 0, 7); cx.stroke();
      if (R.kind === 'harry') course(w, u).slice(0, 3).forEach(function (b, i) { chalk(['1st', '2nd', '3rd'][i], (b[1] + b[2]) / 2, w.y - (u - 0.5) * w.bh + w.bh * 0.02, s * 0.75); });
    }
  }
  function drawGrid(w) {   /* the chalk: 0 on the bin, 1, 2, 3... along the bottom course by the bin's columns, 1 to 6 up the bin's column */
    var s = Math.max(14, w.bh * 0.42), B = w.bin;
    chalk('0', B.x + B.w / 2, B.y + B.h * 0.42, s);
    for (var n = 1; n < w.cols; n++) chalk(String(n), w.x + (n + 0.5) * w.bw, w.y + w.bh * 0.5, s);
    for (var k = 1; k <= w.rows; k++) chalk(String(k), w.x + w.bw * 0.5, w.y - (k - 0.5) * w.bh, s);
  }
  function drawPair(w, now) {   /* the count drawn across first: from the bin along the lid's line, then up the column, the brick ringed and named */
    var t = (now - pair.at) / 1000; if (t < 0) return;
    var to = mid(w, pair.a, pair.u), o = { x: w.x + w.bw * 0.5, y: w.y }, f = Math.min(1, t / 1.2), s = Math.max(14, w.bh * 0.42);
    cx.save(); cx.setLineDash([7, 6]); cx.strokeStyle = '#f3d27a'; cx.lineWidth = 2.5;
    cx.beginPath(); cx.moveTo(o.x, o.y); cx.lineTo(o.x + (to.x - o.x) * Math.min(1, f * 2), o.y);
    if (f > 0.5) cx.lineTo(to.x, o.y + (to.y - o.y) * (f - 0.5) * 2);
    cx.stroke(); cx.restore();
    if (f >= 1) {
      cx.strokeStyle = '#f3d27a'; cx.lineWidth = 3; cx.beginPath(); cx.ellipse(to.x, to.y, w.bw * 0.58, w.bh * 0.72, 0, 0, 7); cx.stroke();
      chalk(pairOf(pair), to.x, to.y - w.bh * 0.95, s);
    }
  }
  function drawTarget(w, now) {   /* the brick to name glows; once he has its across, the half-named pair is chalked over it */
    var c = mid(w, target.a, target.u);
    cx.fillStyle = 'rgba(243,210,122,' + (0.22 + 0.12 * Math.sin(now / 260)) + ')';
    var b = course(w, target.u).filter(function (q) { return q[0] === target.a; })[0];
    if (b) cx.fillRect(b[1] + 2, w.y - target.u * w.bh + 2, b[2] - b[1] - 4, w.bh - 4);
    glowBrick(w, target.a, target.u, 'rgba(241,234,216,0.95)', 3);   /* ringed in steady chalk */
    if (picks && picks.a !== null && stage === 'name') chalk('(' + picks.a + ', ?)', c.x, c.y - w.bh * 0.95, Math.max(14, w.bh * 0.42));
  }
  function drawPuff(w, now) {
    if (!shown || shown.j.reason !== 'swapped') return;
    var t = (now - shown.at) / 1000; if (t > 1.6) return;
    var c = mid(w, shown.j.brick.a, shown.j.brick.u);
    for (var i = 0; i < 14; i++) {
      var an = i * 2.4, d = (8 + i * 2) * Math.min(1, t * 2.5) * w.bh / 40, x = c.x + Math.cos(an) * d * 1.6, y = c.y + Math.sin(an) * d - t * 14;
      cx.fillStyle = 'rgba(205,195,175,' + (0.55 * (1 - t / 1.6)) + ')'; cx.beginPath(); cx.arc(x, y, 3 + i % 4 + t * 6, 0, 7); cx.fill();
    }
  }
  function frame(now) {
    var w = wallOf();
    drawYard(w); drawWall(w, now); drawBin(w);
    if (lit && stage !== 'done') for (var u = 1; u <= w.rows; u++) glowBrick(w, lit.a, u, 'rgba(241,234,216,0.55)', 2.5);   /* the column chalked once, steady (GL-14) */
    if (run.length && now - run[run.length - 1].t > 1500) { run = []; runKey = null; }
    if (run.length && runKey && runKey.indexOf(',') > 0) { var k = runKey.split(',').map(Number); glowBrick(w, k[0], k[1], 'rgba(241,234,216,0.9)', 3);
      var c = mid(w, k[0], k[1]); for (var i = 0; i < run.length; i++) { cx.fillStyle = '#f3d27a'; cx.beginPath(); cx.arc(c.x - 10 + i * 10, c.y + w.bh * 0.3, 3, 0, 7); cx.fill(); } }
    drawPuff(w, now);
    if (open) { drawOpen(w, now); if (stage === 'done' && R.kind !== 'grid') drawSum(w, now); }
    if (R.kind === 'grid' && !(open && (now - open.at) / 1000 < 5.8)) {   /* the chalk hidden while the arch stands open */
      drawGrid(w);
      if (target) drawTarget(w, now);
      if (pair) drawPair(w, now);
    }
    requestAnimationFrame(frame);
  }

  /* ---- touch: taps only ---- */
  cv.addEventListener('pointerdown', function (ev) {
    ensureAudio(); ev.preventDefault();
    tapAt({ x: ev.clientX, y: ev.clientY, t: Math.round(performance.now()) });
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  addEventListener('resize', resize); resize(); choose(round); requestAnimationFrame(frame);
  window.lumosDiagon = { choose: choose, wall: wallOf, mid: function (a, u) { return mid(wallOf(), a, u); },
    tap: function (x, y) { return tapAt({ x: x, y: y, t: Math.round(performance.now()) }); },
    state: function () { return { round: round + 1, stage: stage, running: wallOf().running, run: run.length, last: last, ease: ease, lit: !!lit, line: lineEl.textContent,
      step: step, want: R.want, target: target, picks: picks, pair: pair }; },
    across: function (n) { var w = wallOf(); return n === 0 ? { x: w.bin.x + w.bin.w / 2, y: w.bin.y + w.bin.h * 0.42 } : { x: w.x + (n + 0.5) * w.bw, y: w.y + w.bh * 0.5 }; },
    upNum: function (k) { var w = wallOf(); return { x: w.x + w.bw * 0.5, y: w.y - (k - 0.5) * w.bh }; } };
})();
</script>
</body>
</html>
