<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dissendium, a test</title>
<style>
  html, body { margin: 0; height: 100%; background: #110d0b; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  #line { position: fixed; left: 50%; transform: translateX(-50%); top: max(12px, env(safe-area-inset-top));
    width: min(92vw, 600px); box-sizing: border-box; text-align: center; padding: 10px 14px;
    font: 17px/1.35 Georgia, 'Times New Roman', serif; color: #eadcbf; background: #1e1611;
    border: 1px solid #4a3a2c; border-radius: 6px; pointer-events: none; }
  #line b { color: #f3d27a; }
  #panel { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex;
    flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 8px; }
  button { font: 15px Georgia, serif; color: #eadcbf; background: #2a2019; border: 1px solid #5a4636; border-radius: 8px;
    padding: 8px 12px; touch-action: manipulation; }
  button.on { background: #e8be5a; color: #2b1d10; border-color: #e8be5a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line"></div>
<div id="panel"></div>
<script src="spells.js?v=8"></script>
<script src="guide.js?v=5"></script>
<script>
/* Dissendium, a test page for the Charms lane (12 October 2026, seventh session; the owner is Godric). Drawn in code.
   The books (PoA 10, checked in the text): behind a statue of a humpbacked, one-eyed witch on the third floor, Harry
   taps her and nothing happens; on the map a tiny speech bubble by his dot says the word; he whispers it, tapping the
   stone witch again, and her hump opens wide enough to admit a fairly thin person; he climbs in headfirst, slides a
   long way down a stone slide, lands on damp earth in pitch dark, and lights his wand: a narrow, low, earthy passage,
   twisting like a giant rabbit's burrow. Later he shoves his bag in first, in a hurry (PoA 14); "you tap it and say
   Dissendium" (PoA 16). The lift after the word is the lane's own, for the geometry: the lid swings round its hinge,
   the angle in degrees, and the gap at its edge (the chord) set against what he needs to fit through. Judged by
   LumosSpells.judgeHinge (spells.js), tallied in checks/dissendium-tally.js; the traced guide from guide.js; the dark
   at the bottom is lit with Lumos's flick (judgeFlick). ?ease=, ?guide=, ?need= (degrees) for trying;
   window.lumosDissendium for checks. */
(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), lineEl = document.getElementById('line'), panel = document.getElementById('panel');
  var W = 0, H = 0, S = 1, DPR = 1, audio = null, qs = new URLSearchParams(location.search);
  var EASES = ['kind', 'fair', 'strict'], ease = EASES.indexOf(qs.get('ease')) >= 0 ? qs.get('ease') : 'kind';
  var NEED = Math.max(20, Math.min(90, Number(qs.get('need')) || 45)), MAX = 110, CRACK = 6;
  var stage = 'tap', taps = 0, bubble = null, lid = 0, lidTo = null, from = 0, stroke = null, active = null, trail = null, last = null;
  var thud = null, tickAt = 0, slideAt = 0, litAt = 0, guide = null;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight; S = Math.min(W * 1.15, H * 0.8);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeGuide();
  }
  /* the statue, side on, facing left: the hinge low on the back of her hump, the lid's edge up by her neck */
  function geo() {
    var floor = H * 0.8, x = W / 2, y0 = floor - S * 0.08;
    var hinge = { x: x + S * 0.2, y: y0 - S * 0.36 }, edge = { x: x - S * 0.08, y: y0 - S * 0.47 };
    return { floor: floor, x: x, y0: y0, hinge: hinge, edge: edge, L: Math.hypot(edge.x - hinge.x, edge.y - hinge.y),
      bulge: { x: x + S * 0.08, y: y0 - S * 0.74 } };
  }
  function rot(p, c, deg) { var a = deg * Math.PI / 180, dx = p.x - c.x, dy = p.y - c.y;
    return { x: c.x + dx * Math.cos(a) - dy * Math.sin(a), y: c.y + dx * Math.sin(a) + dy * Math.cos(a) }; }

  function say(html) { lineEl.innerHTML = html; }
  function ensureAudio() { if (audio) { if (audio.state === 'suspended') audio.resume(); return; } var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
  function noise(dur, freq, gain) {
    if (!audio) return;
    var n = Math.floor(audio.sampleRate * dur), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    var src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(audio.destination); src.start();
  }
  function tick() { noise(0.04, 1800, 0.35); }

  /* the guide: an arc round the hinge, from the lid's edge up past the angle he needs */
  function makeGuide() {
    var G0 = geo(), a0 = Math.atan2(G0.edge.x - G0.hinge.x, -(G0.edge.y - G0.hinge.y)) * 180 / Math.PI;
    guide = LumosGuide.create({ key: 'lumos.charms.dissendiumGuidedHits', rest: 1.0, mirror: false,
      box: function () { var g = geo(), G = g.L / 0.4; return { G: G, ox: g.hinge.x - G / 2, oy: g.hinge.y - G / 2 }; },
      parts: [{ pts: LumosGuide.arc([0.5, 0.5], 0.4, a0 + CRACK, a0 + NEED + 12, 24), secs: 0.9, label: 'lift', at: 0.6, dx: -1.6, dy: -1.2 }] });
    guide.build(W, H);
  }

  function menu() {
    panel.innerHTML = '';
    var a = document.createElement('button'); a.textContent = 'Again'; a.onclick = function () { ensureAudio(); start(); }; panel.appendChild(a);
    var e = document.createElement('button'); e.textContent = 'Ease: ' + ease;
    e.onclick = function () { ease = EASES[(EASES.indexOf(ease) + 1) % 3]; menu(); }; panel.appendChild(e);
    var g = document.createElement('button'); g.textContent = 'Guide';
    g.onclick = function () { if (guide) guide.reset(); }; panel.appendChild(g);
  }
  function start() {
    stage = 'tap'; taps = 0; bubble = null; lid = 0; lidTo = null; from = 0; stroke = null; trail = null; last = null; thud = null; slideAt = 0; litAt = 0;
    menu(); say('A statue of a humpbacked, one-eyed witch, on the third floor. Tap her hump with your wand.');
  }

  function onHump(p) {   /* inside the hump's round, generously */
    var g = geo(), m = { x: (g.hinge.x + g.edge.x) / 2, y: (g.hinge.y + g.edge.y) / 2 - S * 0.04 };
    return Math.hypot(p.x - m.x, p.y - m.y) < g.L * 0.75;
  }
  function tapHump(p) {
    if (!onHump(p)) { say(taps ? 'Tap her hump again, and whisper it: <b><i>Dissendium</i></b>.' : 'Tap the witch\'s hump, the round of her back.'); return; }
    noise(0.05, 2600, 0.5); taps++;
    if (taps === 1) {
      thud = performance.now();
      say('Nothing happened. Look at the map: by your dot, a tiny speech bubble...');
      bubble = performance.now() + 700;
      setTimeout(function () { if (stage === 'tap' && taps === 1) say('The map says <b><i>Dissendium</i></b>. Tap her hump again and whisper it.'); }, 1500);
      return;
    }
    stage = 'lift'; lidTo = { at: performance.now(), a: 0, b: CRACK, ms: 300 }; from = CRACK;
    noise(0.3, 220, 0.4);
    say('<b><i>Dissendium!</i></b> The hump unlatches with a scrape of stone. Lift it by its edge, round the hinge: wide enough for you to climb in.');
  }

  var MISS = { 'not wide enough': function (j) { return 'Only ' + Math.round(j.opened) + ' degrees: not wide enough for you to fit. You need about ' + NEED + '.'; },
    'wrong way': function () { return 'That pushes it shut. Lift it the other way, up from its edge.'; },
    'through the hinge': function () { return 'Round the hinge, not across it: lift the edge up and over.'; },
    'short': function () { return 'Lift it further: take hold of the edge and swing it up.'; },
    'tap': function () { return 'Take hold of the lid\'s edge and swing it up, round the hinge.'; } };
  function judge(pts) {
    var g = geo(), want = { need: NEED, max: MAX, from: from, dir: 1 };
    var j = LumosSpells.judgeHinge(pts, g.hinge, g.L, want, W, H, ease);
    var lv = guide ? guide.level() : 0, tr = guide && j.reason !== 'tap' ? guide.score(pts) : null;
    if (tr && tr.traced && j.verdict !== 'open' && j.degrees > 0) { j.verdict = 'open'; j.reason = 'traced'; j.opened = Math.max(j.opened, NEED); j.gap = 2 * Math.sin(j.opened * Math.PI / 360); }
    last = j; trail = { pts: pts, at: performance.now() };
    if (j.verdict === 'open') {
      if (guide) guide.hit(lv > 0);
      LumosSpells.learn('dissendium');
      stage = 'open'; lidTo = { at: performance.now(), a: lid, b: j.opened, ms: 200 };
      if (j.stopped) noise(0.2, 400, 0.5);
      say(Math.round(j.opened) + ' degrees: wide enough for a fairly thin person.' + (j.stopped ? ' It stops there, against the wall.' : '') + ' Tap the hole to climb in, headfirst.');
    } else {
      if (j.reason !== 'tap' && guide) guide.miss();
      if (j.verdict === 'narrow') { lidTo = { at: performance.now(), a: j.opened, b: CRACK, ms: 380 }; thud = performance.now() + 380; setTimeout(function () { noise(0.25, 160, 0.6); }, 380); }
      else lidTo = { at: performance.now(), a: lid, b: CRACK, ms: 250 };
      say((MISS[j.reason] || MISS.short)(j));
    }
    return j;
  }
  function climb(p) {
    var g = geo(), m = { x: (g.hinge.x + g.edge.x) / 2, y: (g.hinge.y + g.edge.y) / 2 };
    if (p && Math.hypot(p.x - m.x, p.y - m.y) > g.L * 0.8) { say('Tap the hole in her hump to climb in.'); return; }
    stage = 'slide'; slideAt = performance.now(); noise(1.4, 500, 0.25);
    say('Headfirst into the hump, and down: a long way down a stone slide...');
    setTimeout(function () { if (stage !== 'slide') return; stage = 'dark'; noise(0.25, 120, 0.6);
      say('Cold, damp earth underfoot, and pitch dark. Light your wand: flick up, <b><i>Lumos</i></b>.'); }, 1700);
  }
  var DARK = { aside: 'Straight up, a quick flick.', short: 'A little longer: a quick flick up.', wiggly: 'One straight stroke, up.',
    slow: 'Quicker: a flick, not a push.', windmill: 'Just one flick, up.', nox: 'That way puts a light out, and there is none yet. Flick up.' };
  function flick(pts) {
    var j = LumosSpells.judgeFlick(pts, W, H, ease);
    if (j.verdict === 'lumos') {
      stage = 'lit'; litAt = performance.now(); noise(0.4, 900, 0.2);
      say('<b><i>Lumos!</i></b> A narrow, low, earthy passage, twisting away like a giant rabbit\'s burrow. Honeydukes is at the far end (Book 3).');
    } else if (j.reason !== 'tap') say(DARK[j.verdict === 'nox' ? 'nox' : j.reason] || DARK.aside);
    return j;
  }

  /* ---- drawing ---- */
  function drawWall() {
    cx.fillStyle = '#1a1411'; cx.fillRect(0, 0, W, H);
    var bw = S * 0.16, bh = S * 0.075, g = geo();
    cx.strokeStyle = 'rgba(0,0,0,0.45)'; cx.lineWidth = 2;
    for (var y = 0, row = 0; y < g.floor; y += bh, row++) for (var x = (row % 2) * -bw / 2; x < W; x += bw) cx.strokeRect(x, y, bw, bh);
    cx.fillStyle = '#231b15'; cx.fillRect(0, g.floor, W, H - g.floor);
    cx.fillStyle = 'rgba(0,0,0,0.35)'; cx.fillRect(0, g.floor, W, 3);
    var v = cx.createRadialGradient(W / 2, H * 0.5, S * 0.2, W / 2, H * 0.5, Math.max(W, H) * 0.7);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)'); cx.fillStyle = v; cx.fillRect(0, 0, W, H);
  }
  function lidPath(g, deg) {   /* the hump's shell from the hinge round to its edge */
    var e = rot(g.edge, g.hinge, deg), b = rot(g.bulge, g.hinge, deg);
    cx.beginPath(); cx.moveTo(g.hinge.x, g.hinge.y); cx.quadraticCurveTo(b.x, b.y, e.x, e.y); cx.closePath();
  }
  function drawWitch(now) {
    var g = geo(), x = g.x, y0 = g.y0, sh = thud && now > thud ? Math.max(0, 1 - (now - thud) / 400) * Math.sin(now / 22) * S * 0.004 : 0, i;
    cx.save(); cx.translate(sh, 0);
    cx.fillStyle = '#4b4650'; cx.fillRect(x - S * 0.26, y0, S * 0.52, g.floor - y0);   /* the plinth */
    cx.fillStyle = 'rgba(0,0,0,0.3)'; cx.fillRect(x - S * 0.26, y0, S * 0.52, S * 0.012);
    var st = cx.createLinearGradient(x - S * 0.2, y0 - S * 0.6, x + S * 0.2, y0);
    st.addColorStop(0, '#77727c'); st.addColorStop(1, '#4f4b55'); cx.fillStyle = st;
    /* her cloak, bent double: the front down from under her chin, the back up over the hump to the hinge and down */
    cx.beginPath(); cx.moveTo(x - S * 0.19, y0); cx.quadraticCurveTo(x - S * 0.18, y0 - S * 0.22, x - S * 0.12, y0 - S * 0.34);
    cx.lineTo(g.edge.x, g.edge.y); cx.quadraticCurveTo(g.bulge.x, g.bulge.y, g.hinge.x, g.hinge.y);
    cx.quadraticCurveTo(x + S * 0.25, y0 - S * 0.15, x + S * 0.2, y0); cx.closePath(); cx.fill();
    cx.strokeStyle = 'rgba(0,0,0,0.25)'; cx.lineWidth = 2;
    for (i = 1; i < 4; i++) { cx.beginPath(); cx.moveTo(x - S * 0.12 + i * S * 0.07, y0 - S * 0.02); cx.quadraticCurveTo(x - S * 0.1 + i * S * 0.07, y0 - S * 0.2, x - S * 0.06 + i * S * 0.06, y0 - S * 0.3); cx.stroke(); }
    /* her stick, and the knobbly hand on it */
    cx.strokeStyle = '#4a4550'; cx.lineWidth = Math.max(3, S * 0.012); cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(x - S * 0.25, y0); cx.lineTo(x - S * 0.22, y0 - S * 0.27); cx.stroke();
    cx.fillStyle = '#6b6670'; cx.beginPath(); cx.ellipse(x - S * 0.215, y0 - S * 0.25, S * 0.03, S * 0.022, -0.4, 0, 7); cx.fill();
    /* her head, low and forward under a hood, below the top of her hump: one eye, a hooked nose */
    var hx = x - S * 0.16, hy = y0 - S * 0.42;
    cx.fillStyle = '#69646e'; cx.beginPath(); cx.ellipse(hx + S * 0.02, hy - S * 0.005, S * 0.08, S * 0.07, -0.5, 0, 7); cx.fill();   /* the hood */
    cx.fillStyle = '#3b3741'; cx.beginPath(); cx.ellipse(hx - S * 0.025, hy + S * 0.012, S * 0.045, S * 0.05, -0.2, 0, 7); cx.fill();   /* its shadow */
    cx.fillStyle = '#5f5a64'; cx.beginPath(); cx.ellipse(hx - S * 0.033, hy + S * 0.018, S * 0.033, S * 0.042, -0.15, 0, 7); cx.fill();   /* her face */
    cx.beginPath(); cx.moveTo(hx - S * 0.06, hy + S * 0.004); cx.quadraticCurveTo(hx - S * 0.095, hy + S * 0.03, hx - S * 0.075, hy + S * 0.045);
    cx.lineTo(hx - S * 0.058, hy + S * 0.03); cx.closePath(); cx.fill();   /* the hooked nose */
    cx.fillStyle = '#16121a'; cx.beginPath(); cx.arc(hx - S * 0.045, hy + S * 0.0, S * 0.007, 0, 7); cx.fill();   /* her one eye */
    cx.strokeStyle = '#2e2a33'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(hx - S * 0.05, hy + S * 0.05); cx.quadraticCurveTo(hx - S * 0.035, hy + S * 0.056, hx - S * 0.02, hy + S * 0.05); cx.stroke();   /* a thin mouth */
    /* the hole under the lid, once it is lifted: the dark of the slide */
    if (lid > 0.5) { cx.fillStyle = '#060404'; lidPath(g, 0); cx.fill(); }
    /* the lid itself */
    var lg = cx.createLinearGradient(g.hinge.x, g.hinge.y, g.bulge.x, g.bulge.y);
    lg.addColorStop(0, '#5f5a65'); lg.addColorStop(1, '#857f8a'); cx.fillStyle = lg;
    lidPath(g, lid); cx.fill();
    cx.strokeStyle = lid > 0.5 ? '#2a262e' : 'rgba(40,36,44,0.55)'; cx.lineWidth = lid > 0.5 ? 2.5 : 1.5; lidPath(g, lid); cx.stroke();
    cx.restore();
  }
  /* the angle at the hinge, in tens, and the gap at the edge against what he needs */
  function drawMeasure(now) {
    var g = geo(), a0 = Math.atan2(g.edge.y - g.hinge.y, g.edge.x - g.hinge.x), R = g.L * 0.62, i;
    cx.save();
    cx.strokeStyle = 'rgba(159,182,201,0.55)'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.arc(g.hinge.x, g.hinge.y, R, a0, a0 + MAX * Math.PI / 180); cx.stroke();
    var fs = Math.round(Math.max(11, S * 0.03));
    cx.font = fs + 'px Georgia, serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    for (i = 0; i <= MAX; i += 10) {
      var a = a0 + i * Math.PI / 180, long = i % 30 === 0, r0 = R * (long ? 0.86 : 0.93);
      cx.strokeStyle = long ? 'rgba(217,199,154,0.9)' : 'rgba(159,182,201,0.6)'; cx.lineWidth = long ? 2.2 : 1.2;
      cx.beginPath(); cx.moveTo(g.hinge.x + Math.cos(a) * r0, g.hinge.y + Math.sin(a) * r0); cx.lineTo(g.hinge.x + Math.cos(a) * R, g.hinge.y + Math.sin(a) * R); cx.stroke();
      if (long && i > 0) { cx.fillStyle = 'rgba(217,199,154,0.95)'; cx.fillText(String(i), g.hinge.x + Math.cos(a) * R * 1.16, g.hinge.y + Math.sin(a) * R * 1.16); }
    }
    if (lid > 1) {   /* the gold wedge he has opened */
      cx.fillStyle = 'rgba(243,210,122,0.28)'; cx.beginPath(); cx.moveTo(g.hinge.x, g.hinge.y);
      cx.arc(g.hinge.x, g.hinge.y, R * 0.84, a0, a0 + lid * Math.PI / 180); cx.closePath(); cx.fill();
    }
    cx.fillStyle = '#9fb6c9'; cx.beginPath(); cx.arc(g.hinge.x, g.hinge.y, Math.max(3, S * 0.008), 0, 7); cx.fill();
    /* the chord: from where the edge was to where it is, and his own width marked along it */
    var e0 = g.edge, e1 = rot(g.edge, g.hinge, lid), gap = Math.hypot(e1.x - e0.x, e1.y - e0.y), need = 2 * g.L * Math.sin(NEED * Math.PI / 360);
    if (gap > 2) {
      var ux = (e1.x - e0.x) / gap, uy = (e1.y - e0.y) / gap, fits = gap >= need - 0.5;
      cx.lineCap = 'round';
      cx.strokeStyle = fits ? '#f3d27a' : 'rgba(243,210,122,0.6)'; cx.lineWidth = 4;
      cx.beginPath(); cx.moveTo(e0.x, e0.y); cx.lineTo(e1.x, e1.y); cx.stroke();
      var m = { x: e0.x + ux * need, y: e0.y + uy * need };
      cx.strokeStyle = '#9fb6c9'; cx.lineWidth = 3;
      cx.beginPath(); cx.moveTo(m.x - uy * 12, m.y + ux * 12); cx.lineTo(m.x + uy * 12, m.y - ux * 12); cx.stroke();
      cx.fillStyle = '#9fb6c9'; cx.font = fs + 'px Georgia, serif';
      cx.fillText('you', m.x - uy * 26, m.y + ux * 26);
    }
    var big = Math.round(Math.max(16, S * 0.05));
    cx.font = '600 ' + big + 'px Georgia, serif'; cx.fillStyle = '#f3d27a'; cx.shadowColor = '#000'; cx.shadowBlur = 6;
    cx.fillText(Math.round(lid) + '°', g.hinge.x + R * 0.3, g.hinge.y + R * 0.55);
    cx.restore();
  }
  /* a corner of the map, his dot, and the tiny speech bubble (PoA 10) */
  function drawMap(now) {
    var w = Math.min(W * 0.34, S * 0.42), h = w * 0.62, x = 12, y = H - h - Math.max(64, H * 0.1);
    cx.save(); cx.fillStyle = '#d9c79a'; cx.fillRect(x, y, w, h);
    cx.strokeStyle = 'rgba(90,64,30,0.75)'; cx.lineWidth = 1.2;
    cx.beginPath(); cx.moveTo(x + w * 0.08, y + h * 0.5); cx.lineTo(x + w * 0.92, y + h * 0.5); cx.moveTo(x + w * 0.08, y + h * 0.72); cx.lineTo(x + w * 0.92, y + h * 0.72);
    cx.moveTo(x + w * 0.3, y + h * 0.5); cx.lineTo(x + w * 0.3, y + h * 0.15); cx.moveTo(x + w * 0.42, y + h * 0.5); cx.lineTo(x + w * 0.42, y + h * 0.15); cx.stroke();
    var dx = x + w * 0.6, dy = y + h * 0.61;
    cx.fillStyle = '#3a2a1a'; cx.beginPath(); cx.arc(dx, dy, 2.6, 0, 7); cx.fill();
    cx.font = 'italic ' + Math.round(Math.max(9, w * 0.07)) + 'px Georgia, serif'; cx.textAlign = 'left'; cx.fillText('You', dx + 5, dy + 10);
    cx.fillText('witch', x + w * 0.46, y + h * 0.42); cx.beginPath(); cx.arc(x + w * 0.44, y + h * 0.5, 2, 0, 7); cx.fill();
    if (bubble && now > bubble) {
      var k = Math.min(1, (now - bubble) / 500), bx = dx + 6, by = dy - h * 0.38, bw = w * 0.5, bh = h * 0.2;
      cx.globalAlpha = k; cx.fillStyle = '#f5ecd2'; cx.strokeStyle = '#3a2a1a'; cx.lineWidth = 1;
      cx.beginPath(); cx.rect(bx, by, bw, bh); cx.fill(); cx.stroke();
      cx.beginPath(); cx.moveTo(bx + 4, by + bh); cx.lineTo(dx + 1, dy - 3); cx.lineTo(bx + 12, by + bh); cx.fill();
      cx.fillStyle = '#3a2a1a'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.font = 'italic ' + Math.round(Math.max(9, bh * 0.55)) + 'px Georgia, serif'; cx.fillText('Dissendium', bx + bw / 2, by + bh / 2 + 1);
      cx.globalAlpha = 1;
    }
    cx.restore();
  }
  function drawSlide(now) {
    var k = Math.min(1, (now - slideAt) / 1700);
    cx.fillStyle = '#050303'; cx.fillRect(0, 0, W, H);
    cx.strokeStyle = 'rgba(120,110,100,' + (0.35 * (1 - k)) + ')'; cx.lineWidth = 2;
    for (var i = 0; i < 14; i++) { var sx = ((i * 137) % 100) / 100 * W, sy = ((i * 71 + now * 1.4) % (H + 200)) - 100;
      cx.beginPath(); cx.moveTo(sx, H - sy); cx.lineTo(sx, H - sy - 80); cx.stroke(); }
  }
  function drawPassage(now) {
    var k = Math.min(1, (now - litAt) / 900), wx = W / 2, wy = H * 0.86;
    cx.fillStyle = '#030202'; cx.fillRect(0, 0, W, H);
    var lg = cx.createRadialGradient(wx, wy - S * 0.2, S * 0.05, wx, wy - S * 0.2, Math.max(W, H) * 0.75 * k + 1);
    lg.addColorStop(0, 'rgba(255,236,190,0.25)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    for (var i = 0; i < 7; i++) {   /* the burrow's rings, each smaller, further and darker, wandering as it twists */
      var f = 1 - i * 0.13, ox = Math.sin(i * 0.9) * S * 0.08 * i * 0.4, oy = -i * S * 0.03;
      cx.fillStyle = 'rgb(' + Math.round((92 - i * 11) * k) + ',' + Math.round((66 - i * 8) * k) + ',' + Math.round((42 - i * 5) * k) + ')';
      cx.beginPath(); cx.ellipse(W / 2 + ox, H * 0.5 + oy, W * 0.62 * f, H * 0.5 * f, 0, 0, 7); cx.fill();
    }
    cx.fillStyle = '#020101'; cx.beginPath(); cx.ellipse(W / 2 + Math.sin(7 * 0.9) * S * 0.08 * 7 * 0.4, H * 0.5 - 7 * S * 0.03, W * 0.07, H * 0.06, 0, 0, 7); cx.fill();   /* the dark where it bends out of sight */
    cx.fillStyle = lg; cx.fillRect(0, 0, W, H);
    cx.strokeStyle = '#4a3220'; cx.lineWidth = Math.max(6, S * 0.018); cx.lineCap = 'round';   /* his wand, lit */
    cx.beginPath(); cx.moveTo(wx + S * 0.04, H + 10); cx.lineTo(wx, wy - S * 0.12); cx.stroke();
    var tg = cx.createRadialGradient(wx, wy - S * 0.12, 0, wx, wy - S * 0.12, S * 0.07);
    tg.addColorStop(0, 'rgba(255,250,230,' + k + ')'); tg.addColorStop(1, 'rgba(255,230,170,0)'); cx.fillStyle = tg;
    cx.beginPath(); cx.arc(wx, wy - S * 0.12, S * 0.07, 0, 7); cx.fill();
  }
  function frame(now) {
    if (lidTo) { var u = Math.min(1, (now - lidTo.at) / lidTo.ms); lid = lidTo.a + (lidTo.b - lidTo.a) * u * u * (3 - 2 * u); if (u >= 1) lidTo = null; }
    if (stage === 'slide') drawSlide(now);
    else if (stage === 'dark') { cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); }
    else if (stage === 'lit') drawPassage(now);
    else {
      drawWall(); drawWitch(now);
      if (stage !== 'tap') drawMeasure(now);
      drawMap(now);
      if (stage === 'lift' && guide && !lidTo) guide.draw(cx, now, !!stroke);
    }
    var pts = stroke || (trail && now - trail.at < 400 ? trail.pts : null);
    if (pts && pts.length > 1 && stage !== 'open') {
      cx.save(); cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = 'rgba(220,225,255,' + (stroke ? 0.5 : 0.5 * (1 - (now - trail.at) / 400)) + ')'; cx.lineWidth = 5;
      cx.beginPath(); pts.forEach(function (p, i) { i ? cx.lineTo(p.x, p.y) : cx.moveTo(p.x, p.y); }); cx.stroke(); cx.restore();
    }
    requestAnimationFrame(frame);
  }

  /* ---- touch: two taps on the hump, the lift round the hinge, a tap on the hole, then Lumos's flick in the dark ---- */
  function pt(ev) { return { x: ev.clientX, y: ev.clientY, t: Math.round(performance.now()) }; }
  function follow() {   /* the lid follows his finger while he lifts, and ticks at every ten degrees */
    var g = geo(), j = LumosSpells.judgeHinge(stroke, g.hinge, g.L, { need: NEED, max: MAX, from: from, dir: 1 }, W, H, ease);
    var to = j.reason === 'through the hinge' ? lid : Math.max(0, Math.min(MAX, from + j.degrees));
    if (Math.floor(to / 10) !== Math.floor(lid / 10)) tick();
    lid = to;
  }
  cv.addEventListener('pointerdown', function (ev) {
    ensureAudio(); ev.preventDefault();
    var p = pt(ev);
    if (stage === 'tap') { tapHump(p); return; }
    if (stage === 'open') { climb(p); return; }
    if ((stage !== 'lift' && stage !== 'dark') || active !== null || lidTo) return;
    active = ev.pointerId; stroke = [p]; trail = null; if (guide && stage === 'lift') guide.cover(p);
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  cv.addEventListener('pointermove', function (ev) {
    if (ev.pointerId !== active || !stroke) return; ev.preventDefault();
    var list = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev]; if (!list.length) list = [ev];
    list.forEach(function (e2) { var q = pt(e2); stroke.push(q); if (guide && stage === 'lift') guide.cover(q); });
    if (stage === 'lift') follow();
  });
  cv.addEventListener('pointerup', function (ev) {
    if (ev.pointerId !== active || !stroke) return;
    active = null; stroke.push(pt(ev)); var pts = stroke; stroke = null;
    if (stage === 'lift') judge(pts); else if (stage === 'dark') flick(pts);
  });
  cv.addEventListener('pointercancel', function (ev) { if (ev.pointerId === active) { active = null; stroke = null; lidTo = { at: performance.now(), a: lid, b: from, ms: 200 }; if (guide) guide.clear(); } });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  addEventListener('resize', resize); resize(); start(); requestAnimationFrame(frame);
  window.lumosDissendium = { start: start, geo: geo, tap: function () { var g = geo(); tapHump({ x: (g.hinge.x + g.edge.x) / 2, y: (g.hinge.y + g.edge.y) / 2 - S * 0.04 }); },
    /* a lift of deg degrees drawn round the hinge from the lid's edge, as a finger would */
    lift: function (deg, n) { var g = geo(), a0 = Math.atan2(g.edge.y - g.hinge.y, g.edge.x - g.hinge.x) + from * Math.PI / 180, out = [], k; n = n || 24;
      for (k = 0; k <= n; k++) { var a = a0 + deg * Math.PI / 180 * k / n; out.push({ x: g.hinge.x + Math.cos(a) * g.L * 0.95, y: g.hinge.y + Math.sin(a) * g.L * 0.95, t: k * 20 }); }
      return judge(out); },
    hold: function (deg) { lid = deg; },
    climb: function () { climb(null); }, flick: function (pts) { return flick(pts); },
    state: function () { return { stage: stage, taps: taps, lid: Math.round(lid), need: NEED, last: last, guide: guide ? guide.state().level : null, ease: ease, learned: LumosSpells.learned('dissendium') }; } };
})();
</script>
