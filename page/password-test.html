<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password test</title>
<style>
  :root { --bg: #15120f; --fg: #f1e8da; --dim: #a89c8a; --ok: #9fd18b; --bad: #f08a6c; --line: #3a3229; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { padding: 12px 16px 40px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  p { margin: 6px 0; color: var(--dim); }
  #facts { font-size: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 10px 0; }
  #facts div { display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 3px 0; }
  #facts div:last-child { border-bottom: 0; }
  #facts b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  button { font: inherit; color: var(--fg); background: #2a241e; border: 1px solid #4a4036; border-radius: 10px; padding: 10px 14px; }
  button.main { background: #6b3a24; font-size: 18px; padding: 14px 18px; width: 100%; }
  #log { font: 13px/1.45 ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 8em; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .said { color: #f3d79b; }
</style>
<script>
/* The castle's state for this page lives in memory only, so the test never touches the real castle's save on this
   iPhone or iPad (the runtime's key lumos.castle.state.v1 and the rest of lumos.castle.* in localStorage). The ear's
   deaf mark in sessionStorage is left real, since it is what the castle itself reads. */
(function () {
  var mem = {}, real = { get: Storage.prototype.getItem, set: Storage.prototype.setItem, rm: Storage.prototype.removeItem };
  function mine(st, k) { try { return st === window.localStorage && /^lumos\./.test(String(k)); } catch (e) { return false; } }
  Storage.prototype.getItem = function (k) { return mine(this, k) ? (k in mem ? mem[k] : null) : real.get.call(this, k); };
  Storage.prototype.setItem = function (k, v) { if (mine(this, k)) mem[k] = String(v); else real.set.call(this, k, v); };
  Storage.prototype.removeItem = function (k) { if (mine(this, k)) delete mem[k]; else real.rm.call(this, k); };
})();
</script>
</head>
<body>
<main>
  <h1>The Fat Lady's password, on its own</h1>
  <p>Tap the big button, as you would tap her, then say the week's password. Every step shows below. If it goes wrong, tap Copy log and paste it to Claude.</p>
  <div id="facts"></div>
  <button class="main" id="tapHer">Tap the Fat Lady</button>
  <div class="row">
    <button id="earOnly">Ear alone (8 s)</button>
    <button id="raw">Raw speech, every event</button>
    <button id="mic">Ask for the microphone</button>
    <button id="undeaf">Clear the deaf mark</button>
    <button id="copy">Copy log</button>
    <button id="clear">Clear log</button>
  </div>
  <div id="log"></div>
</main>
<script src="castle-ear.js?v=5"></script>
<script src="castle-events.js?v=39"></script>
<script>
/* A test of the Fat Lady's password alone (20 October 2026, Godric's iPhone: no microphone prompt and no way in):
   the real runtime with only the password chain, the real ear, the same tap path as the corridor, and a live log of
   each step: the speech API, the permission, its error's name, the words heard, their match, and the fallback. */
(function () {
  var T0 = Date.now(), logEl = document.getElementById('log'), lines = [];
  function log(text, cls) {
    var s = ((Date.now() - T0) / 1000).toFixed(1) + ' s  ' + text;
    lines.push(s);
    var d = document.createElement('div'); d.textContent = s; if (cls) d.className = cls;
    logEl.appendChild(d); d.scrollIntoView({ block: 'nearest' });
  }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var E = window.CastleEar;

  function fact(name, val) {
    var d = document.createElement('div'), a = document.createElement('span'), b = document.createElement('b');
    a.textContent = name; b.textContent = val; d.appendChild(a); d.appendChild(b);
    document.getElementById('facts').appendChild(d); return b;
  }
  fact('Speech API', SR ? (window.SpeechRecognition ? 'SpeechRecognition' : 'webkitSpeechRecognition') : 'none');
  fact('Secure page', String(window.isSecureContext));
  fact('Home-screen icon', String(!!window.navigator.standalone));
  var deafFact = fact('Deaf mark', (E && E.deaf()) || 'none');
  var micFact = fact('Microphone permission', '...');
  var availFact = fact('Ear available', String(!!(E && E.available())));
  var NAME = E && E.browser ? E.browser() : 'unknown';
  fact('Browser', NAME + (E && E.thirdParty && E.thirdParty() ? ' (not Safari: iOS lends it the microphone only if Settings allow)' : ''));
  fact('User agent', navigator.userAgent);
  function refresh() { deafFact.textContent = (E && E.deaf()) || 'none'; availFact.textContent = String(!!(E && E.available())); }
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'microphone' }).then(function (p) {
      micFact.textContent = p.state; p.onchange = function () { micFact.textContent = p.state; log('microphone permission now ' + p.state); };
    }).catch(function (e) { micFact.textContent = 'cannot ask (' + e.name + ')'; });
  } else micFact.textContent = 'cannot ask';
  log('loaded in ' + NAME + '; speech API ' + (SR ? 'present' : 'missing') + '; ear ' + (E ? (E.available() ? 'available' : 'deaf: ' + E.deaf()) : 'missing'));

  /* The runtime's own notes (the ear closing and why, what it heard and how near) go to the log too. */
  var info = console.info, matched = false;
  console.info = function (msg) {
    if (/^\[castle-events\]/.test(String(msg))) {
      var t = String(msg).replace('[castle-events] ', '');
      if (/^heard /.test(t)) { matched = true; t = 'matched: ' + t; }
      log('castle: ' + t, /^matched /.test(t) ? 'ok' : /error|deaf|no ear|could not/.test(t) ? 'bad' : '');
    }
    return info.apply(console, arguments);
  };

  /* The ear's every call, as the runtime makes it: started, each guess with its nearness, and how it ended. */
  var words = [], wrong = [];
  function nearest(text) {
    var best = null, sc = 0;
    words.forEach(function (w) { var s = E.match(text, w); if (s > sc) { sc = s; best = w; } });
    var other = '';
    wrong.forEach(function (w) { if (E.match(text, w) >= E.LOOSE && E.match(text, w) > sc) other = '; it is another week\'s word, "' + w + '", not this week\'s'; });
    return best ? ' (this week "' + best + '" ' + Math.round(sc * 100) + '%, ' + (sc >= E.LOOSE ? 'near enough' : 'not near enough, needs ' + Math.round(E.LOOSE * 100) + '%') + other + ')' : '';
  }
  if (E) E.trace = function (t) { log('ear: ' + t, /refused|NotAllowed|NotFound/.test(t) ? 'bad' : /lent/.test(t) ? 'ok' : ''); };
  /* ?fake=<words>: no microphone, the ear hands those words as an interim guess a second after the tap, to check
     that a guess near enough opens her at once. */
  var FAKE = new URLSearchParams(location.search).get('fake');
  if (E) {
    var listen = E.listen;
    E.listen = function (opts) {
      log('ear: start listening (' + E.LANG + ', up to ' + E.SECONDS + ' s)' + (FAKE ? ', faked' : ''));
      var heard = opts.onHeard, end = opts.onEnd;
      if (FAKE) {
        var done = false, fin = function (why) { if (done) return; done = true; log('ear ended: ' + why); if (end) end(why); };
        setTimeout(function () { if (done) return; log('ear heard: "' + FAKE + '"' + nearest(FAKE), 'said'); if (heard) heard([{ text: FAKE, confidence: 0.9 }], false); }, 1000);
        setTimeout(function () { fin('timeout'); }, 8000);
        return { stop: function () { fin('stopped'); } };
      }
      return listen({
        seconds: opts.seconds,
        onHeard: function (g, final) {
          log('ear heard' + (final ? ' (final)' : '') + ': ' + g.map(function (x) { return '"' + x.text + '"'; }).join(', ') + nearest(g[0] && g[0].text), 'said');
          if (heard) heard(g, final);
        },
        onEnd: function (why) { log('ear ended: ' + why, /error/.test(why) ? 'bad' : ''); if (why === 'error not-allowed' && E.thirdParty()) log('page shows: ' + E.ADVICE, 'bad'); refresh(); if (end) end(why); }
      });
    };
  }

  var weekFact = fact('This week\'s password', '...');
  fetch('events/password.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    var w = d.words && d.words.password, all = {};
    if (w) { (w.list || []).forEach(function (x) { all[x] = 1; }); for (var y in (w.by_year || {})) w.by_year[y].forEach(function (x) { all[x] = 1; }); }
    wrong = Object.keys(all);
  }).catch(function () {});

  /* The castle, the password chain only, on the corridor at her stop. */
  var ev = CastleEvents.start({
    chains: ['password'], place: 'corridor', builtins: { at: function () { return 'her'; } },
    cues: new Proxy({}, { get: function (t, k) { return function () {
      log('shown: ' + String(k), /swings open/.test(String(k)) ? 'ok' : '');
      if (/swings open/.test(String(k))) { log(matched ? 'SHE OPENS: opened on match' : 'SHE OPENS', 'ok'); setTimeout(function () { ev.password(); }, 0); }
    }; } }),
    showLines: function (ls) {
      (ls || []).forEach(function (l) { log((l.speaker || 'line') + ' says: "' + (l.text || l.sound || '') + '"', 'said'); });
    },
    drawRoom: function () {}
  });
  ev.ready.then(function () {
    var w = ev.words('password') || {};
    words = [w.now].filter(Boolean);
    wrong = wrong.filter(function (x) { return words.indexOf(x) < 0; });
    weekFact.textContent = w.now + ' (last week ' + w.last + ', next ' + w.next + ')';
    log('the castle is ready: speech reads ' + (E && E.available() ? 'on' : 'off') + '; this week\'s password "' + w.now + '"');
  });
  setInterval(function () { ev.tick(0.5); }, 500);

  document.getElementById('tapHer').addEventListener('click', function () {
    log('tap: the Fat Lady (speech ' + (E && E.available() ? 'on' : 'off') + ')');
    matched = false;
    ev.tap('her');
  });

  /* The ear alone, the same call the castle makes, with no castle round it. */
  document.getElementById('earOnly').addEventListener('click', function () {
    if (!E) { log('no ear script', 'bad'); return; }
    log('ear alone: available ' + E.available());
    E.listen({ onHeard: function () {}, onEnd: function () {} });
  });

  /* Safari's recognition bare, every event it raises, to see which never comes. */
  document.getElementById('raw').addEventListener('click', function () {
    if (!SR) { log('raw: no speech API in this browser', 'bad'); return; }
    var r = new SR(); r.lang = 'en-GB'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
    ['start', 'audiostart', 'soundstart', 'speechstart', 'speechend', 'soundend', 'audioend', 'nomatch'].forEach(function (n) {
      r['on' + n] = function () { log('raw: ' + n); };
    });
    r.onresult = function (e) {
      var res = e.results[e.results.length - 1];
      log('raw: result "' + (res[0] && res[0].transcript) + '"' + (res.isFinal ? ' (final)' : ''), 'said');
    };
    r.onerror = function (e) { log('raw: error ' + e.error + (e.message ? ' (' + e.message + ')' : ''), 'bad'); };
    r.onend = function () { log('raw: end'); };
    try { r.start(); log('raw: start() called'); } catch (e) { log('raw: start() threw ' + e.name + ': ' + e.message, 'bad'); }
    setTimeout(function () { try { r.stop(); } catch (e) {} }, 8000);
  });

  /* The microphone asked for in the tap's own gesture too (8.11 am), beside the ear, so the log shows whether the
     browser would lend it at the moment he taps her. */
  function probeMic(from) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { log('mic (' + from + '): no getUserMedia here', 'bad'); return; }
    log('mic (' + from + '): asking for the microphone');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      log('mic (' + from + '): allowed (' + s.getAudioTracks().map(function (t) { return t.label || 'a microphone'; }).join(', ') + ')', 'ok');
      s.getTracks().forEach(function (t) { t.stop(); });
    }).catch(function (e) {
      log('mic (' + from + '): ' + e.name + (e.message ? ': ' + e.message : ''), 'bad');
      if (e.name === 'NotAllowedError' && E && E.thirdParty && E.thirdParty()) log(E.ADVICE, 'bad');
    });
  }
  document.getElementById('mic').addEventListener('click', function () { probeMic('button'); });
  document.getElementById('undeaf').addEventListener('click', function () {
    try { sessionStorage.removeItem('lumos.castle.ear.deaf'); } catch (e) {}
    log('the deaf mark cleared; reloading so the ear reads it fresh'); setTimeout(function () { location.reload(); }, 600);
  });
  document.getElementById('copy').addEventListener('click', function () {
    var text = lines.join('\n') + '\n' + navigator.userAgent;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard')))
      .then(function () { log('log copied', 'ok'); }, function (e) { log('could not copy: ' + e.message, 'bad'); });
  });
  document.getElementById('clear').addEventListener('click', function () { logEl.textContent = ''; lines = []; });
})();
</script>
</body>
</html>
